                      - s1_6_2_1: "1. Old Testament Terminology"
                      - s1_6_2_2: "2. Greek and Latin Terminology"
                  - s1_6_3: "E. The Revelation of the Sacred Trinity Through Christ"
                  - s1_6_4: "F. Summary of Essential Truths"
                    sections:
                      - s1_6_4_1: "1. God Is One in Essence, Triune in Persons"
                      - s1_6_4_2: "2. The Appellations of the Persons"
                      - s1_6_4_3: "3. Not Three Gods but One God"
                      - s1_6_4_4: "4. Illustrations of the Trinity"
                        sections:
                          - s1_6_4_4_1: "a. From the Nature of Man"
                          - s1_6_4_4_2: "b. From the Sun"
                          - s1_6_4_4_3: "c. From the Human Soul (Mind, Will, Affections)"
                  - s1_6_5: "G. Secret Things Not to Be Scrutinized"
                  - s1_6_6: "H. The Necessity of Scriptural Testimonies"
                  - s1_6_7: "I. TESTIMONIES OF SACRED SCRIPTURE CONCERNING THE DIVINITY OF CHRIST"
                    sections:
                      - s1_6_7_1: "1. Christ as the Eternal Word"
                      - s1_6_7_2: "2. Christ as the Only-Begotten Son of God"
                      - s1_6_7_3: "3. Christ Expressly Named God"
                      - s1_6_7_4: "4. Christ Ascribes to Himself Works of Divinity"
                  - s1_6_8: "J. TESTIMONIES OF SACRED SCRIPTURE CONCERNING THE DIVINITY OF THE HOLY SPIRIT"
                    sections:
                      - s1_6_8_1: "1. The Holy Spirit Joined with the Father and Son in Baptism"
                      - s1_6_8_2: "2. Additional Biblical Testimonies"
