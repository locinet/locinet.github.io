                  - s1_4_1: "A. The Occasion of This Question"
                  - s1_4_2: "B. Three Considerations"
                    sections:
                      - s1_4_2_1: "1. Concerning the Word “God” (Deus)"
                      - s1_4_2_2: "2. Concerning the Essence of God"
                        sections:
                          - s1_4_2_2_1: "a. The Consensus Against Definition"
                          - s1_4_2_2_2: "b. The Finite Cannot Comprehend the Infinite"
                          - s1_4_2_2_3: "c. Christ’s Statement That God Is Spirit (John 4)"
                      - s1_4_2_3: "3. Concerning the Office and Work of God"
                        sections:
                          - s1_4_2_3_1: "a. The Utility of This Knowledge for Piety"
                          - s1_4_2_3_2: "b. God’s Office as Creator and Preserver"
                          - s1_4_2_3_3: "c. God’s Office as Governor"
                          - s1_4_2_3_4: "d. Denial of Providence Is Denial of God"
                          - s1_4_2_3_5: "e. Sufficient Knowledge for Piety"
              - s1_5: "V. WHAT MANNER GOD IS, CONSIDERING ESSENCE"
