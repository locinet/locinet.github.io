                      - s8_4_3_2: "2. If Concerning Who First Sinned Among Humans: Eve"
                      - s8_4_3_3: "3. If Concerning the Propagation of Sin: Adam"
                        sections:
                          - s8_4_3_3_1: "a. Why Propagation Is Through Adam, Not Eve"
                          - s8_4_3_3_2: "b. How Adam Was Not Deceived"
              - s8_5: "V. BY WHAT COUNSEL OF GOD THE HUMAN RACE FELL IN ADAM"
                sections:
                  - s8_5_1: "A. God Foreknew Man Would Fall"
                  - s8_5_2: "B. God’s Foreknowledge Was Not Without Certain Counsel"
                  - s8_5_3: "C. God Could Have Prevented Man’s Fall"
                  - s8_5_4: "D. Therefore God Did Not Prevent It Because He Willed Not To"
                  - s8_5_5: "E. God Willed Not to Prevent It for a Good Cause"
                  - s8_5_6: "F. This Good Was Sought by Some Counsel and Predestination"
                  - s8_5_7: "G. This Was God’s Counsel, Not the Serpent’s or Man’s"
                  - s8_5_8: "H. By What Counsel God Permitted Man to Sin"
                    sections:
                      - s8_5_8_1: "1. Man Sinned and the Human Race Perished Without God’s Fault"
                      - s8_5_8_2: "2. What Was That Good for Whose Prospect God So Disposed"
                        sections:
                          - s8_5_8_2_1: "a. The Imitation of Sin in Angels, Propagation in Humans"
                          - s8_5_8_2_2: "b. Salvation of Man Destined in His Reparation, Not in His First Condition"
                  - s8_5_9: "I. Epilogue of This Place"
