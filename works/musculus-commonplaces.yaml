                        sections:
                          - s1_5_2_2_1: "a. Not Composite but Simple and Pure"
                          - s1_5_2_2_2: "b. Spirit and Light"
                          - s1_5_2_2_3: "c. Incorporeal, Invisible, Incomprehensible, Immutable, etc."
              - s1_6: "VI. WHAT MANNER GOD IS, CONSIDERING HYPOSTASIS"
                sections:
                  - s1_6_1: "A. The Distinction Between Ousia and Hypostasis"
