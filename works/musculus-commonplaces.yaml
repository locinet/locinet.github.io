                          - s1_2_3_1_1: "a. The Universality of This Mode"
                          - s1_2_3_1_2: "b. How Philosophers Knew God from His Works"
                            sections:
                              - s1_2_3_1_2_1: "i. From the Majesty and Order of Creation"
                              - s1_2_3_1_2_2: "ii. From Divine Beneficence"
                              - s1_2_3_1_2_3: "iii. From Terrifying Judgments"
                              - s1_2_3_1_2_4: "iv. From Prophecies"
                          - s1_2_3_1_3: "c. Response to Those Who Deny Invisible Things"
                            sections:
                              - s1_2_3_1_3_1: "i. The Analogy of Voice, Wind, and Odor"
                              - s1_2_3_1_3_2: "ii. The Analogy of Soul, Mind, and Will"
                              - s1_2_3_1_3_3: "iii. God Declared by His Operations"
                      - s1_2_3_2: "2. Second Mode: By Speaking Through the Word (Special Manifestation)"
