                          - s1_2_3_2_1: "a. The Special Grace to Israel"
                          - s1_2_3_2_2: "b. Extension to the Gentiles in the Last Times"
                      - s1_2_3_3: "3. Third Mode: By Breathing Through the Spirit (Most Special Manifestation)"
                        sections:
                          - s1_2_3_3_1: "a. Limited to the Elect"
                          - s1_2_3_3_2: "b. The Elect’s Diligent Use of Works and Word"
              - s1_3: "III. WHO GOD IS"
                sections:
                  - s1_3_1: "A. The Occasion of This Question"
                  - s1_3_2: "B. Why This Question Is Not Properly Asked"
                  - s1_3_3: "C. The Proper Method: Knowing Who God Is Not"
                  - s1_3_4: "D. Biblical Testimonies to the Inexpressibility of God’s Name"
                    sections:
                      - s1_3_4_1: "1. Jacob’s Wrestling (Genesis 32)"
                      - s1_3_4_2: "2. Moses at the Burning Bush (Exodus 3)"
                  - s1_3_5: "E. How God Declares Who He Is: By Efficacy and Operation"
              - s1_4: "IV. WHAT GOD IS"
