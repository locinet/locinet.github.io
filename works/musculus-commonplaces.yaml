                      - s8_3_2_2: "2. The Good of Sincere Conscience Lost, and Fear Inflicted"
                      - s8_3_2_3: "3. Integrity of Mind Corrupted"
                      - s8_3_2_4: "4. Free Will Lost"
                  - s8_3_3: "C. Concerning the Punishment of Sin Expressly Inflicted"
                    sections:
                      - s8_3_3_1: "1. The Curse Upon the Earth in Man’s Labor"
                      - s8_3_3_2: "2. The Dignity of Primacy Lost"
                      - s8_3_3_3: "3. Corruption and Death Inflicted"
                  - s8_3_4: "D. Nature Itself Infected and Lost"
                    sections:
