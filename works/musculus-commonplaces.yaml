                          - s1_5_2_1_1: "a. Testimony from Sacred Scripture"
                          - s1_5_2_1_2: "b. Philosophers and Poets Acknowledged God’s Unity"
                          - s1_5_2_1_3: "c. The Reasoning of the Wise"
                          - s1_5_2_1_4: "d. The Folly of Those Who Establish Multiple Gods"
                            sections:
                              - s1_5_2_1_4_1: "i. The Creator Is Greater Than His Work"
                              - s1_5_2_1_4_2: "ii. Divine Majesty Receives Neither Addition Nor Diminution"
                              - s1_5_2_1_4_3: "iii. The Similitude of the Sun"
                              - s1_5_2_1_4_4: "iv. The Similitude of the Soul"
