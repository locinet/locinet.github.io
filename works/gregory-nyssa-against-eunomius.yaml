            # loci:
          - it-will-not-do-to-apply-this-conception-as-drawn-out-above-o: "It will not do to apply this conception, as drawn out above, of the Father and Son to the Creation, as they insist on doing: but we must contemplate the Son apart with the Father, and believe that the Creation had its origin from a definite point."
            # loci:
          - he-falsely-imagines-that-the-same-energies-produce-the-same-: "He falsely imagines that the same energies produce the same works, and that variation in the works indicates variation in the energies."
            # loci:
          - he-falsely-imagines-that-we-can-have-an-unalterable-series-o: He falsely imagines that we can have an unalterable series of harmonious natures existing side by side.
            # loci:
          - he-vainly-thinks-that-the-doubt-about-the-energies-is-to-be-: "He vainly thinks that the doubt about the energies is to be solved by the beings, and reversely."
            # loci:
          - there-is-no-word-of-god-that-commands-such-investigations-th: "There is no Word of God that commands such investigations: the uselessness of the philosophy which makes them is thereby proved."
            # loci:
          - the-observations-made-by-watching-providence-are-sufficient-: The observations made by watching Providence are sufficient to give us the knowledge of sameness of Being.
