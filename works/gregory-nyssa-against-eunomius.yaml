            # loci:
          - he-does-wrong-in-making-the-being-of-the-father-alone-proper: "He does wrong in making the being of the Father alone proper and supreme, implying by his omission of the Son and the Spirit that theirs is improperly spoken of, and is inferior."
            # loci:
          - examination-of-the-meaning-of-subjection-in-that-he-says-tha: "Examination of the meaning of 'subjection:' in that he says that the nature of the Holy Spirit is subject to that of the Father and the Son. It is shewn that the Holy Spirit is of an equal, not inferior, rank to the Father and the Son."
            # loci:
