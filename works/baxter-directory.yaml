              by the Constant Work of Gr. Dir. 16. Faith and Love: Even Such a
              Faith as Maketh Things Future as Now Present, and the Unseen World
              as If it Were Continually Open to Your Sight; and Such a Love as
              Makes You Long to See the Glorious Face of God, and the Glory of
              Your Dear Redeemer, and to Be Taken up With Blessed Spirits in His
              Perfect, Endless Love and Praise."
          - direct-xvii-as-the-soul-must-be-carried-up-to-god-and-devote:
              "Direct. Xvii. as the Soul Must Be Carried up to God, and Devoted
              to Him, According to All the Gr. Dir. 17. Foregoing Directions, so
              Must it Be Delivered From Carnal Selfishness, or Flesh-pleasing, I
              Pass Not This by as a Small Matter to Be Passed by Also by the
              Reader. for I Take the Love of God Kindled by Faith in Christ,
              With the Full Denial of Our Carnal Selves, to Be the Sum of All
              Religion. but Because I Would Not Injure so Great a Duty by Saying
              but a Little of It; and Therefore Desire the Reader Who Studieth
              for Practice, and Needeth Such Helps, to Peruse the Mentioned
              Books of Self-denial, and Crucifying the World. Which is the Grand
              Enemy to God and Godliness in the World; and From the Three Great
              Branches of This Idolatry, Viz. the Love of Sensual Pleasures, the
              Love of Worldly Wealth, and the Proud Desire and Love of Worldly
              Honour and Esteem: and the Mortifying of These Must Be Much of the
              Labour of Your Lives."
