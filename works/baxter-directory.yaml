      - a-christian-directory-tom-i-christian-ethics: A Christian Directory. Tom. I. Christian Ethics.
      - chap-i-leg-danielis-episcop-epist-ad-bonif-mogunt-inter-epis:
          Chap. I. Leg. Danielis Episcop. Epist. Ad Bonif. Mogunt. Inter Epist.
          Bonif. 67. De Methodo Convertendi Paganos. Directions to Unconverted
          Graceless Sinners, for the Attaining of True Saving Grace.
        loci: effectual-calling
        sections:
          - part-i: Part I.
            sections:
              - direction-1-if-thou-be-truly-willing-to-be-sanctified-and-a-:
                  Direction 1. If Thou Be Truly Willing to Be Sanctified and a
                  Child of God, Remain Not in a State of Ignorance, Direct. 1.
                  but Do Thy Best to Come Into the Light, and Understand the
                  Word of God, in the Matters of Salvation.
              - direction-2-especially-labour-first-to-understand-the-true-n:
                  Direction 2. Especially Labour First to Understand the True
                  Nature of a State of Sin, and a State Direct. 2. of Grace.
              - direction-3-to-know-what-a-life-of-holiness-is-believe-the-w:
                  Direction 3. to Know What a Life of Holiness Is, Believe the
                  Word of God, and Those That Have Direct. 3. Tried It, and
                  Believe Not the Slanders of the Devil and of Ungodly Men, That
                  Never Tried or Knew the Things Which They Reproach.
              - direction-4-that-thy-understanding-may-be-enlightened-and-th:
                  Direction 4. That Thy Understanding May Be Enlightened, and
                  Thy Heart Renewed, Be Much and Serious Direct. 4. in Reading
                  the Word of God, and Those Books That Are Fitted Tomen in an
                  Unconverted State, and Especially in Hearing the Plain and
                  Searching Preaching of the Word.
              - direction-5-f-thou-wouldst-not-be-destitute-of-saving-grace-:
                  Direction 5. F Thou Wouldst Not Be Destitute of Saving Grace,
                  Let Thy Reason Be Exercised About the Direct. 5. Matters of
                  Thy Salvation, in Some Proportion of Frequent, Sober, Serious
                  Thoughts, as Thou Art Convinced the Weight of the Matter Doth
                  Require.
              - direction-6-suffer-not-the-devil-by-company-pleasure-or-worl:
                  Direction 6. Suffer Not the Devil by Company, Pleasure or
                  Worldly Business to Divert or Hinder Thee Direct. 6. From
                  These Serious Considerations.
              - direction-7-if-thou-wouldst-be-converted-and-saved-be-not-a-:
                  "Direction 7. If Thou Wouldst Be Converted and Saved, Be Not a
                  Malicious or Peevish Enemy to Those Direct. 7. That Would
                  Convert and Save Thee: Be Not Angry With Them That Tell Thee
                  of Thy Sin or Duty, as If They Did Thee Wrong or Hurt."
              - direction-8-if-thou-art-willing-indeed-to-be-converted-do-th:
                  Direction 8. If Thou Art Willing Indeed to Be Converted, Do
                  Thy Best to Discover That yet Thou Art Unconverted, Direct. 8.
                  and in a Lost and Miserable State.
              - direction-9-when-you-have-found-yourselves-in-a-state-of-sin:
                  Direction 9 When You Have Found Yourselves in a State of Sin
                  and Death, Understand and Consider Direct. 9 What a State That
                  Is.
              - direction-10-when-you-have-found-out-how-sad-a-condition-you:
                  Direction 10. When You Have Found Out How Sad a Condition You
                  Are In, Consider What There is in Direct. 10. Sin to Make You
                  Amends or Repair Your Loss, That Should Be Any Hindrance to
                  Your Conversion.
              - direction-11-and-when-you-are-casting-up-your-account-as-you:
                  Direction 11. and When You Are Casting up Your Account, as You
                  Put All That Sin and the World Direct. 11. Will Do for You in
                  the One End of the Scales, so Put Into the Other the Comforts
                  Both of This Life, and of That to Come, Which You Must Part
                  With for Your Sins.
              - direction-12-when-you-have-thus-considered-of-the-condition-:
                  Direction 12. When You Have Thus Considered of the Condition
                  You Are In, Consider Also Whether Direct. 12. it Be a
                  Condition to Be Rested in One Day.
              - direction-13-when-thou-art-resolved-past-thy-waver-and-delay:
                  Direction 13. When Thou Art Resolved, Past Thy Waver and
                  Delays, Give up Thyself Entirely and Direct. 13. Unreservedly
                  to God the Father, Son and Holy Ghost, as Thy Happiness, Thy
                  Saviour and Thy Sanctifier, in an Hearty Consent to the
                  Covenant of Grace.
              - direction-14-in-present-performance-of-thy-covenant-with-god:
                  Direction 14. in Present Performance of Thy Covenant With God,
                  Away With Thy Former Sinful Life; and Direct. 14. See That
                  Thou Sin Wilfully No More; but as Far as Thou Art Able, Avoid
                  the Temptations Which Have Deceived Thee.
              - direction-15-if-thou-have-sincerely-given-up-thyself-to-god-:
                  Direction 15. If Thou Have Sincerely Given up Thyself to God,
                  and Consented to His Covenant, Show it Direct. 15. by Turning
                  the Face of Thy Endeavours and Conversation Quite Another Way,
                  and by Seeking Heaven More Fervently and Diligently, Than Ever
                  Thou Soughtest the World, or Fleshly Pleasures.
              - direction-16-engage-thyself-in-the-cheerful-constant-use-of-:
                  Direction 16. Engage Thyself in the Cheerful Constant Use, of
                  the Means and Helps Appointed by God, Direct. 16. for Thy
                  Confirmation and Salvation.
              - direction-17-that-in-all-this-you-may-be-sincere-and-not-dec:
                  Direction 17. That in All This You May Be Sincere, and Not
                  Deceived by an Hypocritical Change, Be Sure Direct. 17. That
                  God ●e All Your Confidence, and All Your Hopes Be Placed in
                  Heaven, and That There Be No Secret Reserve in Your Hearts,
                  for the World and Flesh; and That You Divide Not Your Hearts
                  Between God and the Things Below, nor Take Not up With the
                  Religion of an Hypocrite, Which Giveth God What the Flesh Can
                  Spare.
              - direction-18-if-you-would-prove-true-converts-come-over-to-g:
                  "Direction 18. If You Would Prove True Converts, Come Over to
                  God as Your Father and Felicity, With Direct. 18. Desire and
                  Delight, and Close With Christ, as Your Only Saviour With
                  Thankfulness and Joy, and Set Upon the Way of Godliness With
                  Pleasure and Alacrity, as Your Exceeding Privilege, and the
                  Only Way of Profit, Honour and Content: and Do it Not as
                  Against Your Wills, as Those That Had Rather Do Otherwise If
                  They Durst, and Account the Service of God an Unsuitable and
                  Unpleasant Thing."
              - direction-19-remember-still-that-conversion-is-the-turning-f:
                  Direction 19 Remember Still That Conversion, is the Turning
                  From Your Carnal Selves to God, and Direct. 1●. Therefore That
                  it Engageth You in a Perpetual Opposition to Your Own Corrupt
                  Conceits and Wills, to Mortify and Annihilate Them, and
                  Captivate Them Wholly to the Holy Word and Will of God.
              - direction-20-lastly-be-sure-that-you-renounce-all-conceit-of:
                  Direction 20. Lastly, Be Sure That You Renounce All Conceit of
                  Self-sufficiency or Merit in Any Thing Direct. 20. You Do, and
                  Wholly Rely on the Lord Jesus Christ, as Your Head, and Life,
                  and Saviour, and Intercessor With the Father.
          - part-ii-the-temptations-whereby-the-devil-hindereth-mens-con:
              "Part. Ii. the Temptations Whereby the Devil Hindereth Men's
              Conversion: With the Proper Remedies Against Them."
      - chap-ii-i-have-since-written-a-book-on-this-subject-to-which:
          Chap. Ii. I Have Since Written a Book on This Subject, to Which I
          Refer the Reader for Fuller Direction. Directions to Young Christians
          or Beginners in Religion, for Their Establishment and Safe Proceeding.
        loci: sanctification
        sections:
          - direct-1-take-heed-lest-it-be-the-novelty-or-reputation-of-t:
              "Direct. 1. Take Heed Lest it Be the Novelty or Reputation of
              Truth and Godliness, That Takes With Direct. 1. You, More Than the
              Solid Evidence of Their Excellency and Necessity: Lest When the
              Novelty and Reputation Are Gone, Your Religion Whither and Consume
              Away."
          - direct-2-take-heed-of-being-religious-only-in-opinion-withou:
              "Direct. 2. Take Heed of Being Religious Only in Opinion, Without
              Zeal and Holy Practice; or Only in Direct. 2. Zealous Affection
              Without a Sound Well Grounded Judgement: but See That Judgement,
              Zeal and Practice ●e Conjunct."
          - direct-3-labour-to-understand-the-true-method-of-divinity-an:
              Direct. 3. Labour to Understand the True Method of Divinity, and
              See Truths in Their Several Degrees Leg. Accost L. 4. C. 21. & 22
              De Fructu Catechizandi. Et Li. 5. and Order; That You Take Not the
              Last for the First; nor the Lesser for the Greater. Therefore See
              That You Be Well Grounded in the Catechism; and Refuse Not to
              Learn Some Catechism That is Sound and Full, and Keep it in Memory
              While You Live.
          - direct-4-begin-not-too-early-with-controversies-in-religion-:
              "Direct. 4. Begin Not Too Early With Controversies in Religion:
              and When You Come to Them, Let Them Direct. 4. Have but Their Due
              Proportion of Your Time and Zeal: but Live Daily Upon These
              Certain, Great Substantials, Which All Christians Are Agreed In."
          - direct-5-be-very-thankful-for-the-great-mercy-of-your-conver:
              "Direct. 5. Be Very Thankful for the Great Mercy of Your
              Conversion: but yet Overvalue Not Your Direct. 5. First Degrees of
              Knowledge or Holiness: but Remember That You Are yet but in Your
              Infancy, and Must Expect Your Growth and Ripeness as the
              Consequent of Time and Diligence."
          - direct-6-be-not-discouraged-at-the-difficulties-and-oppositi:
              Direct. 6. Be Not Discouraged at the Difficulties and Oppositions
              Which Will Rise up Before You, When You Begin Resolvedly to Walk
              With God.
          - direct-7-if-it-be-in-your-power-live-under-a-judicious-faith:
              Direct. 7. If it Be in Your Power, Live Under a Judicious,
              Faithful, Serious, Searching, Powerful Minister; Direct. 7.
              Sulpitius S 〈…〉 Rus in ●●t. Matini ▪ Noteth That None but Bishops
              Were Against Him Because He Was Unlearned and of No Presence. and
              Diligently Attend His Public Teaching, and Use His Private Counsel
              for More Particular Directions and Application, for the Settling
              and Managing the Affairs of Your Souls; Even as You Take the
              Advice of Physicians for Your Health, and of Lawyers for Your
              Estates, and Tutors for Your Studies.
          - direct-8-keep-right-apprehensions-of-the-excellency-of-chari:
              "Direct. 8. Keep Right Apprehensions of the Excellency of Charity
              and Unity Among Believers, and Direct. 8. Against
              Uncha●●●●ableness and Schism. See More in T●n. 2. C●. 23. Receive
              Nothing Hastily That is Against Them; Especially Take Heed Lest
              Under Pretence of Their Authority, Their Number, Their Soundness,
              or Their Holiness, You Too Much Addict Yourselves to Any Sect or
              Party, to the Withdrawing of Your Special Love and Just Communion
              From Other Christians, and Turning Your Zeal to the Interest of
              Your Party, With a Neglect of the Common Interest of the Church:
              but Love a Christian as a Christian, and Promote the Unity and
              Welfare of Them All."
          - direct-9-take-heed-lest-any-persecution-or-wrong-from-others:
              Direct. 9 Take Heed Lest Any Persecution or Wrong From Others,
              Provoke You to Any Unwarrantable Passions and Practices, and
              Deprive You of the Charity, Meekness and Innocency of a Christian;
              or Make You Go Beyond Your Bounds, in Censuring, Reviling, or
              Resisting Your Rulers, Who Are the Officers of God.
          - direct-10-when-you-are-repenting-of-or-avoiding-any-extreme-:
              Direct. 10. When You Are Repenting Of, or Avoiding Any Extreme, Do
              it Not Without Sufficient Direct. 10. Fear and Caution of the
              Contrary Extreme.
          - direct-11-i-et-not-your-first-opinions-about-the-controverte:
              "Direct. 11. I Et Not Your First Opinions About the Controverted
              Difficulties in Religion, ( Where Scripture Direct. 11. for
              Modesty in Your First Opinions. is Not Very Plain) Be Too
              Peremptory, Confident or Fixed: but Hold Them Modestly, With 〈…〉
              Your Unripe Understandings, and With Room for Further Information,
              Supposing it Possible 〈…〉, That Upon Better Instruction Evidence
              and Maturity, You May, in Such Things, Change Your Minds."
          - direct-12-if-controversies-occasion-any-divisions-where-you-:
              "Direct. 12. If Controversies Occasion Any Divisions Where You
              Live, Be Sure to Look First to the Interest of Common Truth and
              Good, and to the Exercise of Charity: and Become Not Passionate
              Contenders for Any Party in the Division, or Censurers of the
              Peaceable, or of Your Teachers That Will Not ●ver 〈…〉 Their Own
              Understandings, to Obtain With You the Esteem of Being Orthodox or
              Zealous Men: but Suspect Your Own Unripe Understandings, and
              Silence Your Opinions Till You Are Clear and Certain, and Join
              Rather With the Moderate and the Peacemakers Than With the
              Contenders and Dividers."
          - direct-13-know-that-true-godliness-is-the-best-life-upon-ear:
              "Direct. 13. Know That True Godliness is the Best Life Upon Earth,
              and the Only May to Perfect Direct. 13. Happiness: Still Apprehend
              it Therefore, and Use it as the Best: and With Great Diligence
              ●●sist Those Temptations Which Would Make it Seem to You a
              Confounding Grievous or Unpleasant Thing."
          - direct-14-be-very-diligent-in-mortifying-the-desires-and-ple:
              Direct. 14. Be Very Diligent in Mortifying the Desires and
              Pleasures of the Flesh; and Keep a Continual Direct. 14. Watch
              Upon Your Senses Appetite and Lusts; and Cast Not Yourselves Upon
              Temptations, Occasions or Opportunities of Sinning, Remembering
              That Your Salvation Lieth on Your Success.
          - direct-15-be-exceeding-wary-not-only-what-teachers-you-commi:
              "Direct. 15. Be Exceeding Wary Not Only What Teachers You Commit
              the Guidance of Your Souls Unto, Direct. 15. Nam Si Falsi & Solo
              Nomine Tumidi, Non Modo Non Consulendi, Sed Vitandi Sunt, Quibus
              Nihil Est Importunius, Nihil Insu Si●s, Etc. P●t●a C●. D●al. 117.
              Li. 2. but Also With What Company You Familiarly Converse: That
              They Be Neither Such as Would Corrupt Your Minds With Error, or
              Your Hearts With Viciousness, Profaneness, Lukewarmness, or With a
              Feavorish Factious Zeal: but Choose, If Possible, Judicious, Holy,
              Heavenly, Humble, Unblameable, Self-denying Persons, to Be Your
              Ordinary Companions, and Familiars; but Especially for Your Near
              Relations."
          - direct-16-make-careful-choice-of-the-books-which-you-read-le:
              "Direct. 16. Make Careful Choice of the Books Which You Read. Let
              the Holy Scriptures Ever Have Direct. 10. the Pre-eminence, and
              Next Them, the Solid, Lively, Heavenly Treatises Which Best
              Expound and Apply the Scriptures: and Next Those, the Credible
              Histories, Especially of the Church, and Tractates Upon Inferior
              Sciences and Arts: but Take Heed of the Poison of the Writings of
              False Teachers, Which Would Corrupt Your Understandings: and of
              Vain Romances, Playbooks, and False Stories, Which May Bewitch
              Your Fantasies, and Corrupt Your Hearts."
          - direct-17-take-heed-that-you-receive-not-a-doctrine-of-liber:
              "Direct. 17. Take Heed That You Receive Not a Doctrine of
              Libertinism as From the Gospel, nor Conceive Direct. 17. of Christ
              as an Encourager of Sin; nor Pretend Free Grace for Your Carnal
              Security or Sloth: for This is but to Set up Another Gospel, and
              Another Christ, or Rather the Doctrine and Works of the Devil
              Against Christ and the Gospel, and to Turn the Grace of God Into
              Wantonness."
          - direct-18-watch-diligently-hath-against-the-more-discernible:
              "Direct. 18. Watch Diligently Hath Against the More Discernible
              Decays of Grace, and Against Direct. 18. the Degenerating of it
              Into Some Carnal Affections: or Something Counterfeit, and of
              Another Kind: and so Also of Religious Duties."
          - direct-19-promises-not-yourselves-long-life-or-prosperity-an:
              Direct. 19 Promise's Not Yourselves Long Life, or Prosperity and
              Great Matters in the World, Lest it Entangle Direct. 19 Your
              Hearts With Transitory Things, and Engage You in Ambitious or
              Covetous Designs, and Steal Away Your Hearts From God, and Destroy
              All Your Serious Apprehensions of Eternity.
          - direct-20-see-that-your-religion-be-purely-divine-and-animat:
              "Direct. 20. See That Your Religion Be Purely Divine, and Animated
              All by God, as the Beginning, the Direct. 20. D 〈…〉 & Ma 〈…〉
              D●●●●●●bat ●ia●●: 〈…〉 Nem 〈◊〉 ●e● 〈◊〉 ●e●i ▪ 〈◊〉 Sufficere Quidem
              Ad Bene Beateque Vivendum; Caeterum Instrumentis Indigere,
              Corporis Bonis, Robore, Sanitate, Integritate 〈◊〉, Etc.
              Exterioribus Etiam, Opinion, Generis Claritate, Gloria, Etc. Ea &
              Si Non Affluerint, Nihilominus Tamen Beatum Fo●●●api●●tem —
              Arbitratur & Deos Humana Cernere Atque Curare: & Daemons Esse —
              Porro in Dialogue Justitiam Divin●m Legem ●●bitratus Est, Ut Ad
              Ju●e Agendum Potentius Persuaderet, Nè Post Mortem Poenas Improbi
              Luerent. Laert. in Pla●.. Way and the End; and That First Upon Thy
              Soul, and Then Upon All That Thou Hast or Dost, There Be Written
              Holiness to the Lord; and That Thou Corrupt Not All With an
              Inordinate Hypocritical Respect to Man."
      - chap-iii-the-general-grand-directions-for-walking-with-god-i:
          "Chap. Iii. the General Grand Directions for Walking With God, in a
          Life of Faith and Holiness: Containing the Essentials of Godliness and
          Christianity."
        loci: sanctification
        sections:
          - direct-i-labour-to-understand-well-the-nature-grounds-reason:
              "Direct. I. Labour to Understand Well the Nature, Grounds, Reason
              and Order of Faith and Gr. Dir. 1. Godliness: and to Believe Upon
              Such Grounds, so Well Understood, as Will Not Suffer for a
              Well-grounded Faith. You to Stagger, or Entertain a Contrary
              Belief."
          - direct-ii-diligently-labour-in-that-part-of-the-life-of-fait:
              "Direct. Ii. Diligently Labour in That Part of the Life of Faith,
              Which Consisteth in the Constant Use of Christ, as the Means of
              the Souls Access to God, Acceptance With Him, and Comfort From
              Him: and Think Not of Coming to the Father, but by Him."
          - direct-iii-gr-dir-3-understand-well-what-it-is-to-believe-in:
              "Direct. Iii. Gr. Dir. 3. Understand Well What it is to Believe in
              the Holy Ghost: and See That He Dwell to Believe in the Holy
              Ghost, and Live Upon His Grace. and Operate in Thee, as the Life
              of Thy Soul, and That Thou Do Not Resist or Quench the Spirit, but
              Thankfully Obey Him."
          - direct-iv-gr-dir-4-let-it-be-your-chiefest-study-to-attain-t:
              Direct. Iv Gr. Dir. 4. Let it Be Your Chiefest Study to Attain to
              a True, Orderly, and Practical Knowledge of God, for the True and
              Orderly Impression of God's Attributes on the Heart. in His
              Several Attributes and Relations; and to Find a Due Impression
              From Each of Them Upon Your Hearts, and a Distinct Effectual
              Improvement of Them in Your Lives.
          - direct-v-remember-that-god-is-your-lord-or-owner-and-see-tha:
              "Direct. V Remember That God is Your Lord or Owner: and See That
              You Make an Absolute Gr. Dir. 5. of Self-resignation to God as Our
              Owner. Resignation of Yourselves, and All That You Have to Him as
              His Own: and Use Yourselves and All Accordingly; Trust Him With
              His Own; and Rest in His Disposals."
          - direct-vi-gr-dir-6-remember-that-god-is-your-sovereign-king-:
              "Direct. Vi Gr. Dir. 6. Remember That God is Your Sovereign King,
              to Rule and Judge You: and That it is Your Rectitude and Happiness
              to Obey and Please Him: Labour Therefore to Bring of Subjection to
              God as Our Supreme Governor. Your Souls and Bodies Into the Most
              Absolute Subjection to Him, and to Make it Your Delight and
              Business Sincerely and Exactly to Obey His Will."
          - direct-vii-continue-as-the-covenanted-scholars-of-christ-the:
              Direct. Vii. Continue as the Covenanted Scholars of Christ, the
              Prophet and Teacher of His Gr. Dir. 7. Church, to Learn of Him by
              His Spirit, Word and Ministers, the Farther Knowledge of God, and
              the Things That Tend to Your Salvation; and This With an Honest
              Willing Mind, in Faith Humility and Diligence; in Obedience,
              Patience and Peace.
            sections:
              - s-ct-2-directions-for-learning-of-christ-as-our-teacher-dire:
                  S●ct. 2. Directions for Learning of Christ as Our Teacher.
                  Direct. 1.
          - direct-viii-gr-dir-6-to-obev-christ-as-our-physician-in-his-:
              "Direct. Viii. Gr. Dir. 6. to Obev Christ as Our Physician in His
              Healing Work, and His Spirit in Its Cleansing Mortifying Work.
              Remember That You Are Related to Christ as the Physician of Your
              Souls, and to the Holy Ghost as Your Sanctifier: Make it Therefore
              Your Serious Study, to Be Cured by Christ, and Cleansed by His
              Spirit, of All the Sinful Diseases and Defilements of Your Hearts
              and Lives."
          - direct-ix-spend-all-your-days-in-a-skilful-vigilant-resolute:
              Direct. Ix. Spend All Your Days in a Skilful, Vigilant, Resolute
              and Valiant War Against the Flesh, Gr. Dir. 9 Our Warfare Under
              Christ Against the Tempter. the World and the Devil, as Those That
              Have Covenanted to Follow Christ the Captain of Your Salvation.
            sections:
              - the-methods-of-christ-against-the-tempter: The Methods of Christ Against the Tempter.
              - tit-2-temptations-to-particular-sins-with-directions-for-pre:
                  Tit. 2. Temptations to Particular Sins; With Directions for
                  Preservation and Remedy.
              - tit-3-temptations-to-draw-us-off-from-duty: Tit. 3. Temptations to Draw Us Off From Duty.
              - tit-4-temptations-to-frustrate-holy-duties-and-make-them-une:
                  Tit. 4. Temptations to Frustrate Holy Duties, and Make Them
                  Uneffectual.
          - direct-x-your-lives-must-be-laid-out-in-doing-god-service-an:
              Direct. X. Your Lives Must Be Laid Out in Doing God Service, and
              Doing All the Good You Can, in Gr. Dir. 10 ●●●● Serving Christ Ou●
              Master in Good Works. Works of Piety, Justice and Charity, With
              Prudence, Fidelity, Industry, Zeal and Delight; Remembering That
              You Are Engaged to God as Servants to Their Lord and Master, and
              Are Entrusted With His Talents, of the Improvement Whereof You
              Must Give Account.
            sections:
              - directions-for-faithful-serving-christ-and-doing-good: Directions for Faithful Serving Christ, and Doing Good.
          - direct-xi-let-it-be-most-deeply-engraven-on-thy-heart-that-g:
              "Direct. Xi. Let it Be Most Deeply Engraven on Thy Heart, That God
              is Infinitely Good, and Amiable: Gr. Dir. 11. Thy Grand Benefactor
              and Father in Christ; the End of All That Thou Art and for Loving
              G●d as Our Father, Our Benefactor and Ou● End. Hast; and the
              Everlasting Rest and Happiness of Thy Soul: See Therefore That Thy
              Inflamed Heart Be Entirely and Absolutely Offered up Unto Him by
              the Mediation of His Son, to Love Him, to Trust Him, to Delight in
              Him, to Be Thankful to Him, to Glorify Him, and Through Faith to
              Long for the Heavenly Glory, Where All This Will Be Perfectly Done
              for Ever. and First Let Us Speak of Love."
            sections:
              - directions-for-loving-god-as-our-father-and-felicity: Directions for Loving God as Our Father and Felicity.
          - direct-xii-trust-god-with-that-soul-and-body-which-thou-hast:
              Direct. Xii. Trust God With That Soul and Body Which Thou Hast
              Delivered up and Dedicated to Gr. Dir. 12. Him; and Quiet Thy Mind
              in His Love and Faithfulness, Whatever Shall Appear to to Trust in
              God. Thee, or Befall Thee in the World.
            sections:
              - 7-directions-for-a-quieting-and-comforting-trust-in-god: §. 7. Directions for a Quieting and Comforting Trust in God.
          - direct-xiii-diligently-labour-that-god-and-holiness-may-be-t:
              "Direct. Xiii. Diligently Labour That God and Holiness May Be Thy
              Chief Delight: and This ●r. Dir. 13. 〈…〉 in G●d. Holy Delight May
              Be the Ordinary Temperament of Thy Religion."
          - direct-xiv-let-thankfulness-to-god-thy-creator-redeemer-and-:
              Direct. Xiv. Let Thankfulness to God Thy Creator, Redeemer and
              Regenerater, Be the Very Gr. Dir. 14. for a Life of Thankfulness.
              Temperament of Thy Soul, and Faithfully Expressed by Thy Tongue
              and Life.
          - direct-xv-let-thy-very-heart-be-set-to-glorify-god-thy-creat:
              Direct. Xv. Let Thy Very Heart Be Set to Glorify God, Thy Creator,
              Redeemer Gr. Dir. 15. and Sanctifier, Both With the Estimation of
              Thy Mind, the Praises of Thy Mouth, to Glorify God. and the
              Holiness of Thy Life.
