junius-de-theologia-vera:
  author: Q713096
  date_added: 2026-02-09
  la:
    title: De theologia vera
    orig_lang: true
    editions:
      - year: 1594
        place: Leiden
  en:
    title: On True Theology
    sections:
      - definition: On the Definition of Theology
        loci: nature-of-theology
        sections:
          - s1: "I. Introduction to the Argument of Sacred Theology"
          - s2: "II. The Etymology and Homonymous Usage of the Term “Theology”"
          - s3: "III. Sacred Theology Distinguished from False Theologies"
          - s4: "IV. The Essential Definition of Sacred Theology"
          - s5: "V. The Genus of Theology: Science"
          - s6: "VI. The Differences of Theological Science from Other Sciences"
          - s7: "VII. The Material Cause of Theology"
          - s8: "VIII. The Formal Cause of Theology"
            sections:
              - s8_1: "A. The Twofold Consideration of Theological Form"
              - s8_2: "B. The Constant Form of Theology in Simple and Comparative Consideration"
              - s8_3: "C. The Truth of Theology"
              - s8_4: "D. The Justice of Theology"
              - s8_5: "E. The Holiness of Theology"
              - s8_6: "F. The Perfection of Theology"
              - s8_7: "G. The Unity, Eternity, and Immutability of Theology"
          - s9: "IX. The Efficient Cause of Theology"
            sections:
              - s9_1: "A. The Twofold Efficient Cause"
              - s9_2: "B. The Principal Efficient Cause: The Triune God"
              - s9_3: "C. The Instrumental Cause: The Enunciative Word of God"
          - s10: "X. The Final Cause of Theology"
            sections:
              - s10_1: "A. The Twofold Final Cause"
              - s10_2: "B. The Primary or Supreme End: The Glory of God"
              - s10_3: "C. The Secondary or Subordinate End: The Good of the Elect"
          - s11: "XI. Theology Considered Absolutely Versus Theology Considered in Human Subjects"
            sections:
              - s11_1: "A. The Distinction Between Absolute and Concrete Theology"
              - s11_2: "B. Natural Theology in Corrupted Man"
                sections:
                  - s11_2_1: "1. The Definition and Preservation of Natural Theology"
                  - s11_2_2: "2. The Source, Nurture, and Communality of Natural Theology"
              - s11_3: "C. Supernatural or Inspired Theology in Some Men"
              - s11_4: "D. The Distribution of Natural, Inspired, and Absolute Theology Among Mankind"
              - s11_5: "E. Sacred Scripture as the Absolute Instrument of Theology"
      - scripture-definition: On the Definition and Matter of Sacred Scripture
        loci: scripture
        sections:
          - s1: "I. The Definition and Subject of Sacred Scripture"
            sections:
              - s1_1: "A. The Definition of Sacred Scripture"
              - s1_2: "B. The Proper Subject of Sacred Scripture"
          - s2: "II. The Twofold Material Distinction of Sacred Scripture"
            sections:
              - s2_1: "A. The Two Modes of Distinguishing Scripture’s Matter"
              - s2_2: "B. The Twofold Subject and Matter of Scripture"
              - s2_3: "C. The Proper and Supreme Subject: God"
              - s2_4: "D. The Inferior and Secondary Subject: Man and the Church"
              - s2_5: "E. The Exposition of Both Matters in Scripture"
          - s3: "III. The Nature of the Twofold Subject Expounded in Scripture"
            sections:
              - s3_1: "A. The Nature of God Expounded Through Attributes"
              - s3_2: "B. The Nature of Man and the Church Expounded Completely"
          - s4: "IV. The Divine Ordination and Offices Between God and Man"
            sections:
              - s4_1: "A. The Necessity of Demonstrating Their Mutual Relation"
              - s4_2: "B. The Ordination: God as Uncaused Cause, Man as Caused Effect"
              - s4_3: "C. The Two Genera of Offices: Right and Fact"
              - s4_4: "D. Divine Offices Concerning Right"
              - s4_5: "E. Human Offices Concerning Right"
              - s4_6: "F. Divine Offices Concerning Fact"
              - s4_7: "G. Human Offices Concerning Fact"
              - s4_8: "H. The Purpose of Scripture’s Exposition of These Matters"
          - s5: "V. The Essential Parts of Sacred Scripture"
            sections:
              - s5_1: "A. The Two Essential Parts: Aetiology and History"
              - s5_2: "B. The Two Essential Parts of Aetiology: Law and Gospel"
              - s5_3: "C. The Two Essential Parts of Sacred History"
              - s5_4: "D. The Mixed Genre of Scripture"
          - s6: "VI. The Integral Parts of Sacred Scripture: The Two Testaments"
            sections:
              - s6_1: "A. The Two Integral Parts: Old and New Testaments"
              - s6_2: "B. The Divisions of the Old Testament"
                sections:
                  - s6_2_1: "1. The Multiplicity of Ancient Divisions"
                  - s6_2_2: "2. The First Division: Law and Prophets"
                  - s6_2_3: "3. The Second Division: Law, Prophets, and Psalms"
                  - s6_2_4: "4. The Third Division: Law, Former Prophets, Latter Prophets, and Psalms"
                  - s6_2_5: "5. The Fourth Division: By Time of Composition"
                  - s6_2_6: "6. The Synecdochical Nature of These Divisions"
                  - s6_2_7: "7. The Fifth Division: By Enumeration of Individual Books"
              - s6_3: "C. The Divisions of the New Testament"
                sections:
                  - s6_3_1: "1. The Varying Divisions of the New Testament"
                  - s6_3_2: "2. The Twofold Division: Historical and Aetiological"
                  - s6_3_3: "3. The Threefold Division: Historical, Prophetical, and Aetiological"
                  - s6_3_4: "4. The Enumeration of Individual Parts"
      - scripture-efficient: On the Efficient Cause of Sacred Scripture
        loci: scripture
        sections:
          - s1: "I. The Impossibility of Created Efficient Causation of Sacred Scripture"
            sections:
              - s1_1: "A. The Dignity of Scripture Confirmed by Its Essential Parts"
              - s1_2: "B. The Incapacity of Creatures to Supply Matter or Form"
          - s2: "II. God as the Absolute Efficient Cause of Scripture"
            sections:
              - s2_1: "A. The Triune God as Author and Efficient Cause"
              - s2_2: "B. The Divine Communication and Testimony"
          - s3: "III. The Twofold Mode of Divine Communication"
            sections:
              - s3_1: "A. The Two Modes: Speech and Scripture"
              - s3_2: "B. The Twofold Mode of Divine Speech"
                sections:
                  - s3_2_1: "1. The Distinction Between Internal/Spiritual and External/Corporeal Speech"
                  - s3_2_2: "2. The Immediate and Mediate Manner of Both Modes"
                  - s3_2_3: "3. Internal and Spiritual Speech"
                    sections:
                      - s3_2_3_1: "a. Immediate Internal Speech with Angels and Godly Men"
                      - s3_2_3_2: "b. Mediate Internal Speech Through Angels"
                  - s3_2_4: "4. External and Corporeal Speech"
                    sections:
                      - s3_2_4_1: "a. Immediate External Speech by the Son"
                      - s3_2_4_2: "b. Mediate External Speech in Three Ways"
              - s3_3: "C. Scripture as the Second Mode of Communication"
                sections:
                  - s3_3_1: "1. The Immediate and Mediate Writing of Scripture"
                  - s3_3_2: "2. Immediate Writing by God Himself"
                  - s3_3_3: "3. Mediate Writing Through God’s Servants"
          - s4: "IV. The Divine Testimonies Confirming God’s Authorship"
            sections:
              - s4_1: "A. The Twofold Division of Testimonies: Ordinary and Extraordinary"
              - s4_2: "B. Extraordinary Testimonies or Signs"
                sections:
                  - s4_2_1: "1. The Two Genera of Extraordinary Testimonies"
                  - s4_2_2: "2. Symbolic Testimonies"
                  - s4_2_3: "3. Energetic Testimonies"
              - s4_3: "C. Ordinary Testimonies"
                sections:
                  - s4_3_1: "1. The Twofold Division: Temporary and Perpetual"
                  - s4_3_2: "2. The Three Perpetual Testimonies"
                  - s4_3_3: "3. The Convergence of All Testimonies at the Giving of the Law"
                  - s4_3_4: "4. The Necessity of These Testimonies for Moses’ Authority"
                  - s4_3_5: "5. The Ordinary Testimonies from Moses to the Babylonian Deportation"
                  - s4_3_6: "6. The Ordinary Testimonies After the Deportation"
                  - s4_3_7: "7. The Examination and Authentication of Post-Deportation Sacred Writings"
              - s4_4: "D. The Testimonies in the Fullness of Times"
                sections:
                  - s4_4_1: "1. God’s Speech Through the Son in the Last Times"
                  - s4_4_2: "2. The Son as the Most Constant Canon of All Scripture"
                  - s4_4_3: "3. The Testimonies Confirming the Son’s Speech"
                  - s4_4_4: "4. The Mediate Production of New Testament Writings in Christ"
              - s4_5: "E. The Testimonies to the Apostolic and Evangelical Writings"
                sections:
                  - s4_5_1: "1. The Twofold Division: Testimonies from God and from Men"
                  - s4_5_2: "2. Immediate Testimonies from God"
                  - s4_5_3: "3. Mediate Testimonies from God"
                  - s4_5_4: "4. Testimonies from Men: The Forced Witness of the Ungodly"
      - scripture-form: On the Form of Sacred Scripture
        loci: scripture
        sections:
          - s1: "I. The Divine Form of Sacred Scripture Defined"
            sections:
              - s1_1: "A. The Analogical Correspondence of Form to Matter"
              - s1_2: "B. The Divine Form Simply Stated"
          - s2: "II. Scripture as Divine Truth"
            sections:
              - s2_1: "A. Christ’s Designation of Scripture as Truth"
              - s2_2: "B. The Convertibility of Divine Truth and Sacred Scripture"
              - s2_3: "C. Divine Truth Shining Forth in All Things and Speech"
              - s2_4: "D. Scripture Conformed to Sacred Theology in Divine Symmetry"
              - s2_5: "E. The Divine Origin of Scripture’s Truth"
              - s2_6: "F. The Divine Manner of Scripture’s Composition"
          - s3: "III. The Fourfold Divine Character in Scripture’s Matter"
            sections:
              - s3_1: "A. The Truth of Scripture in Matters"
              - s3_2: "B. The Justice of Scripture in Matters"
                sections:
                  - s3_2_1: "1. Scripture’s Teaching Nothing Unjust"
                  - s3_2_2: "2. The Narration of Unjust Deeds Does Not Detract from Scripture’s Justice"
                  - s3_2_3: "3. The Proper Virtue of Historical Narrative"
              - s3_3: "C. The Holiness of Scripture in Matters"
              - s3_4: "D. The Perfection of Scripture in Matters"
          - s4: "IV. The Fourfold Divine Character in Scripture’s Speech"
            sections:
              - s4_1: "A. The Attribution of Divine Qualities to Scripture’s Speech"
              - s4_2: "B. The Truth of Scripture’s Speech"
                sections:
                  - s4_2_1: "1. The Complete Absence of Falsehood"
                  - s4_2_2: "2. Figurative Speech Does Not Oppose Truth"
                  - s4_2_3: "3. The Greater Utility of Figurative Speech"
                  - s4_2_4: "4. The Necessity and Expediency of Figurative Expression"
              - s4_3: "C. The Justice of Scripture’s Speech"
              - s4_4: "D. The Holiness of Scripture’s Speech"
              - s4_5: "E. The Perfection of Scripture’s Speech"
          - s5: "V. The Twofold Accommodation of Scripture’s Speech"
            sections:
              - s5_1: "A. Accommodation to the Nature of Things"
              - s5_2: "B. Accommodation to Human Capacity"
          - s6: "VI. The Virtues of Scripture’s Speech"
            sections:
              - s6_1: "A. All Laudable Virtues Present Without Human Wisdom’s Pretense"
              - s6_2: "B. All Things Expounded According to Propriety"
              - s6_3: "C. The Threefold Excellence of Scripture’s Written Form"
                sections:
                  - s6_3_1: "1. Introduction to the Three Excellences"
                  - s6_3_2: "2. Written Well, or Rather Most Excellently"
                  - s6_3_3: "3. Written Briefly"
                  - s6_3_4: "4. Written Clearly"
          - s7: "VII. Conclusion: The Truly Divine and Incomparable Form of Scripture"
      - scripture-end: On the End of Sacred Scripture
        loci: scripture
        sections:
          - s1: "I. The Necessity and Excellence of Scripture’s End"
            sections:
              - s1_1: "A. The Manifold Dignity of Scripture Proving an Excellent End"
              - s1_2: "B. The Certainty of a Definite End for Scripture"
              - s1_3: "C. The Impossibility of Divine Work Without Contemplation of End"
              - s1_4: "D. The Manifest Necessity of an Excellent End"
          - s2: "II. The Twofold End of Sacred Scripture Defined"
            sections:
              - s2_1: "A. The Double Good Corresponding to Double End"
              - s2_2: "B. The Two Genera of Objects in Counsel and Will"
              - s2_3: "C. The Proper Designation of Primary and Secondary Ends"
          - s3: "III. The Glory of God as the Supreme End of Scripture Demonstrated"
            sections:
              - s3_1: "A. Introduction to the Threefold Demonstration"
              - s3_2: "B. From the Nature of God"
                sections:
                  - s3_2_1: "1. God as Infinite, Self-Sufficient, and Supreme Good"
                  - s3_2_2: "2. The Absurdity of Any Other End Than God Himself"
              - s3_3: "C. From the Common Nature of All Created Things"
                sections:
                  - s3_3_1: "1. All Things Moved Toward God as Universal Good"
                  - s3_3_2: "2. The Necessary Distinction Between Natural and Rational Appetite"
                  - s3_3_3: "3. The Condition of Natural Appetite in Non-Rational Creatures"
                  - s3_3_4: "4. The Different Condition of Rational Appetite"
                  - s3_3_5: "5. The Singular Condition of Rational Appetite Regarding the Supreme End"
                  - s3_3_6: "6. The Argument from Human Nature"
              - s3_4: "D. Scriptural Confirmation of God’s Glory as Supreme End"
          - s4: "IV. Man’s Original Knowledge and Subsequent Loss of the Supreme End"
            sections:
              - s4_1: "A. Right Reason’s Original Knowledge and Intended Action"
              - s4_2: "B. Man’s Aberration from the Supreme End Through Sin"
          - s5: "V. The Secondary End: The Good of the Elect After the Fall"
            sections:
              - s5_1: "A. The Occasion for the Secondary End Presented to God"
              - s5_2: "B. The Singular Document Given to Man, Not to the Devil"
              - s5_3: "C. The Demonstration and Bestowal of Evil and Cure"
              - s5_4: "D. Scripture’s Fourfold Provision for Man’s Quadruple Defect"
                sections:
                  - s5_4_1: "1. Doctrine of the Supreme End Against Man’s Ignorance and Aberration"
                  - s5_4_2: "2. Doctrine of Man and Just Ordination Against Man’s IgnoranceThereof"
                  - s5_4_3: "3. Doctrine of Repentance and Faith Against Exclusion by the Evil of Guilt"
                  - s5_4_4: "4. Doctrine of Liberation and Eternal Life Against the Evil of Punishment"
          - s6: "VI. Conclusion: The Dual End of Scripture Recapitulated"
            sections:
              - s6_1: "A. God’s Work for His Own Glory as the Supreme End"
              - s6_2: "B. The Twofold Argument Exhibited in Scripture"
              - s6_3: "C. The Far Greater Glory of the Second Benefit"
              - s6_4: "D. Summary and Doxology"
      - scripture-authority-1: On the Authority of Sacred Scripture
        loci: credibility-of-scripture
        sections:
          - s1: "I. The Two Genera of Those Who Diminish Scripture’s Authority"
            sections:
              - s1_1: "A. Introduction to the Two Genera"
              - s1_2: "B. The Position of Those Who Make Authority Depend on the Church"
              - s1_3: "C. An Illustration of Their Error"
          - s2: "II. The Essential and Per Se Authority of Scripture"
            sections:
              - s2_1: "A. The Universal Principle of Per Se Properties"
              - s2_2: "B. Divine Authority Inherent Per Se in Scripture"
          - s3: "III. The Subordinate Authority of the Church"
            sections:
              - s3_1: "A. The Church’s Authority in Respect to Us Acknowledged"
              - s3_2: "B. The Subordinate Nature of Church Authority"
              - s3_3: "C. God’s Authority as Primary, Supreme, and Alone Sufficient"
              - s3_4: "D. The Church’s Authority as Secondary and Testimonial"
              - s3_5: "E. Both Authorities Recognized in Proper Order"
          - s4: "IV. The Threefold Arguments Abused to Obtain Church Supremacy"
          - s5: "V. The First Argument: From the Dignity and Office of the Church"
            sections:
              - s5_1: "A. The Twofold Office of the Church: What It Ought and What It Hath Performed"
              - s5_2: "B. The Office Owed by the Church"
              - s5_3: "C. The Office Performed by the Visible Church"
                sections:
                  - s5_3_1: "1. The Imperfect Performance of the Church"
                  - s5_3_2: "2. The Varying Degrees of Imperfection"
              - s5_4: "D. The Perfect and Imperfect Custodians of Divine Authority"
                sections:
                  - s5_4_1: "1. God as the Perfect Custodian and Vindicator"
                  - s5_4_2: "2. The Church as the Imperfect Custodian and Vindicator"
              - s5_5: "E. The Church as House, Pillar, and Foundation of Truth"
                sections:
                  - s5_5_1: "1. Introduction to the Threefold Designation"
                  - s5_5_2: "2. The Church as the House of the Living God"
                  - s5_5_3: "3. The Church as the Pillar of Truth"
                  - s5_5_4: "4. The Church as the Firm Seat and Foundation of Truth"
                  - s5_5_5: "5. Summary of the Church’s Preserving and Proposing Function"
              - s5_6: "F. The Church’s Proper Dignity and Office Defined"
                sections:
                  - s5_6_1: "1. The Church Testifies to, But Does Not Confer, Divine Authority"
                  - s5_6_2: "2. The Useful Human Authority Affecting Men"
                  - s5_6_3: "3. The Impossibility of Inferior Authority Detracting from Superior"
                  - s5_6_4: "4. Nothing Can Be Added to the Divine, Perfect, Infinite"
                  - s5_6_5: "5. The Infinite Audacity of Claiming to Perfect the Divine"
          - s6: "VI. The Second Argument: From Accidents—Corruptions and Vices of Scripture"
            sections:
              - s6_1: "A. The Objection: Corruption Requires Church Authority"
              - s6_2: "B. First Response: This Objection Shows Church’s Fault, Not Authority"
                sections:
                  - s6_2_1: "1. The Source of Corruption: Malice, Infirmity, or Imprudence"
                  - s6_2_2: "2. The Depositary’s Responsibility for Corrupted Deposit"
                  - s6_2_3: "3. The Church’s Duty to Prove Faithfulness or Implore Mercy"
                  - s6_2_4: "4. The Church Must Acknowledge Fault and Give Glory to God"
              - s6_3: "C. Second Response: Corruption Affects Only Certain Words and Places"
                sections:
                  - s6_3_1: "1. Corruption Not in Substantial Parts of Doctrine"
                  - s6_3_2: "2. Substantial and Primary Parts Remaining Whole"
                  - s6_3_3: "3. The Church’s Duty to Restore from Scripture Itself"
              - s6_4: "D. Third Response: Specific Objections About Corruption Answered"
                sections:
                  - s6_4_1: "1. Four Specific Objections Stated"
                  - s6_4_2: "2. Response to “Scripture Perished”"
                  - s6_4_3: "3. Response to “Depositaries Acted in Bad Faith”"
                  - s6_4_4: "4. Response to “Scripture Varies”"
                  - s6_4_5: "5. Response to “Human Labor Needed for Restoration”"
                    sections:
                      - s6_4_5_1: "a. Denial of Human Labor in Constituting Hebrew Letters and Points"
                      - s6_4_5_2: "b. The Pious Diligence in Collating Ancient Exemplars"
          - s7: "VII. The Third Argument: From Sentences of the Orthodox Fathers"
            sections:
              - s7_1: "A. The Godly Sentences of Holy Fathers Not Rejected"
              - s7_2: "B. The Religious Manner of the Fathers’ Confirmation"
              - s7_3: "C. The Threefold Caution Required in This Kind of Argument"
                sections:
                  - s7_3_1: "1. First Caution: The Fathers Meant Secondary Authority"
                  - s7_3_2: "2. Second Caution: Used Against Heretics, Not Among the Godly"
                  - s7_3_3: "3. Third Caution: Used When Heretics Obtruded Human Authority"
              - s7_4: "D. The Iniquity of Misusing the Fathers’ Words"
              - s7_5: "E. Conclusion: Rendering to God and Church Their Proper Due"
      - scripture-authority-2: On the Authority of Scripture
        loci: credibility-of-scripture
      - covenants: "Chapter 25: On the Divine Covenants and Testaments"
        loci: covenant-of-grace
        sections:
          - s1: "I. THE TRANSITION FROM LAW TO DIVINE COVENANTS"
          - s2: "II. THE TWOFOLD STATE OF MAN AND CORRESPONDING DIVINE DISPOSITIONS"
          - s3: "III. THE FIRST COVENANT: THE EDENIC COVENANT OF WORKS"
            sections:
              - s3_1: "A. The Nature and Definition of the Term “Covenant”"
              - s3_2: "B. The Author of the Covenant: God in His Triunity"
              - s3_3: "C. The Matter and Object of the Covenant"
                sections:
                  - s3_3_1: "1. The Twofold Object of the Covenant"
                  - s3_3_2: "2. The Proper Subject and Recipients of the Covenant"
              - s3_4: "D. The Material Cause: The Conditions of the Covenant"
              - s3_5: "E. The Form of the Covenant: Mutual Obligation According to Conditions"
              - s3_6: "F. The Ends of the Covenant"
                sections:
                  - s3_6_1: "1. The General End: The Glory of God"
                  - s3_6_2: "2. The Particular End: The Salvation of Man"
              - s3_7: "G. The Instruments of the Covenant"
                sections:
                  - s3_7_1: "1. The First Instrument: The Tree of Life as Sacrament"
                  - s3_7_2: "2. The Second Instrument: The Tree of Knowledge as Pledge of Obedience"
              - s3_8: "H. The Trial, Transgression, and Consequences of the Covenant"
          - s4: "IV. THE SECOND GENERAL DISPOSITION: THE COVENANT OF GRACE IN CHRIST"
            sections:
              - s4_1: "A. The Impossibility of Salvation Through the Broken Covenant"
              - s4_2: "B. God’s Provision of a Way Congruent with Divine Justice"
              - s4_3: "C. The Necessity and Nature of Faith in Apprehending Christ"
              - s4_4: "D. The Uniqueness and Exclusivity of This Way of Salvation"
          - s5: "V. THE DISTINCTION BETWEEN GENERAL DISPOSITION AND SPECIFIC MODES"
          - s6: "VI. THE VARIETY IN EXTERNAL MODES OF THE GOSPEL DISPOSITION"
            sections:
              - s6_1: "A. The Fountain and Source of This Variety"
              - s6_2: "B. The General Distinction of Modes According to Time"
              - s6_3: "C. The Three Periods Before Christ’s Advent"
          - s7: "VII. THE FIRST PERIOD: THE TIME OF PROMISE (ADAM TO ABRAHAM)"
            sections:
              - s7_1: "A. The Nature and Name of the Period of Promise"
              - s7_2: "B. The Worship and Visible Signs Under the Promise"
              - s7_3: "C. The Nature and Efficacy of the Promise Through the Surety"
              - s7_4: "D. The Heavenly Inheritance of the Fathers Before Christ"
          - s8: "VIII. THE SECOND PERIOD: THE TIME OF COVENANT (ABRAHAM TO EXODUS)"
            sections:
              - s8_1: "A. The Historical Occasion and Establishment of the Abrahamic Covenant"
              - s8_2: "B. The Sacraments Added to Seal the Covenant"
                sections:
                  - s8_2_1: "1. The First Sacrament: Circumcision for Initiation"
                  - s8_2_2: "2. The Second Sacrament: Passover for Continuation"
              - s8_3: "C. The Commonality and Differences Between Promise and Covenant"
          - s9: "IX. THE THIRD PERIOD: THE TIME OF TESTAMENT (SINAI TO CHRIST’S ADVENT)"
            sections:
              - s9_1: "A. The Nature, Name, and Meaning of “Testament”"
              - s9_2: "B. The Twofold Parts of the Mosaic Testament"
                sections:
                  - s9_2_1: "1. The First Part: The Conditional Testament of Perfect Legal Obedience"
                  - s9_2_2: "2. The Perfection of the Moral Law’s Standard"
                  - s9_2_3: "3. The Preparatory Purpose of the First Part"
                  - s9_2_4: "4. The Impossibility of the Condition and Succession of the Second Part"
                  - s9_2_5: "5. The Typical and Shadowy Exposition of the Second Part"
              - s9_3: "C. The Disposition and Mutual Relationship of the Two Parts"
              - s9_4: "D. The Method of the Prophets in Expounding the Testament"
              - s9_5: "E. The Cause and Purpose of This Divine Order"
              - s9_6: "F. God’s Declaration Through the Prophets of the Sole Grace Covenant"
          - s10: "X. THE MODE AFTER CHRIST’S NATIVITY"
