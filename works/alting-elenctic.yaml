                  - s4_9_2_2: "b. That the Refutation Be Prudent"
                  - s4_9_2_3: "c. That the Refutation Be Tempered with Meekness and Charity"
      - s13: "THE THIRTEENTH LOCUS CONCERNING THE CHURCH"
        sections:
          - s13_1: "CALUMNIES"
            sections:
              - s13_1_1: "FIRST: That the Church to us is a conflux of whatsoever men or sects, provided only they be not subject to the Pope."
              - s13_1_2: "SECOND: That only the perfect are in the Church?"
              - s13_1_3: "THIRD: That the Church acknowledgeth or admitteth no government at all, besides ecclesiastical governance and discipline."
              - s13_1_4: "FOURTH: That through syncretism we study to reconcile Churches dissenting from each other in whatsoever manner."
          - s13_2: "LOGOMACHIES"
            sections:
              - s13_2_1: "FIRST: Whether the Church is the communion of Saints also in corporal goods?"
              - s13_2_2: "SECOND: Whether any particular Church is or can be called Catholic?"
              - s13_2_3: "THIRD: Whether the Church can be without discipline?"
              - s13_2_4: "FOURTH: Whether private reading of the word is a mark of the Church, or public preaching thereof?"
          - s13_3: "CONTROVERSIES"
            sections:
              - s13_3_1: "FIRST CONTROVERSY OF THE ANABAPTISTS: Whether the Church of the Old and New Testament is the same in reality or substance?"
              - s13_3_2: "SECOND CONTROVERSY OF THE SOCINIANS: Whether there must necessarily always be some militant Church on earth; or, whether the existence of the militant Church on earth is necessary even unto the consummation of the age?"
              - s13_3_3: "THIRD CONTROVERSY OF THE ANABAPTISTS: Whether the goods of Christians ought to be common?"
              - s13_3_4: "FOURTH CONTROVERSY OF THE PONTIFICIANS: Whether the Church is the universality of those obeying the Roman Pope? Or more fully: Whether the Church is an assembly of men bound together by the profession of the same Christian faith and communion of the same Sacraments, under the government of legitimate pastors, and especially of one vicar of Christ on earth, the Roman Pontiff?"
              - s13_3_5: "FIFTH CONTROVERSY OF THE PONTIFICIANS: Whether any particular visible Church can at some time be obscured and also fail?"
              - s13_3_6: "SIXTH CONTROVERSY OF THE PONTIFICIANS: Whether the Name of the Catholic Church and of Christians, Antiquity, Long and Never Interrupted Duration, Amplitude or Multitude and Variety of Believers, Succession of Bishops, Conspiracy in Doctrine with the Ancient Church and Fathers, Union of Members Among Themselves with the Head, Holiness of Doctrine, Efficacy of Doctrine, Holiness of Life of the First Authors, Glory of Miracles, Prophetic Light, Confession of Adversaries, Unhappy End of Those Who Assault the Church, Temporal Felicity—whether, I say, all these universally and severally are genuine and proper marks of the true Church?"
