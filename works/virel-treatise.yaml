  en:
    title: "A Learned and Excellent Treatise Containing All the Principal Grounds of Christian Religion. Set Down by Way of Conference in a Most Plain and Familiar Manner. Written First in French by Master Matthew Virell, After Translated Into Latin: and Now Turned Into English for the Use of Our Countrymen. 1. Tim. 4. 15. These Things Meditate, and Labour in Them, That Thy Profiting May Be Manifest to All. the Second Impression, Corrected and Amended. Deus Imperat Astris. Imprinted at London by Richard Field for Robert Dexter, Dwelling in Paul's Churchyard at the Sign of the Brazen Serpent. 1594."
    sections:
      - the-first-book-of-christian-religion-wherein-the-grounds-of-: "The First Book of Christian Religion, Wherein the Grounds of Our Salvation Are Handled."
        # loci:
        sections:
          - chap-i-of-the-knowledge-of-god-who-being-perfectly-just-and-: "Chap. I. of the Knowledge of God, Who Being Perfectly Just, and Perfectly Merciful, Doth Never Exercise His Mercy, but He Doth Also Exercise His Justice."
            # loci:
          - chap-ii-of-the-knowledge-of-man-who-being-a-most-miserable-s: "Chap. Ii. of the Knowledge of Man, Who Being a Most Miserable Sinner, is Before God, Guilty of Eternal Death."
            # loci:
          - chap-iii-of-the-knowledge-of-christ-who-having-satisfied-for: "Chap. Iii. of the Knowledge of Christ, Who Having Satisfied for Us the Perfect Righteousness of God, Hath Opened a Way to His Infinite Mercy, Through the Which at Length We May Come to Eternal Life."
            # loci:
          - chap-four-of-faith-by-the-which-we-are-made-one-with-christ-: "Chap. Four of Faith, by the Which We Are Made One With Christ, and so Be Partakers of All His Gifts."
