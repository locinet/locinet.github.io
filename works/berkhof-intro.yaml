                  C. Distribution of Dogmatics
  
                  There has been quite a variety of opinion respecting the proper distribution of the material of Dogmatics. The principle of distribution has been derived from the subject-matter of theology, from the sources of its material content, from the manner in which this is treated, or from its historical development. Naturally, this principle may not be chosen arbitrarily, but should be germane to the subject, should cover the whole field and assure to each part a natural place, and should maintain the proper proportions of the separate parts. Logic would seem to require that in theology, as in all other sciences, the principle of division should be derived, not from its sources, its manner of treatment, or its historical development, but very decidedly from its subject-matter. The following are the most important methods of distributing the dogmatic material adopted in the Protestant Church since the days of the Reformation.
  
                  1. THE TRINITARIAN METHOD. To a certain extent Calvin and Zwingli paved the way for the trinitarian distribution of the dogmatic material. Their classification was not strictly trinitarian, but was derived from the Apostolic Confession. They followed up their discussion of God as Creator, God as Redeemer, and God as Sanctifier, with a separate book, dealing with the Church and the Sacraments. The Dutch theologian, Melchior Leydekker (born 1642), a follower of Voetius, was the first one to apply the strictly trinitarian method. It did not become popular, however. Hegel, who regarded the doctrine of the Trinity as the central doctrine of Christianity, brought it into prominence once more; and it is followed by Marheineke and Martensen. This method naturally leads to an undue emphasis on the metaphysical in Dogmatics. Logically, it excludes the discussion of the doctrine of the Trinity. This can only be treated as a presupposition in a preliminary chapter. Moreover, this method, with its excessive emphasis on the separate persons of the Godhead tends to obscure the fact that the divine opera ad extra are all opera essentialia, that is, works of the divine Being as a whole, and to give them the appearance of opera personalia, works of the separate persons. Finally, the various elements of anthropology and soteriology do not find a natural place in such a scheme. For these reasons this method of distribution has found little favor, and does not deserve commendation.
  
                  2. THE ANALYTICAL METHOD. While the synthetic method begins with God, and then proceeds to discuss man, Christ, redemption, et cetera, until it finally reaches the end of all things, the analytical method, proposed by Calixtus (1614–1656), begins with what it considers the final cause or end of theology, namely, blessedness, then proceeds to the subject (God, angel, man, sin), and finally treats of the means by which it is secured (predestination, incarnation, Christ, justification, the Word, the Sacraments, and so on). It surely makes a strange impression that theology should begin with the end, and that the end should be blessedness rather than the glory of God. It is equally strange that in the second part God, angels, and men should be coördinated, as if blessedness were the end of theology for the one as well as for the other. Moreover, the third part does scant justice to Soteriology, since it is silent on such subjects as regeneration, calling, conversion, faith, sanctification, and good works. Notwithstanding this, the method of Calixtus was followed by several Lutheran theologians, though it meets with no favor at the present time.
  
                  3. THE COVENANTAL METHOD. Coccejus was the first to derive a principium divisionis from the covenant idea. He distinguished, and dealt successively with, the foedus naturae et operum, and the foedus gratiae with its three subdivisions: ante legem, sub lege, and post legem. Among the Reformed theologians of the Netherlands he was followed by Witsius and Vitringa, but in other circles his system found no favor. And even in Reformed theology it was short-lived. Among the Southern Presbyterians of our own country Dr. Thornwell followed a somewhat similar division. He derives his principle of distribution from the moral government of God, and treats of the moral government in its simple form, the moral government modified by the covenant of works, and the moral government modified by the covenant of grace. But in this division the principle of distribution is clearly not derived from the subject-matter as such, but from the history of its development. Taking its starting point in the covenant between God and man, it can naturally discuss the doctrine of God and of man only by way of introduction. Moreover, it virtually obliterates the distinction between the History of Revelation and Dogmatics, deprives Dogmatics of its absolute character, and leads to constant repetitions.
  
                  4. THE CHRISTOLOGICAL METHOD. Several theologians, both in Europe and in America, are of the opinion that all genuinely Christian theology should be Christocentric, and should therefore derive its principle of distribution from Christ or the saving operations of Christ. This position is taken by Hase, Thomasius, Schultz, T. B. Strong, A. Fuller, H. B. Smith, and V. Gerhart. Schultz treats of God and the world, and of man and sin, as presuppositions of the Christian salvation, and then proceeds to the discussion of the saving work of the Son of God (Person and work of Christ), and the saving acts of the Spirit of God (Church, means of grace, ordo salutis, perfecting of salvation). A somewhat similar course is followed by Smith, who treats successively of the antecedents of redemption, the redemption itself, and the consequents or (to use a later term) the kingdom of redemption. It is a sufficient condemnation of this method that the doctrines of God, of man, and of sin, must be placed outside of the system, and treated as prolegomena. Christ is indeed the center of God's revelation, but for that very reason cannot be the starting point. Moreover, this method is sometimes (as, for instance, in the work of Gerhart) combined with the false notion that Christ, and not Scripture, is the principium cognoscendi externum of theology.
  
                  5. THE METHOD BASED ON THE KINGDOM IDEA. Under the influence of Ritschl, who makes the Kingdom of God central in his theology, some theologians would derive the principle of distribution from this important concept. Ritschl himself does not apply this division; neither do Kaftan, Haering, and Herrmann, some of the most important theologians of the Ritschlian school. Van Oosterzee offers an example of it which is not very convincing. In reality he gives the customary synthetic division, and merely substitutes for the old titles of the various divisions designations derived from the idea of the Kingdom. He discusses successively God or the supreme King (theology), man or the subject (anthropology), Christ or the founder (Christology), redemption or the salvation (objective soteriology), the way of salvation or the constitution (subjective soteriology), the Church or the training school (ecclesiology), and the future coming of the Lord or the consummation, of the Kingdom (Eschatology). This division is purely formal, and is by no means organically deduced from the Kingdom idea. Moreover, a division based on the Kingdom idea robs Dogmatics of its theological character, and is logically impossible. The doctrine of God, of man in general, of sin, and of Christ in His many-sided significance cannot be derived from the idea of the Kingdom of God.
  
                  6. THE SYNTHETICAL METHOD. This is the only method that will yield the desired unity in Dogmatics. It takes its starting point in God, and considers everything that comes up for discussion in relation to God. It discusses the various doctrines in their logical order, that is, in the order in which they arise in thought, and which lends itself to the most intelligible treatment. In such an order of treatment each truth, except the first, must be so related to preceding truths that it will be seen in the clearest light. God is the fundamental truth in theology, and is therefore naturally first in order. Every following truth, in order to be seen in its true perspective, must be viewed in the light of this primary truth. For that reason Anthropology must precede Christology, and Christology must precede Soteriology, and so on. Proceeding according to this logical method, we discuss:
  
                  I. The doctrine of God (Theology).
  
                  II. The doctrine of man (Anthropology).
  
                  III. The doctrine of Christ (Christology).
  
                  IV. The doctrine of applied salvation (Soteriology).
  
                  V. The doctrine of the Church (Ecclesiology).
  
                  VI. The doctrine of the last things (Eschatology).
  
                  QUESTIONS FOR FURTHER STUDY: What is the difference between biblical and dogmatical theology, and how are the two related? What objections have been raised to systematizing theological truth? What distinction do modern theologians make between the source and the norm of dogmatic truth? Is this distinction valid? Why should the Bible be regarded as the principium unicum of theology? How do Kuyper and Bavinck distinguish between a principium and a source or fons? What important truth is contained in the modern emphasis on the Christian consciousness? How do the views of Troeltsch, Schaeder, and Barth differ as to the task of Dogmatics? What is the Barthian view of the source of theology? Is it possible for a dogmatician to be unbiased in his theological studies? What is the mystical method? The religious-historical method of Troeltsch? The pragmatic method?
  
                  REFERENCES: Bavinck, Geref. Dogm. I, pp. 41–103; Kuyper, Enc. der Heil. Godgel. III, pp. 405–415; Hodge, Syst. Theol. I, pp. 1–150; Shedd, Dogm. Theol. I, pp. 3–15; Miley, Syst. Theol. I, pp. 7–54; McPherson, Chr. Dogm., pp. 1–43; Thornwell, Collected Writings I, pp. 39–52: Macintosh, Theol. as an Emp. Science, pp. 1–46; Foster, G. B., Christianity in its Modern Expression, pp. 1–79; Van Oosterzee, Chr. Dogm. I, pp. 20–42, 84–109; Raebiger, Theol. Enc. II, pp. 335–339; Van Dijk, Begrip en Methode der Dogm., pp. 7–89; Lobstein, An Introd. to Prot. Dogm., pp. 58–275; Smith, H. B., Introd. to Chr. Theol., pp. 60–83; Lemme, Christl. Glaubenslehre, pp. 14–31; Girardeau, Discussion of Theol. Questions, pp. 45–272; C. W. Hodge, The Idea of Dogm. Theol., The Princeton Theol. Rev., Jan., 1908; Warfield, The Idea of Syst. Theol., Studies in Theology, pp. 49ff.; Schaeder, Theozentrische Theologie; Barth, The Doctrine of the Word of God, pp. 1–51.
              - v-history-of-dogmatics: The history of Dogmatics does not go back to the time of the Apostles, but only to the beginning of the third century, when Origen wrote his Peri Archon. Several periods may be distinguished, namely, the period of the Old Catholic Church, the period of the Middle Ages, the period of the Reformation, the period of Protestant Scholasticism, the period of Rationalism and Supra-naturalism, and the period of Modern Theology.
              - a-the-period-of-the-old-catholic-church: |-
                  A. The Period of the Old Catholic Church
  
                  In the beginning of this period some valuable preparatory work was done by the catechetical school of Alexandria, but it was not until the beginning of the third century that any important work appeared which purported to be a systematic presentation of theological truth. In fact, the period of the Old Catholic Church produced only three works of superior value in the field of systematic theology, and even these are rather deficient.
  
                  1. ORIGEN'S PERI ARCHON (DE PRINCIPIIS). Origen was the first to construct something like a system of theology. His work was written about the year 218 A. D. In it the author attempts to transform the doctrine of the Church into a speculative science, acceptable to the cultural and philosophical classes of his day. His great ambition was to develop the contents of faith into a science that did not rest on authority, but on its own inherent rational evidence. In this way he desired to raise pistis to the level of gnosis. While the work testifies to the intellectual clarity and profundity of the author, it also reveals a tendency to sacrifice theology to philosophy. It departs from the current teachings of the Church particularly (a) in the doctrine that human souls preëxisted, sinned in their previous existence, and are now for punishment imprisoned in material bodies; (b) in the notion that the human soul of Christ was already in its preëxistence united with the Logos; (c) in the denial of the physical resurrection; and (d) in the teaching of the restoration of all things, Satan included. The general plan of the work is defective, and does not provide for an adequate treatment of Christology, Soteriology, and Ecclesiology.
  
                  2. AUGUSTINE'S ENCHIRIDION AD LAURENTIUM: DE FIDE, SPE, ET CARITATE. As the subtitle indicates, the plan of this work is derived from the three Pauline virtues, faith, hope, and love. Under the first heading the author discusses the main articles of faith; under the second, the doctrine of prayer, following the order of the six petitions of the Lord's prayer; and under the third all kinds of moral questions. Though this arrangement is by no means ideal and the work is not always self-consistent, it gives evidence of deep thought and of an earnest attempt to construe the whole of Christian doctrine from a strictly theological point of view. The author contemplates the entire world with all its rich variety sub specie aeternitatis, making the whole universe subservient to God. Through this and his many other dogmatical treatises Augustine exercised a tremendous influence, which is potent, especially in Reformed circles, even down to the present day. He did more than any other scholar of pre-Reformation times to develop the Scriptural doctrine of sin and grace.
  
                  Mention should be made in this connection also of the Commonitorium of Vincentius Lerinensis, which gives a representation of the doctrine of the Old Catholic Church, but can hardly be regarded as a systematic exposition of dogmatical truth. It served, however, to give definite form to the teachings of the Fathers. The author's ideal was to give an exposition of doctrine in harmony with the tradition of the Church, which he defined as quod ubique, quod semper, quod ab omnibus creditum est. The work has a Semi-Pelagian flavor.
  
                  3. John of Damascus' EKDOSIS AKRIBES TES ORTHODOXOU PISTEOS (An Accurate Exposition of the Orthodox Faith), 700–760. This work represents by far the most important attempt in the Eastern Church to give a systematic exposition of dogmatic theology, at once speculative and ecclesiastical. It is divided into four books, dealing with (a) God and the Trinity; (b) creation and the nature of man; (c) Christ's incarnation, death, and descent into hades; and (d) the resurrection and the reign of Christ, and further such subjects as faith, baptism, image-worship, and so on. The order of the last book is very defective. Yet the work is of great importance, and is, from a formal point of view, certainly the best systematic presentation of the truth in this period. It is on the whole conservative and in harmony with the teachings of the Church as they had come down to the author.
              - b-the-period-of-the-middle-ages: |-
                  B. The Period of the Middle Ages
  
                  The period following John of Damascus was characterized by a remarkable dialectical activity, especially in theology. The first centuries were rather barren, but towards the end of the tenth century there was a scientific awakening. In the eleventh century Scholasticism arose; in the twelfth Mysticism appeared alongside of it; and in the thirteenth century the former, in league with the latter, gained complete ascendancy, and reached its highest glory. Scholasticism represented an attempt to deal with the doctrinal material found in Scripture according to the strictly scientific method of the schools. On the whole it accepted the contents of the Bible with childlike faith, but it attempted at the same time to represent the various doctrines of Scripture in their inner unity, so as to promote a deeper knowledge of the truth. In course of time it became subject to the controlling influence of philosophy, Platonic and Aristotelian, Nominalistic and Realistic, and developed in a rather precarious direction. It derived from philosophy, not only its dialectical method, but also many problems and questions of a purely philosophical kind. As a result Dogmatics gradually degenerated into a philosophical system. The interrogatory form, in which the material was often cast, frequently promoted doubt, and in many instances had the result of placing authority and reason in antithetical relation to each other. Among the dogmatical treatises of this period the following are outstanding.
  
                  1. WORKS OF ANSELM. The first name of more than ordinary importance is that of Anselm of Canterbury (1033–1109). He was characterized at once by deep piety and great intellectual acuteness and penetration. While he did not produce a comprehensive systematic exposition of theology, he wrote several works of great dogmatical value, such as his Monologium and Proslogium, in which he discusses the nature of God and develops his ontological proof for the existence of God; his de fide Trinitatis et de incarnatione Verbi, which, as the title indicates, deals with the doctrine of the Trinity and of the incarnation; and his de Concordia, devoted to a discussion of predestination in the spirit of Augustine. Surpassing all these in importance, however, his Cur Deus Homo? offers a classical exposition of the satisfaction theory of the atonement. Anselm was the first to deal with this important subject in a thorough and systematic way. His great opponent was Abelard with his moral influence theory.
  
                  2. THE SENTENCES OF PETER THE LOMBARD. The first important systematic work of the Scholastic period, which aims at covering the whole field, is Peter the Lombard's Sententiarum libri IV, consisting of four books: the first on God, the second on His creatures, the third on redemption, and the fourth on the sacraments and the last things. On the whole the work simply reproduces the teachings of the Fathers, though, in distinction from many other works of this period, it also contains a good deal of original material. For several centuries it was widely used as a handbook of theology, and regarded as the most authoritative exposition of the truth. Many scholars followed the example of Peter the Lombard in writing Sentences.
  
                  3. THE SUMMA OF ALEXANDER OF HALES. Alongside of the Sentences Summae theologiae gradually made their appearance. Alexander of Hales, a man of great learning, wrote a Summa universae theologiae, which is really a commentary on the work of Lombardus. His work is cast in a strict dialectical and syllogistic form, and served to establish the scholastic method. It treats of God, of the creature, of the Redeemer and His work, and of the sacraments. From a formal point of view this work is somewhat similar to modern works on Dogmatics. Alexander presents both sides of a question, states what can be said in favor of each, and then gives his own conclusion. Bonaventura, his disciple, added to the dialectical acuteness of his master the mystical element, which was coming to the foreground at this time.
  
                  4. THE SUMMA OF THOMAS AQUINAS. Thomas Aquinas is undoubtedly the greatest of the Schoolmen. His Summa totius theologiae covers in three volumes nearly the whole field of Dogmatics. The first book deals with God and His works; the second with man as the image of God, finding in God the highest end of his existence; and the third with Christ and the means of grace. The work remained incomplete, but the material for the doctrine of the sacraments and of the last things was culled from some of his other works and added to the Summa. Formally, the work is controlled by the Aristotelian philosophy; and materially, by the work of Augustine, though the work of this early Church Father is modified in important points and brought into greater agreement with the doctrine of the Church. Thomas Aquinas is the great authority of the Roman Catholic Church, and Thomism is its standard theology. Duns Scotus was the great opponent of Thomas Aquinas, but his work was critical and destructive rather than systematic and constructive. It marks the decline of Scholasticism.
              - c-the-period-of-the-reformation: |-
                  C. The Period of the Reformation
  
                  The theology of the Reformation is characterized by the special prominence given to the absolute normative authority of Scripture, and by the strong emphasis on the doctrine of justification by faith only. Luther was far more practical and polemical than scientific and dogmatical in his writings. The only doctrinal treatise with which he enriched the theological world, is his De Servo Arbitrio, which contains a clear exposition of the Augustinian doctrine of predestination. The period of the Reformation produced especially three works of a systematic character that were of more than ordinary significance.
  
                  1. MELANCHTON'S LOCI COMMUNES. This work of Melanchton was the first Protestant handbook of Dogmatics. It follows the order of the Epistle to the Romans in its exposition of the truth. In the first edition of the work the author was in entire agreement with Luther, but in the later editions he made concessions to several opponents and thus parted company with Luther on more than one point. In distinction from Luther, Melanchton stressed the ethical element in Christianity and preferred to place special emphasis on faith as the moral activity of the redeemed. In course of time he revealed an inclination also to soft-pedal the doctrine of predestination, and to sponsor the doctrine of the free will of man. In these points he yielded to the powerful influence of Erasmus. At the same time he also made concessions to Calvin in his Christology and in the doctrine of the Lord's Supper. His final position was somewhat of a half-way position between Luther and Calvin.
  
                  2. ZWINGLI'S COMMENTARIUS DE VERA ET FALSA RELIGIONE. Schaff speaks of this work of the great Swiss Reformer as the first systematic exposition of the Reformed faith. But, while it does contain the fundamental thoughts of the Reformed faith, it can hardly be called a well-rounded, systematic whole. The author does not, like Luther, stress the doctrine of justification by faith above all others, but rather the absolute sovereignty of God and the utter dependence of man. He speaks in stronger and less guarded terms than Calvin about the doctrine of predestination. And in the doctrine of the Lord's Supper he approaches, but yet falls short of, the spiritual view of Calvin.
  
                  3. CALVIN'S INSTITUTIO CHRISTIANAE RELIGIONIS. The Institutes of Calvin is so far superior to the Commentarius of Zwingli as to be a truly epoch-making work. It consists of four books, of which the first three follow the trinitarian order, and the fourth treats of the Church and the Sacraments. The central thought, controlling the whole work, is that of the absolute sovereignty of God. Throughout the whole exposition of the truth doctrine and ethics are closely interwoven, and the practical side of the Christian life is made very prominent. This work of Calvin is rightly lauded for its conciseness, for its clarity of thought, for its well-proportioned parts, and for its warmth of expression. It forms quite a contrast with the later, more scholastic, productions of Protestant theology, and is easily the most important work of the Reformation. As another very important work of the Reformation period Ursinus' Commentary on the Heidelberg Catechism may be mentioned.
              - d-the-period-of-protestant-scholasticism: |-
                  D. The Period of Protestant Scholasticism
  
                  It is not surprising that the theology of the seventeenth century is on the whole, strongly polemical. The Reformation had to break with the immediate past with an appeal to the remoter past. It had to show that the hierarchical Church of the Middle Ages had wandered far from the path indicated by the theology of the early Church. Moreover, with its defense of the right of private judgment it had disturbed traditional foundations. As a result divergent opinions soon made their appearance in the Churches of the Reformation and were embodied in separate Confessions. There was a great deal of hair-splitting discussion, and in course of time a spirit of formalism and intellectualism gained the upper hand with chilling effect, and led to the introduction of the scholastic method in the study of theology.
  
                  1. DOGMATICAL STUDY AMONG THE LUTHERANS. The vacillating position of Melanchton soon led to reaction. Towards the end of the sixteenth and in the earlier years of the seventeenth century a party arose, which manifested a strong, and sometimes rather fanatical, attachment to the early Lutheran faith, the faith of Luther himself and of the first edition of the Augsburg Confession. This party found able spokesmen in Hutterus and, especially, John Gerhardo (1582–1637), lauded as "the greatest of all Lutheran theologians." His Loci communes theologici is a work of primary importance, noted for the philosophical development and the systematic arrangement of its subject-matter. Calixtus opposed the attitude of the strict Lutherans and insisted on going back to the Apostles' Creed and to the doctrine of the first five centuries. He was of an irenical turn of mind and sought to continue the theology of Melanchton. The Calixtine movement met with violent opposition, however, in the person of Calovius, a man of great learning and ardently devoted to the strict Lutheran position. In his Systema locorum theologicorum, consisting of twelve volumes, he gives a careful exposition of the orthodox Lutheran faith. The works of two other noted and influential Lutheran theologians, namely, Quenstedt and Hollaz, move along the same lines.
  
                  2. DOGMATICAL STUDY AMONG THE REFORMED. Differences of opinion were not limited to the Lutherans, but also made their appearance among the Reformed. Some of these were of a purely formal, and others of a more material, nature. There were theologians who were perfectly loyal to the truth, but went far beyond Calvin in its schematic arrangement and in all kinds of logical distinctions; and there were others who minimized and even explained away fundamental truths. Some were unduly influenced in their doctrinal expositions by the philosophical tenets of the age, and especially by the philosophy of Cartesius.
  
                  a. The original type of doctrine. Theodore Beza, Calvin's successor at Geneva, was more scholastic than Calvin and more extreme in his supralapsarian view of predestination. He did not write any dogmatical treatise of importance, but nevertheless exercised great influence on the dogmaticians of the seventeenth century. Wollebius and Wendelinus both wrote works of great learning, strictly Calvinistic, but greatly affected by the conflict with Lutheranism, and therefore scholastic in form. Besides these, Polanus and Pictet also each produced a systematic exposition of the Reformed faith. After Beza, Wm. Twisse, the prolocutor of the Westminster Assembly, was one of the earliest to develop the doctrine of predestination with great logical precision and in a rather extreme supralapsarian form. His works give evidence of great speculative power, and furnish one of the best examples of the inexorable application of the basic thought of Supralapsarianism in Reformed doctrine. Three of the very best Calvinistic works of this period are the Synopsis Purioris Theologiae by the four professors of Leyden the elaborate work of Petrus Mastricht on Beschouwende en Practicale Godgeleerdheit, in which he takes issue with the position of Coccejus; and Turretin's Institutio Theologiae Elencticae, a very complete exposition of Reformed doctrine, and one that has exercised great influence on American Reformed theology. In England and Scotland the works of Perkins, Owen, Goodwin, and Boston were of great importance.
  
                  b. The Federal Modification of Reformed doctrine. With Coccejus a reaction set in against the speculative and scholastic method of some of the thorough-going Calvinists. He substituted a purely Biblical method, distributing his material according to the scheme of the covenants. However, his position represented not only a formal divergence, but also a material departure, from traditional Reformed theology, and entered ever increasingly into league with Cartesianism. Its really new thing was not the covenant doctrine, for this is already found in the works of Zwingli, Bullenger, Olevianus, Snecanus, Gomarus, Trelcatius, and Cloppenburg, but its federalistic method. It virtually changed Dogmatics into Biblical Theology, thus making it a historical discipline. Its method was anthropological rather than theological. Two of the best representatives of this school, are Burmannus and Witsius. The Synopsis Theologiae of the former is by far the best of the two, and is free from that forced exegesis which so often characterizes the work of the Cocceian school. The work of the latter, Over de Verbonden (Eng. tr. On the Covenants), is inferior to it, but is better known in this country. It represents a laudible but futile attempt to reconcile the more scholastic and the federal trend in theology. Other representatives of this school are Leydekker, Van Til, C. Vitringa, Lampe, d'Outrein, and the Van der Honerts. This type of theology gradually gained the ascendancy at this time in the Netherlands, though it was strongly opposed by Voetius, and though the more scholastic type of theology still continued to appear in à Marck's Merch der Christene Godgeleertheit and in Brakel's Redelijke Godsdienst.
  
                  c. The more radical modifications. The Arminians or Remonstrants represented a radical departure from Calvinism. They opposed its doctrines of predestination, total depravity, irresistible grace, particular atonement, and the perseverance of the saints. Arminius himself did not go to the extremes that were defended by his followers. Episcopius gave a clear and complete exposition of Arminian theology in his Institutiones theologicae, while Grotius in his Defensio fidei catholicae de satisfactione Christi developed the governmental theory of the atonement. With Limborgh's elaborate work entitled Theologia Christiana, this party turns in the direction of Rationalism. Maccovius and Voetius were among its strongest opponents.
  
                  The school of Saumur represents another attempt to modify strict Calvinism. Amyraldus taught a hypothetical universalism, and Placaeus, the doctrine of mediate imputation. These errors were combatted by Heidegger and Turretin, two of the authors of the Formula Consensus Helvetica.
  
                  3. DOGMATICAL STUDY AMONG THE ROMAN CATHOLICS. During this period, remarkable for the development of Protestant Dogmatics, there were also a few noted Roman Catholic dogmaticians. Bellarmin (1542–1621) is recognized as a prince among them. His great work, entitled Disputationes de controversiis christianae fidei marks him as a man of literary elegance and as a skilful controversilist. It contains a rather complete exposition of Roman Catholic Dogmatics, and represents the ultramontane standpoint of the Jesuits, which is Semi-Pelagian in its doctrine of sin and grace. Another distinguished scholar was Petavius, who published an elaborate, though incomplete work, under the title De theologicis dogmatibus (1644–1650). This work of great erudition is primarily a history of dogma, and is favorably known also among Reformed theologians. Finally, mention should also be made of Jansen's Augustinus, published in 1640, which contains a defense of the Augustinian doctrine of grace, as opposed to the Semi-Pelagian doctrine of the Jesuits. Jansenism was condemned by the Pope in 1713.
              - e-the-period-of-rationalism-and-supranaturalism: |-
                  E. The Period of Rationalism and Supranaturalism
  
                  The Dogmatics of this period are of a somewhat reactionary character. On the one hand there was reaction against the formalism and the cold intellectualism of the current study of theology, against what was called "dead orthodoxy," and an attempt to inject new life into the study of theology and to make it more directly subservient to a living and practical faith. And on the other hand there was a particularly strong and persistent reaction to the dominating influence of Scripture and of ecclesiastical tradition in Dogmatics, and to the doctrines that were taught in the historical Creeds of the Church; and a widespread movement to strike out on new paths, untrammeled by authority, under the guidance of human reason. Old barriers were broken down, and a Rationalistic apostasy became alarmingly prevalent in the Church.
  
                  1. PIETISTIC DOGMATICS. The close of the seventeenth century and the beginning of the eighteenth century saw the rise of Pietism, especially in the Lutheran Church. Its principal representatives were Spener, Francke, Freylinghausen, J. Lange, Rambach, and Oetinger. They desired to release Dogmatics from scholastic formalism, and insisted on a return to Biblical simplicity. From this point of view some of them made real contributions to Dogmatics, as, for instance, Spener, Francke, Freylinghausen, and Oetinger, though none of them produced an outstanding systematic exposition of the truth. Current orthodoxy at first opposed it, but finally yielded to its spirit. Consequently, a new tendency developed in the study of theology, which emphasized practical piety, was inimical to all scholastic subtlety, and showed great moderation in polemics.
  
                  2. RATIONALISTIC DOGMATICS. The principal influence that militated against Pietism appeared in the form of Rationalism, in the rigid method introduced by Wolff, whose ambition it was to reduce all theological statements to mathematical formulae. According to him anything that could not be made perfectly plain by actual demonstration, was not fit to be taught. Carpzovious essayed to demonstrate the truth of the teachings of the Church according to this method. Baumgarten and Mosheim moved along the same line. In the main these men were still orthodox, but had no proper appreciation of the religious value of the truth. For them the dogma of the Church was primarily an object of historical learning and intellectual demonstration. But the influence of Wolff also marked the inception of a thoroughly rationalistic tendency in the study of theology. The light of reason induced many theologians to adopt a position that was partly Socinian and partly Arminian. This tendency is seen especially in the writings of Toellner and Semler. In England the rationalistic movement appeared more particularly in the form of Deism, which denied supernatural revelation and aimed at the development of a system of natural religion. The English Deists, however, furnish little material for the history of Dogmatics. Of greater importance is the Unitarian movement, which continues the Socinian element in theology. Priestly constructed a system of pure Naturalism in his Institutes of Natural and Revealed Religion. In Germany Kant was the first to oppose successfully the superficial Rationalism that glorified in its intellectual enlightenment; but his Religion innerhalb der Grenzen der blossen Vernunft is still purely rationalistic. Tieftrunk elaborated Dogmatics in the Kantian spirit, and Wegscheider still assumed an advanced rationalistic position.
  
                  3. SUPRANATURALISTIC DOGMATICS. Orthodoxy reacted against Rationalism in the weak form of Supranaturalism. This acknowledged a supernatural revelation and honored Scripture as the norm of religious truth, but nevertheless allowed reason to determine in various ways what is and what is not essential in the Bible. Thus it reduced the contents of revelation and by all kinds of concessions sought to make it square with reason. It was really a compromise between reason and revelation. This weak position is represented by Doederlein, Knapp, and Storr. A reconciliation between Rationalism and Supranaturalism was attempted especially by Bretschneider, who exercised great influence by means of his two works: Systematische Entwickelung aller in der Dogmatik vorkommenden Begriffe, and Handbuch der Dogmatik der evangelischen Kirche. A somewhat similar position is taken by De Wette in his Lehrbuch der christliche Dogmatik, and his Ueber Religion und Theologie. He rises above the superficiality and want of spirituality which characterized the illumination, seeks to do justice to the religious feelings, and explains the fundamental truths of Dogmatics as the symbolical expression of the subjective truths of personal experience.
              - f-the-period-of-modern-theology: |-
                  F. The Period of Modern Theology
  
                  In the nineteenth century the theological currents multiply, so that it will be necessary to call attention to several schools, though they can hardly be called schools in the strict sense of the word. Some of them simply represent a general tendency which, however, expresses itself in a variety of ways, and may even reveal sharp differences.
  
                  1. SCHLEIERMACHER AND HIS SCHOOL. Schleiermacher stands as an intellectual giant at the beginning of the theological development of the nineteenth century. He united in himself the various theological currents of his day, and sought to fuse them into a religious unity. This resulted in a syncretism of Rationalism, Supranaturalism, and Pietism. He had learned by experience that Christianity had introduced a new and higher life into the world, and was convinced that this life had to incorporate all possible religious currents. His big heart caused him to take a sympathetic attitude with respect to all schools of thought, and to assimilate the good elements in each. But when he attempted to transform his religious experiences into intellectual concepts, and to combine these into a coherent dogmatic system, he did not succeed. His theology became in fact a confirmation of all kinds of opinions. This accounts for the fact that both Roman Catholics and Protestants, both Rationalists and Mystics, appeal to him. However great a religious thinker he was, his scientific theology was not a success. It is composed of all kinds of heterogeneous elements, and is therefore full of contradictions. In his Reden ueber die Religion and his Monologen (Monologues) he is entirely under the influence of Romanticism, an initial phase of German idealism, which served as a transition from Kant to Hegel. Religion is the sense of God, of the Infinite, and of the Universe, for the Universe is God. Schleiermacher speaks of it as a "Hinneigung zum Weltall." And God is not an object of thought, but only an object to be enjoyed in the depths of one's feelings. That enjoyment of God is religion. His Glaubenslehre contains the same philosophical principles with this difference, however, that religious feeling is now described as a feeling of complete dependence, that God is represented as absolute causality, and that Christianity is characterized as an ethical religion, in which everything is related to the redemption through Christ. According to Schleiermacher dogmas are descriptions of subjective states of consciousness or feeling, more particularly, of such states of consciousness as are determined by the Christian community, or by the Person of Jesus. With him Dogmatics leaves the solid foundation of the Word of God and is made to rest on the shifting sands of human experiences.
  
                  No one adopted the Dogmatics of Schleiermacher as a whole, and yet he had a controlling influence on the whole theological development after him. Among the immediate disciples of Schleiermacher none was so true to his dogmatic principles as A. Schweizer. His most important works are: Die Glaubenslehre der reformirten Kirche; Die Protestantischen Centraldogmen innerhalb der reformirten Kirche, and Die christliche Glaubenslehre. In the first of these works he combines Schleiermacher's feeling of dependence with the Reformed doctrine of predestination; and in his later works he stresses the fact that Dogmatics must go to the living Christian consciousness for its material. His representation of Reformed doctrine is open to several objections. Somewhat similar to his works are those of J. H. Scholten, De Leer der Hervormde Kerk, and Schenkel, Die christliche Dogmatik vom Standpunkte des Gewissens. Lipsius assumed a standpoint essentially distinct from that of Schleiermacher, but yet has this in common with the latter, that he seeks to build up his system from the standpoint of the Christian consciousness. For him religion is not only a feeling dependence, but also a sense of freedom. He denies the unique significance of the incarnation and makes Christ the typical Son of Man, in whom man first realizes his spiritual communion with God. Rothe may also be mentioned in this connection. Like Schleiermacher, he took his starting point in the Christian consciousness, the consciousness of communion with God and of redemption through Christ, and considered Dogmatics as a historical discipline.
  
                  2. THE SPECULATIVE SCHOOL. The philosophical movement from Kant to Hegel had a determining influence on the historical and scientific development of theology. The influence of Hegel was the most far-reaching. Like Schleiermacher, he did a great deal to brush aside the old vulgar Rationalism, and to show the untenableness of Supranaturalism. But while Schleiermacher sought to deliver theology from the domination of philosophy, Hegel encouraged the study of theology in the very terms of philosophy. The theologians who accept and apply his principles are rightly called speculative theologians. Their theology is essentially and in principle speculative.
  
                  Daub has been called "the founder of Protestant speculative theology." He came successively under the influence of Kant, Fichte, Schelling, and Hegel. Together with Marheineke and Rosenkranz, he thought it was quite possible to harmonize the principles of Hegel with the truths of the Christian religion, and made use of those principles in the formulation of the truth. These theologians were on the whole comparatively conservative, and constitute what is generally called "the right wing" of the Hegelian school, of which Marheineke was the recognized leader. In his System der christlichen Dogmatik he applied the principles of Hegel and follows the trinitarian method. The work of John Caird on The Fundamental Ideas of Christianity is also strongly influenced by the Hegelian philosophy.
  
                  The "left wing" of the Hegelian school is represented especially by Strauss and Biedermann. It sacrifices the old content of the Christian truth to the new speculative form. The Christliche Glaubenslehre of Strauss is purely critical and destructive. The various dogmas are tested by the demands of modern science and found wanting. In the Christliche Dogmatik of Biedermann the principles of Hegel are worked out in a purely pantheistic way. The authority of the Bible is not acknowledged, and the personality of God and personal immortality are both denied. Pfleiderer discarded the Hegelian terminology, but is entirely in harmony with the fundamental principles of Hegel.
  
                  3. THE NEO-LUTHERAN SCHOOL. The negative position of the Hegelian school naturally evoked reaction. Some reiterated the confessional doctrine of the Lutheran Church, and others sought a via media. At present we are concerned with the former only. The so-called Neo-Lutherans made an earnest attempt to restore the old confessional truth on the basis of Scripture. Thomasius of Erlangen in his work on Christi Person und Werk presents an evangelical type of Lutheran Dogmatics, in which he makes Christology central. His kenosis doctrine, however, is scarcely compatible with the Lutheran doctrine of Christ's ubiquity. He maintains the satisfaction theory of the atonement, but in the doctrine of the Trinity hardly escapes a certain type of subordinationism. A second representative, Kahnis, maintains a somewhat freer attitude toward Lutheran orthodoxy. He follows the trinitarian method in his Lutherische Dogmatik. His doctrine of the Trinity is more or less Sabellian, and his Christology is marked by a certain subordinationism and by a kenosis doctrine similar to that of Thomasius.
  
                  Frank of Erlangen also departs in several points from pure Lutheranism. In his System der christlichen Wahrheit he postulates two principia cognoscendi in theology, namely, Scripture and the believing subject, held in unity by the principium essendi, which is God. The idea of God becoming man is the central thought of his theology, and from it he derives his principium divisionis. In its broad features his theology is in harmony with the doctrine of the Church. The work of Kaehler of Halle shows some resemblance to that of Frank. He also proceeds from the standpoint of Christian experience, and postulates a special kind of knowledge in the Christian. Philippi is the best representative of pure Lutheranism in Germany. His Kirchliche Glaubenslehre is a clear and well arranged exposition of the doctrine of the Church from a strictly confessional point of view. According to him Dogmatics seeks to elaborate the thought of the restoration of man in communion with God, and it is from this point that he derives his principle of division. In our own country strict Lutheranism finds expression in Schmid's Doctrinal Theology of the Evangelical Lutheran Church, Pieper's Christliche Dogmatik, and Mueller's Christian Dogmatics.
  
                  4. THE MEDIATING SCHOOL. There were many theologians who did not go as far as the Neo-Lutherans in their reaction against the speculative movement in theology. They preferred to steer a middle course and to seek a compromise. Hence they are called "mediating theologians." On the whole these scholars are clearly dependent on Schleiermacher, and with him take their starting point, not in the objective revelation of God, but in the subjective religious consciousness. But with this Schleiermacherian starting point they combine Hegelian speculation. What is first accepted as the content of experience, is next set forth speculatively as a necessity of thought, and thus justified before the bar of philosophy. Only a few names can be mentioned here. The greatest of the mediating theologians is Dorner, who on the one hand assumes a sympathetic attitude towards the confession of the Church, but on the other hand freely criticizes it and incorporates in his system all kinds of speculative elements, which cannot be harmonized with the orthodox. Scriptural position. This is quite evident in his attempt to explain the Trinity, and in his conception of Christ as the ideal man, with whom the Logos is progressively united. His System der christlichen Glaubenslehre contains a wealth of dogmatical and historical material, and is noted for its elaborate and acute criticism.
  
                  Alongside of Dorner mention should be made of Julius Mueller, a man of great moral earnestness and of deep insight into the truth. His Die christliche Lehre von der Suende is still the greatest monograph on the subject of sin. He revived the ancient idea of a pre-temporal self-determination of each man to sin, in order to maintain the voluntary origin of sin in the life of each individual despite the fact that man is sinful from the time of his birth. Nitzsch and Martensen also belong to this class of theologians. The Christliche Dogmatik of the latter, written in a very attractive style, reveals a syncretistic tendency. On the whole he is true to the Lutheran doctrine, but connects with it a mystical and a speculative element. He follows the trinitarian division in Dogmatics, and in his Christology defends a certain type of kenosis doctrine.
  
                  5. THE SCHOOL OF RITSCHL. Another German theologian who formed a school is Albrecht Ritschl; and even of him this cannot be asserted without qualification. It is difficult to say what constitutes the unity of the Ritschlian school. His followers scarcely agree in any point, except in their gratitude for the inspiration derived from their common master, and in their conviction that the characteristic feature of Christianity as a historical religion is found in Christ as its Founder. Ritschl gave the most complete exposition of his system in his Die christliche Lehre von der Rechtfertigung und Versoehnung. He claims to be in harmony with Protestantism in general and, more particularly, with the doctrine of the Lutheran Church. While he desires to banish metaphysics (especially ontology) from theology, he is himself controlled by a purely speculative theory of knowledge. Strictly speaking, his scientific position is that of an agnostic. In his doctrine of God he is really a Unitarian, and in connection with the atonement he accepts the moral influence theory as the only tenable one. He distinguishes between scientific and religious truth. The latter is based, not on judgments of being, but exclusively on judgments of value. The truth of a religious idea is determined by the value which it has for the Christian life. We honor Christ as God, not because we consider Him to be very God, but because He has for us the value of a God. In the doctrine of sin and redemption he deviates from the confession of the Church. He largely ignores the work of the Holy Spirit, and professes ignorance respecting the future life. The doctrine of the Kingdom of God is central in his system. Christ is its Founder, and all those who come under His influence are its citizens, and are controlled by the principle of love to God.
  
                  Hermann accepts the principles of Ritschl in general. By means of his work on Der Verkehr des Christen mit Gott he did a great deal to popularize the leading principles of the Ritschlian theology. He is more subjective and even less Biblical than Ritschl, and reveals a tendency to exchange the rationalistic element of Ritschl for a certain religious mysticism. The most prominent dogmatician of the school is Julius Kaftan. He modifies the dogmatic positions of Ritschl in more than one respect, asserts that judgments of value cannot be dissociated from judgments of being, and denies the distinction between scientific and religious truth as it is usually represented by the critics of Ritschl. His work on Die Wahrheit der christlichen Religion is important for the introduction to Dogmatics, and his Dogmatik is a clear systematic presentation of the truth. He seems to be inclined to make important concessions to orthodox theology in the doctrine of sin, of redemption, and of the Person of Christ. Of all the followers of Ritschl no one has returned in greater measure to the doctrines of the Church than Haering in his work on The Christian Faith.
  
                  6. REFORMED THEOLOGY. Reformed dogmatic theology had several distinguished representatives during this period, who were absolutely opposed alike to vulgar Rationalism and Supranaturalism, to the speculative movement and to the theology of experience with its subjectivism. It was indeed in a sad state of decline at the opening of the nineteenth century and during its first decennia. Supranaturalism had made large inroads in the circles of Reformed theologians; and this, according to the words of Dr. Bavinck, "wanted to be Biblical, but was anti-confessional, anti-philosophical, anti-calvinistic; it produced a dogmatics which was deistic in theology, Pelagian in anthropology, moralistic in Christology, collegialistic in ecclesiology, and eudaemonistic in eschatology." But there has been a repristination of Reformed theology, especially in the Netherlands, through the labors of Kuyper, Bavinck, and many others. It is regrettable that their works are not better known in our country. In Scotland a great deal was done in the field of Dogmatics by such men as Hill, Dick, Cunningham, Bannerman, Crawford, Candlish, and others. And for our own country we need only to mention the names of Breckenridge, Thornwell, Dabney, Ch. Hodge, A. A. Hodge, Shedd, H. B. Smith, Warfield, and Girardeau. Mention may also be made of the Barthian theology, though its Reformed character is of a rather dubious nature.
  
                  REFERENCES: Bavinck, Geref. Dogm. I, pp. 104–206; McPherson, Chr. Dogm., pp. 43–97; Van Oosterzee, Chr. Dogm. I, pp. 42–84; Briggs, History of the Study of Theology, 2 vols.; Workman, Christian Thought to the Reformation; McGiffert, Christian Thought Before Kant; Moore, Christian Thought Since Kant; Heppe, Dogmatik des deutschen Protestantismus im zechzehnten Jahrhundert, 3 vols.; Gruetzmacher, Textbuch zur systematischen Theol.; Lichtenberger, Hist. of German Theol. in the Nineteenth Century; Hurst, History of Rationalism; Pfleiderer, The Development of Theol. in Germany since Kant; Storr, The Development of English Theol. in the Nineteenth Century; Walker, Scottish Theology and Theologians; Aubrey, Present Theological Tendencies; Burtt, Types of Religious Philosophy; Mackintosh, Types of Modern Theology; Horton, Contemporary English Theology; and Types of Continental Theology; W. A. Brown, The Essence of Christianity.
              - i-principia-in-general: |-
                  I. Principia in General
  
                  A. Principia in Non-Theological Sciences
  
                  1. DEFINITION OF 'PRINCIPIUM.' In a discussion of principia it is naturally of the greatest importance to know exactly what the term denotes. 'Principium' is a term that is widely used in science and philosophy. It is the Latin rendering of the Greek word arche, beginning, a term which Aristotle used to denote the primary source of all being, actuality, or knowledge. The English word 'principle' is derived from it, and corresponds with it in meaning, especially when it denotes a source or cause from which a thing proceeds. The term first principle is an even closer approximation to it. After giving several meanings of the word arche, Aristotle says: "What is common to all first principles, is that they are the primary source from which anything is, becomes, or is known." Eisler in his Handwoerterbuch der Philosophie gives the following definition: "Prinzip ist also sowohl das, woraus ein Seiendes hervorgegangen ist oder was den Dingen zugrunde liegt (Realprinzip, Seinsprinzip), als das, warauf sich das Denken und Erkennen notwendig stuetzt (Denkprinzip, Erkenntnisprinzip, Idealprinzip formaler unde materialer Art), als auch ein oberster Gesichtspunkt, eine Norm des Handelns (praktisches Prinzip)." The statement of Fleming in Krauth-Fleming's Vocabulary of the philosophical Sciences is in perfect agreement with this: "The word is applied equally to thought and to being; and hence principles have been divided into those of being and those of knowledge, or principia essendi and principia cognoscendi.… Principia essendi may also be principia cognoscendi for the fact that things exist is the ground or reason of their being known. But the converse does not hold; for the existence of things is in no way dependent on our knowledge of them." In ancient philosophy principia essendi, and in modern philosophy principia cognoscendi, receive the greater amount of attention. There is on the one hand a remarkable similarity between the principia that apply in the non-theological sciences and those that are pertinent to theology; but on the other hand there is also a difference that should not be disregarded. The former bear a natural and therefore general character. They are given with creation itself, are as such adapted to man as man, and have a controlling influence in all non-theological sciences.
  
                  2. PRINCIPIA OF THE NON-THEOLOGICAL SCIENCES. These are the following three:
  
                  a. God is the principium essendi. God is the source and fountain of all our knowledge. He possesses an archetypal knowledge of all created things, embracing all the ideas that are expressed in the works of His creation. This knowledge of God is quite different from that of man. While we derive our knowledge from the objects we perceive, He knows them in virtue of the fact that He has from eternity determined their being and form. While we attain to a scientific insight into things and relations only by a laborious process of discursive thought, He has an immediate knowledge of all things, and knows them not only in their relations but also in their very essence. And even so our knowledge is imperfect, while His knowledge is all-comprehensive and perfect in every way. We are only partly conscious of what we know, while He is always perfectly conscious of all His knowledge. The fulness of the divine knowledge is the inexhaustible source of all our knowledge, and therefore God is the principium essendi of all scientific knowledge. Naturally, Pantheism with its impersonal and unconscious Absolute cannot admit this, for a God, who has no knowledge Himself, can never be the principle or source of our knowledge. In fact, all absolute Idealism would seem to involve a denial of this principle, since it makes man an autonomous source of knowledge. The origin of knowledge is sought in the subject; the human mind is no more a mere instrument, but is regarded as a real fons or source.
  
                  b. The world as God's creation is the principium cognoscendi externum. Instead of "the world as God's creation" we might also say "God's revelation in nature." Of His archetypal knowledge God has conveyed an ectypal knowledge to man in the works of His hands, a knowledge adapted to the finite human consciousness. This ectypal knowledge is but a faint reproduction of the archetypal knowledge found in God. It is on the one hand real and true knowledge, because it is an imprint, a reproduction, though in temporal and therefore limited forms, of the knowledge of God. On the other hand it is, just because it is ectypal, no complete knowledge, and since sin put its stamp on creation, no perfectly clear nor absolutely true knowledge. God conveyed this knowledge to man by employing the Logos, the Word, as the agent of creation. The idea that finds expression in the world is out of the Logos. Thus the whole world is an embodiment of the thoughts of God or, as Bavinck puts it, "a book in which He has written with large and small letters, and therefore not a writing-book in which we, as the Idealists think, must fill in the words." God's beautiful creation, replete with divine wisdom, is the principium cognoscendi externum of all non-theologial sciences. It is the external means, by which the knowledge that flows from God is conveyed to man. This view of the matter is, of course absolutely opposed to the principle of Idealism, that the thinking man creates and construes his own world: not only the form of the world of thought (Kant), but also its material and contents (Fichte), and even the world of being (Hegel).
  
                  c. Human reason is the principium cognoscendi internum. The objective revelation of God would be of no avail, if there were no subjective receptivity for it, a correspondence between subject and object. Dr. Bavinck correctly says: "Science always consists in a logical relation between subject and object." It is only when the subject is adapted to the object that science can result. And God has also provided for this. The same Logos that reveals the wisdom of God in the world is also the true light, "which lighteth every man coming into the world." Human reason with its capacity for knowledge is the fruit of the Logos, enables man to discover the divine wisdom in the world round about him, and is therefore the principium cognoscendi internum of science. By means of it man appropriates the truth revealed in creation. It is not satisfied with an aphoristic knowledge of details, but seeks to understand the unity of all things. In a world of phenomena which are many and varied, it goes in quest of that which is general, necessary, and eternal,—the underlying fundamental idea. It desires to understand the cause, the essential being, and the final purpose of things. And in its intellectual activity the human mind is never purely passive, or even merely receptive, but always more or less active. It brings with it certain general and necessary truths, which are of fundamental significance for science and cannot be derived from experience. This thought is denied by Empiricism in two different ways: (1) by regarding the human spirit as a tabula rasa and denying the existence of general and necessary truths; and (2) by emphasizing analytical experience rather than synthetic reason. Dr. Bavinck points out that it ended in Materialism. Says he: "First the thought-content, then the faculty, and finally also the substance of the spirit is derived from the material world."B. Principia in Religion or Theology
  
                  Religion and theology are closely related to each other. They are both effects of the same cause, that is, of the facts respecting God in His relation to the universe. Religion is the effect which these facts produce in the sphere of the individual and collective life of man, while theology is the effect which they produce in the sphere of systematic thought. The principia of the one are also the principia of the other. These principia are not of a natural and general, but of a spiritual and special character. They do not belong to the realm of creation as such, but to the sphere of redemption. Notwithstanding this fact, however, they are also of inestimable value for the Christian pursuit of scientific knowledge in general.
  
                  1. GOD IS THE PRINCIPIUM ESSENDI. This is equivalent to saying that all our knowledge of God has its origin in God Himself. God possesses a complete and in every way perfect knowledge of Himself. He knows Himself in the absolute sense of the word, not only as He is related to His creatures, nor merely in His diversified activities and their controlling motives, but also in the unfathomable depths of His essential Being. His self-consciousness is perfect and infinite; there is no sub-conscious life in Him, no subliminal region of unconscious mentality. And of that absolute, perfectly conscious self-knowledge of God, the knowledge which man has of the divine Being is but a faint and creaturely copy or imprint. All human knowledge of God is derived from Him, Matt. 11:27; 1 Cor. 2:10 f. And because there can be no knowledge of God in man apart from self-consciousness in God, Pantheism spells death for all theology. It is impossible to deduce a conscious creature from an unconscious God, a creature that knows God from a God that does not know Himself. We can find the principium of our theology only in a personal God, perfect in self-consciousness, as He freely, consciously, and truly reveals Himself.
  
                  2. THE PRINCIPIUM COGNOSCENDI EXTERNUM IS GOD'S SPECIAL REVELATION. The knowledge which God desires that we should have of Him is conveyed to us by means of the revelation that is now embraced in Scripture. Originally God revealed Himself in creation, but through the blight of sin that original revelation was obscured. Moreover, it was entirely insufficient in the condition of things that obtained after the fall. Only God's self-revelation in the Bible can now be considered adequate. It only conveys a knowledge of God that is pure, that is, free from error and superstition, and that answers to the spiritual needs of fallen man. Because it has pleased God to embody His special revelation in Scripture for the time being, this, in the words of Bavinck, has the character of a "causa efficiens instrumentalis of theology." It is now the principium unicum, from which the theologian must derive his theological knowledge. Some are inclined to speak of God's general revelation as a second source; but this is hardly correct in view of the fact that nature can come into consideration here only as interpreted in the light of Scripture. Kuyper warns against speaking of Scripture, or God's special revelation, as the fons theologiae, since the word fons has a rather definite meaning in scientific study. It denotes in general a certain object of study which is in itself passive, but which embodies certain ideas, and from which man must, by means of scientific study, extract or elicit knowledge. The use of that word in this connection is apt to give the impression that man must place himself above Scripture, in order to discover or elicit from these the knowledge of God, while as a matter of fact this is not the case. God does not leave it to man to discover the knowledge of Him and of divine things, but actively and explicitly conveys this to man by means of His self-revelation. This same idea was later on also stressed by Schaeder and Barth, namely, that in the study of theology God is never the object of some human subject, but is always Himself the subject. We should bear in mind that the word 'principium,' as we use it in theology, has a casual signification, just as the corresponding Hebrew and Greek words do in the Bible, when it speaks of the fear of the Lord as the principle (reshith) of wisdom (Ps. 111:10) or knowledge (Prov. 1:7), and of Christ as the principle (arche) of creation and of the resurrection (Col. 1:18; Rev. 3:14). By means of His self-revelation God communicates the requisite knowledge of Himself and of divine things to man. Man can know God only because and in so far as God actively reveals Himself. And if we do speak of Scripture as the fountain-head of theology, we shall have to remember that it is a living fountain, from which God causes the streams of knowledge to flow, and that we have but to appropriate these. The same point should be borne in mind, when we follow the common custom in speaking of God's special revelation as the source of theology. Man cannot place himself above his object in theology; he cannot investigate God.
  
                  3. THE PRINCIPIUM COGNOSCENDI INTERNUM IS FAITH. As in the non-theological sciences, so also in theology there must be a principium cognoscendi internum that answers to the principium cognoscendi externum. Scripture sometimes represents regeneration (1 Cor. 2:14), purity of heart (Matt. 5:8), doing the will of God (John 7:17), and the anointing of the Holy Spirit (1 John 2:20) as such. But it most frequently points to faith as the principium internum of the knowledge of God (Rom. 10:17; Gal. 3:3, 5; Heb. 11:1, 3), and this name undoubtedly deserves preference. The self-communication of God aims at conveying the knowledge of God to man, in order that God may receive honor and glory through man. Therefore it may not terminate outside of man, but must continue right on into the mind and heart of man. By faith man accepts the self-revelation of God as divine truth, by faith he appropriates it in an ever increasing measure, and by faith he responds to it as he subjects his thoughts to the thoughts of God. The principium internum, says Bavinck, is sometimes called the verbum internum or even the verbum principale, because it brings the knowledge of God into man, which is after all the aim of all theology and of the whole self-revelation of God. Barth stresses the fact that it is only by faith that the knowledge of God becomes possible. These three principia, while distinct, yet constitute a unity. The Father communicates Himself to His creatures through the Son as the Logos and in the Holy Spirit.
  
                  QUESTIONS FOR FURTHER STUDY: Has the doctrine of the principia always received adequate attention in Reformed theology? What took the place of it under the influence of Rationalism? What was the nature of the so-called 'Prolegomena,' 'Prinzipienlehre,' or 'Fundamentaldogmatik,' which came into vogue under the influence of Schleiermacher? Should theology derive its principia from other sciences or from philosophy? Which are the fundamental objections of modern theology to the doctrine of the principia, as it was stated in the preceding? Does Barth also regard Scripture as the principium cognoscendi externum of theology?
  
                  REFERENCES: Bavinck, Geref. Dogm. I, pp. 207–237; Kuyper, Enc. der Heil. Godgel. II, pp. 291–346; Girardeau, Discussions of Theological Questions, pp. 72–272; Thornwell, Collected Writings I, pp. 43–52; Strong, Syst. Theol., pp. 1–15; Miley, Syst. Theol., pp. 7–47; McPherson, Chr. Dogm., pp. 18–37.
              - ii-religion: A brief discussion of religion at this point will have a double advantage. It will enable us to see the rationality of the principia to which attention was called in the preceding, and will prepare us for a more detailed discussion of God's special revelation, the necessary corollary of religion, and the principium cognoscendi externum of theology. There is a very close relation between religion and theology. This is evident from the very fact that many regard theology as the science of religion. While this is certainly a mistake, the fact remains that the two are inseparably connected. There is no such thing as theology apart from religion. Religion consists in a real, living, and conscious relationship between a man and his God, determined by the self-revelation of God, and expressing itself in a life of worship, fellowship and service. It pre-supposes that God exists, that He has revealed Himself, and that He has enabled man to appropriate this revelation. And where man does appropriate the revealed knowledge of God, reflects on it and unifies it, there the structure of theology arises on the basis of God's revelation. We do not proceed on the assumption, so common among modern students of religion, that the essential nature of religion can be determined only in the light of its origin and history, and therefore do not begin this discussion with a historical study of the religions of the world. Since our conception of religion is frankly determined by Scripture, it seems more desirable to follow the logical order in its discussion, and to consider first of all the essence of religion.
              - a-the-essence-of-religion: |-
                  A. The Essence of Religion
  
                  1. THE DERIVATION OF THE WORD 'RELIGION'. The derivation of the word 'religion' is still uncertain, and even if it were certain, would only yield a historical, and not a normative, definition of religion. It would only shed some light on the conception of religion that gave rise to the use of this particular word. Several derivations of it have been suggested in course of time. The earliest of these is that of Cicero, who derived it from re-legere, to re-read, to repeat, to observe carefully. In the light of this derivation religion was regarded as a constant and diligent observance of all that pertains to the knowledge of the gods. One of the influential Church Fathers of the fourth century, Lactantius, held that the word was derived from religare, to attach, to establish firmly, to bind together, and therefore pointed to religion as the bond between God and man. Gellius suggested the derivation from relinquere in the sense of to separate oneself from someone or something. The word 'religion' would then indicate that which by reason of its holiness is separated from all that is profane. Finally, Leidenroth assumed that it was derived from a supposed root ligere, meaning to see. Religere would then mean, to look back, and religion, to look back with fear. The derivation of Gellius found no favor whatsoever. That of Lactantius was generally accepted for a long time, but was gradually relinquished when Latin scholars pointed out that it was linguistically impossible to derive 'religion' from 'religare'. Some admit the possibility of the derivation suggested by Leidenroth, but the derivation of Cicero is now preferred by most theologians. Calvin also gave preference to this, though he did not share Cicero's explanation of the term. Says he: "Cicero truly and shrewdly derives the name religion from relego, and yet the reason which he asigns is forced and far-fetched, namely, that honest worshippers read and read again, and ponder what is true. I rather think the name is used in opposition to vagrant license—the greater part of mankind rashly taking up whatever first comes their way, whereas piety, that it may stand with a firm step, confines itself within due bounds."
  
                  2. SCRIPTURAL TERMS FOR RELIGION. The Bible contains no definition of religion, nor even a general term descriptive of this phenomenon. It has become customary in Reformed theology to distinguish between objective and subjective religion. The word 'religion' is clearly used in a two-fold sense. When we speak of the Christian religion in distinction from other religions, we mean one thing; and when we say that a man's religion is too intellectual or too emotional, we have something different in mind. In the one case we refer to something that has objective existence outside of man, and in the other, to a subjective phenomenon in the inner life of man, which finds expression in a variety of ways. The term 'religio objectiva' is used to denote that which determines the nature of man's religion, its regulative norm, namely, the knowledge of God and of man's relation to Him, as this is prescribed by the Word of God. It is sometimes practically equivalent to 'the divine revelation.' And the term 'religio subjectiva' serves to designate the life that is so regulated or determined by the Word of God, and that expresses itself in worship, fellowship, and service. Now the Bible uses different terms for each of these aspects of religion.
  
                  The religio objectiva is, as was said, practically identical with God's revelation, and is indicated in the Old Testament by such terms as 'law,' 'commandments', 'precepts', 'judgments', 'ordinances', and so on. In the New Testament the revelation of God is embodied, not primarily in a set of laws, but in the Person of Christ, in His redemptive work, and in the apostolic kerugma, which centers about Christ, and is merely an interpretation of the facts of redemption. Such terms as 'the gospel', 'the faith', and 'the kerugma' serve to designate the religio objectiva.
  
                  The religio subjectiva corresponds to the religio objectiva, and is described in the Old Testament as "the fear of the Lord," which is repeatedly called "the beginning of wisdom." The term is expressive of the inner disposition of the pious Israelite with reference to the law of God. This fear of God should be distinguished, however, from that anxious solicitude, accompanied with dread, that is so characteristic of heathen religions. The really God-fearing Israelite was not controlled by the distrust, the dread anxiety, and slavish fear, with which the Gentiles thought of their gods. In his case the fear of the Lord was accompanied with other religious dispositions, such as faith, hope, love, trust, taking refuge in, leaning on, and clinging to, God, and therefore was perfectly consistent with joy and peace, childlike confidence and blessedness, in communion with God.
  
                  The New Testament rarely employs the terms that are most prominent in classical Greek as designations of religion, such as deisidaimonia (fear or reverence for the gods), Acts 25:19, theosebeia (reverence towards God), 1 Tim. 2:10, and eulabeia (circumspection in religious matters, fear of God, reverence, piety), Heb. 5:7; 12:28. The only word that occurs with some frequency is eusebeia (piety towards God, godliness), which is found fifteen times. These words do not express the characteristic element of New Testament religion. The fear of the Lord is indeed mentioned here as an element in religion, Luke 18:2; Acts 9:31; 2 Cor. 5:11; 7:1, but is far less prominent than in the Old Testament. The usual New Testament term for the religio subjectiva in the New Testament is pistis, faith. In classical Greek this word is used to denote: (a) a conviction based on the testimony of another; and (b) trust in a person whose testimony is accepted. It does not stand out as a designation of trust in the gods, though it is occasionally so used. And it is exactly this element that is brought to the foreground in the New Testament. To the glorious message of salvation, there is an answering faith on the part of man, a faith consisting in childlike trust in the grace of God, and becoming at the same time a fountain of love to God and of devotion to His service. This faith is not the natural expression of any so-called inborn religious disposition of man, but is the fruit of the supernatural operation of the Holy Spirit. The words latreia, Rom. 9:4; 12:1; Heb. 9:1, 6, and threskeia, Acts 26:5; Col. 2:18; Jas. 1:27, are used to denote the service of God that springs from the principle of faith.
  
                  3. HISTORICAL CONCEPTIONS OF THE ESSENCE OF RELIGION. Religion is one of the most universal phenomena of human life. Man has sometimes been described as "incurably religious." This need not surprise us in view of the fact that man was created in the image of God, and was destined to live in communion with Him. And while it is true that man fell away from God, his fall did not involve a complete loss of the image of God. The Belgic Confession states in Art. XIV that man "lost all his excellent gifts which he had received from God, and only retained a few remains thereof, which, however, are sufficient to leave man with excuse." And according to the Canons of Dort III and IV, Art IV: "There remain, however, in man since the fall, the glimmerings of natural light, whereby he retains some knowledge of God, of natural things, and of the difference between good and evil, and discovers some regard for virtue, good order in society, and for maintaining an orderly deportment." This remaining light, however, does not avail unto salvation, and is even abused by man in natural and civil things. At the same time it does serve to explain the presence of some form of religion even among the lowest and most barbaric tribes of the earth. But however general this phenomenon may be among the nations of the world, this does not mean that there is general agreement as to the essential nature of it. Even the history of the Christian Church reveals considerable difference of opinion on this point. The following are the most important conceptions that come into consideration here:
  
                  a. The conception of the early Church. The Bible does not furnish us with a definition of religion, nor even with a description of it, though it contains in its entire compass a clear revelation of what God requires of man. There are a few passages, however, which contain some specific indications. Thus Paul says in Rom. 12:1; "I beseech you therefore, brethren, by the mercies of God, to present your bodies a living sacrifice, holy, acceptable to God, which is your spiritual (or: reasonable) service (latreia)." The Epistle to the Hebrews contains this admonition: "Wherefore receiving a kingdom that cannot be shaken, let us have grace, whereby we may offer service well-pleasing to God with reverence and awe," 12:28. In this passage the words latreio and eulabeia are both used. James adds a specific element in the words: "Pure religion (threskeia) and undefiled before our God and Father is this, to visit the fatherless and widows in their affliction, and to keep oneself unspotted from the world," 1:27.
  
                  In the early Church Christians enjoyed religious experiences and engaged in consecrated service and in reverential worship long before they began to reflect on the exact nature of religion. One of the earliest definitions of it was that of Lactantius in the beginning of the fourth century. He defined religion as recta verum Deum cognoscendi et colendi ratio (the right manner of knowing and serving the true God). This definition has always met with considerable favor, and is even now found in some works on dogmatic theology. During the previous century, however, it was criticized as favoring an external conception of religion, in which the heart is not concerned. But this criticism is hardly justified, since the definition does not pretend to specify what is the right manner of knowing and serving God. There is nothing in it to prevent anyone from assuming that the author had in mind a knowledge, which is not only intellectual, but also experiential, and a service which springs from the heart and is truly spiritual. The right manner of knowing and serving God is after all determined by the Word of God, which is not satisfied with a purely intellectual knowledge, nor with a merely external service. It is true, however, that the definition applies to the religio objectiva, the religion as prescribed by God in His Word, rather than to the religio subjectiva, religion as experienced and practiced by men; and that it docs not indicate the connection between the right knowledge and the right service of God.
  
                  b. The conception of the Middle Ages. It is a well known fact that during the Middle Ages, under the influence of the Church of Rome, religious life was gradually externalized. The one-sided emphasis on the Church as an external organization brought with it a similar emphasis on the performance of external rites and ceremonies, to the neglect of the inner disposition of the heart. And this undue attention to mere ritual punctuality reached its culmination in the scholastic period. Moreover, since the authority of the Church and of tradition gradually surpassed, if it did not supersede, that of Scripture, and the Bible was excluded from the hands of the laity, the element of knowledge was reduced to a minimum in the religious life of the people. The conception of religion, which was then present, finds its best expression in Thomas Aquinas' definition of it as "the virtue by which men render to God the required service and honor." Thus religion takes its place among the human virtues, and is practically identified with the single element of latreia. Thomas Aquinas distinguishes between the theological virtues, faith, hope, and charity, which have God for their object, and the moral virtues, justice, fortitude, prudence, and temperance, which find their object in the things that lead us to God. He looks upon religion as a part of the virtue of justice, because in it man renders to God what is His due. While this definition does indeed stress the religio subjectiva, it contemplates this one-sidedly as service. Religion is not merely service and worship; it is primarily a disposition of the heart, which expresses itself in service and worship. The definition of Thomas Aquinas is even now found in some Roman Catholic works. Spirago voices the same external conception of religion, when he says: "Religion is not a matter of feeling; it is a matter of the will and of action, and consists in following out the principles that God has laid down."
  
                  c. The conception of the Reformers. The Reformers broke with the externalism of the Church of Rome in general, and also with its external conception of religion. They could not conceive of religion as being merely one of the moral virtues. In fact they did not regard it as a human virtue at all, but rather as spiritual communion with God, coupled with reverential fear, and expressing itself in grateful worship and loving service. Says Calvin: "Such is pure and genuine religion, namely, confidence in God coupled with serious fear—fear, which both includes in it willing reverence, and brings along with it such legitimate worship as is prescribed by the law." Moreover, he adds: "And it ought to be more carefully considered, that all men promiscuously do homage God, but very few reverence Him. On all hands there is abundance of ostentatious ceremonies, but sincerity of heart is rare."
  
                  Since the Reformers regarded religion as a conscious and voluntary spiritual relation to God, which expresses itself in life as a whole but particularly in certain acts of worship, they distinguished between pietas as the principle and cultus as the action of religion. And even this cultus they regarded as twofold. They drew a clear line of distinction between a cultus internus, which manifests itself primarily in faith, hope and love, and a cultus externus, which finds expression in the worship of the Church and in a life of service. Furthermore they spoke of a religio subjectiva and a religio objectiva, and indicated the relation between the two. The religio subjectiva, which is primarily a disposition of the heart, disturbed, degenerated, and falsified by sin, but restored by the operation of the Holy Spirit, is determined, directed, and fructified by, and passes into action under the influence of, the religio objectiva, consisting in the revealed truth of God, in which God Himself determines the adoration, worship, and service that is acceptable to Him. All will-worship, such as the detailed ritualism of the Roman Catholic Church, and the individualism of the Anabaptists, was regarded a contraband.
  
                  The question may be raised at this point, what should be regarded as the really characteristic disposition of the soul in religion. There has been no general agreement on this point. It has been found in piety, fear, reverence, faith, a feeling of dependence, and so on; but these are all emotions or affections which are also felt with reference to man. Otto in his psychological study of religion seems to have hit upon the right idea. He feels that, while Schleiermacher suggested an important idea, when he spoke of "a feeling of dependence," yet this can hardly be regarded as an adequate statement of what is felt in religion. He finds something more, for instance, in the words of Abraham, when he undertakes to plead for the men of Sodom: "Behold now, I have taken upon me to speak unto the Lord, which am but dust and ashes." Gen. 18:27. Says he: "There you have a self-confessed 'feeling of dependence,' which is yet at the same time far more, and something other than, merely a feeling of dependence. Desiring to give it a name of its own, I propose to call it 'creature-consciousness' or 'creature-feeling.' It is the emotion of a creature, abased and overwhelmed by its own nothingness in contrast to that which is supreme above all creatures." The really characteristic thing is this, that in religion the absolute majesty and infinite power of God and the utter insignificance and absolute helplessness of man come into consideration. This does not mean, however, that religion is merely a matter of the emotions, nor that man's absolute subjection to the infinite God is simply a necessity imposed on man. The relation of man to God in religion is a conscious and voluntary one, and instead of enslaving man leads him into the enjoyment of the highest liberty. In religion man knows God on the one hand as a holy Power on which he is absolutely dependent, and on the other hand, as the highest Good, the source of all natural and spiritual blessings. In it he entrusts himself voluntarily to God with all his interests for time and eternity, and thus acknowledges his dependence on Him. And it is exactly by this acknowledgment that the moral life of man gains the highest victory through the grace of God and enters upon the enjoyment of true liberty.
  
                  d. The modern conception of religion. In more recent times the conception of religion handed down by the Reformers, was changed considerably. The Reformers maintained the right of private judgment, and this soon resulted in a rather considerable number of Churches and Confessions. Consequently a tendency manifested itself in course of time to seek the essence of the religio objectiva in that which all Churches had in common. Some found this in the truth as it is expressed in the Apostolic Confession. Quite a different note, however, was sounded by Rationalism, which broke with the Word of God and limited religion in the objective sense to the familiar triad of God, virtue, and immortality. Thus the religio objectiva was reduced to a minimum. Kant and Schleiermacher went still farther by transferring the center of gravity from the object to the subject, and divorcing the religio subjectiva from the religio objectiva. The former regarded religion simply as a form of moral action, in which man recognizes his duties as divine commandments. According to him, says Moore, "morality becomes religion when that which the former shows to be the end of man is conceived also to be the end of the supreme law giver, God." And Schleiermacher considered religion to be merely a condition of devout feeling, a feeling of dependence, a "Hinneigung zum Weltall." In the system of Hegel religion becomes a matter of knowledge. He speaks of it as "the knowledge possessed by the finite mind of its nature as absolute mind"; or, regarded from the divine side, as "the divine Spirit's knowledge of itself through the mediation of the finite spirit." This makes God, not only the object, but also the subject of religion. Thus, in the words of van Oosterzee, religion becomes "a play of God with Himself." Ever since the days of Schleiermacher religion has come to be regarded as something purely subjective, and in modern theology it is generally represented as man's search for God, as if it were possible to discover God apart from divine revelation, and as if God did not first have to find man before men could really find Him. In fact the idea of religion as a conscious and voluntary relation of man to his God, a relation determined by God Himself, was gradually lost. It is now often defined without any reference to God whatsoever, as may be seen from the following examples: Religion is "morality touched with emotion" (Matthew Arnold), "a sum of scruples which impede the free exercise of our faculties" (Reinach), "faith in the conservation of values" (Hoeffding), or "the belief that there is an unseen order and that our supreme good lies in harmoniously adjusting ourselves thereto" (James).
  
                  e. The Barthian conception. Modern theology turned from the objective to the subjective; it relegated the idea of revelation to the background, and brought the idea of religion prominently to the fore. Moreover, it contemplated religion as something native to man, as the highest achievement of man in the life of the human race, and as a prized possession, on the basis of which man can rise to the heights of God. It saw in religion the manifestation of the divine in man, which makes him continuous with God, enable him to scale the heavens, and makes him entirely fit to dwell in the presence of God. Over against this modern subjectivism, Barth again stresses the objective in religion, and centers attention once more on the divine revelation, on the Word of God. He never wearies of dinning it into the ears of the present generation that there is no way from man to God, not even in religion, but only a way from God to man. He points out that the Bible has nothing commendable to say about the kind of religion of which the Modernists boast, but repeatedly spurns and condemns it. It is like the religion of the Pharisees in the days of Jesus, and of the Judaists in the days of Paul. He even shocked and horrified his modernist contemporaries by stigmatizing this religion as the greatest sin against God. According to him the history of religion, which became so prominent during the last decennia, is really the history of what is untrue in religion. "For," says he, "at the moment when religion becomes conscious of religion, when it becomes psychologically and historically conceivable, it falls away from its inner character, from its truth, to idols. Its truth is its other-worldliness, its refusal of the idea of sacredness, its non historicity." It is his desire to break the strangle-hold which Schleiermacher had for so long a time on modern theology. Says he: "With all due respect for the genius shown in his work, I can not consider Schleiermacher a good teacher in the realm of theology because, so far as I can see, he is disastrously dim sighted in regard to the fact that man as man is not only in need, but beyond all hope of saving himself; that the whole of so-called religion, and not least the Christian religion, shares in this need; and that one can not speak of God simply by speaking of man in a loud voice." Barth does not regard religion as a possession of man, something which man has, and which is therefore something historical rather than something that comes to man from above. It is not something by which man can improve himself and thus become fit for heaven, since this loses sight of the qualitative difference between this world and the world to come. It is not a historical quantum, on the possession of which man can base his hope for the future, but rather an attitude, a frame of mind, a disposition, into which man is brought when he is confronted with the divine revelation. The truly religious man is the man who despairs of himself and of all that is purely human, the man who cries out with Isaiah, "Woe is me! for I am undone," or with Paul, "Wretched man that I am! who shall deliver me out of the body of this death?" In his Roemerbrief (2nd ed. p. 241) Barth expresses himself as follows: "It (religion) gives him no solution of his life's problems, but rather makes him an insoluble enigma to himself. It is neither his salvation, nor a discovery of it: it is rather the discovery that he is not saved.… It is a misfortune which falls with fatal necessity upon some men, and from them is carried to others. It is the misfortune under the weight of which John the Baptist goes into the wilderness to preach repentance and the judgment to come; under the weight of which such a deeply moving long drawn-out sigh as the second Epistle to the Corinthians was put on paper; under the uncanny weight of which a physiognomy like that of Calvin becomes what it finally was." While all this is by no means a complete statement of what Barth has to say about religion, it does indicate sufficiently what he regards as the essence of it.
              - b-the-seat-of-religion: |-
                  B. The Seat of Religion
  
                  A brief consideration of the question as to the real seat of religion in the human soul will undoubtedly promote a proper understanding of its essential nature. The question has been raised in the course of history, whether it has its seat in, and therefore operates through, just one of the faculties of the soul—to speak in the language of the old faculty psychology—, or occupies a central place in the life of man and functions through all the powers of the soul. It has been erroneously represented as a function, now of this, and then of that, faculty, while it should undoubtedly be regarded as something in which the soul of man as whole, with all its psychical powers, is operative. Its place in life is fundamental and central, and consequently it affects all the manifestations of life. The following views come into consideration here and call for a brief discussion.
  
                  1. IT HAS ITS SEAT IN THE INTELLECT. There is an intellectual conception, which seeks the essence of religion in knowledge, and therefore locates its psychical basis in the intellect. It was especially Hegel that sponsored the intellectual view and brought it to the foreground. According to him the whole life of man is merely a process of thought, and religion is simply a part of the process. In the finite spirit of man the Absolute becomes conscious of itself, and this self-consciousness of the Absolute in the human spirit is religion. According to this view religion is neither feeling nor action—though these are not entirely excluded—, but essentially knowledge. At the same time it is not the highest form of knowledge, but a knowledge clothed in symbols, from which only philosophy can extract that which is ideal and permanent. Religion never gets beyond the stage of apprehending reality in concrete and imaginative terms, while philosophy makes the attempt to discover the pure idea that lies behind the image. This view is certainly a very serious misconception of the essence of religion, since it reduces this to a sort of imperfect philosophy. This virtually means that one's knowledge determines the measure of one's piety. Certainly, there is also knowledge in religion, but it is knowledge of a specific kind; and the attainment of knowledge does not constitute the real end in religion. Science aims at knowledge, but religion seeks comfort, peace, salvation. Moreover, religious knowledge is not purely intellectual, but above all experiential, a knowledge accompanied with emotions and resulting in action. Religion is not merely a matter of the intellect, but also of the will and of the affections. This consideration should also serve as a warning to all those in the Christian Church who speak and act as if true religion were only a matter of a proper conception of the truth, of sound doctrine and of an orthodox profession of the verities of the Christian religion; and as if Christian experience and the Christian life in all its varied manifestations were matters of comparative insignificance. Cold intellectualism would never have made Christianity the power it proved to be in the world.
  
                  2. IT HAS ITS SEAT IN THE WILL. Some have simply defined religion as moral action and sought its seat in the will. The way for this view was paved by Pelagianism in its various forms, such as Semi-Pelagianism, Arminianism, Socinianism, Deism, and Rationalism, all of which represent Christianity as a nova lex, and stress the fact that faith is a new obedience. Doctrine is made subordinate as a means to a higher end, and that end is practical piety. It was especially Kant that gave prominence to this moralistic type of religion. He stressed the fact that the supernatural is beyond the reach of pure reason, and that the great concepts of God, virtue, and immortality, are but the necessary postulates of the practical reason. In this view faith becomes a knowledge resting on practical grounds, and religion is reduced to moral action determined by the categorical imperative. Moral duties are fundamental in the life of man, and religion begins at the point where man recognizes these duties as divine commands, that is, where he comes to the discovery that God requires those duties of him. Thus the intimate relation between religion and morality is indeed maintained, but the order of the two is reversed. Morality loses its foundation in religion, and in turn itself becomes the foundation of religion. Man becomes morally autonomous, and religion loses its objective character. But a morality that is not rooted in religion cannot itself be religious. Moreover, religion is never mere moral action. There is also knowledge in religion, and a far greater measure of knowledge than that for which the system of Kant made allowance. And in addition to that there is in religion also a self-surrender of man to God, by which he is delivered from guilt and pollution, and becomes a participant in all the blessings of salvation as the reward of the faithful. This moralistic conception of religion has become very popular in the American religious world. This is undoubtedly due in part to the influence of Ritschl, who adopted the fundamental principles of Kant and found many followers in our country, but also in part to the practical temper of the American people and to Pragmatism, in which that temper found philosophical expression. There is a one-sided emphasis on religious action in our country. Many concern themselves very little about religious experience, and even less about religious knowledge. 'Service' is the great watchword of the day, and service only is the mark of true Christianity. There is little concern about the question whether this action springs from true religious principles. It is no wonder that the term 'Activism' is used to characterize American Christianity.
  
                  3. IT HAS ITS SEAT IN THE FEELINGS. There have been those who defined religion as feeling, especially in mystical and pietistic circles. Romanticism, which was a reaction of the free emotional life against a rather formal and inflexible classicism, was in no small measure conducive to this view. Schleiermacher was its great apostle. According to him religion is essentially a sense of the infinite, a feeling of dependence, not so much on a personal God as on the universe conceived as a unity. Hence he spoke of religion as a "Hinneigung zum Weltall." In religion man feels himself one with the Absolute. Religion is pure feeling, disconnected from thought on the one hand, and from morality or action on the other. It is, to use the words of Edwards, "a warm, intimate, immediate awareness of the Infinite in the finite, the Eternal in the temporal, a sense of dependence on the Whole." Now it is undoubtedly true that feeling has an important place in religion, but it is a mistake to regard it as the exclusive seat of religion. And it is even more incorrect to regard it as the source of religion, as Schleiermacher does. His conception of religion makes it entirely subjective, a product of human factors, and ignores its relation to absolute truth. In human feeling the great question is, whether a sensation or perception is pleasant or unpleasant, and not whether it is true or false; and yet this is the all-important question in religion. This view of religion is just as one-sided as the other two. True religion is not merely, and is not even fundamentally, a matter of feeling, but also of knowledge, and of volition or moral action. Moreover, this conception easily leads to a confusion of religious and aesthetic feeling, and to an identification of religion and art. And also in connection with this philosophical view it is necessary to remark that it is not a mere abstract theory, but one that reverberates in practical life. Many regard religion purely as a matter of emotional enjoyment, good enough for women, but hardly fit for men. According to them it is something apart from the life of man in general. It really means little or nothing for the serious business of life. It has no controlling influence on the thoughts of man, neither does it determine his action in any way. One can be a Christian with his heart (feeling), and a heathen with his head. He can say, "Lord, Lord" in private or public worship, and at the same time refuse to do the Lord's bidding in daily life. This is not only an un-Scriptural, but also an unpsychological view of religion, and one that has done a great deal of harm to the cause of God in the past.
  
                  4. IT HAS ITS SEAT IN THE HEART. The only correct view is that religion has its seat in the heart. Some might be inclined to regard this position as identical with the preceding one, since the word 'heart' may denote the seat of the affections and passions in the life of man, in distinction from the intellect and the will. In that case it is really a designation of the emotional nature, that is, of the feelings. It is used in that sense, when it is said that a man's heart is better than his head. But the word 'heart' is also used in a far more general sense, and may denote even the entire personality of man as capable of being influenced or moved. It is so employed, when it is said that a man loves with all his heart. It is in a somewhat related sense, a sense that is derived from Biblical psychology, that the word is used here. The word is not always used in the same sense even in the Bible, but in some cases has a general, and in others a more specific meaning. And when it is said that religion has its seat in the heart, it is employed in its most general sense. To the question what is meant with the 'heart,' we may answer with Laidlaw that the 'heart' in the language of Biblical psychology means "the focus of the personal and moral life. It never denotes the personal subject, always the personal organ. All the soul's motions of life proceed from it, and react upon it." It is the central organ of the soul, and has sometimes been called "the workshop of the soul." Religion is rooted in the image of God in man, and that image is central. It reveals itself in the whole man with all his talents and powers. Consequently, man's relation to God is central and involves the whole man. Man must love God with all his heart, and with all his soul, and with all his mind. He must consecrate himself to his God entirely, body and soul, with all his gifts and talents, and in all relations of life. Thus religion embraces the entire man with all his thoughts and feeling and volitions. It has its seat in the heart, where all the faculties of the human soul are seen in their unity. In view of this fact we can readily understand the Scriptural emphasis on the heart as that which we must give unto the Lord, Deut. 30:6; Prov. 23:26; Jer. 24:7; 29:13. Out of the heart are the issues of life, Prov. 4:23. And in religion the heart takes possession of the intellect, Rom. 10:13, 14; Heb. 11:6, of the feelings, Ps. 28:7; 30:12, and of the will, Rom. 2:10, 13; Jas. 1:27, 1 John 1:5–7. The whole man is made subservient to God in every sphere of life. "In de religie," says Dr. J. H. Bavinck, "dalen wij af tot het wezen van den mensch. Daar waar de waarlijk religieuze krachten in den mensch tot ontwaking komen hebben wij het meest met hemzelf te doen. Daar klopt de ziel zelve in, de mensch, in de wereld gevangen, staat op en zegt tot zichzelven: ik zal naar mijnen Vader gaan."
              - c-the-origin-of-religion: |-
                  C. The Origin of Religion
  
                  Different methods have been applied in the study of the origin of religion. During the last century persistent attempts have been made to explain it as a purely natural phenomenon. This was the inevitable result of the application of the philosophy of evolution. Both the historical and the psychological methods were the fruit of this tendency. It may be said that in these naturalism is largely pitted against supernaturalism. In this chapter little more than a bare indication of these methods can be given.
  
                  1. THE HISTORICAL METHOD. The historical method aims at discovering the origin of religion by studying the history of mankind, with special attention to its primitive religions. According to Edwards this method seeks to answer such questions as the following: "How did religion first appear in time and place? In what way did the religious nature of man first express itself? What was the most rudimentary form of religion, from which all other forms may be said to have developed?" But these are questions which no historian can answer with any degree of assurance. He cannot go back far enough in history to observe man in the process of becoming religious, for man is already religious at the very dawn of history. Moreover, there are no records of the oldest forms of religion, either in written documents or in trustworthy traditions. And if this is so, then the question naturally arises, How can the historian ever find a satisfactory answer to the questions which present themselves here? Edwards says that "by a sympathetic study of the mind and ways of modern savages and of children, and by constructive imagination on the basis of such study, the anthropologist may rebuild for us the religion of the primitive man. His reconstruction must necessarily be purely hypothetical." All this means that the historian who would investigate the origin of religion must take his stand on pre-historical ground, and that as a result he can only suggest theories, which may be shrewd guesses but do not carry conviction. Moreover, the advocates of the historical method make a fundamental mistake, when they proceed on the assumption, based on the theory of evolution, that the religious life of the most primitive peoples reflects religion in its earliest and original form. This is, of course, merely a bare assumption rather than an established fact, and does not take into account the possibility that the earliest known forms may be corruptions of a far earlier form. It has long been taken for granted that the original form of religion was polytheistic, but the investigations of Lang, Radin, Schmidt, and others have found traces of the recognition of "high gods," also called "creator gods," among peoples of very low culture, and regard these as evidences of an original monotheism.
  
                  We shall mention a few of the theories suggested to explain the origin of religion, not because of their inherent value, but mainly to illustrate the insufficiency of this method. Some anthropologists found the historical explanation of religion in the cunning of priests or the craft of rulers, who exploited the credulity and the fears of the ignorant masses, in order to gain control over them. This view is so superficial that it finds no support in scientific circles today. Others were of the opinion that the higher forms of religion developed out of fetish-worship. But while this may explain the origin of certain forms of religion, it does not explain the origin of religion as such, since this fetish-worship is already religion and therefore itself requires explanation. Moreover, wherever it is in vogue, there are generally also manifest traces of an earlier higher form of religion. The fetishes themselves are frequently mere symbols of religious objects. The theories of Tyler and Spencer are closely related. The former is of the opinion that the conception of a soul or other-self, located somewhere in the body and continuing after death, gradually developed among the earliest men; and that animism (from anima, soul), as the doctrine of souls, expanded in the course of time into the doctrine of spirits, whether gods or devils, as objects of worship. The theory of Spencer is related to that of Tyler but is more specific. It suggests ancestorism, the worship of the souls of departed ancestors, as the most fundamental form of religion. According to him primitive peoples ascribed great influence to the spirits of departed ancestors, and consequently acquired the habit of praying, and of offering sacrifices, to them. But these theories are also unsatisfactory. They fail to explain the very forms they assume, the worship of the spirits of the departed, and the universal underlying conviction that these spirits are gods highly exalted above men. Moreover, wherever this spirit-worship is found, there is also a separate and distinct worship of the gods. Durkheim criticized these theories of Tyler and Spencer, and offered instead a sociological theory of the origin of religion. He found the origin of religious belief in the idea of a mysterious impersonal force controlling life, a sense of power derived from the authority of society over the individual. The sense of the power of the social group develops into the consciousness of a mysterious power in the world. The totem is the visible emblem of this power; it is the emblem of the tribe; and in worshipping the totem man worships the tribe. Man's real god is society, and the power which he worships is the power of society. But this theory was also severely criticized by other scientists, and that from various points of view. It is no more satisfactory than the others as an explanation of the origin of religion. The theory of naturism was brought into the limelight especially by Pfleiderer. According to this theory religion was originally merely respect for the great and imposing phenomena of nature, in the presence of which man felt himself weak and helpless. This feeling of respect led to the worship, in some cases of these phenomena themselves, and in others of the invisible power(s) revealing itself in them. But the question naturally arises, How did man ever hit upon the idea of worshipping nature? May not this nature-worship, which is undoubtedly prevalent in some tribes, be the result of a decline from a purer stage of religious belief and practice? Like all the preceding hypotheses, this theory also fails to offer any explanation whatsoever of religion on its psychological side. In more recent times it was suggested that the origin of religion is connected with the belief in magic. Some think that the former in some way evolved out of the latter, but Frazer, who is the great authority on this subject, claims that the contribution of magic to religion was negative rather than positive. Man tried magic first, but was disappointed, and the despair of magic gave birth to religion. On the whole the result of this historical investigation is very disappointing as an explanation of the origin of religion.
  
                  2. THE PSYCHOLOGICAL METHOD. It was felt in the course of time that the historical method had to be supplemented by the psychological, and this is now regarded as the more important of the two. This method raises the question as to the source of religion in man's spiritual nature, not merely in the beginning, but everywhere and always. Edwards puts the questions thus: What are the constant factors in the inner life of man which, in interplay with the environment, generate the attitude which we call religious? What are the impulses, promptings, motives, felt needs, which lead him to apprehend the supernatural and to adjust his life to it? What is there in his mental make-up that accounts for the fact that wherever man is found he has some form or other of religion?" The psychological method seeks to derive religion from certain factors in man, which are not themselves religious, but which by combination and in cooperation with man's natural environment give rise to religion.
  
                  It will hardly do to say, as some have done, that man is religious because he has a religious instinct, for this supposed instinct is already religious, and is therefore the very thing to be explained. It is equally unsatisfactory to account for religion, as others have done, by holding that man has a religious faculty, for there is no proof for the existence of such a faculty, and if there were, this faculty itself would require explanation. Schleiermacher sought the explanation of religion in feeling, more particularly, in a feeling of dependence, but failed to explain how a mere feeling of dependence passed into a religious attitude. Some suggest that the transition may be found in a feeling of awe, which is akin to fear, in the presence of unknown but mighty powers. But fear is not yet religion and does not necessarily lead to worship. Moreover, religious emotion is far too complex to be explained in such a simple way. It includes not only awe, wonder, and admiration, but also gratitude, love, hope, and joy. Kant and Ritschl find the origin of religion in the desire of man to maintain himself as a free moral being over against the physical world. Man is conscious of the fact that he, as a spiritual being, is of far greater value than the whole natural world, and therefore ought to control this. At the same time he cannot help feeling that, as to the physical side of his being, he is simply a part of nature, and that in striving for ethical and spiritual ends he is repeatedly thwarted by natural conditions. This tension results in an attempt on the part of man to realize his destiny by believing and resting in a higher being that controls the natural order and makes it subservient to spiritual ends. On this view God becomes merely a helper in time of need. But seeking help with a higher being is not yet religious adoration. Moreover, this theory does not explain the origin of such religious phenomena as consciousness of guilt, penitence, desire for redemption, prayer for forgiveness, and so on. Neither does it account for the universality of the felt need of God, despite the fact that discoveries and inventions make it increasingly possible for man to maintain himself over against nature. Evolutionists made the attempt to demonstrate the development of religion out of such characteristics as a sense of dependence, fidelity, attachment, and love, as these are present in the animal world. But this attempted explanation can hardly be called successful. The so-called "doctrine" of evolution is still a mere hypothesis, and what is said about the inner "soul" life of the animals is largely conjectural. And the assumptions that seem to be warranted on this point still leave the most important elements of religion unexplained. Modern psychologists differ so greatly in their suggested explanations of the origin of religion that we cannot begin to enumerate them. Nor do we consider it necessary to do this.
  
                  The psychological method labors under a difficulty similar to that with which the historical method is burdened. It must take its starting point in a hypothetical man, so undeveloped and barbarian that he has not even a spark of religion in him. Religion must be derived from factors that are not themselves religious. But Dr. Bavinck correctly says that such a man is a pure Gedankending, an empty abstraction. In reality such men do not exist. Moreover, this method makes religion dependent on an accidental concourse of circumstances. If the complex in which the explanation of religion is sought had been slightly different, religion would never have originated. This, of course, robs religion of its independent significance, of its universality and necessity, and of its incalculable worth. If it is purely accidental, it lacks the firm foundation on which it ought to rest. But this is not all: religion really becomes an absurdity, when it is explained without assuming the existence of a God. According to the psychological method man creates his own God, and determines how that God must be served. The relation between the religio objectiva and the religio subjectiva is reversed, and the latter becomes the source of the former. In principle this method conflicts with the essence of religion and virtually destroys the phenomenon which it ought to explain.
  
                  3. THE THEOLOGICAL METHOD. Speaking of the origin of religion, Edwards says that there are two views "which were once widely prevalent, but which are now obsolete or obsolescent. The first is the view that traced religion back to a primitive or a special Divine revelation." He rejects this view as being, in its usual forms, too intellectual and mechanical, pre-scientific and crudely unpsychological. However, it is the Biblical view of the origin of religion, and is far more satisfying than any of the historical and psychological views that were offered to the world. In distinction from these, it alone contains a real explanation of the universal phenomenon of religion. Both the historical and the psychological method proceed on the assumption that religion, like science and art, must be explained in a purely naturalistic way, though some of their protagonists—Edwards being one of these—feel that it may be necessary in the last analysis to appeal to some sort of revelation. The theological method, on the other hand, maintains that religion can only find its explanation in God. Religion, being communion of the soul with God, naturally implies that God exists, that He has revealed Himself, and that He has so constituted man that the latter can know Him, is conscious of kinship with Him, and is even prompted by nature to seek after Him. While the historical and psychological methods are not even able to explain religion in its most primitive forms, the theological method offers us the key to the explanation, not only of the lowest, but also of the highest there is in religion. And of course a real explanation can be satisfied with nothing less than that. It is the only method that is in harmony with the real nature of religion. Scientists do not start out with a normative view of religion, and then undertake to explain the origin of it. They begin with a study of the phenomena of the religious life, and then adapt their views, their definitions, of religion to their findings. This gives rise to a great number of historical definitions which utterly fail to do justice to that which is essential in religion.
  
                  On the basis of God's revelation, the theological method posits the following truths:
  
                  a. The existence of God. If in religion we are concerned with the most intimate relationship between God and man, then it naturally involves the assumption that God exists. And we frankly proceed on the assumption that there is a personal God. It is true, many consider it unscientific to refer anything back to God. They admit that the Hebrews did this, but find the explanation for that in the fact that these people lived in a pre-scientific age. Consequently their explanations may meet with an indulgent smile, but cannot now be taken seriously. Over against this it may be said, however, that it is a poor science that may not rise above the visible and experimental, and is not permitted to take God into account. And this is doubly true of all scientific attempts to explain the origin of religion without any reference to God, for apart from Him religion is an absurdity. Religion is either an illusion, because God does not exist or cannot be known; or it is founded on reality, but then it presupposes the existence and the revelation of God.
  
                  b. The Divine Revelation. We also proceed on the assumption that God has revealed Himself. The idea of revelation is, in some form or other, found in all religions, and this proves quite sufficiently that it is a necessary corollary of religion. There is no religion in any real sense of the word apart from a divine revelation. If God had not revealed Himself in nature, in providence, and in experience, there would be no religion among the Gentile nations of the world; and there would be no true religion in any part of the world today, if God had not enriched man with His special revelation, enbodied in His divine Word, because it is exactly this revelation, as the religio objectiva, which determines the worship and service that is acceptable to Him. The religio subjectiva owes its inception, its development, and its proper regulation instrumentally to the religio objectiva. Divorced from its objective foundation, religion turns into a will-worship that is purely arbitrary.
  
                  c. Man's creation in the image of God. A third presupposition is that God so constituted man that he has the capacity to understand and to respond to the objective revelation. Religion is founded in the very nature of man, and was not imposed upon him from without in a somewhat mechanical way. It is a mistake to think that man first existed without religion, and was endowed with this later on as a sort of superadditum. The very idea of revelation presupposes the existence of a religious consciousness in man. Created in the image of God, man has a natural capacity for receiving and appreciating the self-communication of God. And in virtue of his original endowment man seeks communion with God, though under the influence of sin he now, as long as he is left to his unaided powers, seeks it in the wrong way. It is only under the influence of God's special revelation and of the illumination of the Holy Spirit, that the sinner can, at least in principle, render to God the service that is due to Him.
  
                  This view is not open to the criticism voiced by Edwards in the following words: "In its usual forms the doctrine of revelation has explained the origin of religion in far too intellectual and mechanical a fashion, as if religion began with the impartation to man of a set of ideas, ready-made and finished ideas poured into a mind conceived as a kind of empty vessel. This is a crudely unpsychological view." He speaks of the view that must be traced back to a primitive or special revelation as "obsolete or obsolescent," but admits that the "category of revelation may be ultimately necessary in a statement of the objective ground of the validity of religious beliefs and in order to safeguard the place of the divine initiative in the religious life of man." He insists, however, that it should be the idea of a continuous and progressive revelation. But when he says this he has in mind the kind of revelation which, from another point of view, may also be called human discovery.
  
                  QUESTIONS FOR FURTHER STUDY: Does the present emphasis on the immanence of God in any way affect the current conceptions of religion? Can the psychology of religion be of great assistance in the study of the essential nature of religion? How does the philosophy of the psychologists affect their investigations in the field of religion? Is it proper to speak of man as having a religious instinct or a religious faculty? Is it correct to say that affections are more fundamental in religion than either the intellect or the will? Why is it wrong to study merely the lowest forms of the religious life of man, in order to explain the origin of religion? Are there conclusive proofs that the higher forms of religion developed out of the lower? What can be said in favor of the idea that the historical process in religion was one of deterioration rather than of development?
  
                  REFERENCES: Bavinck, Geref. Dogm. I, pp. 207–290; Kuyper, Enc. der Heil. Godgel. II, pp. 291–369; Wisse, Religie en Christendom, pp. 25–57; J. H. Bavinck, Inleiding in de Zielkunde, pp. 265–277; Galloway. The Philosophy of Religion, pp. 54–187; Edwards. The Philosophy of Religion, pp. 29–178; Wright, A Student's Philosophy of Religion; Leuba, A Psychological Study of Religion; Jevons, Introduction to the Study of Comparative Religion; Kirkpatrick, Religion in Human Affairs, pp. 1–166; Lidgett, The Christian Religion, pp. 138–224; Beattie, Apologetics, pp. 139–247; Bruce, Apologetics, pp. 71–163; Patton, Fundamental Christianity, pp. 1–208; Clark, Ten Great Religions; Menzies, History of Religion; Aalders, De Heilige Schrift en de Verelikende Godsdiens Twentenschap; Sabatier, Outlines of a Philosophy of Religion, pp. 3–117; Brown, The Essence of Christianity; Pratt, The Religious Consciousness; Hughes, The New Psychology and Religious Experience; Moore, E. C., The Nature of Religion.
              - a-name-and-concept-of-revelation: |-
                  A. Name and Concept of Revelation
  
                  1. CONNECTION BETWEEN RELIGION AND REVELATION. The idea of religion naturally leads on to that of revelation as its necessary corollary. In the study of comparative religion it is recognized ever increasingly that all religion is based on revelation of some kind, and that there is no purely "natural," as distinguished from "revealed," religion. Dr. Orr says: "In a wider respect, there is probably no proposition on which the higher religious philosophy of the past hundred years is more agreed than this—that all religion originates in revelation." The study of the History of Religions yields abundant evidence of the fact that belief in revelation is quite general among the nations of die world, and that every religion of any importance appeals to some form of revelation. Buddhism has sometimes been regarded as an exception to the rule, but in reality it is no exception, for when it became a religion it regarded Buddha as its god. Not only conservative, but also liberal scholars, grant explicitly that the knowledge of God, and therefore also religion, rests on revelation, though their conception of revelation varies a great deal. To quite an extent the term 'natural theology' has fallen into disuse, and even when it is still used, it is often with the distinct understanding that it should not be regarded as the designation of a theology which is the opposite of 'revealed theology.' W. Fulton finds fault with this old mediaeval distinction, which is still tacitly accepted by J. G. Frazer in his Gifford Lectures, and says: "the knowledge of God derived from the consideration of nature, or from the light of reason, is as much entitled to be called revealed knowledge as the knowledge of God mediated through the Scriptures and the Church."3 John Caird declares: "There is therefore, we repeat, no such thing as a natural religion or religion of reason distinct from revealed religion." McPherson was perfectly justified in saying: "In the idea and fact of religion, therefore, revelation as the operation of God is the necessary correlate of faith as the spiritual act of man."5 This could not be otherwise, because religion brings man in contact with an invisible Power, inaccessible to human investigation. If man is ever to know and serve God, the latter must reveal Himself. This is all the more true in view of the fact that in religion man is seeking something which he cannot find in science and art, in commerce and industry, in sensual pleasures and worldly riches, namely, redemption from sin and death, and life in communion with God. He can obtain these blessings only if God reveals Himself in relation to man and points out the way of salvation.
  
                  2. THE GENERAL IDEA OF REVELATION. The word 'revelation' is derived from the Latin 'revelatio,' which denotes an unveiling, a revealing. In its active sense it denotes the act of God by which He communicates to man the truth concerning Himself in relation to His creatures, and conveys to him the knowledge of His will: and in the passive sense it is a designation of the resulting product of this activity of God. It should be observed that in theology it never denotes a mere passive, perhaps unconscious, becoming manifest, but always a conscious, voluntary, and intentional deed of God, by which He reveals or communicates divine truth. The idea of revelation assumes (a) that there is a personal God who actively communicates knowledge; (b) that there are truths, facts, and events which would not be known without divine revelation; and (c) that there are rational beings to whom the revelation is made and who are capable of appropriating it. The words more particularly used in Scripture for revelation are the common words for 'disclose,' 'make known,' or 'reveal,' with a deepened meaning as applied to supernatural communications, or the effect of these. In the Old Testament the outstanding word is 'galah,' the original meaning of which is 'to be naked.' As applied to revelation, it points to the removal of a covering which obstructs the view. There is no noun derived from this verb, which denotes the concept of revelation. The corresponding New Testament term is 'apokalupto,' which also signifies the removal of a veil or covering, in order that what is back of it or under it may be seen. The noun 'apokalupsis' denotes an uncovering, a revelation. Another word that is frequently used is 'phaneroo' (noun, 'phanerosis'), to make manifest, to expose to view. The classical passage concerning the revelation of God to man is Heb. 1:1–2: "God, having of old time spoken unto the fathers in the prophets by divers portions and in divers manners, hath at the end of these days spoken to us in his Son."
  
                  3. HISTORICAL CONCEPTIONS OF REVELATION. The idea of revelation has had a rather checkered history. There was no general agreement as to just what constituted divine revelation. Baillie distinguishes five periods in the history of human thought on this subject, and a brief characterization of these periods will serve to indicate the conflicting opinions that gained currency in the course of time.
  
                  a. In the earliest times. Primitive peoples found the final court of appeal in all religious matters in the mass of tribal traditions that were handed down conscientiously from one generation to another. They regarded the knowledge of the gods and of divine things, contained in these traditions, as perfectly reliable, because it had been acquired by the inspired men of the race by divination, that is, by signs provided by the gods in the entrails of animals, the flight and cries of birds, the constellations, and so on. These signs were interpreted by those who were skilled in such matters (artificial divination), or by communications which were directly clear to the mind, and which were made during sleep or in a waking state of ecstacy or frenzy (natural divination). The traditions which originated in this fashion were sometimes embodied in sacred books.
  
                  b. In the philosophy of the Greeks. The Greeks virtually set aside the idea that the gods revealed themselves to man, and substituted for it the idea that man gradually discovered the gods. They did not deny the reality of divination altogether, but did not consider this sufficient to explain the whole body of religious knowledge. In their opinion the truth about the gods was not suddenly acquired in dreams or visions, but by means of calm and persevering thought. The prevailing opinion was that God and nature were one, and that the study of nature would therefore yield religious knowledge. The philosophy of Socrates and Plato represented, at least to a certain extent a protest against this idea. In a measure they rose above the polytheism of their day.
  
                  c. In the Christian era up to the latter half of the seventeenth century. Under the influence of the Semitic and the Christian religion a distinction was made between a revelation of God in nature and a special revelation, finally embodied in Scripture. This idea of a twofold revelation prevailed for more than sixteen hundred years without being seriously questioned. The only point in dispute was that of the exact line of demarcation. This was not always stated in the same way. Thomas Aquinas held that natural revelation could lead to the knowledge of God as a unity, and furnished an adequate basis for a scientific theology, but that only special revelation could acquaint man with God as triune and as incarnate in Jesus Christ, and conveyed to man a knowledge of the mysteries of faith.
  
                  d. In the latter half of the seventeenth century and the eighteenth century. During this period there was a growing tendency to emphasize the revelation of God in nature at the expense of His special revelation in Scripture. The idea, fostered especially by Deism and Rationalism, was that the light of nature is quite sufficient for man, and that the Christian revelation really adds nothing to it, but is merely a "republication" of the truths of nature for the benefit of those who cannot discover or reason out things for themselves. By the "light of nature" they meant "partly certain intuitive or self-evident religious beliefs, and partly certain discursive proofs based on scientific and metaphysical speculation."
  
                  e. Since the beginning of the nineteenth century. Under the influence of Kant, and especially of Schleiermacher, the difference between the light of nature and the light of God's special revelation was supposedly transcended. They are no more regarded in modern liberal theology as two different avenues to the knowledge of God, but only as two distinct ways of conceiving of the only avenue there is. The doctrine of the immanence of God is beginning to play an important part. Both Kant and Schleiermacher are "convinced that the only argument capable of reaching Deity is one that starts not from external, but from human, nature; and they believe, too, that it is in human nature, and not in its abeyance in trance or dream or frenzy, that God characteristically reveals Himself." They represent neither the doctrine of the light of nature nor that of special revelation in its old form, but resolve both in a higher unity. This new representation is in a measure a return to that of Greek philosophy, and it is especially this view of revelation that is strongly opposed by the Theology of Crisis.
  
                  4. THE IDEA OF REVELATION IN MODERN THEOLOGY
  
                  a. The Deistic conception. Eighteenth century Deism believed in a personal God and in a general revelation in nature and history, but denied the necessity, the possibility, and the reality of a supernatural revelation. It denied the necessity of such a revelation in view of the fact that human reason can discover, in the general revelation of God, all that a special revelation might convey to man. The only conceivable advantage of a special revelation is that it might facilitate the acquirement of the necessary knowledge. Lessing, though not himself a Deist, agreed with them in asserting the all-sufficiency of natural revelation. According to him special revelation offers man nothing "worauf die menschliche Vernunft, sich sellbst ueberlassen, nicht auch kommen wuerde; sondern sie gab und gibt ihm die wichtigsten dieser Dinge nur fruehrer." Deism also considered a supernatural revelation as impossible, that is, metaphysically inconceivable and morally unworthy of God. Such a revelation would imply that the existing world is defective and, consequently, that the Creator, when He called it into being, was wanting, either in the necessary wisdom to plan a better world, or in the requisite power to create a superior world. The one is just as inconceivable as the other, and both involve an unworthy conception of God. Finally, it also boldly denied the existence of any supernatural revelation, since it considered such a revelation as absolutely contrary to the fact that God always works according to the established laws of nature. The world is under the control of an iron-clad system of laws, and therefore necessarily excludes the intrusion of supernatural elements. Prophecy and miracles do not prove the existence of a revelation transcending the bounds of reason, since they admit of a natural explanation. The Deist, then, ruled out the supernatural, and retained only the natural revelation of God, and he was followed in that respect by the philosophy of the Enlightenment. Even Kant did not transcend this view, but argued just as Lessing did before him. His religion was a religion within the bounds of reason.
  
                  b. The modern Idealistic conception. While Deism placed God at a distance from the world and allowed no point of contact, the idealistic philosophy of the beginning of the previous century stressed the immanence of God in the world, and thereby gave rise to a new conception of revelation. That philosophy was essentially pantheistic and therefore excluded revelation in the sense in which it was always understood by the Church. The fundamental principle of Pantheism is that God and the world are one. God has no independent existence apart from the world; neither does the world exist in distinction from God. A distinction is usually made between the monistic, infinite, and self-sufficient ground of all things, and the temporal, finite, and constantly changing phenomena that necessarily flow from it. These phenomenal forms are only modifications of the unknown something that lies back of them, and that has been variously designated as Brahm (in Indian philosophy), Pure Being (Greeks), Substance (Spinoza), or Pure Thought (Hegel). These are all pure abstractions which, as Bavinck remarks, may mean everything or nothing. Opinions differed as to the way in which the world of phenomena comes forth out of this hidden background. The Indian philosophers spoke of emanation, the Greeks, of manifestation, Spinoza, of modification, and Hegel, of a process of idealistic evolution. But this process, of whatever kind it may be, does not, strictly speaking, reveal the Absolute; this remains an unknown quantity. Moreover, on this standpoint one can at best speak of a becoming manifest, and not at all of a conscious, voluntary, and active self-communication. And, finally, this pantheistic view knows no object, to which knowledge could be communicated. Subject and object are one. Moore correctly says that, according to Hegel, "God is revealer, recipient, and revelation all in one."
  
                  Through Schleiermacher and his followers the one-sided emphasis of the Idealists on the immanence of God also became popular in theological circles, and was often stressed to the point of Pantheism. The whole of nature was not only regarded as a manifestation of the immanent God, but often identified with Him. The divinity of man was emphasized in view of the fact that the most important revelation of God was found in the inner life of man, in which, according to Hegel, the Infinite comes to self-consciousness. And since Christ was regarded as the purest flower of the human race, the highest revelation of God was also found in Him. primarily in His inner life, but secondarily also in His historical appearance. Thus the continuity of God and man was made emphatic, and the idea of the distance separating the two was minimized and often completely ignored. McGiffert, speaking of the influence of the doctrine of immanence on the idea of revelation, says: "As God is immanent in the life of man divine revelation comes from within, not from without. The religious man looks into his own experience for the disclosure of divine truth, and if he also turns to the pages of a sacred book, it is simply because it is a record of the religious experiences of others who have found God in their own souls and have learned from Him there."
  
                  This Idealism also rules out the supernatural revelation of God. It is true that, while Deism denies the supernatural, Idealism in a formal sense denies the natural, since it regards all thoughts, facts, and events in the natural world as the direct products of the immanent God. All that Deism called natural is denominated supernatural by Idealism. In its estimation the supernatural is, in the last analysis, not distinct from the natural, but finds expression in the common laws of nature and in the ordinary course of events. All the natural is supernatural, and all the supernatural is natural. In view of this fact it is no wonder that present day liberalism sometimes speaks of a "natural supernaturalism" and of a "supernatural naturalism." It might seem therefore that, in this idealistic view, they who contend for a supernatural revelation receive even more than they are asking for; but the gain is merely apparent. It only means that all revelation is regarded as supernatural in origin, that is, as coming from God. Hence the question remains, whether there is a revelation of God, which transcends all that man can learn by his natural powers, a revelation, which not only flows from a supernatural source, but is also mediated and brought to man in a supernatural way. And at this point Idealism, in spite of all its pretended belief in the supernatural, joins Deism in its denial. Over against it, we must emphasize the fact that there is a revelation of God, which was mediated and brought to man in a supernatural way.
  
                  There is another point that deserves particular attention here, namely, that concerning the content of the divine revelation. The Church has always regarded the revelation of God as a communication of knowledge to man: knowledge of the nature and of the will of God. But in modern liberal theology, which is dominated by Idealism with its doctrine of the divine immanence, we repeatedly meet with the assertion that revelation is not a communication of divine truth, but assumes the form of experience or of a historical person, namely, Jesus Christ. Sometimes it is said that God reveals Himself in acts rather than in words. This is entirely in line with the common view that Christianity is not a doctrine but a life. G. B. Foster says that the Christian concept of revelation differs from that "of the orthodox ecclesiastical dogmatics. The latter rests on the equivalence of revelatio specialis with Sacred Scriptures. In consequence of this, revelation is conceived (a) as communication of doctrine; (b) as internally authoritative and statutory; (c) as miraculous in the sense that main stress is placed on the absence of natural mediations; (d) as historyless." According to Gerald Birney Smith "revelation is more and more being considered as exceptional spiritual insight rather than as a non-human communication of truth."2 Edwards admits that the category of revelation may be ultimately necessary, but "it must be a revelation of God in terms of the whole life of man and not in terms of mere intellectual knowledge or ideas, conveyed to the mind of man from above." Modesty does not permit the modern liberals to pretend that they are in possession of the truth, and therefore they assume the humble attitude of being seekers after truth. At the same time they have enough confidence in man to think that he can discover the truth, and has even discovered God. And even if they do still believe in divine revelation, they must insist that human discovery goes hand in hand with it.
  
                  c. The conception of the Theology of Crisis. The Theology of Crisis, represented by such men as Karl Barth, Emil Brunner, E. Thurneysen, F. Gogarten, and A. Bultmann, represents in no small measure a reaction against the modern idealistic view of revelation. Several of its interpreters have already suggested that it might appropriately be called "The Theology of the Word of God." This would be quite in harmony with the title of Barth's Prolegomena, "Die Lehre vom Worte Gottes." In this theology the "infinite qualitative difference between time and eternity" is stressed, and with it as its necessary corollary the discontinuity between God and man. By taking this position it at once cut the ground from under the modern subjective conception of revelation, in which human discovery plays so great a part. It rebukes the pride of those who imagine that they can build a tower high enough to reach heaven, and places great and repeated emphasis on the fact that there is no way from man to God, but only a way from God to man. God is a hidden God, and man in his spiritual blindness can never find Him. It is a God who finds man and thereby puts him in a crisis. Revelation, according to this theology, has no concrete historical existence, not even in the Bible, and therefore it would not be correct to say, This is the Word of God. It would involve bringing the Word of God down to the level of the historical and relative, and putting it in the power of man to make God an object of study, while, as a matter of fact, God is never object, but always subject. In revelation all the emphasis falls on the free act of God. It is God in the act of speaking, and speaking now to this and then to that man, and bringing the word home to the soul in faith.
  
                  The Theology of Crisis speaks of a revelation given once for all. And if the question is raised, when this revelation was given, the answer is, in the incarnation, in which God actually came to man to perform a great all-decisive deed in order to constitute afresh our humanity. However, it is not in the historical life of Jesus that the supreme revelation of God was given, as the modern liberals claim, but only in that which is absolutely new in Him, that in which the eternal comes vertically down from above and penetrates into the horizontal line of history. Camfield says in his Barthian study: "Christ makes the entrance into history of something that is new. In that which makes Him Christ, the revelation of God, he is not continuous with history but discontinuous. In Him, history is lifted out of its temporal sequential setting and set in the light of the divine event of revelation." Brunner speaks in a similar vein: "Jesus Christ means eternity in time, the Absolute within relativity, the fulfilment of time, the beginning of that which is above all temporal change, the aion mellon, the coming of the word of God and salvation." The revelation of God came to man therefore in a great central fact rather than in a communication of knowledge. In it God approaches man, not with a teaching that must be believed, but with a challenge that must be met, with a behest or a command that must be obeyed. There is no revelation, even in Christ, however, until there is faith. Faith is not, strictly speaking, to be understood as a spiritual activity of man, by which he accepts the divine revelation, for this would make man subject and put him in possession of the revelation. It is rather the negation of man as subject. It is the creative work of God, and particularly of the Holy Spirit, by which, and by which alone, the revelation finally becomes an accomplished fact. Faith is a miracle, the deed and gift of God; it is revelation on its subjective side. Camfield says: "In faith man becomes the subject of a great aggression upon his life, a great approach of God, which disqualifies his consciousness, his thought-world for purposes of revelation." It is true that Barth sometimes speaks of faith as the response of man to the divine revelation, but this must be understood in the light of the preceding. He says that it is the Word of God in Christ, the revelation therefore, which itself creates the apprehension of it.
  
                  Barth also speaks of the Word of God that came to the prophets and the apostles as the original revelation; and the question naturally arises, how this Word is connected with the revelation in Christ. In his work on God in Action Barth represents God as having gone forth as a warrior to meet the hosts of sinful men in a terrible contest, and then says: "This event is God's revelation to man; and whoever fails to understand it in this manner does not know what he is saying when he takes the word 'revelation' on his lips." He points out that the great central revelation came in Jesus Christ, and that the men who bore the brunt of the attack were the men of the first line, that is the prophets and the apostles. To them the revelation of God in Christ came first of all; and since there is no revelation apart from the apprehension of it, the revelation that came to them may be called the original revelation.
  
                  They in turn bear witness to the revelation in the Bible, so that the Bible may be called a witness to, or a token of, the divine revelation, and can only in so far be called the Word of God. It is not itself the revelation, for this always comes as an act of God. Says Barth: "Holy Scripture as such is not the revelation. And yet Holy Scripture is the revelation, if and in so far as Jesus Christ speaks to us through the witness of His prophets and apostles." And again: "The prophetic apostolic Word is the word, the witness, the proclamation and the preaching of Jesus Christ. The promise given to the Church in this word is the promise of God's mercy—expressed in the person of Him who is true God and true man—which takes to itself us who, because of our enmity towards God, could literally never have helped ourselves."4 The word of Scripture may and does become for man the Word of God, the revelation, when it comes to him with the creative force that engenders faith. Barth speaks of the Bible as the second, and of the preaching of the Word, as the third, form of the Word of God. Church proclamation is the gospel of Jesus Christ, preached with the expectation that it will become for some the Word of God. It becomes this only in those cases in which it is brought home to the heart in faith, and it is recognized as a divine revelation through the operation of the Holy Spirit,—a testimony of the Holy Spirit in each particular case.
  
                  The characteristic thing of the revelation of God is not that it communicates truth to man, but that it comes to him as a challenge, as a command, as a behest, which calls for obedience on the part of man, an obedience which is again wrought in faith. It is factual rather than verbal, that is, it comes to man as an act rather than as a word or, to speak in the words of Forsyth, who has been called "a Barthian before Barth," as "a word in the form of an act." Moreover, it is not merely something that took place in the past, but is also something actual and contemporaneous. This is correctly stressed by Walter Lowrie in the following words: "When we say that revelation is not a question of fact but of actuality, we completely alter the statement of the problem as it was conceived by Protestant as well as by Catholic orthodoxy. The question now is not first of all whether God spoke—some time in the past, more or less remote—and by what criterion we can determine that the record of this speech, a word recorded in Holy Scripture, was really a Word of God. Instead it is a question whether God actually speaks, now, at this moment and to me. And whether I hear. For if I hear a word addressed to me in God's voice, the question cannot arise how I am to recognize it as God's Word. And if I do not thus hear it, I can have no interest in asking such a question. The doctrine of the Reformers that the Word of God authenticates itself, or is authenticated to the individual by the testimony of the Holy Ghost, is much more evidently applicable here than in the connection in which they used it. Regarded as actual the Word of God is either heard as the Word of God, or it is not heard at all."
  
                  5. THE PROPER CONCEPTION OF THE NATURE OF REVELATION. The existing variety of opinions respecting the idea of revelation naturally gives rise to the question, how we can arrive at a proper conception of revelation. Is it possible to determine precisely what constitutes a genuine divine revelation, and to define it in a way that will meet with general approval? And if it is possible to arrive at a proper conception of revelation, what method should be pursued in quest of it?
  
                  a. The historical method. Many are of the opinion that the answer to the question under consideration should be sought by the study of the history of religions. The investigator should approach the study of the subject with an unbiased mind, place himself, as it were, outside of all religions and their supposed revelations, take careful notice of the claims which they present, and then finally draw his conclusions. They regard this as the only scientific way in which the essential elements of a divine revelation can be discovered, and in which a unitary view of revelation can be obtained. But this method is bound to disappoint for various reasons. (1) It is pure self-deception to think that anyone can ever take his stand outside of history, study the various beliefs respecting revelation in the different religions of the world without any presuppositions, and thus reach a purely objective conclusion as to its nature. We are all historically conditioned, and cannot possibly take our stand outside of history. Moreover, we cannot set ourselves aside in our investigations, nor the religious content of our consciousness, and usually reach a conclusion which was in principle determined beforehand. (2) On the supposition that one does succeed in approaching one's subject in an entirely unbiased manner, without any presuppositions on the subject, one, for that very reason, enters upon the study of the subject without a standard by which to determine the genuineness of a revelation. Approaching the matter in such a fashion, it is simply impossible to reach a sound judgment. And if on the other hand one comes to the study with a rather definite standard in mind, one is no more unbiased and is guilty of petitio principii, a begging of the question. (3) No science, however, objective, will ever be able to remove the differences of opinion respecting the idea of revelation, and to unify all nations and individuals in the deepest convictions of the heart. Only unity of religion can lead to such a spiritual unity. It cannot be said that the study of the history of religions has led to very gratifying results in this field.
  
                  b. The theological method. In the study and evaluation of the idea of revelation we must have a standard of judgment. And the all-important question is, Whence shall we derive it? Certainly not from philosophy, for this has no right to determine a priorily what constitutes genuine revelation. The Christian can derive the real concept of revelation only from what he recognizes as the special revelation of God. This means that we must turn to what we consider to be the divine revelation itself, in order to learn what revelation really is. It will of course be said that in following this method of procedure we are also reasoning in a circle, and we frankly admit this; but it is the same kind of circle as that in which the scientist moves when he turns to the earth, in order to learn what really constitutes it. Edwards feels constrained to resort to the same kind of reasoning, when he seeks to determine the norm of religion in a historical way. Says he: "In pursuing this inquiry it will be difficult for us to avoid reasoning in a circle—i. e., to avoid using our norm to guide us in our description of the common element as well as using the common element to guide us in our search for the norm.… It may be doubted whether in our actual reasoning we ever quite avoid the 'circles,' except when our reasoning is purely formal, sterile, and pedantic." The situation is this: If no revelation has ever taken place, all efforts to reflect on the nature of it will be in vain; but if there is a revelation, then this itself must shed light on its essential nature and thus supply us with a standard of judgment. The many so-called revelations constitute no reason why the Christian in his scientific study should set aside his convictions respecting the truth of God's special revelation in Scripture. If it did, then the contention of many in our day that the true, the good, and the beautiful are relative concepts, would also have to constrain us to abandon our convictions concerning the laws of logic, of morals, and of aesthetics. It is perfectly true that people of other religions may argue in the same way, but this makes no essential difference. In the last analysis each one standeth and falleth to his own Lord. It is true that this method does not lead to a unitary view of revelation, but neither does any other method. And it is quite possible that we can do more to heal the existing breach by adhering to our Christian faith also in our scientific study than in any other way. Bavinck says that a science which seeks refuge in indifference does not know what to do with religion and revelation, and finally classes both as superstition.
  
                  6. DISTINCTIONS APPLIED TO THE IDEA OF REVELATION. In course of time two different distinctions were applied to the idea of revelation. The earliest of these is that between natural and supernatural revelation. Later on many abandoned this in favor of the distinction between general and special revelation. Each one of these modes of distinguishing between different kinds of revelation has its own peculiar fitness and describes a real difference between the two in their essential nature, in their comprehensiveness, and in the purpose which they serve.
  
                  a. Natural and supernatural revelation. Scripture does not make the distinction between natural and supernatural revelation, though it does afford a basis for it. Neander mistakenly regarded phaneroun and apokaluptein as being respectively designations of natural and supernatural revelation. In a certain sense it may be said that, according to Scripture, all revelation of God is supernatural, since it comes from God and reveals God, who possesses a life distinct from that of nature. As a rule the Bible does not trace the phenomena of nature to secondary causes, but to their primary cause, which is God or the will of God. The distinction was made rather early in history, however, but was not intended as a designation of a two-fold origin of revelation. It was clearly understood that all revelation of God is supernatural in origin, since it comes from God. It served rather to discriminate between two different modes of revelation. Natural revelation is communicated through the media of natural phenomena, while supernatural revelation implies a divine intervention in the natural course of events; it is supernatural not only in origin, but also in mode. The distinction between natural and supernatural revelation became very prominent in the Middle Ages, and occupied an important place in the discussions of the Scholastics. It was especially the problem of the relation between the two that engaged the attention of several of the most prominent Schoolmen. In their minds the question was really that of the relationship between reason and revelation. Some ascribed the primacy to revelation and expressed their conviction in the words "Credo ut intelligam," while others regarded reason as primary. Toward the end of the scholastic period, however, the distinction took the form of an antithesis, particularly in the teachings of Thomas Aquinas. He considered it necessary to keep the truth of philosophy and the truth of revelation each in its own place, and to handle the problems of philosophy as a philosopher, and those of theology, as a theologian. Of the two methods to be followed the one leads to scientific knowledge, and the other to faith, that is, to an acceptance of the truth, which is not based on intellectual insight. He considered it possible to construct a science on the basis of reason, but not on the basis of faith, though he recognized the possibility of proving some of the propositions of faith or revelation by means of rational argumentation. Revelation, it was thought, added to the knowledge obtained by reason specifically the knowledge of the mysteria (Trinity, incarnation, etc.), and these, as resting exclusively on authority, remain a matter of faith. This view led to a dualism, involving an over-valuation of natural, and an under-valuation of supernatural, revelation.
  
                  The Reformers retained the distinction, but sought to get away from the dualism of Thomas Aquinas. They denied the possibility of arriving at a strictly scientific knowledge of God from natural revelation, and held that through the entrance of sin into the world God's natural revelation was corrupted and obscured, and man's understanding was so darkened that he was unable to read and interpret correctly God's handwriting in nature. As a result of the fall two things became necessary: (1) that in a supernatural revelation God should re-publish, correct, and interpret the truths which man could originally learn from nature; and (2) that He should so illumine man by the operation of the Holy Spirit as to enable him to see God once more in the works of His hands. Consequently natural theology, which had been emphasized by Scholasticism, lost its independence on the basis of reason, and was incorporated in the Christian system of doctrine. This does not mean, however, that the Churches of the Reformation attached little or no value to natural revelation. Both the Lutherans and the Reformed continued to maintain its great significance. Several Reformed scholars defended it against the Socinians, who regarded all knowledge of God as the fruit of an external communication. It may be said that even the Churches of the Reformation did not entirely escape the dualistic representation of the Scholastics. Reformed scholars have sometimes given the impression—and do this occasionally even now—that there is still a sphere, however small, where human reason reigns supreme and does not need the guidance of faith. Under the influence of the Cartesian philosophy, with its emphasis on reason as the source of all knowledge, some of them published separate works on natural theology. In the eighteenth century English Deism and German Rationalism gave such prominence to the theologia naturalis that the theologia revelata was made to appear as altogether superfluous. This culminated in the philosophy of Wolff, who considered it possible to prove everything by a rationalistic procedure and a deductive method, and to present it in a clear way. Kant overthrew this position entirely by pointing out that the supersensual and supernatural lies beyond the reach of human reason. Moreover, the history of the study of religions proved that none of these are based on a purely natural revelation.
  
                  b. General and special revelation. Alongside of the distinction between natural and supernatural revelation, another distinction arose, namely, that between general and special revelation. The former was considered faulty, since it was found that even heathen religions are based, not exclusively on the revelation of God in nature, but in part also on elements of a supernatural revelation, handed down by tradition and to a great extent perverted. The distinction between general and special revelation runs to a certain degree parallel to the preceding one, though it is not entirely the same. It contemplates the extent and purpose of the revelation rather than its origin and mode. There is, however, a certain overlapping. General revelation rests on the basis of creation, is addressed to all intelligent creatures as such, and is therefore accessible to all men; though as the result of sin they are no more able to read and interpret it aright. Special revelation on the other hand rests on the basis of re-creation, is addressed to men as sinners with a view to their redemption, and can be properly understood only by the spiritual man. General revelation is not exclusively natural, but also contains supernatural elements; and special revelation also comprises elements which assume a perfectly natural character. The revelation of the covenant of works before the fall was supernatural and at the same time general. And when the sphere of special revelation was limited to Israel, God repeatedly gave supernatural revelations to non-Israelites, and therefore outside of the sphere of special revelation, Gen. 20;40, 41; Judg. 7:13; Dan. 2; 5:5. And on the other hand, when God reveals Himself in the history of Israel, in the providential vicissitudes of that ancient people, and in the ritual worship in tabernacle and temple, He is clothing His special revelation in natural forms. Of course, in so far as these elements are now embodied in the inspired Word of God, they come to us as a part of God's supernatural revelation. In view of the preceding it can hardly be said that natural and general revelation on the one hand, and supernatural and special revelation on the other hand, are in all respects identical. Roman Catholics still give preference to the older distinction, while Reformed theologians prefer the later one, though they do not use it exclusively.
