                  B. General Revelation
  
                  General revelation, as we know it, does not come to man in a verbal form. It is a revelation in res rather than in verba. It consists in those active manifestations to the perception and consciousness of man which come to him in the constitution of the human mind, in the whole framework of nature, and in the course of God's providential government. Divine thoughts are embodied in the phenomena of nature, in the human consciousness, and in the facts of experience or history. As was pointed out in the preceding, this general revelation has sometimes also included elements of supernatural revelation. The existence of such a general revelation was taught in Reformed theology from the very beginning. In Calvin's Institutes we read: "That there exists in the human mind, and indeed by natural instinct, some sense of Deity, we hold to be beyond dispute, since God himself, to prevent any man from pretending ignorance, has endued all men with some idea of his Godhead, the memory of which He constantly renews and occasionally enlarges, that all to a man being aware that there is a God, and that He is their Maker, may be condemned by their own conscience when they neither worship him nor consecrate their lives to his service." In a following chapter he points out that God has not only been pleased "to deposit in our minds the seed of religion of which we have already spoken, but so to manifest his perfections in the whole structure of the universe, and daily place himself in our view, that we cannot open our eyes without being compelled to behold him."2 Still farther on he speaks of God's revelation in the providential guidance of the world. At the same time he stresses the fact that man does not derive great benefit from this revelation. Says he: "Bright, however, as is the manifestation which God gives both of himself and his immortal kingdom in the mirror of his works, so great is our stupidity, so dull are we in regard to these bright manifestations, that we derive no benefit from them."
  
                  In answer to the question by what means God is known to us, the Belgic Confession says: "We know Him by two means: First by the creation, preservation, and government of the universe; which is before our eyes as a most elegant book, wherein all creatures, great and small, are as so many characters leading us to see clearly the invisible things of God, even His everlasting power and divinity, as the apostle Paul says (Rom. 1:20). All which things are sufficient to convince men and leave them without excuse." These words contain a clear recognition of the general revelation of God, as it is taught in Scripture, and a statement of its significance for man. A further recognition of this general revelation is found in Art. XIV, which speaks of the creation of man in the image of God, of his fall in sin, whereby he lost all his excellent gifts, and of the fact that he "retained only small remains thereof, which, however, are sufficient to leave man without excuse."
  
                  Liberal theology greatly over-emphasized the general revelation of God. In distinction from Deism, it found this revelation primarily in man and in his religious experiences, and supremely in the man Christ Jesus, in whom the divine element that is in every man, reached its highest manifestation. The Bible, and particularly the New Testament, was regarded merely as a record of the religious experiences of men who enjoyed special privileges in their close contact with Christ, the source of their deep God-consciousness. In this way it was robbed of its supernatural character and made to differ only in degree from other parts of God's general revelation. The self-disclosure of God in human experience became the all-sufficient revelation of God unto salvation. The immanent God is present in every man and saves all those who heed His promptings.
  
                  Over against this view the Theology of Crisis once more places all emphasis on special revelation. In fact, Barth goes to the extreme of denying all natural revelation, whether it be in nature round about us, in the human consciousness, or in the course of historical events. That is, he denies that there is in the work of creation a revelation, from which the natural man can learn to know God, and on the basis of which he can construct a theology, and rejects absolutely the analogia entis of the Roman Catholic Church. He is willing to admit that the invisible things of God are visible in the world, but only to seeing eyes, and the natural man is blind. There would be a revelation for him in these things, only if he could see them. But the subjective condition of revelation is utterly wanting in his case. There is no point of contact in him, since the image of God was utterly destroyed by sin. Right here an important difference emerges between Barth and Brunner. The latter does believe in natural revelation, and denies that the image of God was utterly defaced, so that not a trace of it is left. He holds that the image of God was utterly destroyed materially but not formally, and that there is still an Anknuepfungspunkt in the natural man to which revelation can link itself. In this respect he certainly comes closer to the historical position of Reformed theology. Barth takes issue with him on this point in his pamphlet entitled "Nein."
  
                  1. THE VALUE AND SIGNIFICANCE OF GENERAL REVELATION. The fact that after the fall the general revelation of God was superseded by a special revelation, is apt to lead to an under-valuation of the former. But we may not neglect the data of Scripture on this point. The Gospel of John speaks of a light that lighteth every man (John 1:9). Paul says that the invisible things of God "since the creation of the world are clearly seen, being perceived through the things that are made, even His everlasting power and divinity; that they may be without excuse," and speaks of the Gentiles as "knowing God" (Rom. 1:20, 21). In the following chapter he says that "they show the work of the law written in their hearts, their consciences bearing witness therewith, and their thoughts one with another accusing or else excusing them (Rom. 2:15). God did not leave Himself without a witness among them (Acts 14:17). There is therefore a general revelation of God, for which the natural man has a certain susceptibility, for it renders him without excuse. And while they who enjoy only this general revelation never live up to the light, and many deliberately go contrary to it, there are also some who do by nature the things of the law. In spite of the fact that God has now revealed Himself in a superior manner, His original revelation remains of great importance.
  
                  a. In connection with the Gentile world. Though there is no purely natural religion, yet the general revelation of God in nature and history furnishes the firm and lasting foundation for the Gentile religions. It is in virtue of this general revelation that even the Gentiles feel themselves to be the offspring of God, Acts 17:28, that they seek God, if haply they might find Him, Acts 17:27, that they see God's everlasting power and divinity, Rom. 1:19, 20, and that they do by nature the things of the law, Rom. 2:14. In spite of that fact, however, Scripture does not regard their religions as true religions, differing from the Christian religion only in degree, as so many students of religion do at the present time, but ascribes them to a wilful perversion of the truth. It passes a severe judgment on them, and describes the condition of the Gentile world, devoid of the light of God's special revelation, as one of darkness, Isa. 9:1 f.; 60:2; Luke 1:79; Eph. 4:18, ignorance, Acts 17:30; Rom. 1:18 f.; 1 Pet. 1:14, folly, 1 Cor. 1:18 ff.; 2:6; 3:19 f.; and of sin and unrighteousness, Rom. 1:24 f.; 3:9 f. The heathen gods are no gods, but idols which have no real existence and are really lies and vanity, Isa. 41:29; 42:17; Jer. 2:28; Acts 14:15; 19:26; Gal. 4:8; 1 Cor. 8:4; and the heathen religions even give evidence of the operation of demoniacal power, Deut. 32:17; 1 Cor. 10:20 f.; Rev. 9:20.
  
                  But though Scripture passes a severe judgment on the religions of the Gentiles, and represents them as false religions over against Christianity as the only true religion, it also recognizes true elements in them. There is also among the heathen a revelation of God, an illumination of the Logos, and an operation of the Holy Spirit, Gen. 6:3; Job. 32:8; John 1:9; Rom. 1:18 ff.; 2:14, 15; 14:16, 17; 15:22–30. Nevertheless, it beholds in the Gentile world only a caricature of the living original which is seen in Christianity. What is mere appearance in the former, is real in the latter, and what is sought in the former is found in the latter.
  
                  Philosophy has not been satisfied with the explanation which Scripture gives of the religions of the Gentiles, and substituted for it another under the influence of the doctrine of evolution. According to this, mankind gradually developed out of an irreligious condition, through the stages of fetishism, animism, nature-worship, and henotheism, into ethical monotheism. But in recent years some renowned scientists, engaged in archaeological researches, such as Langdon, Marston, and Schmidt, declared themselves in favor of an original Monotheism as the primary form of religion.
  
                  b. In connection with the Christian religion. General revelation also has a certain value for the Christian religion. Not that it provides us with a religio naturalis, which is quite sufficient in itself and therefore renders all supernatural revelation superfluous. Such a natural religion does not exist, and is in fact impossible. Neither can it be said that the Christian derives his knowledge of God first of all from general revelation, and then supplements this with the knowledge of Christ. He derives his theological knowledge of God from special revelation only; this is his principium unicum. Yet there is a close relation between the two. Special revelation has incorporated, corrected, and interpreted general revelation. And now the Christian theologian takes his stand on the Word of God, and from that point of vantage also contemplates nature and history. He reads God's general revelation with the eye of faith and in the light of God's Word, and for that very reason is able to see God's hand in nature, and His footsteps in history. He sees God in everything round about him, and is thereby led to a proper appreciation of the world. Moreover, general revelation offers the Christian a basis, on which he can meet and argue with unbelievers. The light of the Logos that lighteth every man is also a bond that unites all men. The whole creation testifies with many voices that man is created in the image of God, and therefore cannot find rest except in God. Finally, it is also due to God's general revelation that His special revelation is not, as it were, suspended in the air, but touches the life of the world at every point. It maintains the connection between nature and grace, between the world and the kingdom of God, between the natural and the moral order, between creation and re-creation.
  
                  2. THE INSUFFICIENCY OF GENERAL REVELATION. Pelagians taught the sufficiency of general revelation and of the religio naturalis founded on it. They spoke of three different ways of salvation, the very names of which point to autosoterism, the doctrine that man saves himself. These three ways were called: (a) the lex naturae, (b) the lex Mosis, and (c) the lex Christi. At the time of the Reformation both the Roman Catholics and the Protestants regarded general revelation as insufficient. But in the eighteenth century Deists and Rationalists again followed the Pelagians in their over-estimation of general revelation. And under the influence of Schleiermacher and of the idealistic philosophy of the nineteenth century, with its one-sided emphasis on the immanence of God, many began to regard the revelation of God in man as quite sufficient for the spiritual needs of man, and this was tantamount to an admission of the sufficiency of general revelation. Over against this modern tendency it is necessary to stress its insufficiency. There are especially three reasons why it cannot be considered adequate.
  
                  a. It does not acquaint man with the only way of salvation. By general revelation we receive some knowledge of God, of His power, goodness, and wisdom, but we do not learn to know Christ, the highest revelation of God, in His redemptive work and in His transforming power. And yet an experimental knowledge of Him is the only way of salvation, Matt. 11:27; John 14:6; 17:3; Acts 4:2. Since general revelation knows nothing about grace and forgiveness, it is entirely insufficient for sinners. Moreover, while it teaches certain truths, it changes nothing in the sphere of being. And yet it is absolutely necessary that the sinner should be changed, that a new element should be introduced into history, and that a new process should be set in motion, if the divine purpose is to be realized in the life of mankind.
  
                  b. It does not convey to man any absolutely reliable knowledge of God and spiritual things. The knowledge of God and of spiritual and eternal things derived from general revelation is altogether too uncertain to form a trustworthy basis, on which to build for eternity; and man cannot afford to pin his hopes for the future on uncertainties. The history of philosophy clearly shows that general revelation is no safe and certain guide. Even the best of philosophers did not escape the power of error. And though some rose to a height of knowledge that compels admiration, they proved quite inadequate to present that knowledge in such a form that it became the common property of the masses. As a rule it was of such a nature that only the limited number of intellectuals could really share it. Paul tells us that the world through its wisdom knew not God.
  
                  c. It does not furnish an adequate basis for religion. The history of religions proves that not a single nation or tribe has been satisfied with a purely natural religion. Through the devastating influence of sin God's revelation in nature was obscured and corrupted, and man was deprived of the ability to read it aright. This noetic effect of sin remains, and general revelation itself makes no provision for its removal, but leaves the spiritual condition of man as it is. Therefore it cannot serve as a basis for true religion. The so called natural religion of the Deists and the Vernunftreligion of Kant are pure abstractions, which never had any real existence. It has become increasingly evident that such a religion does not, and cannot exist. It is generally admitted at present that all religions are positive and appeal to a greater or less degree to a supposed or real positive revelation.
              - c-special-revelation: |-
                  C. Special Revelation
  
                  1. THE SCRIPTURAL IDEA OF REVELATION. Alongside of the general revelation in nature and history, we have a special revelation, which is now embodied in Scripture. The Bible is the book of the revelatio specialis, and is in the last analysis the only principium cognoscendi externum of theology. It is therefore to this source that we also turn for our knowledge of special revelation. Several words are used in Scripture to express the idea of revelation, such as certain forms of the Hebrew words galah, ra'ah, and yada', and the Greek words epiphanein (epiphaneia), emphanizein, gnorizein, deloun, deiknunai, lalein, and especially phaneroun and apokaluptein. These words do not denote a passive becoming manifest, but designate a free, conscious, and deliberate act of God, by which He makes Himself and His will known unto man. Barth stresses the fact that God is absolutely free and sovereign in revealing Himself to man. Scholten had the mistaken notion that apokaluptein refers to subjective internal illumination, and phaneroun, to objective manifestation or revelation. The former is also used to denote objective revelation, Luke 17:30; Rom. 1:7–18; 8:18; Eph. 3:5; 2 Thess. 2:3, 6, 8, etc. Neander was equally mistaken, when he regarded phaneroun as a designation of God's general revelation in nature, and apokaluptein as a denomination of the special revelation of grace. The former is also used of special revelation, John 17:6; Rom. 16:26; Col. 1:26; 1 Tim. 3:16; 2 Tim. 1:10, etc., and the latter serves, at least in one passage, to denote general revelation, Rom. 1:18.
  
                  It is difficult, if not impossible, to make a distinction between the two that will hold in all cases. Etymologically, apokaluptein refers to the removal of a covering by which an object was hidden, and phaneroun, to the manifestation or publication of the matter that was hidden or unknown. Apokalupsis removes the instrumental cause of concealment, and phanerosis makes the matter itself manifest. This also accounts for the fact that phanerosis is always used of objective, and apokalupsis of both subjective and objective, revelation; and that phanerosis is repeatedly used to denote either general or special revelation, while apokalupsis is, with a single exception, always used of special revelation. There is also a characteristic difference between these two words and the words gnorizein and deloun. The former stress the fact that matters are brought to light, so that they fall under our observation; and the latter indicate that these matters, by virtue of that revelation, now also become the object of our conscious thought.
  
                  2. THE MEANS OF SPECIAL REVELATION. The Christian religion is not only like the heathen religions in its appeal to revelation; even in the means of revelation a certain similarity can be seen. In general these can be reduced to three forms.
  
                  a. Theophanies. Gentile religions are frequently associated with traditions respecting appearances of the gods. The gods are not considered to be like man and to be living with him on a footing of equality, but are nevertheless represented as coming to man occasionally and bestowing rich blessings upon him. In this respect these religions are somewhat like the Christian religion, which also has, not only a God afar off, but also a God at hand. Scripture teaches us that God dwelt among the cherubim in the days of old, Ps. 80:1; 99:1, etc. His presence was seen in clouds of fire and smoke, Gen. 15:17; Ex. 3:2; 19:9, 16 f.; 33:9; Ps. 78:14; 99:7, in stormy winds, Job 38:1; 40:6; Ps. 18:10–16, and in the gentle zephyr, 1 Kings 19:12. These appearances were tokens of God's presence, in which He revealed something of His glory. Among the Old Testament appearances that of "the Angel of the Lord" occupies a special place. This Angel was not a mere symbol, nor a created angel, but a personal revelation, an appearance of God among men. On the one hand He is distinguished from God, Ex. 23:20–23; Isa. 63:8, 9, but on the other hand He is also identified with Him, Gen. 16:13; 31:11, 13; 32:28, and other passages. The prevailing opinion is that He was the second Person of the Trinity, an opinion that finds support in Mal. 3:1. Theophany reached its highest point in the incarnation of the Son of God, in Jesus Christ, in whom the fulness of the Godhead dwelt bodily, Col. 1:19; 2:9. Through Him and the Spirit which He sent, God's dwelling among men is now a true spiritual reality. The Church is the temple of the Holy Spirit, 1 Cor. 3:16; 6:19; Eph. 2:21. But an even fuller revelation of this will follow, when the new Jerusalem descends out of heaven from God and the tabernacle of God is pitched among men, Rev. 21:2, 3.
  
                  b. Communications. In all religions we meet with the idea that the gods reveal their thoughts and will in some way. The usual representation is that they do this by means of natural phenomena, such as the constellation of the stars, the flight of birds, the intestines of sacrificial animals, and so on. But alongside of this there is another, according to which they do it through the mediation of men in the capacity of soothsayers, visionaries, interpreters of dreams, diviners, consulters with familiar spirits and others claiming special powers. In a parallel line of thought Scripture teaches us that God revealed His thoughts and His will in various ways. Sometimes He spoke with an audible voice and in human language, Gen. 2:16; 3:8–19; 4:6–15; 6:13; 9:1, 8, 12; 32:26; Ex. 19:9 f.; Deut. 5:4, 5; 1 Sam. 3:4. In other cases He adapted Himself to the use of forms that were rather common among the nations, as the lot and Urim and Thummim. The dream was a very common means of revelation, Num. 12:6; Deut. 13:1–6; 1 Sam. 28:6; Joel 2:28, and was used repeatedly in revelations to non-Israelites, Gen. 20:3–6; 31:24; 40:5; 41:1–7; Judg. 7:13; Dan. 2; 4:4 ff; Matt. 2:12. A closely related but higher form of revelation was the vision. It was in this form that the Lord often revealed Himself to the prophets. As a rule they did not receive these visions while they were in a state of ecstasy, in which their own mental life was held in abeyance, but in a state in which their intelligence was fully alert. In some cases the visions seem to have been objective, but in others they were clearly subjective, though not the products of their own minds, but of a supernatural factor. In distinction from the true prophets, the false prophets brought messages out of their own hearts. The following are some of the passages that speak of this form of revelation, Isa. 1:1; 2:1; 6:1; Jer. 1:11; Ezek. 8:2; Dan. 7:2, 7; 8:1, 2; Amos 7:1; 8:1; 9:1; Zech. 1:8, 18; 2:1; 3:1. Most generally, however, God revealed Himself to the prophets by some inner communication of the truth, of which the method is not designated. After the prophets received their revelations of God, they in turn communicated them to the people, and habitually designate their message to the people as debhar Yahweh, the Word of God. In the New Testament Christ appears as the true, the highest, and, in a sense, the only prophet. As the Logos He is the perfect revelation of God, Himself the source of all prophecy, and as the Mediator He receives the fulness of the Spirit in preparation for His prophetic work, John 3:34. He communicated the Spirit to His disciples, not only as the Spirit of regeneration and sanctification, but also as the Spirit of revelation and illumination, Mark 13:11; Luke 12:12; John 14:17; 15:26; 16:13; 20:22; Acts 6:10; 8:29.
  
                  c. Miracles. Finally, we also find in all religions a belief in the special intervention of the gods in times of need. The practice of magic is widespread, in which men seek to make the divine power subservient to them by the use of mysterious means, such as sacred words, magic formulas, amulets, and so on. Little understood powers of the human soul were often applied to the performance of so-called miracles. At the present day we often see the operation of these occult powers in spiritualism, theosophy, telepathy, and hypnotism. Scripture clearly testifies to the fact that God also revealed Himself in miracles. That miracles are also regarded in Scripture as means of revelation, is evident from the following passages: Deut. 4:32–35; Ps. 106:8; John 2:11; 5:36; 10:37, 38; Acts 4:10. Word-and fact-revelation go hand in hand in the Bible, the former explaining the latter, and the latter giving concrete embodiment to the former. It is especially from this point of view that the miracles of Scripture should be studied. They are designated by various names. Sometimes they are called niphla'oth, mophthim, Gr. terata, names which point to the unusual in the miracle, that which fills men with amazement. Again, they are called gebhuroth, ma'asim, Gr. dunameis, to indicate that they are revelations of a special power of God. Finally, they are also designated as'othoth, Gr. semeia, since they are signs of a special presence of God and often symbolize spiritual truths. The miracles are founded in the creation and preservation of all things, which is a perpetual miracle of God. At the same time they are made subservient to the work of redemption. They serve repeatedly to punish the wicked and to help or deliver the people of God. They confirm the words of prophecy and point to the new order that is being established by God. The miracles of Scripture culminated in the incarnation, which is the greatest and most central miracle of all. Christ Himself is the miracle in the most absolute sense of the word. In Him creation is again brought back to its pristine beauty, for His work results in the apokatastasis or restoration of all things, Acts 3:21.
  
                  3. THE CONTENTS OF SPECIAL REVELATION. It goes without saying that the knowledge of God forms the content of special revelation. In the nature of the case all revelation of God is self-revelation. God reveals Himself in nature and history, but the study of these is not necessarily theology, since both can be studied simply as they are in themselves, apart from their revelational implications. It is only when they are contemplated in relation to God and considered sub specie aeternitatis, that they assume the character of a revelation and enable us to know something of God. God is also the content of special revelation. The difference between general and special revelation does not primarily consist in this that the latter, in distinction from the former, is in all its parts and in every way strictly supernatural, but more particularly in this that it is a revelation of the gratia specialis, and therefore gives rise to the Christian religion of redemption. It is a revelation of the way of salvation. While general revelation gives prominence to the theiotes (Rom. 1:20), the divine greatness of God, His absolute power and infinite wisdom, special revelation reveals with increasing clearness the triune God in His personal distinctions, and the divine economy of redemption. It reveals a God who is on the one hand holy and righteous, but on the other hand also merciful and gracious. Three points deserve particular attention in connection with special revelation.
  
                  a. It is a historical revelation. The content of special revelation was gradually unfolded in the course of the centuries. This is clearly demonstrated in the historia revelationis, sometimes called Biblical Theology. This study shows that special revelation is controlled by a single thought, namely, that God graciously seeks and restores fallen man to His blessed communion. There is a constant coming of God to man in theophany, prophecy, and miracle, and this coming reaches its highest point in the incarnation of the Son of God, which in turn leads to the indwelling of the Holy Spirit in the Church. The divine telos, towards which the whole of revelation moves, is described in Rev. 21:3: "Behold, the tabernacle of God is with men, and He shall dwell with them, and they shall be His peoples, and God Himself shall be with them and be their God."
  
                  b. It is both word and fact-revelation. The Socinians were undoubtedly wrong in holding that special revelation merely serves the purpose of furnishing man complete information respecting God and the duty of man; but Barth is equally wrong when he speaks as if the revelation of God is factual rather then verbal, and consists in redemptive acts rather than in a communication of knowledge. Special revelation does not consist exclusively in word and doctrine, and does not merely address itself to the intellect. This is more clearly understood at present than it was formerly. The Old Testament revelation is not found in the law and the prophets only, but also in theophany and miracle, and in the whole history of Israel. And in the New Testament Christ is not only prophet, but also priest and king. He is not merely the Word, but also the appearance and servant of God. He is the personal revelation of God's righteousness and holiness on the one hand, and of His mercy and grace on the other. And when the apostles enter the world with their message of redemption, not only their words, but also their charismatic gifts and miracles were revelations of God. The view, once widely held, that revelation consists exclusively in a communication of doctrine, was clearly one sided. At present, however, some go to the other extreme, equally one-sided, that revelation consists only in a communication of power and life. It finds expression in the familiar slogan, that "Christianity is not a doctrine, but a life."
  
                  c. It is a soteriological revelation. Special revelation is a revelation of salvation, and aims at the redemption of the entire man, both in his being and in his consciousness. This must be maintained over against a false intellectualism, which connects salvation with historical faith, as if the only thing that is necessary is the correction of the error, and the removal of the darkness, of the understanding. But in combatting this view, we should not go to the other extreme. Though God's special revelation is thoroughly soteriological this does not mean that it consists only in a communication of life. The entire man is corrupted by sin and needs redemption. Sin also includes the lie, the power of error, and the darkness of the understanding, and therefore revelation must also be a communication of truth. Not only grace, but also truth came by Jesus Christ, John 1:17. He is the way, because He is the truth and the life, John 14:6.
  
                  4. THE PURPOSE OF SPECIAL REVELATION. In speaking of the purpose of revelation we may distinguish between its final end and its proximate aim. The final end can only be found in God. God reveals Himself, in order to rejoice in the manifestation of His virtues, especially as these shine forth in the work of redemption and in redeemed humanity. The proximate aim of revelation, however, is found in the complete renewal of sinners, in order that they may mirror the virtues and perfections of God. If we bear in mind that revelation aims at the renewal of the entire man, we shall realize that it cannot seek the realization of its aim merely by teaching man and enlightening the understanding (Rationalism), or by prompting man to lead a virtuous life (Moralism), or by awakening the religious emotions of man (Mysticism). The purpose of revelation is far more comprehensive than any one of these, and even more inclusive than all of them taken together. It seeks to deliver from the power of sin, of the devil, and of death, the entire man, body and soul, with all his talents and powers, and to renew him spiritually, morally, and ultimately also physically, to the glory of God; and not only the individual man, but mankind as an organic whole; and mankind not apart from the rest of creation, but in connection with that whole creation, of which it forms an organic part. This purpose also determines the limits of special revelation. The historical process of revelation may be said to reach its end in a measure in Christ. Yet it does not end with the ascension of Christ. This is followed by the outpouring of the Holy Spirit and the special operation of gifts and powers under the guidance of the apostolate. Such a continued revelation was necessary, in order to ensure special revelation a permanent place in the midst of the world, and that not only in Scripture, but also in the life of the Church. But after the revelation in Christ, appropriated and made effective in the Church, has thus been introduced into the world, a new dispensation begins. Then special revelation ceases and no new constitutive elements are added. The work of Christ in furnishing the world with an objective revelation of God is finished. But the redemption wrought by Christ must still be applied, and this requires a constant operation of the Holy Spirit, always in connection with the objective revelation, for the renewal of man in his being and consciousness. By the Spirit of Christ man is led to accept the truth revealed in Scripture, and becomes a new creature in Christ Jesus, making God's revelation the rule of his life, and thus aiming at the glorification of God. This representation is not in harmony with that of the Theology of Crisis, except in that which is said respecting the purpose of revelation. Says Barth: "The revelation, Jesus Christ, is the work in which God Himself restores the shattered order of the relation between Himself and man. We must always apprehend the revelation as this work of restoration, whether we seek to apprehend it relatively to its essence or its tokens. A shattered relation between God and man has to be restored; hence the work of God, if it is not to consist in abandoning man or in annihilating what He has created, must consist in revelation." Neither Barth nor Brunner believe in a completed, and now objectively existing, revelation. They stress the fact that revelation is simply God speaking, and at the same time, creatively, eliciting from man the desired response. The response is wrought in man by the Holy Spirit through the word of revelation itself. Without it there is no revelation, though there are tokens of it. The word of revelation was addressed to prophets and apostles in the days of old, and is still addressed to men up to the present time, and may in that sense be called continuous, or, perhaps better, frequentative. The revelation is never completed and never becomes an object on which man can lay hold. This refusal to ascribe to the divine revelation an objective character seems to be based fundamentally on an idealistic conception of an object. "An object," says Brunner, "is what I can think myself; a subject is what I cannot think. In my thinking it becomes an object." To regard revelation as an object would seem to put man in control of it. The question may be raised, whether on this view God's revelation is not in the last analysis simply equivalent to the calling of God in Christ Jesus, made effective by the Holy Spirit. If this is really what is meant, it naturally follows that is continues up to the present time.
  
                  QUESTIONS FOR FURTHER STUDY: What is the relation between religion and revelation? In how far can we maintain that all religion originates in revelation? Why is it better to speak of general and special, than of natural and supernatural, revelation? Can the necessary manifestations of God as the ground of all existing things, or as the indwelling spirit in all creation, properly be called revelation? What is included in what is generally called natural revelation? Is this revelation static or progressive? Is there any such thing as a pure mind, which may serve as an undimmed mirror of natural revelation? How do they who apply the doctrine of evolution to the history of revelation conceive of what we call special revelation? How do the Gentiles testify to the need of special revelation? Does the existence of revelation depend on its subjective apprehension?
  
                  REFERENCES: Bavinck, Geref. Dogm. I, pp. 291–369; Kuyper, Enc. der Heil. Godgel., II, pp. 205–241; Warfield, Revelation and Inspiration, pp. 3–49; Orr, Revelation and Inspiration, pp. 1–154; Mead, Supernatural Revelation, pp. 1–278; Fisher, Nature and Method of Revelation, pp. 1–86; Ladd, The Doctrine of Sacred Scriptures II, pp. 302–451; Smith, Introduction to Chr. Theol., pp. 84–187; Ewald, Revelation, Its Nature and Record, pp. 1–299; Given, Revelation, Inspiration, and the Canon, pp. 9–103; McGregor, The Revelation and the Record; Sabatier, Outlines of a Philosophy of Religion, pp. 32–66; Baillie, The Interpretation of Religion, pp. 71–76, 449–470; id., Our Knowledge of God, pp. 3–43; Dickie, Revelation and Response; Lewis, A Philosophy of the Christian Revelation; Camfield, Revelation and the Holy Spirit (Barthian); Barth, The Doctrine of the Word of God; Brunner, The Word and the World; Revelation (edited by Baillie and Martin); Gilson, Reason and Revelation in the Middle Ages. The Word of God and the Reformed Faith. pp. 51–79, 102–111.
              - d-special-revelation-and-scripture: |-
                  D. Special Revelation and Scripture
  
                  1. HISTORICAL VIEWS OF THE RELATION BETWEEN THE TWO.
  
                  a. In the patristic period. The Gnostics and Marcion had erroneous views respecting the Bible, but the early Church Fathers regarded it in all its parts as the revealed Word of God. They frankly spoke of it as inspired, but did not yet have a clear conception of its inspiration. Justin and Athenagoras clearly thought of the writers as passive under the divine influence, and compared them to a lyre in the hands of a player. Clement of Alexandria and Tertullian asserted that both the Old and the New Testament were equally inspired, and as such constituted the infallible Word of God. Eusebius regarded it as presumptious to admit the possibility of error in the sacred books; and Augustine said that the apostles wrote what Christ dictated. Chrysostom called the prophets "the mouth of God," and Gregory the Great spoke of the Holy Spirit as the real author of Scripture. All this goes to show that these Church Fathers regarded the Bible as the Word of God, and therefore identified it with the divine revelation.
  
                  b. During the Middle Ages. The firm belief in the Bible as the Word of God was not shaken during the Middle Ages. At the same time the thought was developed that there is not only a written, but also an oral, revelation of God. The idea of an apostolic tradition, handed down from generation to generation, gradually gained currency. This tradition was considered necessary for the establishment of the authority of Scripture, and for the determination of its proper meaning. It was said that without the guidance of tradition Scripture could be made to speak in so many discordant ways that its authority was destroyed altogether. The development of this theory was detrimental to the proper conception of Scripture. It is true, the Bible was still regarded as the infallible Word of God, but its authority and proper meaning was made dependent on tradition, and that means, on the Church. The importance ascribed to so-called apostolic tradition even involved a denial of the absolute necessity, the sufficiency, and the perspicuity of the Bible.
  
                  c. At the time of the Reformation. The Reformers took position over against the Roman Catholic Church on this point. When they spoke of the Word of God, they had the Bible, and the Bible only, in mind. They rejected the authority of what was called apostolic tradition, and acknowledged the Bible only as the final authority and the absolute norm in all matters of faith and conduct. Instead of admitting its dependence on the testimony of the Church, they boldly declared its autopistia. Though they did not yet develop the doctrine of inspiration as fully as it was developed by seventeenth century theologians, it is quite evident from their writings that they regarded the whole Bible as the inspired Word of God in the strictest sense of the word. Though it has often been said by liberal theologians that they drew a distinction between the divine revelation and Scripture, and conceived of the former, not as identical with, but as contained in, the former; and though this view is now echoed by the representatives of the Theology of Crisis in a slightly different way,—this contention cannot bear close scrutiny. On the basis of their writings it must be maintained that the Reformers identified the divine revelation and Scripture. It was especially in the seventeenth century that the doctrine of the perfections of Scripture was developed.
  
                  d. In modern theology. Under the influence of Rationalism strong opposition arose to the strict conception of the Bible as the infallible Word of God. Various philosophical and scientific, critical and historical, studies served to undermine the prevalent belief in the supernatural, and therefore also the doctrine of the divine inspiration of Scripture. The old conception of the Bible as the infallible Word of God was brushed aside as untenable, and several other views of it were suggested as alternatives, but not a single one of them has been able to entrench itself in the hearts and minds of Christian people in general. For a time the idea was rather popular that the Bible is partly human and partly divine, and it became rather popular to say that the divine revelation is contained in the Bible, and that parts of the Bible are therefore inspired. But it soon became evident that it was impossible to say where the divine ended and the human began, or what parts of the Bible were, and what parts were not, inspired. Others discarded the idea of inspiration and simply regarded the Bible as the human record of a divine revelation. Idealistic philosophy, with its doctrine of the divine immanence, and the subjectivism of Schleiermacher, led to a new conception of both revelation and inspiration. Inspiration came to be regarded as a special divine illumination, differing only in degree from the spiritual illumination of Christians in general; and revelation, as the resulting heightened insight into the nature of things. This in course of time led on to a certain identification of revelation and human discovery. On this view the Bible becomes a record of rather exceptional human experiences,—a record which is purely human. The Theology of Crisis is an attempt to restore the idea of revelation as a supernatural act on the part of God to its rightful place. But it also disowns the doctrine of the infallible inspiration of Scripture, and therefore does not identify the revelation of God and the Bible. The Bible is merely a human witness to the divine revelation, which may, just because it witnesses to the revelation, be called the Word of God in a secondary sense.
  
                  2. THE REFORMED CONCEPTION OF THE RELATION BETWEEN THE TWO. According to the great Reformers of the sixteenth century the special revelation of God was given permanent form in Scripture. This idea is not in itself anything out of the ordinary. Among all cultured nations we find magical formulas, liturgical texts, ritual tracts, ceremonial laws, and historical and mythological literature, connected with their religious life. Several religions have holy books, to which divine authority is ascribed, and which serve as rules of doctrine and practice. Every prominent religion possesses a dogma which is expressed in language and assumes a permanent form in writing. Christianity forms no exception to the rule in that respect. It was of the utmost importance for the special revelation of God that it should be embodied in writing, because it was given in the course of many centuries and comprises deeds and events that are not repeated, but belong to the past, so that the knowledge of them would soon be lost in oblivion, if they were not recorded and thus preserved for posterity. And it was important that this knowledge should not be lost, since the divine revelation contains eternal truths, that are pregnant with meaning for all times, for all peoples, and under all circumstances. Therefore God provided for its inscripturation, so that His revelation now comes to us, not in the form of deeds and events, but as a description of these. In order to guard it against volatilization, corruption and falsification, He gave it permanent form in writing. From this it follows that there is a very close connection between special revelation and Scripture.
  
                  It should be pointed out, however, that the word 'revelation' is not always used in the same sense. It may serve to denote the direct, supernatural communications of God to man, which were far more frequent in the old dispensation than in the new, and culminated in the Word made flesh. If the word 'revelation' be understood in that sense, then it cannot be said that special revelation is identical with the Bible, but only that it is contained or recorded in the Bible. Scripture contains a great deal that was not so communicated by God. It should be borne in mind, however, that this does not justify the distinction, sometimes made in modern theology, between the Word of God as divine and its record as human. Neither does it warrant the unqualified statement that the Bible is not, but merely contains the Word of God. The terms 'Word of God' and 'special revelation' are also used in a sense in which they are identical with 'Scripture.' In most cases revelation or the direct self-communication of God preceded its inscripturation. The prophets usually received their communications some time before they committed them to writing, Jer. 25:13; 30:1, 2; 36:2. This is true of the apostles as well. When they received the highest revelation of God in Jesus Christ, they did not at once record it for future generations, but only after the lapse of several years, and even then they did not record everything that was revealed, John 20:30; 21:25. It may be that some things were revealed to them while they were writing. Moreover, in some cases men who received no direct revelations themselves yet recorded them for the future. In view of all this it may be said that there is a sense in which we must distinguish between special revelation and Scripture.
  
                  But the term 'revelation' may also be used in a broader sense. It can be applied to that whole complex of redemptive truths and facts, which is recorded in Scripture and has its guarantee as a divine revelation in the fact that the whole of Scripture is infallibly inspired by the Holy Spirit. In that sense the entire Bible from Genesis to Revelation, and it only, is for us God's special revelation. It is only through Scripture that we receive any knowledge of the direct revelations of God in the past. We know absolutely nothing about God's revelations among Israel through the prophets and finally in Christ, except from the Bible. If this is set aside, we abandon the whole of God's special revelation, including that in Christ. It is only through the word of the apostles that we can have communion with Christ. Consequently, it is unthinkable that God gave a special revelation and then took no measures to preserve it inviolate for coming generations. Scripture derives its significance exactly from the fact that it is the book of revelation. By means of Scripture God constantly carries His revelation into the world and makes its content effective in the thought and life of man. It is not merely a narrative of what happened years ago, but the perennial speech of God to man. Revelation lives on in Scripture and brings even now, just as it did when it was given, light, life, and holiness. By means of that revelation God continues to renew sinners in their being and consciousness. Scripture is the Holy Spirit's chief instrument for the extension and guidance of the Church, for the perfecting of the saints, and for the building up of the body of Jesus Christ. It forms a lasting bond of union between heaven and earth, between Christ and His Church, and between God and His people. In it we hear ever anew the voice of God, for it remains the inspired Word of God. And it will not have served its purpose fully until the new creation is completed, when all the children of God will be inspired and will all be fully taught of the Lord.
              - a-the-doctrine-of-inspiration-in-history: |-
                  A. The Doctrine of Inspiration in History
  
                  Revelation and inspiration stand in the closest possible relation to each other. As far as special revelation is concerned, it may be said that the one is inconceivable without the other. Peter tells us that "no prophecy ever came by the will of man: but men spake from God, being moved by the Holy Spirit." 2 Pet. 1:21. The recognition of the Bible as the special revelation of God depends on the conviction that its authors were inspired by the Holy Spirit. But, however closely related the two may be, they should not be identified. Dr. Hodge correctly calls attention to the fact that they differ both as to their object and in their effects. "The object or design of revelation is the communication of knowledge. The object or design of inspiration is to secure infallibility in teaching.… The effect of revelation was to render its recipient wiser. The effect of inspiration was to preserve him from error in teaching." The doctrine of inspiration was not always held in the same form, and therefore a brief statement of its history would seem to be desirable.
  
                  1. BEFORE THE REFORMATION. In a sense it may be said that this doctrine had no history before the Reformation, because it remained essentially the same from the first century down to the sixteenth. Nevertheless it will serve a useful purpose to call specific attention to the fact that throughout all these centuries the Church stood firm in the conviction that the Bible is the inspired, and therefore infallible, Word of God. It is a well known fact that the Jews held the strictest view of inspiration. They regarded first of all the Law as divinely and infallibly inspired, and therefore ascribed to it absolute divine authority, and afterwards ascribed the same inviolable character and authority to the Prophets and the Holy Writings. This view passed right over into the Christian Church. Even liberal scholars, who reject that strict view of inspiration, feel constrained to admit that Jesus and the New Testament writers also held the same view. The early Church Fathers had the same exalted view of the Bible, as appears abundantly from their writings. Sanday admits that from the very first they are found using expressions, which even point to verbal inspiration. Some of their expressions certainly seem to suggest that the writers of the books of the Bible were passive under the influence of the Holy Spirit, and therefore point to a mechanical conception of inspiration. But Dr. Orr calls attention to the fact that the general trend of their teaching shows that it was not their intention to teach a doctrine of inspiration, which involved the suppression of the human consciousness, that Origen contended against such a view, and that Montanism, which held it, was condemned by the Church. Between the time of the early Church Fathers and that of the Reformation the prevailing opinion in the Church did not differ essentially from that previously held. The Scholastics shared the common conviction of the Church, and merely tried to give a more precise definition of some of the details of the doctrine of inspiration. It must be admitted, however, that equal inspiration was ascribed to apostolic tradition, and that in practice this tended to weaken the consciousness of the absolute authority of the written Word of God. Moreover, there were some Mystics, who gloried in a special illumination and in revelations of the divine presence within, and manifested a tendency to undervalue the supernatural inspiration of the writers of the Bible, and to reduce it to the level of that gracious inner teaching which all Christians alike enjoyed. But their subjectivism did not seriously affect the view that was held in the Church at large.
  
                  2. AFTER THE REFORMATION. It has become quite the vogue with those who are opposed to what Dr. Warfield calls "the church-doctrine of inspiration," to saddle their own loose views on the great Reformers of the sixteenth century. They find in the works of Luther and Calvin a few expressions which seem to reflect a certain freedom in dealing with canonical questions, and then hastily conclude from this that these great men did not share the current doctrine of inspiration. But why should they rely on mere inferences, when these great Reformers use several expressions and make many plain statements, which are clearly indicative of the fact that they held the strictest view of inspiration, and that this view was not at all, as the opponents claim, an invention of Protestant Scholasticism in the seventeenth century. They even speak of the Holy Spirit as the author of every part of Scripture, and of the human writers as having written what was dictated to them. Such expressions had been common from the earliest times. At the same time it is quite evident from their teachings in general that inspiration, as they conceived of it, did not suppress the individuality and the intellectual activity of the human authors. Seeberg speaks of Calvin as the author of the strict, seventeenth century view of inspiration. The only difference on this point between the Reformers and the following generation of theologians is, that the latter made the subject of inspiration an object of special study and worked it out in details, and that some manifested a tendency to "reduce the inspired man, when under the influence of the Spirit, to the level of an unconscious and unintelligent instrument." (Bannerman) This tendency also found expression in one of the Confessions, namely, the Formula Consensus Helvetica, drawn up in 1675 in opposition to the loose views of the school of Saumur. This Confession never found wide acceptance as an ecclesiastical standard.
  
                  At a later date, however, when Rationalism made its influence felt, Le Clerc (1657–1736) impugned the strict infallibility of Scripture and asserted the existence of errors in the record, and many of the apologists, who took up the defense, admitted his contentions and felt constrained to have recourse to the theory of an inspiration, differing in degrees in various parts of the Bible, and thus allowing for imperfections and errors in some portions of Scripture. This was a theory that allowed of various modifications. One of these, which enjoyed considerable popularity for a while, was the theory of a partial inspiration, that is, an inspiration limited to parts of the Bible, but it soon became evident that it was impossible to reach a unanimous opinion as to the exact extent of inspiration. Since this view will be discussed later on, it is not necessary to enlarge upon it here.
  
                  A radically different theory owes its origin especially to Schleiermacher. In distinction from the theory of partial inspiration, which at least ascribed strict inspiration to some parts of Scripture, it altered the character of inspiration altogether by excluding the supernatural element. It held inspiration to be (to express it in the words of Bannerman) "the natural, or at most the gracious, agency of God illuminating the rational or the spiritual consciousness of a man, so that out of the fulness of his own Christian understanding and feelings he may speak or write the product of his own religious life and beliefs." Here inspiration is changed to a divine illumination, differing only in degree from that of Christians in general. The special, supernatural and miraculous operation of the Holy Spirit, is superseded by one of His ordinary operations in the lives of believers. Many of the works on inspiration, written since the days of Schleiermacher are simply variations on this general theme. Some, such as Wegscheider and Parker, went even farther, and spoke of a purely natural operation, common to all men. Such works as those of Lee, Bannerman, McIntosh, Patton, Orr, Warfield, and others naturally form exceptions to the rule. Sad to say, Barth and Brunner also reject the doctrine of the infallible inspiration of Scripture, and regard it as a product of Protestant Scholasticism. Their own views still await clarification.
              - b-scriptural-proof-for-the-inspiration-of-the-bible: |-
                  B. Scriptural Proof for the Inspiration of the Bible
  
                  The question arises, whether the record of the divine revelation, as well as the revelation itself, is from God, or whether God, after giving the revelation of redemption, simply left it to man to record this as best he could. Have we in Scripture a merely human or a divinely inspired record? And if God's special revelation was given by inspiration, how far does that inspiration extend? In seeking an answer to these and other similar questions, we turn to Scripture itself. This will not seem strange in view of the fact that for us the Bible is the only principium cognoscendi externum of theology. Just as the Bible contains a doctrine of God and man, of Christ and redemption, it also offers us a doctrine concerning itself; and we receive this in faith on the basis of the divine testimony. In saying this, we do not mean to intimate that Scripture contains a clear-cut and well formulated dogma of inspiration, but only that it supplies all the data that are necessary for the construction of such a dogma. We shall consider the Scriptural proof for the inspiration of the authors of Scripture under two headings: (1) proof for their inspiration considered apart from their writing; and (2) proof for their inspiration in writing the books of the Bible.
  
                  1. PROOFS FOR THE INSPIRATION OF THE SECONDARY AUTHORS OF SCRIPTURE CONSIDERED APART FROM THEIR WRITING. It may be well to point out first of all that the secondary authors of Scripture were inspired as the organs of divine revelation, even apart from their activity in recording the special revelation of God. Then it will appear that inspiration was deemed necessary for the immediate purpose of revelation. We derive our proof in this respect primarily from prophecy, or what may be called the prophetic inspiration, but also in part from the apostolic inspiration.
  
                  a. Prophetic inspiration. Several points deserve attention here: (1) The nature of a prophet. There are two classical passages in the Bible, which shed light on the Biblical conception of a prophet, namely, Ex. 7:1 and Deut. 18:18. According to these passages a prophet is simply the mouthpiece of God. He receives a message from God, and is in duty bound to transmit it to the people. In his capacity as a prophet of the Lord, he may not bring a message of his own, but only the message which he receives from the Lord. It is not left to his own discretion to determine what he shall say; this is determined for him by his Sender. For the message divinely entrusted to him He may not substitute another. (2) The consciousness of the prophets. The prophets of Israel knew that they were called of the Lord at a certain moment, sometimes contrary to their own desire, Ex. 3:1, ff.; 1 Sam. 3; Isa. 6; Jer. 1; Ezek. 1–3. They were conscious of the fact that the Lord had spoken to them, and in some cases even knew that He had put His words into their mouth, Num. 23:5; Deut. 18:18; Jer. 1:9; 5:14. This consciousness was so strong that they even designated the time and place when and where the Lord spoke to them, and distinguished between times in which He did, and times in which He did not, speak to them, Isa. 16:13, 14; Jer. 3:6; 13:3; 26:1; 27:1; 33:1; Ezek. 3:16; 8:1; 12:8. Hence they also made a sharp distinction between what the Lord revealed to them and what arose out of the depths of their own hearts, Num. 16:28; 24:13; 1 Kings 12:33; Neh. 6:8. They accused the false prophets of speaking out of their own hearts, without being sent of the Lord, Jer. 14:14; 23:16, 26; 29:9; Ezek. 13:2, 3, 6. When they addressed the people, they knew that they were not bringing their own word, but the word of the Lord, and this because the Lord demanded it of them, Jer. 20:7–9; Ezek. 3:4 ff.; Amos 3:8; Jonah 1:2. (3) The prophetic formulae. The prophetic formulae were also very significant in this respect. They were in themselves clear indications of the fact that the prophets were conscious of bringing a message that was inspired by the Lord. There is quite a variety of these formulae, but they all agree in ascribing the initiative to the Lord. The faithful watchmen on the walls of Zion were deeply impressed with the fact that they received the word, with which they came to the people, at the mouth of the Lord. They were ever mindful of the word of the Lord to Ezekiel: "Son of man, I have made thee a watchman unto the house of Israel: therefore hear the word at my mouth, and give them warning from me." Ezek. 3:17. Moreover, they clearly wanted the people to understand this. Such formulae as the following testify to this: "Thus saith the Lord," "Hear the word of the Lord," "The word that came to … from the Lord," "Thus the Lord showed me," "The burden of the word of the Lord." (4) Failure to understand their own message. The fact that the prophets sometimes failed to understand the message which they brought to the people, also goes to show that it came to them from without, and did not arise out of their own consciousness. Daniel brought a message which was entrusted to him, but declares that he did not understand it, Dan. 12:8, 9. Zechariah saw several visions, which contained messages for the people, but needed the help of an angel to interpret these for him, Zech. 1:9; 2:3; 4:4. And Peter informs us that the prophets, having brought their message respecting the sufferings and the following glory of Christ, often searched into the details of it, in order that they might understand it more clearly, 1 Pet. 1:10, 11.
  
                  b. Apostolic inspiration. The operation of the Holy Spirit after the day of Pentecost differed from that which the prophets in their official capacity enjoyed. The Holy Spirit came upon the prophets as a supernatural power and worked upon them from without. His action on them was frequently repeated, but was not continuous. The distinction between His activity and the mental activity of the prophets themselves was made to stand out rather clearly. On the day of Pentecost, however, He took up His abode in the hearts of the apostles and began to work upon them from within. Since He made their hearts His permanent abode, His action on them was no more intermittent but continuous, but even in their case the supernatural work of inspiration was limited to those occasions on which they served as organs of revelation. But because of the more inward character of all the Spirit's work, the distinction between His ordinary and His extraordinary work was not so perceptible. The supernatural does not stand out as clearly in the case of the apostles, as it did in the case of the prophets. Notwithstanding this fact, however, the New Testament contains several significant indications of the fact that the apostles were inspired in their positive oral teachings. Christ solemnly promised them the Holy Spirit in their teaching and preaching. Matt. 10:19, 20; Mark 13:11; Luke 12:11, 12; 21:14, 15; John 14:26; 15:26; 16:13. In the Acts of the Apostles we are told repeatedly that they taught "being full of," or "filled with," the Holy Spirit. Moreover, it appears from the Epistles that in teaching the churches they conceived of their word as being in very deed the word of God, and therefore as authoritative, 1 Cor. 2:4, 13; 1 Thess. 2:13.
  
                  2. PROOFS FOR THE INSPIRATION OF THE SECONDARY AUTHORS IN WRITING THE BOOKS OF THE BIBLE. The guidance of the Holy Spirit was not limited to the spoken word, but also extended to the written word. If God deemed it necessary to guide prophets and apostles in their oral teaching, which was naturally limited to their contemporaries, it would seem to follow as a matter of course that He would consider it far more important to ensure them of divine guidance in committing His revelation to writing for all following generations. It is only in its written form that the Word of God is known in the world, and that His revelation is the continuous speech of God to man. And there are several indications in the New Testament that He did so guide the apostles. These are contained in certain general pehnomena, and in some direct assertions.
  
                  a. Certain general phenomena. (1) Commands to write the word of the Lord. Repeatedly the writers of the Old Testament are explicitly commanded to write what the Lord reveals unto them, Ex. 17:14; 34:27; Num. 33:2; Isa. 8:1; 30:8; Jer. 25:13; 30:2; 36:2, 27–32; Ezek. 24:1 f.; Dan. 12:4; Hab. 2:2. Some prophecies were evidently not intended to be spoken, but to be written for the careful consideration of the people, Jer. 29; 36:4ff., 27ff.; Ezek. 26; 27; 31; 32; 39. In such cases the prophetic formulae naturally also refer to the written word. (2) Suppression of the human factor. In many of the prophecies the divine factor, as it were, overpowers the human. The prophetic word begins by speaking of God in the third person, and then, without any indication of a transition, continues in the first person. The opening words are words of the prophet, and then all at once, without any preparation of the reader for a change, the human author simply disappears from view, and the divine author speaks apparently without any intermediary, Isa. 10:12; 19:1, 2; Hos. 4:1–6; 6:1–4; Mic. 1:3–6; Zech. 9:4–6; 12:8, 9. Thus the word of the prophet passes right into that of the Lord without any formal transition. The two are simply fused, and thus prove to be one. Some passages clearly indicate that the word of the Lord and that of the prophet are equally authoritative, Jer. 25:3; 36:10, 11. Isaiah even speaks of his own written prophecies as "the book of Jehovah." 34:16. (3) The designation of the Old Testament as he graphe or hai graphai. In the New Testament we find that the Lord and the apostles, in their appeal to the Old Testament, frequently speak of it as he graphe (a term sometimes applied to a single passage of Scripture, Mark 12:10; Luke 4:21; John 19:36), or as hai graphai in view of the fact that it consists of several parts, Luke 24:27; Rom. 1:2. Cf. also ta hiera grammata in 2 Tim. 3:15. They evidently regarded this collection as authoritative. An appeal to it was equivalent to "God says," as appears from the fact that the formula he graphe legein (the Scripture says) is used interchangeably with others, which clearly indicate that what is quoted is the Word of God, and from cases in which the word quoted is really spoken by God in the Old Testament, Rom. 9:15–17; Gal. 3:8. (4) Formulae of quotation. The Lord and His apostles do not always use the same formula in quoting the Old Testament. Sometimes they simply say, "It is written," Matt. 4:4; John 6:45, or "Scripture says," Rom. 4:3; Gal. 4:30. In some cases they mention the human author, Matt. 15:7; 24:15, but frequently they name the primary author, that is, God or the Holy Spirit, Matt. 15:4; Heb. 1:5 ff.; 3:7. Paul in some cases personifies Scripture, so that it is represented as identical with God, Rom. 9:17; Gal. 3:8, 22; 4:30; cf. also Rom. 4:3; 10:11; 11:2; 1 Tim. 5:18. The writer of the Epistle to the Hebrews usually names the primary author, 1:5 ff.; 3:7; 4:3; 5:6; 7:21; 8:5, 8; 10:15, 16.
  
                  b. Direct assertions. There are several passages in which the divine authority of the Old Testament is clearly asserted, Matt. 5:17; Luke 16:17, 29, 31; John 10:35; Rom. 15:4; 1 Pet. 1:10–12; 2 Pet. 1:19, 21. This is true especially of the locus classicus, 2 Tim. 3:16: "All (every) Scripture is given by inspiration of God, and is profitable for teaching, for reproof, for correction, for instruction which is in righteousness." We read here in the original: Pasa graphe theopneustos kai ophelimos pros didaskalian, etc. This passage has been interpreted in various ways, and that not infrequently with the scarcely concealed intention of destroying its evidential value. On the basis of transcriptional evidence some proposed to leave out the word kai, but the weight of evidence clearly favors its retention. Because pasa stands without the article, some insist on translating pasa graphe by "every Scripture"; but such passages as Matt. 2:3; Acts 2:36; Eph. 2:21; 4:16; 1 Pet. 1:15, bear evidence of the fact that the word pas may mean "all" in the New Testament even when the article is wanting. Materially, it makes very little difference, whether we read "all Scripture," or "every Scripture," since the expression certainly refers back to ta hiera grammata in the 15th verse, and this serves to designate the Old Testament writings. There is also a strong tendency (cf. even the Am. Rev. Version) to regard theopneustos, not as the predicate, but as a part of the subject, and therefore to read: "All (or, "every") scripture inspired of God is also profitable for teaching," etc. But it would seem that, if it were so intended, the verb estin should have been used after ophelimos, and there is no good reason why kai should have been used before it. There is nothing that compels us to depart from the usual interpretation of the passage. In connection with this statement of Paul, the word of Peter in 2 Pet. 1:21 deserves special attention: "For no prophecy ever came by the will of man, but men spake from God being moved by the Holy Spirit." The writers of the New Testament were conscious of the guidance of the Holy Spirit in their writing, and therefore their written productions are authoritative, 1 Cor. 7:10; 2 Cor. 13:2, 3; Col. 4:16; 1 Thess. 2:13; 2 Thess. 3:14. Peter places the Epistles of Paul on a level with the writings of the Old Testament, 2 Pet. 3:15, 16. And Paul himself says: "If any man thinketh himself to be a prophet, let him take knowledge of the things which I write unto you, that they are the commandments of the Lord." 1 Cor. 14:37.
              - c-nature-and-extent-of-its-inspiration: |-
                  C. Nature and Extent of Its Inspiration
  
                  There has been no general agreement as to the nature and extent of the inspiration of Scripture, and with a view to a proper understanding of these, it may be well to consider the most important views that were held in course of time.
  
                  1. THE NATURE OF INSPIRATION. In dealing with the nature of inspiration, we shall consider first of all two erroneous views, which represent opposite extremes, and then state what we consider to be the correct view.
  
                  a. Mechanical inspiration. There is a rather common misunderstanding, against which we must be on our guard. It is often represented as if verbal inspiration were necessarily mechanical, but this is not the case. The two terms are certainly not synonymous, for they refer to different aspects of the work of inspiration, the one being an indication of the extent, and the other, of the nature of inspiration. And while it is true that mechanical inspiration is from the nature of the case verbal, it is not true that verbal inspiration is necessarily mechanical. It is quite possible to believe that the guidance of the Holy extended to the choice of the words employed, but was not exercised in a mechanical way. According to the mechanical view of inspiration God dictated what the auctores secundarii wrote, so that the latter were mere amanuenses, mere channels through which the words of the Holy Spirit flowed. It implies that their own mental life was in a state of repose, and did not in any way contribute to the contents or form of their writings, and that even the style of Scripture is that of the Holy Spirit. This theory has very unfairly and rather persistently been ascribed by its opponents to all those who believe in verbal inspiration, even after these have repeatedly disclaimed that view. It must be admitted that some of the early Church Fathers, the Reformers, and some Lutheran and Reformed theologians of the seventeenth century occasionally used expressions that savoured of such a view; but it should be added that their general teachings clearly show that they did not regard the writers of the Bible as mere passive instruments, but as real authors, whose intellectual powers were alert and operative and who gave expression also to their individuality in their writings. As far as the Reformers are concerned, this appears very clearly from the fact that many of those who do not believe in any real doctrine of inspiration, vie with each other in their attempts to prove that Luther and Calvin did not hold the strict view of inspiration which was current in the seventeenth century. The great historical Confessions, with the exception of the Formula Consensus Helvetica (1675) do not express themselves as to the precise nature of the inspiration of Scripture. The one Confession named comes closest to the presentation of a mechanical view of inspiration, but this Confession was recognized only by a few cantons in Switzerland, the land of its birth, and was even there set aside by a following generation. Moreover we should not lose sight of the fact that this Confession represents a reaction against the loose views on inspiration, which were sponsored by Cappelus of the school of Saumur. It may well be doubted, whether there ever has been a considerable number of Reformed theologians who consciously adopted a mechanical view of inspiration. This view is not found in our own Confessio Belgica, and is certainly not now the accepted doctrine of Reformed theology. Reformed theologians now generally have an organic conception of inspiration. They do not believe that the auctores secundarii of Scripture were mere passive instruments in the hand of God; that they were mere amanuenses who wrote what God dictated; that what they wrote did not in any sense of the word originate in their own consciousness; nor that their style in simply the style of the Holy Spirit. To the contrary, they adopt a view which recognizes them as real authors and does full justice to their personal share in the production of their writings.
  
                  b. Dynamical inspiration. If we desire on the one hand to avoid the mechanical view of inspiration, we are equally desirous, on the other hand, to steer clear of the so-called dynamical view. The term 'dynamic inspiration' is sometimes used to denote what we would call 'organic inspiration', but is employed here to designate the theory of inspiration that owes its inception to the teachings of Schleiermacher. This theory renounces the idea of a direct operation of the Holy Spirit on the production of the books of the Bible, and substitutes for it a general inspiration of the writers, which really amounts to nothing more than a spiritual illumination, differing only in degree from the spiritual illumination of Christians in general. Strictly speaking, it eliminates the supernatural, transforms the idea of inspiration, and transfers it from the intellectual to the moral sphere. The writers of the New Testament (the Old Testament is not even taken into consideration) were holy men, who moved about in the presence of Jesus and lived in the sphere of revelation, which naturally had a sanctifying influence on their character, thought, and speech. Says Ladd: "The general conception of inspiration is that of a divine influence coming like a breath of wind, or some other fluid, into the soul of man, and producing there a transformation."2 Bannerman correctly says that in Schleiermacher's theology inspiration is held to be "the natural, or at most the gracious, agency of God illuminating the rational or the spiritual consciousness of a man, so that out of the fulness of his own Christian understanding and feelings he may speak or write the product of his own religious life and beliefs." This view is entirely subjective, makes the Bible a purely human product, and allows for the possibility of errors in the Word of God. Inspiration so conceived was a permanent characteristic of the writers, and in so far naturally also influenced their writings, but was by no means a supernatural operation of the Holy Spirit, which served to qualify the writers for the specific task of committing the divine revelation to writing. It terminated on the writers rather than on their writings. While it naturally influenced their writings, it did not affect them all in the same measure. On the one hand the Bible contains the highest truths, but on the other hand it is still imperfect and fallible. This theory, which is also called the theory of spiritual insight or spiritual intuition, certainly does not do justice to the Scriptural data on inspiration. It robs the Bible of its supernatural character and destroys its infallibility.
  
                  c. Organic inspiration. The term 'organic inspiration' is also somewhat ambiguous, because some use it to designate what is usually called 'dynamic inspiration.' The term 'organic' serves to stress the fact that God did not employ the writers of the books of the Bible in a mechanical way, just as a writer wields a pen; did not whisper into their ears the words which He wanted them to write; but acted upon them in an organic way, in harmony with the laws of their own inner being. He used them just as they were, with their character and temperament, their gifts and talents, their education and culture, their vocabulary, diction, and style. He illumined their minds, prompted them to write, repressed the influence of sin on their literary activity, and guided them in an organic way in the choice of their words and in the expression of their thoughts. This view is clearly most in harmony with the representations of Scripture. It testifies to the fact that the writers of the books of the Bible were not passive but active. In some cases they searched out beforehand the things of which they wrote, Luke 1:1–4. The authors of the books of Samuel, Kings, and Chronicles repeatedly refer to their sources. The messages of the prophets are generally determined by historical circumstances, and the New Testament Epistles also have an occasional character. The psalmists often sing of their own experiences, of sin and forgiveness, Ps. 32 and 51, of surrounding dangers and gracious deliverances, Ps. 48 and 116. Each one of the writers has his own style. Alongside of the sublime poetry and poetical language of poets and prophets, we have the common prose of the historians; alongside of the pure Hebrew of Isaiah, the Aramaic-tinted Hebrew of Daniel; and alongside of the dialectic style of Paul, the simple language of John. The writers put on their literary productions their own personal stamp and the stamp of their times. Thus the Bible itself testifies to the fact that it was not mechanically inspired. The Holy Spirit used the writers as He Himself had formed them for their task, without in any way suppressing their personality. He qualified them and guided them, and thus inspired the books of Scripture organically.
  
                  2. THE EXTENT OF INSPIRATION. Different views were held in the course of history, not only respecting the nature of inspiration, but also as to its extent. The three views that come into consideration here especially may be designated as partial inspiration, thought inspiration, and verbal inspiration.
  
                  a. Partial inspiration. Under the influence of eighteenth century Deism and Rationalism lax views of inspiration were zealously propagated and found ready acceptance in the theological world, and in some cases even met with adherents in the Churches. Le Clerc, who was originally a Reformed theologian, but later on became an Arminian professor at Amsterdam, denied the inspiration of many of the historical portions of Scripture, resolved that of the apostles into a sort of spiritual enlightenment and a strengthening of the faculties of the soul, and limited that of the prophets to the time when they received their revelations. From his time on it became quite common for theologians, who desired to maintain the doctrine of inspiration, at least in some sense of the word, to speak of degrees of inspiration. They distinguished between the doctrinal and the historical portions of Scripture, and regarded the former, containing essential truths, with which the writers were made acquainted by revelation, as plenarily inspired; and the latter, containing non essential truths, of which the writers had knowledge apart from revelation, as only partially inspired, and as marred by inaccuracies and mistakes. There were also theologians, however, who were even more completely under the influence of Rationalism, and who accepted the idea of a partial inspiration devoid of supernaturalism. According to them the writers of the Bible simply enjoyed a special spiritual enlightenment and guidance, which offered no guarantee against all kinds of historical, chronological, archaeological, and scientific mistakes, but did make the writers reliable witnesses in moral and spiritual matters. Among those who adopt a partial inspiration of Scripture there is no unanimity whatsoever. Some would limit inspiration to doctrinal matters, others to the New Testament, others to the words of Jesus, and still others to the Sermon on the Mount. This shows as clearly as anything can that the theory is purely subjective, and lacks all objective basis. The moment one accepts it in any one of its many forms one has virtually lost one's Bible.
  
                  According to the Bible inspiration extends equally to all parts of the Word of God. The Law and the historical books, the Psalms and the Prophets, the Gospels and the Epistles,—they were all written under the guidance of the Holy Spirit, and are therefore all in the same measure he graphe. An appeal to any part of it, is an appeal to the Word of God, and therefore to God Himself. This is indicated in various ways. The Epistles of Paul are placed on a level with the writings of the Old Testament, which are clearly regarded as inspired and authoritative by Jesus and the apostles, 2 Pet. 3:15, 16. It should be noted that the New Testament contains quotations from twenty-five Old Testament books, and among these are several of a historical character, which in the estimation of some are least, if at all, inspired. The Lord Himself and the New Testament writers evidently regarded each one of these books as a part of he graphe, and ascribed to them divine authority. Moreover, there are several collective quotations, or catenae of quotations, that is, quotations gathered from several books, which are all advanced as equally authoritative to prove the same point, Rom. 3:10–18; Heb. 1:5–13; 2:12, 13. We cannot explain the interpenetration of the divine and the human factors in Scripture, any more than we can explain that of the two natures in Christ. Scripture presents itself to us as an organic whole, consisting of several parts, that are interrelated in various ways, and that find their unity in the central, all-controlling, and progressively unfolding, thought of God reaching out to man, in order to redeem him from sin and to bestow upon him the blessings of eternal salvation. And therefore we should not ask where the divine ends and the human begins, nor where the human ends and the divine begins. We might just as well ask where in man the soul ends and the body begins. No such line of demarcation can be pointed out. Scripture is in its entirety both the Word of God and the word of man.
  
                  b. Thought inspiration. Some who would defend the doctrine of inspiration against its complete denial, are of the opinion that the advocates of the doctrine should retrench somewhat, and speak of thought—rather than of word—inspiration. The thoughts, they say, were evidently divinely inspired, but the words in which they are clothed were freely chosen by the human authors, and that without any divine guidance. In that way they consider it possible to satisfy the requirements of the Biblical teaching respecting inspiration, and at the same time account for the imperfections and errors that are found in Scripture. But such an inspiration of thoughts without words is an anomaly, and is really inconceivable. Thoughts are formulated and expressed in words. Girardeau correctly remarks: "Accurate thought cannot be disjoined from language. Words are its vehicles both subjectively and objectively. When we think accurately and precisely, we think in words. To give the thought therefore, is to give the words." And Dr. Orr, who would himself rather speak of plenary than of verbal inspiration, admits that the latter name expresses a true and important idea, where it "opposes the theory that revelation and inspiration have regard only to thoughts and ideas, while the language in which these ideas are clothed is left to the unaided faculty of the sacred penman." Moreover, he says: "Thought of necessity takes shape and is expressed in words. If there is inspiration at all, it must penetrate words as well as thought, must mould the expression, and make the language employed the living medium of the idea to be conveyed."2 As we shall point out in the sequel, Scripture clearly teaches the inspiration of the words of Scripture.
  
                  c. Verbal inspiration. There are some who believe in the inspiration of every part of the Bible, but would rather not speak of verbal inspiration, because this is apt to suggest the mechanical idea that God dictated what the secondary authors wrote. They would prefer to use the term "plenary inspiration." Others, however, reject the idea of verbal inspiration altogether, because they do not believe in any plenary inspiration. It may be well therefore to call particularly attention to the Scriptural data on this point. (1) References to verbal communications. The Pentateuch repeatedly refers to verbal communications of the Lord. The expressions, "The Lord said unto Moses" and "The Lord spoke unto Moses," serve so frequently to introduce a written message, that they almost have the force of a formula, Ex. 3 and 4; 6:1; 7:1; 8:1; 10:1; 12:1; Lev. 1:1; 4:1; 6:1, 24; 7:22, 28; 8:1; 11:1. The Lord certainly did not speak to Moses without words. The word of the Lord repeatedly came to Joshua in the same way, Jos. 1:1; 4:1; 6:2; 8:1. (2) Prophets are conscious of bringing the very words of the Lord. The prophets were conscious of the fact that the Lord spoke through them. Isaiah begins his prophecy with the words: "Hear, O heavens, and give ear, O earth, for Jehovah hath spoken, 1:2; and he and other prophets constantly use the well known prophetic formulae, "Thus saith the Lord" and, "Hear the word of the Lord." Jeremiah even says: "Then Jehovah put forth His hand, and touched my mouth; and Jehovah said unto me, Behold, I have put my words in thy mouth," 1:9. In Ezekiel we read: "Son of man, go, get thee unto the house of Israel, and speak with my words unto them.… Son of man, all my words that I shall speak unto thee receive in thy heart, and hear with thine ears. And go, get thee to them of the captivity, unto the children of thy people, and speak unto them, and tell them, Thus saith the Lord Jehovah," 3:4, 10, 11. It is not necessary to multiply the examples. (3) The apostles speak of the words of the Old Testament and of their own words as the words of God. Paul explicitly says that he gives instruction, not in words of his own choosing, but in Spirit-taught words, 1 Cor. 2:13, and claims that Christ is speaking in him, 2 Cor. 13:3. And in the Epistle to the Hebrews several words of the Old Testament are quoted, not as words of some human author, but as words of God, or of the Holy Spirit, 1:5 ff.; 2:11–13; 3:7; 4:4, 5, 7; 8:8; 10:15–17. (4) Arguments based on a single word. There are three cases in which Jesus and Paul base a whole argument on the use of a single word of the Old Testament, John 10:35; Matt. 22:43–45; Gal. 3:16. In doing this they give clear evidence of the fact that they regard the separate words as inspired and infallible, and that the readers share their conviction. If this were not the case, they would not have been able to consider their arguments as conclusive.
              - d-attempts-to-discredit-the-doctrine-of-inspiration: |-
                  D. Attempts to Discredit the Doctrine of Inspiration
  
                  Several attempts have been made to discredit or set aside the doctrine of inspiration. Of these the following may be considered as the most important.
  
                  1. THEY WHO DEFEND IT ARE REASONING IN A CIRCLE. We are often accused of reasoning in a circle, when we derive our proof for the inspiration of the Bible from Scripture itself. Because the Bible is true, we accept its testimony respecting its inspiration, and because it is inspired, we regard it as true. Apologetically, this argument can be met, and has frequently been answered. It is possible, for the sake of argument, to start out with the assumption that the books of the Bible are purely human productions, which, however, as the productions of eye-and ear-witnesses, which are known as men of high moral standing, can be regarded as entirely trustworthy. Then it can be shown that, according to these books, Christ and the apostles held the strictest view of the inspiration of the Old Testament. From that point it is quite possible to reach the conclusion that the Old Testament necessarily required a complement such as is found in the New Testament. And on the basis of this it can be said that therefore the whole Bible must be regarded as an inspired book. By reasoning in that fashion the circle is avoided. This line of argumentation is followed by Bannerman, Patton Warfield, Van Oosterzee, and others. But it is a question, whether the circle referred to is really as vicious as some would have us believe. Jesus evidently did not think so, when a similar objection was raised against His testimony concerning Himself as the incarnate Word of God, John 8:13 f. In social life people frequently move in the same circle. If they are firmly convinced that a person is thoroughly reliable and trustworthy, they do not hesitate to receive his testimony concerning himself and his actions, when others accuse him of deception and dishonesty. Girardeau pertinently remarks: "Suppose we should use the argument: God declares that He is true; therefore God is true. Here God's truth would be proved by His truth. Would that be a vicious reasoning in a circle? The atheist might say, You assume that there is a God of truth. So we do, and so do all sensible men." Through the testimony of the Holy Spirit in his heart the Christian stands in the unwavering faith that God is true in His revelation, and therefore it is a matter of course that he accepts the testimony of Scripture respecting itself.
  
                  2. JESUS DID NOT TEACH THE DOCTRINE OF INSPIRATION. Though modern liberal scholars generally admit that Jesus and the apostles accepted the Old Testament as the inspired Word of God, there are some among them who, in their denial of the doctrine of inspiration, appeal to Jesus as over against the apostles, and especially Paul. The apostles, they say, firmly believed that the writings of the Old Testament were written under inspiration. but Jesus did not share their opinion. And because they regard the testimony of Jesus as decisive, they feel justified in rejecting the doctrine of inspiration. But their fundamental assumption is contrary to the data of Scripture, and apart from these we have no knowledge of what Jesus thought on this subject. They point in quite another direction. The positive statements of Jesus respecting the abiding significance, authority, and inviolability of the Old Testament, Matt. 5:17, 18; 24:35; Luke 16:17; John 10:35. His quotations from it as an authoritative source, and His repeated use of it, leave no doubt as to the fact that He, as well as the apostles, recognized the divine authority of the Old Testament. Some who feel constrained to admit the force of the available evidence, but are not willing to draw the inevitable conclusion, seek refuge in the old accommodation theory of Semler. We fully agree with Dr. Burrell, when he says: "One thing is clear: when Jesus referred to the Scriptures as written by men under the influence of the Spirit, He separated those Scriptures generically from all other 'literature' whatsoever. To his mind, the inspiration of these writers was a singular sort of inspiration, which produced a singular book. In his teaching it is represented as the one book having authority." Moreover, it should be remembered that such a contradistinction between Jesus and the apostles as the opponents assume, in which the attempt is made to play off the former against the latter, is absolutely false, and results in the loss of the Word of God. We know nothing about Jesus save through the testimony of the apostles. He who discredits the apostles bars the way for himself and will never be able to discover what Jesus taught. He even contradicts Jesus, who appointed the apostles as faithful witnesses and promised them the Holy Spirit, to guide them in all the truth.
  
                  3. THE PHENOMENA OF SCRIPTURE CONTRADICT THE DOCTRINE OF INSPIRATION. Under the influence of historical criticism still another method has been employed to set aside the doctrine of inspiration. They who employ this method are, at least in some cases, willing to admit that the Bible teaches its inspiration, but at the same time maintain that a correct conception of this inspiration can be obtained only by taking account of the peculiar phenomena of Scripture, such as doublets, mistakes, contradictions, misapplied quotations, and so on. Only such a doctrine of inspiration can be regarded as true, which will enable one to account for all these phenomena. The reasoning of those who take this position often sounds very plausible. They do not want a theory of inspiration that is imposed on Scripture from without, but one that is based on an inductive study of the facts. But, however plausible this representation may seem, it does not fit the case. According to it man faces the phenomena of Scripture just as he faces the phenomena of nature and the facts of history, which he must interpret and set forth in their true significance. It loses sight of the fact that the Bible contains a very clear doctrine respecting itself, which man must accept with childlike faith. Even the phenomena of Scripture may not be cited as a witness against this testimony of Scripture. He who does this eo ipso rejects the authority of the Bible and virtually adopts a rationalistic standpoint. Instead of humbly accepting the testimony of Scripture, he places himself above it as judge, and opposes to the testimony of Scripture his own scientific insight. History clearly teaches us that the historical-critical method does not lead to a generally accepted and permanent result. The representations vary according to the different standpoint of the critics, and do not lead to a satisfactory doctrine of Scripture. It has already become abundantly evident that this method leads to various views of Scripture, which are absolutely contrary to the teachings of Scripture itself,—a veritable babel of confusion. Ladd, whom no one will accuse of being prejudiced in favor of a strict view of inspiration, says that, while the old conception of Scripture as the Word of God was brushed aside as untenable, and several other theories were suggested as alternatives, not a single one succeeded in entrenching itself in the hearts and minds of Christian people in general.
  
                  4. THE DOCTRINE OF INSPIRATION APPLIES ONLY TO THE AUTOGRAPHA, AND THEREFORE HAS NO REAL PRACTICAL VALUE. The fact that the doctrine of inspiration, as set forth in the preceding pages, applies only to the autographa (the original writings of the Biblical authors), which are no more in our possession, has led some to the rather hasty conclusion, that the problem of inspiration is of a purely academic character and has no practical bearing whatsoever. How can the inspiration of the originals be of any value for us, they ask, if we have in our possession nothing but defective manuscripts? They often give the impression that this renders the entire contents of Scripture uncertain, and that consequently no one can appeal to it as a divine and authoritative Word. But something may be said in answer to this. We would certainly expect that the Holy Spirit, who so carefully guided the writers of Scripture in the interest of future generations, would also guard and watch over His revelation, in order that it might really serve its purpose. Hence Reformed theologians have always maintained that God's special providence watched over Scripture. Inspiration naturally called for conservation. And history certainly favors this idea in spite of all the variations that exist.
  
                  If we bear in mind that there are more than 4000 Greek MSS. of the New Testament, and in addition to that 6000 MSS. of the Vulgate, and 1000 of other Latin translations, then we understand that it was practically impossible that Scripture should be lost to the world for centuries, just as many of the writings of the Church Fathers were. Then we also understand what Kenyon, an eminent authority on the subject, says: "The number of manuscripts of the New Testament, of early translations from it, and of quotations from it in the oldest writers of the Church is so large, that it is practically certain that the true reading of every doubtful passage is preserved in some one or other of these ancient authorities. This can be said of no other ancient book in the world." Textual errors did creep into the text in the course of frequent transcriptions, and the number of the existing variations even sounds very considerable. Nestle speaks of 150,000 in the New Testament, but adds that about nineteen-twentieths of these are devoid of real authority, and that of the remaining 7,500 nineteen-twentieths do not alter the sense of Scripture in any way. Moses Stuart points out that about ninety-five percent of all the existing variations have about as much significance as the question in English orthography, whether the word 'honour' should be spelled with or without the 'u'. According to Nestle there are about 375 variations that bear on the sense of Scripture, and even among these are several of little importance. While admitting the presence of variations, we should bear in mind what Moses Stuart says: Some change the sense of particular passages or expressions, or omit particular words or phrases; but no one doctrine of religion is changed, not one precept is taken away, not one important fact altered, by the whole of the various readings collectively taken."2 From the existence of these variations it does not follow that the doctrine of verbal inspiration has no practical value; but only that we do not know at present in what reading we have the Word of God on those particular points. The important fact remains, however, that apart from the relatively few and unimportant variations, which are perfectly evident, we are in possession of the verbally inspired Word of God. And therefore it is of great practical importance that we maintain the doctrine of verbal inspiration.
              - e-objections-to-the-doctrine-of-inspiration: |-
                  E. Objections to the Doctrine of Inspiration
  
                  Several objections have been raised against the doctrine of inspiration, and particularly against the doctrine of verbal inspiration, and it cannot be denied that some of them present real difficulties. It will not do to ignore them, nor to laugh them out of court. They deserve careful consideration and a more detailed discussion than we can devote to them here. We cannot even begin to discuss separate objections here with the necessary care. This must be left to works which deal exclusively with the doctrine of inspiration, such as Lee, The Inspiration of Scripture; Brannerman, The Inspiration of the Scriptures; and McIntosh, Is Christ Infallible and is the Bible True? We can only indicate the general nature of the objections, and give some general suggestions as to the way in which they can be met.
  
                  1. GENERAL NATURE OF THE OBJECTIONS. Some of the objections result from the application of the philosophy of evolution to the origin of the books of the Bible, a scheme which does not fit the facts, and is then made to militate against them. Their force naturally depends entirely on the truth or falsity of that philosophy. Others are derived from the supposed inner discrepancies that are found in Scripture as, for instance, between the numbers in Kings and Chronicles, between the account of Jesus' public ministry in the Synoptics and in the Gospel of John, and between the doctrine of justification in the Epistles of Paul and in the Epistle of James. Still others are drawn from the way in which the Old Testament is quoted in the New. The quotations are not always taken from the Hebrew, but frequently from the Septuagint, and are not always literal. Moreover, the quoted words are often interpreted in a way which does not seem to be justified by the context in which they are found in the Old Testament. There are objections, which result from a comparison of the Biblical narratives with secular history as, for instance, that of the taking of Samaria by Shalmanezer; that of Sennacherib's march against Jerusalem and the slaying of 185,000 Assyrians by an angel of the Lord; that of Esther's elevation to the position of queen; and that of the enrollment mentioned in the second chapter of Luke. Again, it is found that the miracles of Scripture cannot be harmonized with belief in the inflexible laws of nature. The narratives of these miracles are simply declared to be exaggerated, naive representations of historical events which made a deep imprssion, and after the lapse of years assumed the proportions of miracles in the consciousness of a credulous people. Some objections are the products of the moral judgment passed on Biblical injunctions and practices. Attention is called to the jus talionis in the law of Moses, to the polygamy that was prevalent among the Israelites, to the terrible scene of moral corruption in the last chapters of the book of Judges, to David's immorality, to the harem of Solomon, and so on. Finally, texual criticism also gives rise to objections. Scripture in its original text, we are told, is corrupt, and its translations are defective. The MSS. reveal all kinds of variations, which testify to the corruption of the original, and the translations are not always a correct representation of it.
  
                  2. GENERAL REMARKS ON THE OBJECTIONS RAISED. First of all the general remark must be made that, though we cannot ignore the objections that are raised but must take account of them, no one has the right to demand of us that we make our belief in the inspiration of Scripture contingent on our ability to remove all objections by solving the problems which they present. The objections raised do not constitute a sufficient reason for setting aside the doctrine of inspiration, which is clearly taught in Scripture. The doctrines of the Trinity, of creation and providence, and of the incarnation, are all burdened with difficulties, but these do not justify anyone in rejecting the clear teachings of Scripture with respect to those truths. Many of the teachings of science are similarly burdened and present problems which cannot be solved at present, but are not therefore necessarily discounted. People confidently speak of atoms and electrons, of genes and chromosomes, though these still present many problems. We should always bear in mind the statement of Dr. Warfield, that it is "a settled logical principle that so long as the proper evidence by which a proposition is established remains unrefuted, all so-called objections brought against it pass out of the category of objections to its truth into the category of difficulties to be adjusted to it."
  
                  In connection with the common objections against the doctrine of inspiration the following points should be borne in mind:
  
                  a. The present day opposition to Scripture and its inspiration is to a great extent, not merely scientific, but ethical. It clearly reveals the aversion of the natural heart to the supernatural. Opposition is evoked by the very fact that Scripture demands absolute subjection, the subjection of human reason to its authority. This ethical conflict is clearly seen in the opposition to the miracles, the incarnation, the virgin birth, the resurrection of Christ, and other supernatural events.
  
                  b. Many of the so-called objections have no factual basis, but are born of faulty assumptions. They often result from the wrong scientific attitude, which the opponent assumes to Scripture. If one takes for granted a priorily that the contents of Scripture is not the fruit of revelation but of natural evolution, then many facts and events appear to be out of place in the framework in which the Bible places them. Then the laws of Moses become an anomaly at the beginning of Israel's national existence, and the books of Chronicles must be regarded as unhistorical. Then Jesus especially becomes an historical enigma. Again, if it is taken for granted that all the events of history are controlled by an iron-clad system of natural laws, and the supernatural is eliminated, then there is, of course, no place for the miracles of Scripture. And if in the study of the Synoptics a double or triple source theory is taken for granted, and these sources are made the standard of truth, a great deal of material will naturally be set aside. But all such objections are the result of false assumptions, and therefore need not be taken seriously.
  
                  c. Several of the objections are exaggerated and can easily be reduced. Discrepancies and contradictions are sometimes hastily assumed, which on closer inspection prove to be no discrepancies or contradictions at all. There are so-called doublets in Joshua, Judges, and the books of Samuel, which in fact are merely complementary narratives, introduced in characteristically Hebrew fashion. The Gospel of John has been declared unhistorical, because its representation of the life of Jesus differs from that of the Synoptics; but even these differences can largely be explained in the light of the character and purpose of the different Gospels. A book like that of Gregory, Why Four Gospels? is very illuminating on this point.
  
                  d. There are also a number of objections that would apply on the assumption of a mechanical conception of inspiration, but lose their force entirely if the inspiration of Scripture is organically conceived. Verbal inspiration is sometimes denied, because the writers indicate that their literary work is based on previous investigations, because the individuality of the writers is clearly reflected in their writings, or because there are marked differences of style and language. But it is quite evident that these objections militate only against a mechanical view of inspiration.
  
                  e. Finally, objections are frequently derived from the low moral conditions which are reflected in the Bible, especially in its earliest books, and from the imperfections, deceptions, polygamy, and even immorality of some of the chief Bible characters, such as Noah, Abraham, Jacob, Eli, David, and Solomon. But the fact that the Bible gives a faithful picture of the times and the lives of these saints can hardly constitute an objection against its inspiration. The situation would be different, of course, if the Bible approved of such conditions or acts, or even if it condoned them: but as a matter of fact it does quite the contrary.
  
                  QUESTIONS FOR FURTHER STUDY: What is plenary, in distinction from verbal, inspiration? Does the fact that the Bible contains truths which transcend reason prove anything as to its inspiration? Is the doctrine of inspiration consistent with the evolutionary view of Scripture? If the Bible is not verbally inspired in all its parts, how can we determine which parts are, and which are not, inspired? What is the difference between prophetic, lyric, chokmatic, and apostolic inspiration? Does the doctrine of inspiration imply that the evangelists always recorded the ipsissima verba of Jesus? How does it square with the fact that the human authors of the Bible sometimes derive their material from written sources? Is it possible to deny the doctrine of inspiration and maintain the veracity of Jesus and the apostles? How did the inspiration of the writers of Scripture differ from the ordinary illumination of Christians? How, from the inspiration of the great poets?
  
                  REFERENCES: Bavinck, Geref. Dogm., I, pp. 406–476; Kuyper, Enc. der Heil, Godgel., II, pp. 369–511; id., Dict. Dogm., De Sacra Scriptura, I, pp. 86–100; II, pp. 3:179; id., De Hedendaagsche Scriftcritiek; Honig, Is de Bijbel op Bovennatuurlijke Wijze Geinspireerd? Daubanton, De Theopneustie der Heilige Schrift; Bannerman, Inspiration of the Scriptures; Lee, The Inspiration of the Scripture; McIntosh, Is Christ Infallible and is the Bible True?, Patton, Inspiration of the Scriptures; McGregor, The Revelation and the Record, pp. 79–117; Given, Revelation, Inspiration, and the Canon, pp. 104–202; Orr, Revelation and Inspiration, pp. 155–218; Ladd, The Doctrine of Sacred Scriptures, II, pp. 452–494; Sanday, Inspiration; Warfield, Revelation and Inspiration, pp. 51–456; Girardeau, Discussions of Theological Questions, pp. 273–384; Cunningham, Theological Lectures, pp. 343–411; Mead, Supernatural Revelation, pp. 279–317.
              - f-the-perfections-of-scripture: |-
                  F. The Perfections of Scripture
  
                  The Reformation naturally brought the doctrine of Scripture to the foreground. During the Middle Ages the fiction of an apostolic tradition, which was supposed to have come down in oral form from the days of the apostles gradually crystallized and secured a firm hold on the Church. This tradition was placed on a level with the Bible as an authoritative source of theological knowledge, and in practice was often treated as superior to the Bible. It was regarded as the necessary warrant for the authority of the Bible, and as the indispensable guide for the interpretation of Scripture. Moreover, the hierarchical Church of Rome, with its claim to infallibility, placed itself above them both. It posed as the only body which could determine infallibly what was and what was not, apostolic tradition, and which could give an infallible interpretation of Scripture. Great emphasis was placed on the fact that the Bible owes its origin to the Church, and stands in constant need of the testimony of the Church. The Reformers clearly saw that this position of the Church of Rome was the fruitful source of many errors, and therefore felt that it was incumbent on them to call the people back to the Bible, which had been greatly neglected, and to stress its autopistia. To offset the errors of Rome they deemed it necessary to develop the doctrine of the perfections of Scripture. They themselves did not yet include a systematic presentation of this in their works, but their successors did. It occupies a very important place in the writings of Musculus, Zanchius, Polanus, Junius, and others. We conclude our study of the principium cognoscendi externum with a brief discussion of the perfections of Scripture.
  
                  1. THE DIVINE AUTHORITY OF SCRIPTURE. The divine authority of Scripture was generally accepted until the chill winds of Rationalism swept over Europe and caused the enthusiasm of faith to go down to the freezing point. This means that in the days of the Reformation the Church of Rome as well as the Churches that parted company with it, ascribed divine authority to Scripture. But in spite of the fact that Roman Catholics and Protestants had the principle of authority in common, they were not altogether agreed as to the nature of this authority. There was a very important difference of opinion with respect to the ground on which it rests. On the part of Rome there was an ever-increasing denial of the autopistia of Scripture, that is, of its inherent authority. It maintained that the Church temporarily and logically precedes Scripture, and therefore does not owe its existence to Scripture, but exists in and by itself, that is, through Christ or the indwelling Spirit of God. Scripture rather owes its existence to the Church, and is now further acknowledged, preserved, interpreted, and defended by it. Without the Church there is no Scripture, but without Scripture there is still a Church.
  
                  Over against this position of Rome, the Reformers emphasized the autopistia of Scripture, the doctrine that Scripture has authority in and of itself as the inspired Word of God. They did not hesitate to ascribe great importance to the testimony of the Church to Scripture as a motivum credibilitatis, but refused to regard this testimony of the Church as the final ground for the acceptance of Scripture. They firmly maintained the position that the Bible must be believed for its own sake. It is the inspired Word of God and therefore addresses man with divine authority. The Church can and should acknowledge the Bible for what it is, but can in no sense of the word make it what it is. The Protestant principle is, says Thornwell, "that the truths of the Bible authenticate themselves as divine by their own light."
  
                  In Protestant circles, however, a dispute arose in the seventeenth century respecting the authority of Scripture. While Scripture as a whole was recognized as the only and sufficient rule of faith and practice, the question was raised, whether every part of it should be regarded as authoritative. In seeking an answer to this question it became evident that it was necessary to distinguish between the Word of God in a formal and in a material sense, and between an auctoritas historica and an auctoritas normativa. Scripture has first of all historical authority, that is, it is a true and absolutely reliable record, and as such is entitled to a believing acceptance of all that it contains. But in addition to that it also has normative significance, as a rule of life and conduct, and as such demands absolute subjection on the part of man. And in connection with this the difficult question arose, in how far the normative value that is ascribed to Scripture as a whole also belongs to its separate parts. Do the historical parts of the Bible, do the laws of Moses, and do the words of the speakers that are introduced in Scripture have normative significance for us? Happily, we need not grope about entirely in the dark here, for the Bible itself teaches us to make distinctions with respect to this point. It does not demand that we keep every one of the precepts which it contains. It disapproves of some and calls attention to the temporary character of others. Reformed theologians never attempted to lay down hard and fast rules by which we can be governed in this matter. Heppe gives some examples of the manner in which they dealt with the matter. Voetius says that absolute normative significance must be ascribed to the words and works (a) of God, (b) of Christ as God and man, and (c) of the angels. Moreover, he regards those words of the prophets and of the apostles as normative, in which they as public teachers, orally or in writing, edify the Church. He ascribes normative authority to their deeds only when they are approved by Scripture. On the other hand, he does not regard all the words of Job as normative, nor the words of the friends of Job. Others explicitly exclude the words of the devils and of wicked persons. Voetius holds that the writings of the Old Testament are just as normative as those of the New Testament. Grosheide calls attention to the fact that absolute normative significance must be ascribed to those statements or commands of God which are clearly intended for all ages, and to all positive statements of an ethical or dogmatical character; but that no such authority can be ascribed to the words of Satan, of wicked persons, or even of the pious, except when they are clearly speaking in the name of God or make statements that are fully in harmony with the moral law; nor to purely historical narratives pertaining to the things of every day life. In general it will not be difficult to determine, whether a certain part of Scripture has normative value for us. Yet there are cases in which the decision is not easy. It is not always possible to say, whether a certain Scriptural precept, which was clearly normative for the original readers, still has normative significance for us. On the whole it is well to bear in mind that the Bible is not exactly a code of laws, and is far more interested in the inculcation of principles than in the regulation of life by specific precepts. Even the laws of Moses and the history of Israel as the Old Testament people of God embody principles of permanent validity. Sometimes we may come to the conclusion that, while certain laws no more apply in the exact form in which they were cast, yet their underlying principle is just as binding today as it ever was. In dubious cases we shall have to be guided to a great extent by the analogy of Scripture and by the moral law.
  
                  In modern liberal theology very little remains of the normative significance of the Bible. Schleiermacher denied the normative character of the Old Testament altogether, and regarded only the New Testament as a norm for the Church. And he ascribed this significance to the New Testament, not on account of its supernatural inspiration, for he did not believe in this, but because he saw in it the record of the religious experiences of men, who, as the immediate associates of Jesus, enjoyed a special measure of spiritual illumination. Ritschl did not ascribe normative significance even to the New Testament, but saw in it only a valuable historical record of the beginnings of Christianity, and in no sense of the word a rule of faith. He felt free to reject all those elements which did not harmonize with the postulates of his own system and had no real value for the revelation in Christ as the real founder of the Kingdom of God, nor for the Christian life, as he conceived of it. In general it may be said that these two men determined the attitude which modern liberal theology assumes with reference to the Word of God. Strange to say, some present day Dispensationalists, who are strongly opposed to all Liberalism, also maintain that the Old Testament is not normative for us. They fully recognize the inspiration of the Old Testament, and consider it to be normative for the Jews, but not for New Testament believers. Cook expresses himself very clearly on this point, when he says that "in all the Old Testament there is not a sentence that applies to the Christian as a Rule of Faith and Practice—not a single command that is binding on him, as there is not a single promise there given him at first hand, except what is included in the broad flow of the plan of Redemption as there taught in symbol and prophecy."
  
                  2. THE NECESSITY OF SCRIPTURE. Because the Church of Rome proceeds on the assumption that the Church takes precedence over Scripture, it cannot very well acknowledge the absolute necessity of the latter. The Church, which derives its life from the Holy Spirit, is self-sufficient and therefore autopistos. While it does need tradition, it does not really need Scripture, no matter how useful this may be as a norm. The Lord referred those to whom He brought His doctrine, not to a book, but to the living voice of His apostles and of the Church. "He who heareth you," He said to the apostles, "heareth me." Moreover, nearly twenty years elapsed after the ascension of Christ before a single book of the New Testament came into existence, and during all that time an appeal to the New Testament was naturally out of the question. According to Rome it is far more correct to say that the Bible needs the Church than that the Church has need of the Bible. The denial of the necessity of Scripture, however, was not limited to the Church of Rome. Even in the early Church some of the mystical sects, such as the Montanists and the Cathari regarded the Bible as quite superfluous. And in the days of the Reformation the Anabaptists and the Libertines of Geneva were of the same opinion. The Anabaptists especially exalted the inner word at the expense of the external. They did not regard the Bible as the true Word of God, but only as a testimony, a description, a dead and thoroughly impotent letter. In their estimation the real and true Word of God was spoken by the Holy Spirit in the hearts of God's people. Schleiermacher also taught that Scripture was produced by the Church, and is simply the supreme, and therefore also authoritative, expression of its religious life. This may be said to be the prevalent view in modern Liberalism, which draws for its theology far more on the Christian consciousness, informed by the current teachings of science and philosophy, than on the Bible as the Word of God.
  
                  When the Reformers defended the necessity of Scripture over against Rome and the Anabaptists, they did not deny that the Church existed before Moses' day, nor that the New Testament Church was in existence long before there was a canon of the New Testament. Neither did they defend the position that Scripture was absolutely necessary, in the sense that God could not have made man acquainted with the way of salvation in some other way. They considered Scripture to be necessary in virtue of the good pleasure of God to make the Word the seed of the Church. Even before the time of Moses the unwritten word served that purpose. And the New Testament did not come into existence apart from the spoken word of Jesus and the apostles. As long as these witnesses of the facts of redemption lived, there was little need of a written word, but when they fell away, this changed at once. The historical character of God's revelation, the history of redemption, and the redemptive facts which did not admit of repetition, and were yet of the greatest significance for all coming generations, made it necessary to commit God's special revelation to writing. From that point of view Scripture remains necessary to the very end of time. In this sense of the word Reformed theology has always defended the necessity of Scripture. Even Barth, who does not share the Reformed conception of the Bible as the infallible Word of God, feels constrained to defend its necessity as a witness to the divine revelation.
  
                  3. THE PERSPICUITY OF SCRIPTURE. In the estimation of Rome the Bible is obscure, and is badly in need of interpretation even in matters of faith and practice. It contains deep mysteries, such as the doctrine of the Trinity, of the incarnation, and others, and is often so obscure that it is liable to be misunderstood. For that reason an infallible interpretation is needed, and this is supplied by the Church. Peter says distinctly that some parts of the Bible are hard to understand, and the experience of centuries proves conclusively that, without the infallible interpretation of the Church, it is impossible to reach the desired unity in the interpretation of Scripture. Over against this position of the Roman Catholic Church the Reformers stressed the perspicuity of Scripture. They did not intend to deny that there are mysteries in the Bible which transcend human reason, but freely admitted this. Neither did they claim such clarity for Scripture that the interpreter can well dispense with scientific exegesis. As a matter of fact, they engaged in exegetical labors far more than the votaries of Rome. Moreover, they did not even assert that the way of salvation is so clearly revealed in Scripture that every man, whether he be enlightened by the Holy Spirit or not, and whether or not he be deeply interested in the way of salvation, can easily understand it. Their contention was simply that the knowledge necessary unto salvation, though not equally clear on every page of Scripture, is yet conveyed to man throughout the Bible in such a simple and comprehensible form that one who is earnestly seeking salvation can, under the guidance of the Holy Spirit, by reading and studying the Bible, easily obtain for himself the necessary knowledge, and does not need the aid and guidance of the Church and of a separate priesthood. Naturally, they did not mean to minimize the importance of the interpretations of the Church in the preaching of the Word. They pointed out that Scripture itself testifies to its perspicuity, where it is declared to be a lamp unto our feet, and a light unto our path. The prophets and the apostles, and even Jesus Himself, address their messages to all the people, and never treat them as minors who are not able to understand the truth. The people are even declared to be able to judge and to understand, 1 Cor. 2:15; 10:15; 1 John 2:20. Because of its perspicuity the Bible can even be said to be self-interpretive. The Reformers had this in mind, when they spoke of an interpretatio secundum analogiam fidei or Scripturae, and laid down the great principle, Scriptura Scripturae interpres. They did not regard the special task of the Church in the interpretation of the Bible as superfluous, but explicitly recognized the duty of the Church in this respect. Hence they spoke of the potestas doctrinae of the Church.
  
                  4. THE SUFFICIENCY OF SCRIPTURE. Neither Rome nor the Anabaptists regarded the Bible as sufficient. The latter had a low opinion of Scripture, and asserted the absolute necessity of the inner light and of all kinds of special revelations. They attached very little importance to the ministry of the Word. One of their pet slogans was, "The letter killeth, but the Spirit maketh alive." From the time of the Middle Ages Rome maintained the absolute necessity of oral tradition as a complement to the written word. This tradition was not always clearly defined. The term originally covered oral teachings and customs of apostolic origin. But in the measure in which the Church moved farther and farther away from the apostolic age, it became increasingly difficult to determine, whether certain teachings really came down from the apostles. Hence it became necessary to define the characteristics of what might truly be regarded as apostolic tradition. An attempt at this was made in the rule of Vincentius Lerinensis, who declared that to be apostolic which was believed everywhere, always, and by all (ubique, semper, et ab omnibus, creditum est). Real apostolic tradition could therefore be recognized by the fact that it was believed everywhere, at all times, and by the whole Church. This definition was adopted by all later Roman Catholic theologians, though in actual practice it was modified. It was very difficult to determine, whether a certain truth was always believed, and therefore the question gradually took on the more contemporaneous form, whether such a truth is at any particular time generally believed. The antiquity of the truth was sacrificed to its universality, and the really important question was ignored. It was tantamount to saying that it could not be determined, whether a certain teaching actually came down from the apostles. But even so a formidable difficulty remained. In seeking an answer to the question who was to pass on this question of universality, it was held that the Church in general could not do this, but only the ecclesia docens, the bishops in their councils. This is still the position of the Old Catholic Church. But even this position proved untenable. The question arose, When are the bishops infallible in determining the nature of a tradition, always, or only when they are met in council? And if they can give infallible decisions only when they have come together, must their vote be unanimous or is a majority sufficient to lend weight to their decision? And if a majority is sufficient, how great must this be; is a majority of one sufficient? The result of all these deliberations was that the Pope was finally declared infallible in matters of faith and practice, when speaking ex cathedra. If the Pope now declares something to be apostolic tradition, that settles the matter, and what is so declared thereby becomes binding on the Church.
  
                  Over against the position that Scripture needs some complement, the Reformers asserted the perfectio or sufficientia of Scripture. This doctrine does not mean that everything that was spoken and written by the prophets, by Christ, and by the apostles, is incorporated in Scripture. The Bible clearly proves that this is not the case, 1 Kings 4:33; 1 Cor. 5:9; Col. 4:16; 2 Thess. 2:5. Neither does it mean that all the articles of faith are found in finished form in Scripture. The Bible contains no dogmas; these can be derived from it only by a process of reflection. The Reformers merely intended to deny that there is alongside of Scripture an unwritten Word of God with equal authority and therefore equally binding on the conscience. And in taking that position they took their stand on Scriptural ground. In Scripture each succeeding book connects up with the preceding (except in contemporary narratives), and is based on it. The Psalms and the Prophets presuppose the Law and appeal to it, and to it only. The New Testament comes to us as the fulfilment of the Old and refers back to nothing else. Oral traditions current in the time of Jesus are rejected as human inventions, Matt. 5:21–48; 15:4, 9; 1 Cor. 4:6. Christ is presented to us as the acme of the divine revelation, the highest and the last, Matt. 11:27; John 1:18; 17:4, 6; Heb. 1:1. For the knowledge of the way of salvation we are referred to Scripture only, to the word of Christ, and of the apostles, John 17:20; 1 John 1:3. The Reformers did recognize a Christian tradition, but only a Christian tradition based on, and derived from, Scripture, and not one that equalled or even surpassed it in authority.
  
                  QUESTIONS FOR FURTHER STUDY: How do Roman Catholics defend the authority of tradition alongside of that of Scripture? Why do they attach so much importance to apostolic tradition? Is it right to limit the normative authority of Scripture to those parts which teach the doctrine of salvation? Has Scripture any authority in matters of science and art? Does the Bible in any way testify to its necessity? How does modern liberal theology judge of this? Do not the many contradictory interpretations of Scripture disprove its perspicuity? How do the oral law of the Jews and the oral tradition of the Roman Catholics compare? Is the appeal of the Mystics to 2 Cor. 3:6 to disprove the sufficiency of Scripture, tenable?
  
                  REFERENCES: Bavinck, Geref. Dogm. I, pp. 476–527; Kuyper, Dict. Dogm., De Sacra Scriptura II, pp. 190–241; Ladd, The Doctrine of Sacred Scripture II, pp. 514–610; Cunningham, Theol. Lectures, pp. 459–516; D. S. Schaff, Our Fathers' Faith and Ours, pp. 147–170; Wilmers, Handbook of the Chr. Rel., pp. 120–151; Heppe, Dogm. der ev. ref. Kirche, pp. 9–31; id., Dogm. des deutschen Protestantismus im zechzehnten Jahrhundert I, pp. 211–257; Mead, Supernatural Revelation, pp. 318–355; Schmid, Doct. Theol. of the Ev. Luth. Church, pp. 61–101; Gravemeijer, Leesboek over de Geref. Geloofsleer I, pp. 244–267; Burgess, The Protestant Faith, pp. 59–94.
              - v-the-principium-cognoscendi-internum: 'The knowledge of God presupposes, not only that God has revealed Himself, but also that man is capable, either constitutionally or by virtue of a gracious work of renewal, of receiving and appropriating this revelation. If man did not have that ability, the divine revelation, while existing objectively, would forever remain foreign to him and exercise no influence on his life. All knowledge, and consequently also all science, requires a certain correspondence between subject and object. This means that alongside of the principium cognoscendi externum there must also be a principium cognoscendi internum, a principium in man which enables him to discern and to appropriate God''s special revelation. Naturally, the absolute Idealist would not subscribe to this position, for according to him knowledge not only calls for a correspondence between subject and object, but for the identity of the two. Even the Theology of Crisis feels constrained to put the matter in a different form. It recognizes no objectively existing revelation; nor does it believe in a point of contact in the life of man for special revelation. Revelation simply is not revelation until it is brought home to the heart of man in faith. But this faith is not a permanent receptivity in man for an objectively existing revelation, but is given in and with the revelation itself whenever God reveals Himself. This means that on this point the distinction between the subjective and the objective is really cancelled. Reformed theology, however, recognizes the existence of a principium cognoscendi internum, and the question naturally arises. What is the nature of this principium? In the course of history several answers have been given to that question. The organ by which man judges and appropriates the revelation of God was sought successively: (A) in the human understanding, (B) in speculative reason, (C) in devout feeling, and (D) in the moral consciousness. We shall consider these successively.'
              - a-the-human-understanding: |-
                  A. The Human Understanding
  
                  Some sought the principium cognoscendi internum in the human understanding in general, as distinguished from what is more specifically called the speculative reason. It was their persistent attempt to establish the truth on historico-apologetical grounds.
  
                  1. HISTORICAL STATEMENT OF THIS POSITION.
  
                  a. Up to the time of the Reformation. In view of the fact that the revelation of God in Christ does not minister to the pride of man but rather humbles him, it naturally met with a great deal of opposition and was repeatedly in need of defense. This was necessary even in the apostolic age, so that the Bible itself contains apologetical elements. In the second century the Apologetes defended the truth of Christianity over against Jews and Gentiles, and gave an account of the grounds on which it rests. They did not take their starting point in doubt or in any so-called neutrality, but in an unwavering faith and called attention to the superior excellency of Christianity, to the redemptive message of special revelation, to the antiquity and unity, the simplicity and sublimity, the fulness and many-sidedness of Scripture, to prophecies and miracles, and to the testimony of the Church and the blessings of the gospel. These arguments were repeated in the writings of the anti Gnostic fathers and in later theology, though they were sometimes treated in other connections and did not always assume the same character.
  
                  Scholasticism also took its starting point in faith, but by its attempt to change religious truths into concepts of reason effected a separation of natural and supernatural truths that was detrimental to both. According to them the former could be proved by reason, but the latter could only be accepted on authority. In the former scientific certainty was possible, but in the latter it was not possible to rise above the level of faith. The order which they usually followed, though with several variations, was the following: first they sought to demonstrate by rational argumentation the truths of natural revelation; then they proved in a similar way the possibility, necessity, and reality of special revelation; and finally they urged reason, on the mere ground of the existence of a special revelation, to accept its contents blindly in faith. The motives that were adduced for belief in a special revelation were generally called motiva credibilitatis. The argument that Scripture as a divine revelation rests on the testimony of the Church was developed by the Roman Catholics especially after the Reformation. All such arguments, however, though they may demonstrate the reasonableness of accepting Scripture as the Word of God, can only produce a fides humana and never a fides divina. Even among the Roman Catholics some are willing to admit this, though on the whole they have a high opinion of Apologetics. The general Roman Catholic representation as to the way in which man arrives at the knowledge of God's revelation is the following: (1) Supernatural revelation rises on the basis of natural revelation, and can only be appropriated successively by degrees. (2) By various proofs man in his natural state is first led to the natural theology, which constitutes the preamble of faith. At this point even science is possible, since the proofs are demonstrative. Ordinarily we cannot yet speak of faith at this stage. (3) He who has reached this point is now, through the motives of credibility, of which the Church is the most important, put in a position to see and admit the trustworthiness of God's revelation and the reasonableness of faith. (4) After man has thus been led to the fides humana (human faith) he is raised by an infused grace to the supernatural order and prepares himself by good works for the vision of God.
  
                  b. After the Reformation. The Protestants took a different position, but did not always consistently maintain it. The Reformers did not take their starting point in human reason, but in the Christian faith, and stressed the fact that this faith rests only on divine authority and is wrought by the Holy Spirit. Protestant theologians did not always remain true to this principle, but frequently returned to the doctrine of a natural theology, and to the historical proofs for the truth of revelation. Under the influence of Cartesius, who took his starting point in doubt, Rationalism gradually found its way into the Churches, and the historico-apologetical method came into vogue. It clearly came to the foreground in Supranaturalism. In the application of this method the purpose was to prove that God has revealed Himself in a supernatural way rather than to exhibit the reasonableness of revelation. And in order to prove this, attention was called to the miracles of Scripture, to the fulfilment of prophecies, often of a very special character, to the striking correspondence of the various parts of Scripture, to the moral influence of the gospel, and so on. The purpose was to lead men to faith by such intellectual considerations. It cannot be denied that some who followed this method did it with the best intentions. Some of their works are even now mentioned with honor in Christian Apologetics, though the method now followed and the arguments adduced are quite different. Yet this method was bound to lead to Rationalism. Even Butler could pen a sentence like the following: "For though natural religion is the foundation and principal part of Christianity, it is not in any sense the whole of it." Reason is accorded the right to examine and explain the credentials of revelation, and is thus placed above Scripture. For that reason this method stands condemned from a theological point of view. Moreover, its untenableness clearly appeared from the history of Supranaturalism itself, and from the sharp criticism of Rousseau and Lessing, of Kant and Schleiermacher. For a long time even Reformed authors continued to speak of natural theology as fundamental theology, but in many Reformed circles it is entirely discredited at present.
  
                  2. EVALUATION OF THIS POSITION. As intimated in the preceding, the historico-apologetical method does not meet with approval from a theological point of view, because it underrates both religious truth and faith. Religious truth is not like some theorem of science, and faith is not purely intellectual insight into some result of scientific investigation. Baillie calls attention to the fact that this whole method of reasoning is called in question today. It also does scant justice to the Christian religion. The Word of God presupposes the darkness and error of the natural man, and would therefore contradict itself, if it submitted itself to the judgment of that man. It would thereby acknowledge one as judge whom it had first disqualified. Finally, this method does not lead to the desired result. In the beginning of the previous century miracles and prophecies could serve as proofs, but in the present day they themselves require proof.
  
                  This does not mean, however, that Apologetics is devoid of all real value. It may undoubtedly serve a useful purpose in some respects, but cannot, without forfeiting its theological character, precede faith nor prove the truth of revelation a priorily. It presupposes in its votaries a believing acceptance of the truth. A threefold value may be ascribed to it: (a) It compels theology to give an account of its contents and of the grounds on which it rests, and thus promotes theological self-consciousness, (b) It makes the Christian conscious of the fact that he need not feel embarrassed in the presence of the enemy, but finds support in nature and history, in science and art, and in the heart and conscience of every man. (c) Though it cannot of itself bring any man to the acknowledgment of the truth by compelling proofs, it may, like the ministry of the Word, give him a profound impression of the truth, which he cannot easily shake off.
  
                  In actual practice, however. Apologetics has often moved in the wrong direction, (a) It has divorced itself from faith, assuming a place outside of above, and preceding theology, and has thereby laid claim to an authority to which it is not entitled, (b) It has separated faith and knowledge in such a way as to cause religious truth to rest wholly or in part on purely intellectual grounds, something that is entirely contrary to the nature of that truth. (c) The result was that it cherished exaggerated expectations with reference to its scientific labors, as if it could change the heart through the intellect, and by means of sound reasoning could cultivate piety.
              - b-speculative-reason: |-
                  B. Speculative Reason
  
                  The position of those who regarded speculative reason as the organ by which to discern, and judge, and appropriate religious truth, did not differ essentially from those who ascribed these functions to the human understanding in general. The one as well as the other made human reason the arbiter of the truth as well as its appropriating organ. Both belong to that broader category generally known as Rationalism. And one of the fundamental assumptions of Rationalism, says Paterson is, "that the mind has been restricted to the use of its natural powers in the discovery and appropriation of religious and moral truth. The notion is rejected that at any stage of the process the mind has been aided by an immediate action upon it of the Divine Spirit, as the result of which it is enabled to take possession of truth that would otherwise lie beyond its ken and grasp." At the same time they who exalted speculative reason to the place of honor presented a system that was far more profound and comprehensive than that of vulgar Rationalism, that is, the Rationalism of the Wolffian type. They made speculative reason not only the norm and the necessary faculty for the reception of the truth, but even regarded it as the source of the truth, and by so doing broke the more effectively with the idea of a special divine revelation.
  
                  1. HISTORICAL STATEMENT OF THIS POSITION. The vulgar Rationalism of the eighteenth century, represented by Deism and the Wolffian school of philosophy, finally yielded to the critical onslaughts of Rousseau and Lessing, of Kant and Schleiermacher. The superficial structure which it reared was swept from its foundation. With Kant and Schleiermacher the autonomy of the subject began. At first the reaction went so far as to discount the objective world. According to Kant man cannot know noumena or the essence of things, but knows merely phenomena, and even these only in the forms which the thinking subject imposes on them. The subject thus produces the form of the phenomenal world. Fichte went a step farther and denied the existence of an objective world, in distinction from the subject. In his opinion the world of external things exists only in the one universal mind and is the product of this mind. At first Schleiermacher also assumed this standpoint. In course of time it was felt, however, that there must be something that has objective reality and therefore normative value. That consideration led to the so-called restauration, in which the attempt was made to get back to the objective, while retaining the same subjective starting point. Hegel was the great representative of this tendency. He raised the subjective, ethical Idealism of Fichte to an objective, logical Idealism, and substituted for the idea of being that of becoming. In his system of thought the whole world became a process, a development of the logical idea, in which all being is simply represented as thought. In that evolution religion also has its place. It, too, is pure thought or knowledge, namely, the knowledge which the Absolute has of itself in forms of the imagination. It is clothed in forms and symbols, or pictorial representations, of which only speculative reason can fathom the deep significance. According to Hegel it is the task of philosophy to rid the dogmas of religion of their historical forms, which are after all mere husks, and to discover and elucidate the idea, which is the precious hidden kernel. Thus the great truths of Christianity, such as the doctrine of the Trinity, of the incarnation, of the atonement, and others, not only became objects of philosophical speculation, but in their essential nature and ideal form really became the fruits of this speculation. Apart from Scripture and every other authority, these truths were represented as necessary thoughts of reason, and were therefore shown to be highly reasonable. The real proof for the truths of religion was found in the fact that they presented themselves to the mind as necessary thoughts. This was in harmony with the fundamental principle of Hegel: "All that is rational is real." Whatever one thought with logical necessity and proved to be a coherent part of the whole system of truth, was regarded as true. Logical necessity of thought or coherence was thus made the standard of truth in matters of religion. This method was applied in theology by Daub, Marheineke, Strauss, Vatke, Weisse, Biedermann, and others, though not always to the same degree, nor with the same result. It also found some favor among the followers of Schleiermacher, the father of modern theology, who shared the subjective starting point of Hegel, though he took position in the affections rather than in reason.
  
                  2. EVALUATION OF THIS POSITION. They who regard speculative reason as the criterion of religious truth are wedded to the speculative method in appropriating and judging this truth. This method undoubtedly has an advantage over the historico-apologetical method. Supranaturalism pretended to be able to demonstrate the dogmas of religion so clearly as to silence all objections. It made a determined effort to give a definite and clear representation of the truth, so that the reasonableness of it could at once be seen. But its sharp distinctions led to an intellectualism in which truth was divorced from life. The speculative method broke with this demand for clearness, and recognized the deep sense of the dogmata, and the mysterious elements in religion. Moreover, it emphasized the fact that religion occupies a unique place in human life, and therefore demands a corresponding organ in human nature. Hegel found this in speculative reason, and Schleiermacher, in the feelings. Both were mistaken, but nevertheless called attention to an important matter, when they stressed the necessity of a proper organ for religion, a matter that is of the greatest importance for the study of theology, and is therefore entitled to grateful recognition.
  
                  But the speculative method did not stop at the thought that thinking and being necessarily correspond to each other; it proceeded to the identification of the two. This is the fundamental error of speculative philosophy. The great question is, Do we think a thing because it exists, or does it exist because we necessarily think it. Speculative philosophy claims the latter, but without any warrant. At this point Hegel took an impossible leap. The existence of a thing does not follow from the fact that we think it, for existence is not an emanation of thought, but rests on an act of power. It is true that God thought things eternally, but He brought the things which existed ideally into real existence only by a creative act. We can only reflect on what God thought long before and has creatively brought to our consciousness in the existing world of reality. If we reject all that comes to us from without, we retain only a vague principle without any content, from which nothing can be derived. Notwithstanding its high pretensions and its, ostensibly, good intentions, the speculative method did not succeed in changing the despised doctrines of the Christian religion into a philosophical system of universal truth, quite acceptable to the world. The word of the cross remained foolishness to them that perish. It broke away from the objective basis of God's revelation, and therefore could not succeed in constructing a real system of theology.
              - c-devout-feeling-or-religious-intuition: |-
                  C. Devout Feeling or Religious Intuition
  
                  A third position with respect to the principium cognoscendi internum of theology, is that of those who find the organ by which religious truth is acquired and discerned in devout feeling or religious intuition. Schleiermacher is generally recognized as the father of this view. This conception of the internal or subjective principle of knowledge in theology has this in common with that of Hegel, that it does not involve any preliminary assumption as to the derivation of the subject-matter from revelation. But in distinction from those who championed the speculative method and virtually changed theology into philosophy, the advocates of this method are inclined to banish all philosophy from theology. They are like the speculative philosophers and theologians, however, in their failure to distinguish between the norm or criterion and the source of religious truth. Since they recognize their own subjective feelings as the source of this truth, the question for them is not so much a question of the appropriation, as of the appraisal, of religious truth or, to express it in a different way, a question of recognizing it as religious truth. Their special characteristic is that they seek religious certitude in a religious-empirical way. Devout feeling is the criterion of religious truth, and the test applied to it is the test of experience.
  
                  1. HISTORICAL STATEMENT OF THE POSITION. When both of the preceding methods led to no result, many theologians took refuge in religious experience and sought support in it for the certainty and truth of Christianity. It is particularly in the application of this method that the influence of Schleiermacher is felt. He and his followers had the laudable desire to restore theology to honor again, and they attempted to accomplish this by taking position in the believing consciousness. In answer to the question, What prompts us to accept the truths of Christianity? the advocates of this method do not appeal to historical or rational proofs, nor to the authority of Scripture or of the Church, but to the experience of salvation in the heart of the sinner. Schleiermacher wants the theologian to start with the data given in the confession of a particular Church, and by these data he means, not so much the doctrines that are formulated in the Creeds, as the living and effectual beliefs, which are voiced in the preaching and teaching of the Church. Then these doctrines or beliefs must be traced to their original source, which is not found in Scripture, but in the devout feeling which results from the relation of the soul to Jesus Christ. And, finally, they must be reproduced in a systematized form in the light of the fact that they are the reflex of distinctly pious feelings. This means that the doctrines are derived from pious or religious feelings, and also find in these the ground of their certitude. It is only in the light of such feelings that their truly religious character stands out.
  
                  Frank, one of the outstanding theologians of the Erlangen school of theology, is also one of the most representative advocates of this theory. His system already marks a real advance upon that of Schleiermacher, since he does not start from a general state of feeling, but from the specific experience of regeneration. In his work on The System of the Christian Certainty he seeks the answer to this question: What leads man to depend on the objective factors of salvation, such as God, Christ, Scripture, and others, and to accept Scripture as the Word of God? And his answer is that this is not due to historical or rational proofs, nor to the authority of Scripture, of the Church, or of tradition, but only to the experience of regeneration. The Christian certainty of which he speaks is not the assurance of salvation, but the assurance respecting the reality of the truth. Christian certitude, in the sense of certainty respecting the truth, finds its basis, according to Frank, in the Christian life, that is, in the believer's moral and spiritual experience. The Christian knows that a mighty change has taken place in his life, and from this experience of regeneration he infers the whole content of Christian truth. This truth arranges itself in three groups around the experience of regeneration. (a) There are truths which are immediately involved in that experience, such as the reality of sin, of judgment, and of future perfection (immanent and central truths) (b) Then there are truths which must be assumed, in order to explain the new condition, such as the reality of a personal God, the existence of God as triune, and the redemption wrought by the God-man (transcendent truths). (c) Finally, these lead right on to the means by which the preceding agents work, such as the Church, the Word of God, the sacraments, miracles, revelation, and inspiration (transeunt truths). This answer of Frank undoubtedly contains an important truth, since regeneration is indeed necessary, in order to see the Kingdom of God. But the manner in which he elaborates his thought is very dubious, and this is probably the necessary result of his subjective standpoint. He does not consistently work out a single thought, but constantly confuses the manner in which religious truths are derived, and the manner in which certainty respecting these is obtained. Since his work is entitled The System of the Christian Certainty, it raises the expectation that the author simply desires to show how the believer reaches Christian certitude. But in that case he should have limited himself to the task of elucidating the origin and nature of Christian certainty, and should not in addition have discussed the contents of the religious consciousness. Then he would not have given us a system of the objects to which this certainty pertains; and yet this is exactly what he does, when he derives all religious truths from the experience of regeneration.
  
                  2. EVALUATION OF THIS POSITION. There are many objections to this starting point and method. (a) Regeneration and all other experiences of the Christian are always connected with the objective factors of the Church, the Scriptures, and so on, while Frank divorces the two. (b) In his second work, The System of the Christian Truth, he himself gives precedence to these objective factors, and thus recognizes their priority. For that very reason he should have maintained this order throughout his system. (c) The method in which he derives the objective dogmata from the certainty of the Christian, is one that does not fit in theology. It is borrowed from speculative philosophy, which derives religious truth from the necessity of logical coherence. (d) This method goes contrary to all religious experience. No Christian ever obtained certainty respecting objective truths in the manner described by Frank. Scarcely anyone has adopted his method. And even among those who have adopted it in a modified form there is a difference of opinion as to the significance of experience for the principia of theology. The application of this method carries with it a threefold danger. (a) It easily leads into the danger of forming a wrong conception of religious experience, and of expecting from it what it cannot yield. While it is possible to experience certain emotions, such as those of penitence, fear, hope, and so on, it is not possible to experience historical facts. (b) It really makes it impossible for uneducated Christians to obtain knowledge and certainty respecting the historical facts of Christianity, since these can only be deduced from experience by an elaborate process of reasoning. (c) It is apt to rob historical Christianity ever increasingly of its real significance. Experience is loaded down with a burden which it cannot bear. The truth of Christianity cannot rest on it as a final ground. And the consciousness of this may easily lead to a reduction of the burden by divorcing the contents of faith from all historical facts and limiting it to religious and ethical experiences.
              - d-the-moral-consciousness: |-
                  D. The Moral Consciousness
  
                  Finally, there is still another view of the norm of religious truth, and of the manner in which we come to recognize and acknowledge it as such, a view that is somewhat akin to the preceding, but which, in distinction from the preceding, with its emotional appeal, stresses the ethical element in religion. It is a view that finds its roots in the moralism of Kant, and that became popular in theology through the influence of the Neo-Kantianism of Ritschl and his followers. It makes the moral consciousness the real judge of religious truth. The real emphasis in this view is not on emotional experience, but on ethical self-maintenance. The great and determinative question is, whether a certain truth satisfies the moral requirements of the heart or the conscience, and thus answers to a real practical need. Hence the method applied by its advocates is called ethical-psychological or ethical-practical.
  
                  1. HISTORICAL STATEMENT OF THE POSITION. If the immediately preceding method connects up with Schleiermacher, this method finds its main support in Kant. For its adherents Christianity in general is not so much a doctrine that must be demonstrated and accepted as true, nor a historical fact that calls for proof, but a religious and ethical power that addresses itself to the heart and the conscience of man. According to them Christianity cannot be made acceptable to all men without distinction, but only to those who have a proper moral disposition, a feeling of dissatisfaction, a sense of the good, a desire for redemption, and so on. When Christianity comes in contact with such men, it commends itself to their hearts and consciences as divine truth without any reasoning or further proof. It satisfies their religious needs, answers to their higher aspirations, reconciles them with themselves, brings them peace, comfort, and salvation, and thus proves itself to be the consolation and the wisdom of God.
  
                  This kind of argumentation did not begin with Kant. Tertullian already appealed to the testimony which the soul involuntarily gives to Christ. The Apologetes pointed out that the heathen religions of their day were not able to satisfy the religious needs of man, nor to foster a truly ethical life. Duns Scotus called attention to the moral influence of God's revelation and to its sufficiency in enabling man to reach his destiny. Both Roman Catholic and Protestant theologians sought to prove the truth of the Christian religion by pointing to its operation and influence on the intellectual, moral, social, and political life of individuals and nations. Pascal and Vinet especially brought this method to honor, but did not yet place it in opposition to historical argumentation. The former even admitted the great value of historical proofs, though he did not assign to them their usual place; and the latter did not despise them, though he regarded them as inferior to the moral and religious proof. In later years this method was adopted by Astie, Pressencé, Secretan, de la Saussaye, and others, who generally neglected and sometimes even disdained historical proofs.
  
                  However, the influence of Kant was of great significance for this method. According to him the theoretical reason necessarily yields three ideas, namely, those of God, freedom, and immortality. These three are therefore general. It does not assure us, however, that there are corresponding realities, nor enlighten us as to the nature of these realities. The corresponding realities are demanded, however, by the practical reason with its categorical imperative. This clearly testifies to the existence of a moral order, and demands that this order shall finally triumph over the natural order. This being so, it naturally follows that man must be free, that there must be a future life in which the moral will be really triumphant, and that there must be a highest Judge to punish vice and reward virtue. Only that view of the world is true that answers to our inner life and satisfies our moral needs.
  
                  When the insufficiency of the speculative method appeared, there was a tendency to go back to Kant. In theology Kantianism was reintroduced especially by Ritschl and Lipsius, though these men differed from Kant in several particulars. It is especially in the school of Ritschl that the ethico-psychological method is brought into prominence. This school regards Christianity as a historical phenomenon, but especially as a religious and ethical power of the greatest significance for the heart and conscience of man. Ritschl finds in religion especially two elements: on the one hand that of dependence on God, and on the other, that of spiritual freedom or supremacy over nature, which, in the estimation of Ritschl, is its main element. The Christian religion gives answer to the question, how man as a free moral being, who is yet hemmed in by nature and in many ways dependent on it, can maintain his freedom and rise superior to nature. And the answer is that man can gain the mastery over nature through communion with God in Christ and by making God's end his own, that is, by seeking the Kingdom of God in a life for God, motivated by love. In this practical power of Christianity Ritschl finds the real proof for the truth of the revelation of God in Christ and of the Christian religion. It is not a theoretical, but a practical proof. Like Schleiermacher, he too would banish all metaphysics from theology. In science theoretical proofs apply, but in religion only judgments of value. As a matter of fact, however, neither one of the two succeeded in excluding philosophy. Moreover, Kaftan, one of the most prominent and one of the ablest followers of Ritschl, stressed the fact that judgments of value cannot be divorced from theoretical judgments of being.
  
                  2. EVALUATION OF THIS POSITION. This and the immediately preceding method undoubtedly deserve to be preferred above the historical and speculative methods. The method now under consideration does not regard religion merely as a doctrine to be proved, nor as a condition of the subject to be analyzed intellectually, as the first two methods do respectively. It looks upon the Christian religion as a historical, objective power that answers to the moral needs of man, and finds in this its proof and justification. Nevertheless, there are serious objections to this method. (a) Though a religion that does not satisfy the religious and ethical life, that offers no comfort in sorrow and death, and does not give strength unto the battles of life, is not worthy of the name of religion; yet the fact that the Christian religion does do this, is no absolute proof of its truth, since there are other religions which also give a certain degree of satisfaction in this respect. (b) It is dangerous to make the truth of Christianity dependent on judgments of value. There would be no great objection, if it were only intended to stress the fact that a dogma must always have religious and ethical value, or that intellectual reasoning can never give us perfect certainty respecting religious truths, while this can be obtained by experiencing the religious values expressed by the dogmas. In that case the subjective evaluation would presuppose the objective reality of the religious truths and would only serve as a means to obtain certainty respecting that reality. Then the value of a thing would not be represented as the ground of its existence, but would simply enable us to acknowledge it subjectively. In the system of Ritschl it is quite different, however, since the judgments of value are divorced from all metaphysics. (c) Moreover, in this way we can never reach objectivity. The needs that find satisfaction in the Christian faith are virtually created by that same faith through the work of the ministry. Hence the question arises, whether those needs are real in the life of man, or have merely been awakened artificially and are therefore purely imaginary. In other words, the question of the truth of the Christian religion remains.
  
                  QUESTIONS FOR FURTHER STUDY: What is the difference between a fides humana and a fides divina? Can we be satisfied with historical certainty in theology? How can the transition from the historico-apologetical, to the speculative, method be explained? Is subjectivism, which makes the human reason or human experience the source of Christian truth, compatible with absolute certainty? Can absolute Idealism ever lead to a satisfying Christian certitude? Is the test of experience and the pragmatic test ever applied to the truth in Scripture? What makes these tests so popular in the present day? What more objective test does Troeltsch recommend? How should we judge of the psychological approach to religion, as exhibited in Horton's A Psychological Approach to Theology? Does the position taken by Baillie in his Our Knowledge of God differ materially from that of Schleiermacher?
  
                  REFERENCES: Bavinck, Geref. Dogm. I, pp. 528–602; Miley, Syst. Theol., I, pp. 34–47; Macintosh, Theol. as an Emp. Science, pp. 7–26; Dorner, System of Chr. Doct., I, pp. 58–168; Girardeau, Discussions of Theol. Questions, pp. 73–125; Paterson, The Rule of Faith, pp. 92–173; Kaftan, The Truth of the Chr. Rel., I. pp. 230–316; Frank, The System of the Chr. Certainty; Baillie, The Interpretation of Religion, pp. 174–339; Heffern, Apology and Polemic in the N. T.; Wenley, Contemporary Theology and Theism, pp. 11–124; Schaeder, Theozentrische Theologie, Vol. I and II, pp. 1–55; Horton, A Psychological Approach to Theology; Baillie, Our Knowledge of God; Dickey, Revelation and Response; Mackintosh, Types of Modern Theology.
              - e-faith-the-proper-principium-internum: |-
                  E. Faith, the Proper Principium Internum
  
                  Under the influence of Schleiermacher most theologians have come to the conclusion that religion is a unique phenomenon in human life, and can only be understood in a manner corresponding to its nature. By assuming this position theology takes its starting point in the subject, but should not, simply for that reason, be accused of subjectivism. No science has another starting point, since the objective world exists for us only as it is reflected in our consciousness. There must always be a principium internum that answers to the principium externum. Moreover, Christian theology from the very beginning took its starting point in the believing subject, was born of faith, and was guided and controlled by the rule: per fidem ad intellectum. And this is also entirely in harmony with Scripture, which speaks not only of a revelation of God outside of us, but also of an inner illumination of the Holy Spirit. If the accusation of subjectivism could be lodged against this starting point with any degree of justice, it could also be urged against all science, against theology as a whole, and even against Scripture itself. Such an accusation is warranted only, however, when the subjective condition absolutely necessary for the knowledge of a thing is made the source of that knowledge. An organ by which we take cognizance of the objective world round about us, is not the source from which that world proceeds.
  
                  1. THE NAME OF THE PRINCIPIUM COGNOSCENDI INTERNUM. The principium internum is usually called faith in Scripture. Other terms are also used, such as regeneration, John 3:3; 1 Cor. 2:12, 14, purity of heart, Matt. 5:8, love to the will of God, John 7:17, and the Spirit of God, 1 Cor. 2:13. For several reasons, however, the term faith deserves preference. (a) It is the term that stands out prominently in Scripture. (b) It directs attention at once to the conscious life, and thus involves a recognition of the fact that all the knowledge of man is mediated by his consciousness. And (c) it indicates better than any other name the close connection between religious knowledge and all other knowledge of man. In general it may be said that we obtain knowledge in no other way in religion than we do in the other sciences. We should remember that faith is not a new organ of science. Men sometimes speak of believing and knowing as opposites, but in such cases they use the word 'believe' in the weak sense of having an opinion for which the proper evidence is lacking. The word 'faith' has a far more profound meaning, however. It is frequently used to denote the positive knowledge that does not rest on external evidence nor on logical demonstration, but on an immediate and direct insight. In that sense it can ever be said to be fundamental to all the sciences. Intuitive knowledge and immediate insight occupy an important place in human life. There is not a single field of endeavor, nor a single phase of life in which we can get along without it.
  
                  2. DISTINCTIVE NATURE OF THE KNOWLEDGE OF FAITH. The correspondence between general and religious knowledge should not cause us to lose sight of the existing difference. There is a very important difference between faith in the sense of immediate certainty and faith in the religious sense. In the Christian religion faith has a unique significance, as the following points will show. (a) In the New Testament it denotes a religious relation of man to God, and includes not only a certain knowledge, that is, an assured knowledge, but also a heartful trust in God, a complete surrender to Him, and a personal appropriation of the promises of the gospel. (b) While the faith we exercise in connection with the external world, for instance with respect to the reliability of our senses, the pertinency of the laws of thought, and so on, rests on our own inner observation, Christian faith is directed to that which is invisible and cannot be observed, Heb. 11:1. (c) Faith in the religious sense is distinguished from that in the sense of immediate certainty in this that it rests on the insight of others rather than on our own. We are made acquainted with the grace of God in Jesus Christ through the testimony of prophets and apostles. (d) Finally, Christian faith differs from faith as immediate certainty also in the fact that it does not arise spontaneously in human nature. While it is perfectly human, and may even be called the restoration of human nature, it grates on the pride of the natural man and arouses hostility in his heart. God is not only its object, but also its author. Barth and Brunner go so far as to call God, rather than man, the subject of faith. While they also speak of it as man's response to the divine revelation, they really regard it as that in which God completes His revelation. The revelation itself gives birth to the response. As long as it does not do this, there is no revelation.
  
                  According to Scripture this faith carries its own certainty with it. It does this, not because it is so firm and certain in itself, but because it rests on the testimony and the promises of God. It makes the invisible blessings of salvation just as certain for man, yea even more certain, than his own insight or any scientific proof can ever make anything. Scripture represents certainty as one of the characteristics of faith. Alongside of the certainty of science we have, therefore, the certainty of faith, practically demonstrated in the believing Church, in its martyrs and steadfast confessors, and theoretically professed and developed in Christian theology. It is a certainty that is unwavering and indestructible. But this faith does not necessarily involve the truth of that which is believed. There is a great difference between subjective certainty and objective truth. In this respect everything depends on the grounds on which faith rests.
              - f-the-ground-of-faith: |-
                  F. The Ground of Faith
  
                  By faith we accept the testimony of God as it is contained in Scripture. But now the question arises, How do we know that that testimony is true, and therefore perfectly reliable? What is the ground on which our faith in the Word of God rests? Or, perhaps better still, By what means is the conviction respecting the truth of the special revelation of God wrought in our hearts? In answer to these questions Reformed theologians point to the testimony of the Holy Spirit. It is this subject that calls for a brief discussion in this concluding chapter.
  
                  1. THE DOCTRINE OF THE TESTIMONIUM SPIRITUS SANCTI IN THE CHURCH. It was admitted from the earliest Christian centuries on that none of the intellectual or historical proofs adduced for the truth of the Christian religion provide an adequate assurance. While they may lead to a fides humana, divine grace is necessary to engender faith in the heart. Augustine was the first one of the Church Fathers who clearly saw and taught the absolute necessity of inward grace for the acceptance of Scripture as the Word of God. It is true that he also attached great value to the testimony of the Church as a motivum credibilitatis, but he did not regard this as the last and deepest ground of faith. Theoretically, even the Church of Rome held that only the Holy Spirit can give one absolute certainty respecting the truth of revelation, but in practice there was a tendency to replace the testimony of the Holy Spirit by the testimony of the Church.
  
                  The Reformers consciously and deliberately placed testimony of the Holy Spirit in the foreground. They derived their certainty respecting the truth of the divine revelation from the work of the Spirit of God in the hearts of believers. They took position against the Church of Rome with its undue emphasis on the testimony of the Church, and also against the Anabaptists and other Mystics, who revealed a tendency to divorce the testimony of the Holy Spirit from the external testimony contained in Scripture. Calvin was the first one to give a detailed exposition of the doctrine of the testimony of the Holy Spirit. Since his day this doctrine is quite generally accepted by both Lutheran and Reformed theologians. Of late, however, it has suffered eclipse. This is due in part to the fact that many confuse the testimony of the Holy Spirit with the argument from experience, which is so popular in many circles today, and in part, to the mystical conception which some have of the testimony of the Holy Spirit, in connection with the widespread aversion to the supernatural. It is not unnecessary therefore to indicate precisely what is meant with the testimony of the Holy Spirit.
  
                  We should bear in mind, that the particular work of the Holy Spirit described by that name does not stand by itself, but is connected with the whole work of the Holy Spirit in the application of the redemption wrought in Christ. The Spirit renews the sinner, not only in his being, but also in his consciousness. He removes the spiritual darkness of the understanding and illumines the heart, so that the glory of God in Christ is clearly seen. It is only in virtue of the special operation of the Holy Spirit that man confesses Jesus Christ as Lord, 1 Cor. 12:3. The work of the Holy Spirit enables him to accept the revelation of God in Christ, to appropriate the blessings of salvation, and to attain to the assurance of faith. And the testimony of the Holy Spirit is merely a special aspect of His more general work in the sphere of redemption. For that reason the two should never be dissociated.
  
                  2. MISTAKEN NOTIONS OF THE TESTIMONIUM SPIRITUS SANCTI. There are especially two views of the testimony of the Holy Spirit against which we must be on our guard.
  
                  a. That it brings a new revelation. The Mystics conceived of it as an inner revelation to the effect that the Bible is the Word of God. This was evidently the conception which Strauss had of it, for he maintained that, when Protestants accepted the doctrine of the testimonium Spiritus Sancti, they virtually adopted the principle of Mysticism. He interpreted it as the communication of a new truth, namely, that the Bible is really the Word of God. If this interpretation were correct, his assertion would be justified, for then the Christian would indeed be receiving a new revelation through the testimony of the Holy Spirit, just as the prophets did in the days of old. This revelation would then, of course, call for a new attestation, and so on ad infinitum. Such a conception of the testimony of the Holy Spirit makes our belief in Scripture as the Word of God dependent on this new revelation, and naturally involves a denial of its autopistia. The older Protestant theologians never had such a conception of the testimony of the Holy Spirit. They all stressed the autopistia of Scripture and were strongly opposed to the mysticism of the Anabaptists. Even the somewhat related representation, that we must conceive of the testimony of the Holy Spirit as an influence producing in believers a blind or unfounded conviction that the Bible is the Word of God, proved unacceptable to them. Faith is a conviction founded on a testimony, which in the absence of proper evidence does not make its appearance.
  
                  b. That it is identical with the argument from experience. The testimony of the Holy Spirit should not be confused, as is often done, with the testimony of experience. The Holy Spirit does indeed work in believers the experience of salvation in Christ, which cannot be explained apart from Scripture, but is wrought through the instrumentality of the Word, and therefore implicitly testifies to the fact that the Bible is of divine origin. This is an inference, in which we conclude, from an experience which we regard as divine, that the Bible, through which the experience is wrought in us, is the inspired Word of God. This argument has been elaborated, though not in the same form, by such theologians as Frank, Koestlin, Ihmels, Stearns, and many others. In itself it is perfectly legitimate and is not devoid of evidential value, but it is something quite different from the testimony of the Holy Spirit. They who identify the two do not distinguish properly between the efficient cause of faith and the motives for faith. The testimony of experience may certainly be a motive for faith, but just as certainly cannot be the origin of it, since it already presupposes faith. The testimony of the Holy Spirit, on the other hand, is the causa efficiens of faith. Without it all the motives for faith would have no convincing power. Moreover, the testimony of experience respecting Scripture is no objective testimony of God, but simply the testimony of our own heart respecting the Scriptures. Finally, it has the character of a mere inference, or may even be said to involve more than one inference, since it concludes from a certain experience to Scripture as its origin, and from the fact that this experience is wrought through to the instrumentality of the revealed Word to the fact that this revelation is indeed the Word of God. It does not, therefore, have the character of an immediate testimony of the Holy Spirit. And because the testimony of experience is entirely subjective, the faith that is founded on it rests, in the last analysis, on the inner experience of the soul rather than on the objective testimony of God in His Word, which is after all the ground of all Christian certitude.
  
                  3. CORRECT VIEW OF THE TESTIMONIUM SPIRITUS SANCTI. Calvin absolutely rejects the idea that the authority of Scripture rests on the testimony of the Church, as well as some other erroneous views. He finally says: "Let it therefore be held as fixed, that those who are inwardly taught by the Holy Spirit acquiesce implicitly in Scripture; that Scripture, carrying its own evidence along with it, deigns not to submit to proofs and arguments, but owes the full conviction with which we ought to receive it to the testimony of the Spirit. Enlightened by Him, we no longer believe, either on our own judgment or that of others, that the Scriptures are from God; but, in a way superior to human judgment, feel perfectly assured—as much so as if we beheld the divine image visibly impressed on it—that it came to us, by the instrumentality of men, from the very mouth of God." The Testimony of the Holy Spirit is simply the work of the Holy Spirit in the heart of the sinner, by which he removes the blindness of sin, so that the erstwhile blind man, who had no eyes for the sublime character of the Word of God, now clearly sees and appreciates the marks of its divine nature, and receives immediate certainty respecting the divine origin of Scripture. Just as one who has an eye for the beauties of architecture, in gazing up into the dome of the St. Peter's Church at Rome, at once recognizes it as the production of a great artist, so the believer in the study of Scripture discovers in it at once the earmarks of the divine. The redeemed soul beholds God as the author of Scripture and rests on its testimony with childlike faith, with a fides divina. It is exactly the characteristic mark of such faith that it rests on a testimony of God. while a fides humana merely rests on a human testimony or on rational arguments. Of course, rational arguments may be adduced for the divine origin of Scripture, but these are powerless to convince the unrenewed man. The Christian believes the Bible to be the very Word of God in the last analysis on the testimony which God Himself gives respecting this matter in His Word, and recognizes that Word as divine by means of the testimony of God in his heart. The testimony of the Holy Spirit is therefore, strictly speaking, not so much the final ground of faith, but rather the means of faith. The final ground of faith is Scripture only, or better still, the authority of God which is impressed upon the believer in the testimony of Scripture. The ground of faith is identical with its contents, and cannot be separated from it. But the testimony of the Holy Spirit is the moving cause of faith. We believe Scripture, not because of, but through the testimony of the Holy Spirit.
  
                  QUESTIONS FOR FURTHER STUDY: In how many different senses is the word 'faith' used? How do faith and knowledge compare in the estimation of Locke, and in that of Kant? What do the Ritschlians mean when they speak of "faith-knowledge"? Is faith a matter of the intellect, of the will, of the emotions, or of all three combined? How does Calvin work out the doctrine of the testimony of the Holy Spirit? What is the difference between the testimonium Spiritus Sancti generale and speciale? Does the testimony of the Holy Spirit apply to the different parts of the Bible separately?
  
                  REFERENCES: Bavinck, Geref. Dogm. I, pp. 603–670; Kuyper, Enc. der Heil. Godgel., II, pp. 501–511; Hodge, Syst. Theol., II, pp. 69–86; Wisse, Geloof en Wetenschap, pp. 41–212; Foster, Studies in Theol., Proleg., pp. 74–246; Hall, Dogm. Theol., Introd., pp. 84–141; Frank, The System of Chr. Certainty; Stearns, The Evidence of Chr. Experience; Ihmels, Centralfragen der Dogm., pp. 1–21, 134–165; Kaftan, The Truth of the Chr. Rel., II; Hepp, Testimonium Spiritus Sancti, Generale; C. W. Hodge, Witness of the Holy Spirit, Princeton Review, Vol. II, p. 41 ff.
  
