              - preface-to-the-revised-edition: |-
                  IT is not necessary to say very much now that the revised edition of my Introduction to the study of Systematic Theology appears on the market. I can only say that I am truly grateful for the reception which this work has enjoyed, and for its use in ever-increasing circles. While the general plan of the work remained the same, it has been re-written and revised from cover to cover. In some cases small changes were brought on, in order to clarify the thought, while in others the modifications were considerable. A great deal of historical material has been added, and more attention has been paid to recent movements in theology. This brings the Introduction more in harmony with the second edition of my Systematic Theology. My only prayer is that the work in this new form may be of even greater usefulness, and may contribute in some small measure to the study of Reformed theology in our Country.
  
                  - L. BERKHOF
              - i-names-applied-to-the-systematic-presentation-of-theology: |-
                  There was little or no attempt in the first two centuries of the Christian era to present the whole body of doctrinal truth, gathered from the Word of God, in a systematic way. Yet the urge of the human mind to see the truth as much as possible as a whole could not long be suppressed. Man is endowed with reason, and the human reason cannot rest satisfied with a mere collection of separate truths, but wants to see them in their mutual relationship, in order that it may have a clearer understanding of them. It involuntarily begins to group disconnected truths, to classify them, and to integrate them, so that their interrelation becomes evident. Objections have frequently been raised against a systematic presentation of the doctrinal truths of Scripture; and also in the present day some are decidedly averse to it. There seems to be a lurking fear that the more we systematize the truth, the farther we wander from the presentation of it that is found in the Word of God. But there is no danger of this, if the system is not based on the fundamental principles of some erring philosophy, but on the abiding principles of Scripture itself. God certainly sees the truth as a whole, and it is the duty of the theologian to think the truths of God after Him. There should be a constant endeavor to see the truth as God sees it, even though it is perfectly evident that the ideal is beyond the grasp of man in his present condition.
  
                  The Church has never hesitated on this point. From the beginning of the third century on several works appeared which aimed at giving a complete presentation of the doctrinal truths of Scripture. Their aim was similar, but they differed in character and did not always bear the same title. Origen was the first one of the Church Fathers who gave a systematic presentation of doctrinal theology under the title Peri Archon. Only fragments of the original have been preserved; but the whole work has come down to the present in the Latin translation of Rufinus, dating from the fourth century, under the title De Principiis. By 'First Principles' Origen meant the "fundamental doctrines and leading articles of the faith." Lactantius was the second to write a work of that nature. He entitled his work Divinarum Institutionum Libri VII. It is really an Apology for the Christian religion characterized by great elegance of style. Augustine followed in the fifth century with his Enchiridion (meaning, 'Handbook'), and designated its contents by adding "sive de fide, spe et caritate." It is really an exposition of the Creed, in which the author exalts the sovereign grace of God and the saving work of Christ as connected with His death on the cross. This work became almost as authoritative in the Church as the Creed itself. Toward the end of the patristic period John of Damascus wrote a systematic treatise under the title Ekdosis Akribes Tes Orthodoxou Pisteos (an Accurate Exposition of the Orthodox Faith). This is more like a modern work on Dogmatics than any of the preceding. It was divided into four books, dealing with (1) God and the Trinity; (2) Creation and the Nature of Man; (3) Christ and His Incarnation, Death, and Descent into Hades; and (4) the Resurrection and Reign of Christ, including the rest of theology.
  
                  During the Middle Ages the nature of the doctrinal works that appeared were of a somewhat different nature. They were not grounded on Scripture to the same extent, but were based largely on what the earlier Fathers had written. It was then that the name Sententiae came into use. The name itself indicates that the works consisted largely of compilations from the Fathers. The most important of these was that of Peter the Lombard, De Libres Sententiarum. This is not merely a compilation, but also contains a great deal of original material. It remained the Handbook for the study of theology par excellence for three centuries. Along-side of the name Sententiae the name Summa gradually came into use, and in course of time supplanted the earlier title. The most important of the Summae is that of Thomas Aquinas, the great authority of the Roman Catholic Church. The author did not live to finish the work. Additions to it from some of his other works supply at least in a measure what is lacking.
  
                  At the time of the Reformation, and after that, still other titles of doctrinal works came into use. Melanchton was the first great dogmatician of the Lutheran Church. He entitled his work Loci Communes rerum theologicarum (Common-places of Theological Matters). It grew out of a course of lectures on the Epistle to the Romans. Several other Lutheran theologians used very similar titles. In course of time, however, it also fell into disuse. Zwingli wrote a Commentarius de vera et falsa religione, which has been called "the first systematic exposition of the Reformed faith." And Calvin entitled his principal work Institutio Religionis Christianae, a title which was adopted by several others. Even in the nineteenth century it appeared in a modified form in Richard Watson's Theological Institutes, and without any change in Gerhart's Institutes of the Christian Religion.
  
                  After the Reformation, however, the name Theologia became increasingly prevalent among Lutheran and Reformed theologians. And when the number of theological studies increased, it became quite apparent that this name required some delimitation, and the adjectives didactica, systematica, theoretica, positiva, and dogmatica served the purpose. L. Reinhart (1659) seems to have been the first one to use the last term. He entitled his work Synopsis theologiae dogmaticae. Since the contents of the Christian faith had long been designated as dogmata, the modifier was gradually used independently, and the principal term (theologia) was dropped, though it is always understood. Under the influence of Schleiermacher, who called his principal work Christlicher Glaube nach den Grundsaetzen der evengelischen Kirche, the title Doctrine of Faith (Dutch: Geloofsleer) came into use.
  
                  In more recent works we find a variety of titles, such as The Christian Faith (Haering, Curtis); Christian Theology (Knapp, Pope, Valentine); Dogmatics, Dogmatik, Gereformeerde Dogmatiek, Christliche Dogmatik (Kaftan, Bavinck, Honig, Barth); Dogmatic Theology (Shedd, Hall); and Systematic Theology (Raymond, Hodge, Miley, Strong). Reformed scholars in Germany and in the Netherlands show a decided preference for the title Dogmatics, with or without a modifier. In our own country, however, the term Systematic Theology seems to have a more popular appeal. From an ideal point of view the former certainly deserves preference, (1) because it is the more specific of the two, and designates the real object of study with greater precision; and (2) because the modifier 'systematic' in 'Systematic Theology' is apt to create the impression that the study under consideration is the only theological study which treats its subject-matter in a logical order, or that among the theological discipline there is no other that is systematic in structure; and this is not true. For practical reasons, however, it seems more desirable, especially in our country and in our day, to use the title Systematic Theology. This does not require the sacrifice of any principle. Dr. Warfield even considers this title better than the other, and therefore comes to its defense.
              - a-the-name-dogma: |-
                  A. The Name 'Dogma'
  
                  SYSTEMATIC Theology or Dogmatics deals with the dogmata, the accepted doctrines of the Church. This makes it necessary to consider their general character first of all. In this connection the name 'dogma' deserves brief consideration.
  
                  1. DERIVATION AND MEANING OF THE TERM. The word 'dogma' is derived from the Greek verb dokein. In classical Greek the expression dokein moi meant not only, it seems to me, or, I am of the opinion, but also, I have come to the conclusion, I am certain, it is my conviction. And it is especially this idea of certainty that finds expression in the word 'dogma'. While a dogma might in the abstract be a mere private opinion, in common parlance it was generally regarded as an axiomatic or self-evident truth, an official ordinance, or a well founded and formulated article of belief. There are not only religious dogmas, but scientific, philosophical, and political dogmas as well. The fundamental and supposedly unchangeable principles of science, the established teachings of philosophy, the decrees of governments, and the generally accepted doctrines of religion,—they are all dogmata. Modern liberal theologians might well bear this in mind, for a great deal of their criticism of the concept of dogma proceeds from the mistaken assumption that it is something entirely peculiar to religion. All dogmata have this in common, that they are clothed with a certain authority. Naturally, the basis of this authority differs. Scientific dogmas have the authority of axiomatic or self-evident truth. Philosophical dogmas derive their authority from the generally admitted arguments by which they are established. Political dogmas are clothed with the authority of the government by which they are decreed. And religious dogmas are based on divine revelation (either real or supposed), and are therefore authoritative.
  
                  2. THE BIBLICAL USE OF THE WORD. The word 'dogma' is found both in the Greek translation of the Old Testament (the Septuagint), and in the New Testament. It is used several times to denote governmental decrees, Esth. 3:9; Dan. 2:13; 6:8; Luke 2:1; Acts 17:7. In two passages it serves as a designation of the Mosaic ordinances, Eph. 2:15; Col. 2:14. And in Acts 16:4 it is applied to the decisions of the assembly of the apostles and elders recorded in the preceding chapter. The use of the term in this passage is particularly important, because it speaks of an ecclesiastical decision, and therefore virtually furnishes a basis for the theological use of the term. It is true that the assembly at Jerusalem did not formulate any doctrine, but its decision certainly had doctrinal bearings. Moreover, this decision was clothed with divine authority, and was absolutely binding on the churches for which it was intended. It was not a mere advice which these churches could follow up or ignore, as they saw fit, but a burden placed upon them to which they had to submit. The passage under consideration therefore contains at least an intimation of the fact that a religious dogma is a doctrine officially defined by the Church and declared to rest upon divine authority.
  
                  3. VARIOUS USES OF THE TERM IN THEOLOGY. In theology the word 'dogma' has not always been used in the same sense. The theological literature of the past sometimes employs the word in a rather loose sense, as practically equivalent with 'doctrine'. But when it speaks of dogmas with precision, it refers to those statements or formulations of doctrines which are regarded as established truths by the body of Christians which formulated them, and which are therefore clothed with authority. The early Church Fathers speak of the truths of the Christian faith, as they were recognized in the Church, as dogmata, and also apply this term to the teachings of the heretics. During the Middle Ages a somewhat more specific conception of dogmas was developed by the Roman Catholic Church. In that Church a dogma has come to be regarded as "a revealed truth which has in some way been defined by an infallible teaching authority, and as such is proposed to the acceptance of the faithful." Such a truth need not necessarily be revealed in Scripture, but may also be revealed in oral tradition. The important thing is that the Church declares it to be revealed, and imposes it as such upon the Church. Thus it is really made to rest on the authority of the Church.
  
                  The Reformers, and Protestant theology in general, broke with this hierarchical view, and regarded dogmas as divine truths, clearly revealed in the Word of God, formulated by some competent Church body, and regarded as authoritative, because they are derived from the Word of God. Though they ascribed to them a great measure of permanence and stability, they did not, and do not now, regard them as infallible.
  
                  A notable change came about through Schleiermacher, who veered from the objective to the subjective in his conception of the source of dogmas. Since he considered Christian experience as their source, he saw in them the intellectual expressions, authorized by the Church, of the inner meaning of the religious experiences of the Christian community. Ritschlian theology pretends to be more objective in its conception of dogmas, but is, as a matter of fact, just as subjective. It regards dogmas as the scientific affirmations of the faith of the Church, that is, not of the contents of this faith, but of that which is involved in it. In this representation faith, the fides qua creditur, becomes the source of dogmas, and this is just as subjective as religious experience. While it is perfectly true that this faith does not arise apart from the divine revelation, this is equally true of the religious experience of which Schleiermacher speaks.
  
                  The Schleiermacherian and Ritschlian conceptions of dogmas still prevail in many circles. But in more recent theology a new tendency is manifesting itself to recognize their objective character. P. T. Forsyth, of whom McConnachie speaks as "a Barthian before Barth," speaks of dogma as "final revelation in germinal statement," and as "God's act put as truth." The fundamental redemptive acts of God, revealed in the Bible (and therefore expressed in words), constitute the dogma, which is the foundation of the Church. In distinction from it, doctrine is the interpretation of the revealed dogma, and therefore not the foundation, but the product of the Church. Even the interpretations of the acts of God found in Scripture must be regarded as doctrines rather than as dogmas.
  
                  There is indeed some agreement between the position of Forsyth and that of Barth, though there are also points of difference. Barth distinguishes between 'dogma' in the singular and 'dogmas' in the plural. He defines 'dogma' as "Church proclamation, so far as it really agrees with the Bible as the Word of God." In another place he speaks of it as "the agreement of Church proclamation with the revelation attested in Holy Scripture."3 And this revelation is not to be regarded as a doctrinal proposition, but rather as divine action, as a behest or decree, calling for action on man's part. 'Dogmas' in the plural, however, are "the doctrinal propositions acknowledged and confessed by the Church, which are deposited in the Church Symbols, with their relative authority." They are the word of man which comes out of the Word of God, worthy of veneration and respect indeed, yet only the word of man. They do not constitute the object, (like 'dogma'), but only the expression of faith.
  
                  Finally, Micklem is also very much in line with these two men, when he says: "The fundamental and distinctive dogmas of the Christian faith are not in terms of abstract truth, but in terms of the mighty acts of God. That which forms an essential part of the gospel story is dogma; that which is interpretation of the story is theology." The final statement also applies to the interpretation that is found in the Bible itself. It need hardly be said that the views of these men are moving along lines which are quite foreign to Reformed theology.
              - b-the-formal-characteristics-of-dogmas: |-
                  B. The Formal Characteristics of Dogmas
  
                  Some have spoken of dogmas simply as the substance of the Christian faith, but this view is too indefinite and finds no support whatsoever in Scripture. It does not do justice to their official character. They are truths derived from the Word of God, but the fact that they are so derived does not yet make them dogmas in the strict sense of the word. There are no dogmas as such in the Bible, though the doctrinal teachings which they embody are found there. But these become dogmas only when they are formulated and officially adopted by the Church. It may be said that religious dogmas have three characteristics, namely: their subject-matter is derived from Scripture; they are the fruit of the reflection of the Church on the truth, as it is revealed in the Bible; and they are officially adopted by some competent ecclesiastical body.
  
                  1. THEIR SUBJECT-MATTER IS DERIVED FROM SCRIPTURE. The Bible is God's Word, the book which is His continuous revelation of redemption for all successive generations. It acquaints us with the mighty redemptive acts of God, and also furnishes mankind with a reliable interpretation of these acts. It may therefore be said to be both a word—and a fact—revelation; and both these words and facts have doctrinal significance. Naturally, the meaning of the facts can only be expressed in words. Both the facts and the words have doctrinal significance, and therefore furnish the subject-matter of dogmas. The position of those who find the real revelation of God in Scripture only in the mighty redemptive acts of God (as Forsyth, Barth, Bultmann, Micklem) involves a denial of the fact that every part of the Bible is equally the Word of God. Moreover, it does not take sufficient account of the fact that we have no reliable information respecting the acts of God apart from the words in which He Himself describes these. And the idea that only the acts of God put as truth, or proclaimed by the Church, form the real foundation for dogma(s), clothed with divine authority, really makes an unwarranted distinction between the Scriptural words which describe the facts and the words which interpret them, by regarding the latter as less authoritative. According to our Reformed conception the Bible does not contain dogmas, but does contain the doctrinal truths which they embody. Doctrinal propositions, which are not derived from the Word of God, can never become ecclesiastical dogmas.
  
                  Roman Catholics speak of dogmas in the strict sense of the word as "truths contained in the Word of God, written or unwritten—i.e. in Scripture or tradition—and proposed by the Church for the belief of the faithful." The Vatican Council expresses itself as follows: "Further all those things are to be believed with divine and Catholic faith which are contained in the Word of God, written or handed down, and which the Church, either by a solemn judgment, or by her ordinary and universal magisterium, proposes for belief as having been divinely revealed." Historical Protestantism, of course, does not thus coördinate Scripture and tradition. It maintains that the doctrinal truths embodied in dogmas are either contained explicitly in Scripture, or are deduced from it by "good and necessary consequence." Dogmas are not mere repetitions of Scripture statements, but careful, albeit human and therefore fallible, formulations of doctrines contained in the Word of God. Their subject-matter is derived from Holy Writ. If it were not so derived, they would not be dogmas.
  
                  It is not superfluous to stress this fact at the present time. Since the beginning of the nineteenth century another view of the derivation of dogmas gradually gained the ascendancy in some Protestant circles. Schleiermacher, the father of modern theology, does not derive the material content of the dogmas of the Church from the facts or truths revealed in Scripture, but from the Christian consciousness or Christian experience. He declares the articles of faith to be "conceptions of pious feeling set forth in language." On that view they cease to be statements of the truth respecting God and His will, and become mere expressions of the meaning of the ever changing experience of man. Mackintosh correctly says: "If words mean anything, doctrine is for him a statement about our feeling, not about God." And from this it also follows that for Schleiermacher it is not the question, whether the dogmas of religion are objectively true, but only whether they rightly express the various states of feeling. Edghill says that he conceives of dogma as the expression of "ever varying life," and points out that this involves the denial of any permanent authority in the statement of religious "belief."2
  
                  The Ritschlian view does not differ from this materially, though it pretends to be more objective by taking its starting point in the revelation of God given in Jesus Christ. It seems rather encouraging to find Kaftan saying: "Voraussetzung ist dabei, dass die Dogmen aus goettlicher Offenbarung stammen und, auf evangelischem Gebiet, dass sie dem Glauben und Bekenntniss der Gemeinde entsprechen." But it soon becomes apparent that, while he certainly wants to take account of the objective revelation of God in Jesus Christ, he interposes the faith of the Church between this revelation and the dogmatician. And when he speaks of faith, he is not thinking of faith in the objective sense, as it is expressed in the symbols of the Church, the fides quae creditur, but of faith in the subjective sense, the fides qua creditur. Moreover, he does not even conceive of this faith as an intellectual apprehension of the truth revealed in the Word of God, but as fiducia, trust, that is, as a practically conditioned spiritual relationship to its object, which is presented in the Word of God. This faith includes knowledge, but this knowledge is practical, experiential rather than intellectual, knowledge resulting from a life in communion with God. Man cannot know God, except as He is mirrored in faith. (Kantian) And this practical knowledge, involved in faith, is expressed in dogmas. Thus dogmas are not the object, but the expression of faith. Faith becomes the source of dogmas. This means that Ritschlian theology rejects the older Protestant conception of dogmas as formulations of the truth that is found in the Word of God, and seeks to derive their content from the Christian faith as this is determined in a rather speculative way by value judgments. "Dogma," says Lobstein, another Ritschlian scholar, "is the scientific exposition of the Protestant faith." On page 75 of the same work he states explicitly that "the source of dogmatics is faith."
  
                  A somewhat similar subjective view is also found among the Ethicals in the Netherlands. J. Van der Sluis in his work on De Ethische Richting, p 23, quotes a word of Prof. D. Chantepie de la Saussaye, which is very much in harmony with the Ritschlian position: "De leer onstaat na en door het leven. Zij is de vrucht van het nadenkend verstand over de waarheid, wanneer die waarheid tot leven geworden is in de ziel." And Dr. Is. Van Dijk says: "Indien wij een bepaling van dogme moesten geven, wij zouden het aldus doen: Het dogme is de vrucht der poging, een bepaalde relatie van het leven der gemeente in de taal des verstands om te zetten."2
  
                  2. DOGMAS ARE THE FRUIT OF DOGMATIC REFLECTION. The Church does not find her dogmas in finished form on the pages of Holy Writ, but obtains them by reflecting on the truths revealed in the Word of God. The Christian consciousness not only appropriates the truth, but also feels an irrepressible urge to reproduce it and to see it in its grand unity. While the intellect gives guidance and direction to this reflection, it is not purely an intellectual activity, but one that is moral and emotional as well. The understanding, the will, the affections, in short, the whole man, is brought into play. All the faculties of his soul and all the movements of his inner life contribute to the final result. Broader still, it is not merely the individual Christian, but rather the Church of God as a whole, under the guidance of the Holy Spirit, that is the subject of this reflective activity. The spiritual man is the only one that is fit for this work, and even he can obtain a proper and adequate understanding of the truth in all its relations, and in all its fulness and grandeur, only in communion and in coöperation with all the saints. When the Church, led by the Holy Spirit, reflects on the truth, this takes a definite shape in her consciousness and gradually crystalizes into clearly defined doctrinal views and utterances. The formation of dogmas is not always a short process, nor is it a simple one. Its course is frequently determined more or less by long-drawn controversies. These are not always edifying, since they often generate a scorching heat and frequently lead to unholy antagonisms. At the same time they are of the greatest importance, and serve to focus the attention sharply on the question in debate, to clarify the issue at stake, to bring the different aspects of a problem into the open, and to point the way to a proper solution. The Church is largely indebted to the great doctrinal controversies of the past for its progress in the understanding of the truth. Seeberg calls attention to the various elements that entered into the construction of dogmas when he says: "Dogma is an exceedingly complicated historical structure. It has in it various constituent parts, constructed as they have been in the face of multifarious forms of opposition, and under the inspiration of many practical (ethical and devotional) impulses and external (political and canonical) occasions, received the impress of different theological tendencies."2 Not all periods of history have been equally conducive to the reflection required for the formation of dogmas. It calls for deep spirituality, for religious fervor, for willing subjection to the truth as it is revealed in the Word of God, for a consuming passion to gain an ever-increasing insight into the truth in all its bearings, for diligent exegetical study, and for constructive ability. Cold Rationalism and sentimental Pietism are equally inimical to it. And certainly such an age as ours, in which philosophical speculations and psychological analyses have largely taken the place of real theological study, is not favorable to the construction of theological dogmas. There is very little recognition of the supreme importance of reflecting on the truth as it is revealed in the Word of God. In fact, there is a widespread and decided opposition to the idea that man must lead his thoughts captive to the obedience of Christ, and must in his search for the truth respecting God and man, sin and redemption, life and death, base his thought on the word of authority, the inspired Word of God, rather than on the discoveries of fallible human reason.
  
                  3. DOGMAS ARE OFFICIALLY DEFINED BY SOME COMPETENT ECCLESIASTICAL BODY. The final step in the formation of dogmas is their specific formulation and formal acceptance by some official Church body. It is generally agreed that such an official action of the Church is necessary. Roman Catholics and Protestants are of the same opinion on this point. And even modern theologians, in spite of their subjectivism, voice their concurrence, because they believe that "dogma must have attached to it an idea of collectivity and an idea of authority." Schleiermacher recognized only those religious truths as dogmas, which were accepted as such by the Church. Lobstein says: "It is very evident, in effect, that dogma, in its precise and historical sense, is nothing other than a creed officially defined and formulated by a competent authority, that is to say, in this case, by the Church going hand in hand with the State." And even George Burman Foster declares: "Dogmas are deliverances concerning faith, sustained by ecclesiastical authority."2
  
                  The question may arise, What Church body has the power to determine what should be believed? Harnack virtually takes the position that only an ecumenical council, representing the Church as a whole, can do this. For that reason he also denies the existence of a Protestant dogma. He points out that Protestantism broke up the unity of the Church, and itself does not present a united front. Naturally, the Churches of the Reformation do not share this view. Reformed Churches particularly have always stressed the fact that every local church is a complete representation of the Church of Jesus Christ, and therefore also has the potestas dogmatica or docendi, the power to determine what shall be recognized as a dogma in her own circle.
  
                  But if such a local church is affiliated with a number of similar churches in a larger organization, it will naturally have to leave this matter to major assemblies. It goes without saying that the dogmas officially defined by the ecumenical councils best satisfy the communal consciousness of the Church; but it is arbitrary to speak of the dogmas formulated by these councils as the only real dogmas.
  
                  The dogmas officially attested by the church have authority in the circle in which they are recognized. There is a difference of opinion, however, as to the nature of this authority. The Roman Catholic Church ascribes to its dogmas absolute authority, not only because they are revealed truths, but even more particularly because they are infallibly apprehended and proposed by the Church for the belief of the faithful. The following statement in A Catholic Dictionary, Article Dogma is significant: "Hence with regard to a new definition—such, e.g., as that of Transubstantiation, Christians have a two-fold duty. They are obliged to believe, first, that the doctrine so defined is true, and next that it is a part of the Christian revelation." Here the declaration of the Church has priority. Scripture and tradition, says Wilmers, are "only the remote or mediate rules of faith, while the immediate rule is the teaching Church." Faith consists in the implicit acceptance of the truth from the hands of the ecclesia docens (the priesthood). And the authority of dogmas is really based on the formal declaration of the Church. That authority is absolute, because the Church is infallible.
  
                  The Churches of the Reformation broke with this view. While they maintain that a doctrine does not become a dogma, and does not acquire ecclesiastical authority, until it is officially defined and accepted by the Church, they ascribe authority to it only because, and in so far as, it is founded on the Word of God. Their view of the matter can perhaps be best stated as follows. Materially (that is, as to contents) dogmas derive their authority exclusively from the infallible Word of God, but formally (that is, as to form) they derive it from the Church. Barth has a somewhat different view on this point. According to him dogma, in the singular, is Church proclamation in so far as it agrees with the revelation attested in Scripture. That revelation is not primarily a disclosure of truth, though this is involved, but a kerugma, a herald's call, a divine imperative, which calls for a response on the part of man. That kerugma, that behest, must be made contemporary in Church proclamation. Hence this should not introduce God as an object about which man must speak, but as a subject which addresses man, and to which man must respond. And in so far as it does this, and is therefore really in agreement with the revelation attested in the Bible, it is dogma. Church proclamation is an approximation to the original revelation, and not a perfect reproduction of it; but in so far as it does agree with it and is therefore really God speaking to sinners in the present, it is clothed with divine authority. The dogma so conceived should be distinguished from the dogmas (plural), in which it is not God who speaks, but the Church, and which for that reason have only relative authority. They are doctrinal propositions acknowledged and formulated by the Church, the word of man which comes out of the Word of God. In them the Church of the past speaks to present generations, and passes on or reproduces the truth of God's revelation in so far as it has learned to understand it under the guidance of the Holy Spirit.
  
                  Naturally, the followers of Schleiermacher, and even those of Ritschl, do not share the Reformed conception of the authority ascribed to the dogmas of the Church, though they pretend to be in agreement with the position of the Reformers. They regard the view, presented in the preceding as that of Reformed theology, as being in reality the mistaken idea of Protestant Scholasticism which came nigh wrecking the work of the Reformation. For them dogmas are not derived from Scripture, but from the Christian consciousness, that is, from religious experience or from the Christian faith. They are clothed with authority only because they are sanctioned by the communal consciousness of the Church (Schleiermacher), or by that of Church and State combined (Lobstein). Moreover, the authority which they have is not normative and regulative, so as to require submission and demand obedience, but is merely, as Lobstein calls it, "a manifestation of the intrinsic force of the truth, a demonstration of the spirit and of power." Hence it is also regarded as a serious blunder to ascribe a legal character to the Creeds, which embody the dogmas of the Church, and to regard them as a possible basis for disciplinary action.
              - c-the-necessity-of-dogmas: |-
                  C. The Necessity of Dogmas
  
                  The present age is an undogmatic age. There is a manifest aversion, not only to dogmas, but even to doctrines, and to a systematic presentation of doctrinal truth. During the last half a century very few dogmatical works made their appearance, while the market was flooded with works on the History of Religions, the Philosophy of Religion, and the Psychology of Religion. The assertion is often heard that Christianity is not a doctrine but a life, and that it makes very little difference what we believe, if we but share the life of Christ. There is an insistent cry, especially in our own country, for a Christianity without dogmas. Dogmatical preaching is not in favor and is therefore avoided in many circles. Many conservative Christians clamour for purely experiential preaching, while others of a more liberal type greatly prefer ethical or social preaching.
  
                  1. CAUSES OF PRESENT DAY OPPOSITION TO DOGMAS. The question naturally arises as to the possible explanation of this opposition to dogmas. In the Christian Church at large it can only be explained as the result of certain philosophical tendencies. Under the influence of Kant the dogmas of the Church gradually fell into disrepute. He denied the possibility of theoretical knowledge of those things that transcend the phenomenal world, and therefore also of such knowledge of divine things. His epistemology was of far reaching influence, and received a new impetus in the theology of Ritschl and his disciples. The result was that so-called theoretical knowledge of God and divine things soon fell into disrepute in many circles. Hegel complained about the undogmatic spirit of his day and sought to rehabilitate Christian dogma by means of speculative philosophy. Like the Gnostics of the second century, he proceeded on the assumption that, if it were pointed out that Christianity is really a philosophy, it would naturally become popular in educated circles. And therefore he stressed the fact that true philosophy, consistently carried through, necessarily leads to the tenets of the Church; and that Christian doctrines are nothing less than speculative truths in pictorial form. In his opinion it was only necessary to strip off this form, in order to liberate and disclose the real spiritual kernel of philosophical truth. But the attempt to change the foolishness of God into the wisdom of the world proved abortive. In the hands of left-wing Hegelians, like Strauss and Biedermann, it soon became evident that, after the so-called husk was removed, there was very little Christianity left, and that the philosophical kernel was something quite different from the truth revealed in the Word of God. The Hegelian operation really resulted, as Kaftan says, in "the breaking-up of dogma."
  
                  The reaction that arose took the form of Neo-Kantianism in the theology of Ritschl. Says Dr. Orr in his work on The Ritschlian Theology, p. 33f.: "As a primary service, Kant furnished Ritschl with a theory of knowledge precisely suited to the requirements of his system. That our knowledge is only of phenomena; that God is theoretically incognoscible; that our conviction of His existence rests on a practical, not on a theoretic judgment—these are thoughts which, we shall see, are raised in Ritschlian circles almost to the rank of first principles." Hence it is no wonder that the work of Ritschl, and of such followers of his as Lotze, Herrmann, Harnack, Sabatier, and others, was on the whole unfavorable to Christian dogma, though theoretically it did not rule it out altogether.
  
                  Finally, Dreyer in his Undogmatisches Christentum makes a plea for a Christianity without dogma. He argues (a) that the ancient dogmas were naturally cast in the conceptual forms of the day in which they arose, and that these forms become a hindrance in a time when religious views have undergone a fundamental change; and (b) that dogmas endanger the independence and freedom that is indispensable for the Christian faith. It will readily be seen that only the second argument bears against dogmas as such, but it is exactly this argument that marks the real tendency of the work under consideration. Kaftan and Lobstein quite agree with Dreyer, that dogmas have often been a hindrance to faith, but at the same time consider them necessary and plead for a new dogma. Troeltsch comes to the conclusion that "an Ecclesiastical Protestant system of dogma no longer exists," and that the Protestant Churches will have to seek "union and cohesion" in some other sphere than that of dogma.
  
                  Alongside of this direction of philosophical thought, there have, of course, been many other influences, too many to enumerate, which have operated and continue to operate to make dogmas unpopular. Religious free-thinkers repeatedly raise their voices against dogmas, as encroaching upon their religious liberty and call for freedom in the Church. They not infrequently pose as the real champions of the right of private judgment, one of the fundamental principles of the Reformation. On more than one occasion a one-sided dogmatism led to a pietistic reaction. And it is characteristic of Pietism that it is hostile to all intellectualism in religion and exalts emotionalism and experience as the only real manifestation of the religious life. It bids Christian people escape from the wrangling of doctrinal controversies by withdrawing into the citadel of the heart, the seat of the affections. In our own country Pietism has found a rather welcome ally in an Activism, which holds that it makes little difference what one believes, provided one is only busy in the work of the Lord. A great number of American Christians are much too busy in all kinds of church activities to concern themselves very much about the study of the truth. They are practical pragmatists and are interested only in a religion that promptly yields tangible results. Their knowledge of dogmas has been reduced to a minimum. In fact both Pietists and Activists often claim that Christian people should disengage themselves from the complexities of present day doctrinal systems and return to the simplicity of the Apostolic Age, and preferably to the words of Jesus, who did not concern Himself about dogmas. Many other anti-dogmatic tendencies might be mentioned, but these are sufficient to give us at least some understanding of present day opposition to dogmas.
  
                  2. DOGMAS ESSENTIAL TO CHRISTIANITY. The necessity of dogmas may be argued in various ways. Even the followers of Schleiermacher and Ritschl defend it in spite of their subjectivism, and notwithstanding their mysticism and moralism. Several reasons at once suggest themselves, why Christianity cannot dispense with dogmas.
  
                  a. Scripture represents the truth as essential to Christianity. The assertion often heard in our day, that Christianity is not a doctrine but a life, may have a rather pious sound, and for that very reason seems to appeal to some, but is after all a dangerous falsehood. It has been pointed out repeatedly, and has in recent years again been emphasized by Dr. Machen in his Christianity and Liberalism, that Christianity is a way of life founded on a message. The gospel is the self-revelation of God in Christ, which comes to us in the form of truth. That truth is revealed, not only in the Person and work of Christ, but also in the interpretation of these found in the Bible. And it is only by a proper understanding and a believing acceptance of the message of the gospel, that men are brought to the necessary self-surrender to Christ in faith, and are made partakers of the new life in the Spirit. The reception of that life is not dependent on some purely mystical infusion of grace, nor on the proper ethical conduct of man, but is conditioned by knowledge. "And this is life eternal," says Jesus, "that they should know thee, the only true God, and Him whom thou didst send, even Jesus Christ." Paul says that God would have "all men to be saved, and come to the knowledge of the truth." He represents it as one of the grand ideals of the ministry, that all believers may "attain unto the unity of the faith, and of the knowledge of the Son of God, unto a full-grown man, unto the measure of the stature of the fulness of Christ." And Peter says that the divine power "hath granted unto us all things that pertain unto life and godliness, through the knowledge of him that called us by his own glory and virtue." Participation in the life of Christianity is everywhere in the New Testament made conditional on faith in Christ as He has revealed Himself, and this naturally includes knowledge of the redemptive facts recorded in Scripture. Christians must have a proper understanding of the significance of these facts; and if they are to unite in faith, must also arrive at some unitary conviction and expression of the truth. Jesus concludes His prayer for His immediate disciples with the words: "Sanctify them in the truth: thy word is truth," and then continues: "Neither for these only do I pray, but for them also that believe on me through their word; that they may all be one." The acceptance of the Word of God and spiritual unity go hand in hand. The same remarkable conjunction is found in the word of Paul: "Till we all attain unto the unity of the faith, and of the knowledge of the Son of God."4 The Bible certainly does not create the impression that the Church can safely disregard the truth, as it is revealed in the Word of God. Jesus stressed the truth, Matt. 28:20; John 14:26; 16:1–15; 17:3, 17; and the apostles were very much in earnest about it, Rom. 2:8; 2 Cor. 4:2; Gal. 1:8; 3:1 ff.; Phil. 1:15–18: 2 Thess. 1:10; 2:10, 12, 13; 1 Tim. 6:5; 2 Tim. 2:15; 4:4: 2 Pet. 1:3, 4, 19–21; 1 John 2:20–22; 5:20. They who minimize the significance of the truth, and therefore ignore and neglect it, will finally come to the discovery that they have very little Christianity left.
  
                  b. The unity of the Church demands doctrinal agreement. The Bible teaches the unity of the Church of Jesus Christ, and at the same time speaks of it as "the pillar and ground of the truth." In Ephesians 4 Paul stresses the unity of the Church of God, and clearly indicates as the ideal that its members all attain to the unity of the knowledge of the Son of God. This receives further emphasis in the 15th verse: "That we be no longer children, tossed to and fro and carried about with every wind of doctrine." He exhorts the Philippians that they shall "stand fast in one spirit, with one soul striving for the faith of the gospel." In this passage the word "faith" has in all probability the same meaning as in Jude 3, where the writer exhorts his readers "to contend earnestly for the faith which was once for all delivered unto the saints." If it does not entirely have the same meaning, it certainly approaches it. The apostle admonishes the Corinthians, that they "all speak the same thing," and that there be no divisions among them. They should be of one accord and of one mind. He considers this so important that he hurls his anathema at those who preach a gospel different from that which he had preached,2 and even insists on the exclusion of heretical persons. It is a stern judgment, which he pronounces in 1 Tim. 6:3–5; "If any man teacheth a different doctrine, and consenteth not to sound words, even the words of our Lord Jesus Christ, and to the doctrine which is according to godliness; he is puffed up, knowing nothing, but doting about questionings and disputes of words, whereof cometh envy, strife, railings, evil surmisings, wranglings of men corrupted in mind and bereft of the truth, supposing that godliness is a way of gain." Unity in the knowledge of the truth is evidently regarded as of the greatest importance to the well-being of the Church. If it includes men of all kinds of conviction, it will harbor in its bosom the seeds of discord, strife, and division. And that certainly will not minister to the edification of the saints and to the welfare of the Church, nor be conducive to its efficiency in the work of the Lord. And in striving for the unity of the Church it will hardly do to rest satisfied with the least common denominator in the confession of the truth, nor to say, Let us forget about doctrine, and get together by working together.
  
                  c. The duty of the Church requires unity in doctrine. Naturally, the Church as such can only be one in doctrine, if it has a common confession. This means that the Church must formulate and thus give expression to its understanding of the truth. Unity in doctrine therefore involves the confession of a common dogma. It will not do to admit that the Church may need doctrines, and at the same time to deny that she needs dogmas. The Church cannot perform her function in the world, unless she becomes conscious of, and gives clear expression to, the contents of her faith. The Church of Jesus Christ was appointed to be a depository, a guardian, and a witness of the truth, and can only be true to her calling, if she has a definite conception of the truth. Ministers are exhorted to hold fast the pattern of sound words, and believers in general, to contend earnestly for the faith once delivered to the saints, but how can they accomplish their important task, if there is no agreement as to the "sound words" and as to what the Church believes. The Church must deal with errorists, correcting, rebuking, and possibly excluding them from the fold, but cannot do this intelligently and effectively, unless she has a clear apprehension of the truth and therefore a definite standard of judgment. History clearly teaches that, before a Church can really pass judgment on heresies, she must have some official standard or test. And it goes without saying that she can never bear a united and powerful testimony to the truth, unless she herself presents a united front.
  
                  d. The position of the Church in the world calls for a united testimony. Every Church owes it to other Churches and to the world round about her, to make a public declaration of her teachings. If it is but natural that we desire to know something about the character and convictions of the people to whom we would entrust our material interests, it will certainly be considered highly desirable, and in fact quite essential, that we know exactly where a Church stands, in which we would seek spiritual guidance for ourselves and for our children. Moreover, one Church will have to know where another stands, in order to be able to determine in how far it can correspond, coöperate, and possibly affiliate with such a Church. The Church of Jesus Christ should never seek refuge in camouflage, should not try to hide her identity. And this is exactly what she does in the measure in which she fails to give a clear and unequivocal expression of her faith.
  
                  e. Experience teaches that dogmas are indispensable. Every Church has its dogmas. Even the Churches that are constantly decrying dogmas have them in effect. When they say that they want a Christianity without dogma, they are by that very statement declaring a dogma. They all have certain definite convictions in religious matters, and also ascribe to them a certain authority, though they do not always formulate them officially and acknowledge them candidly. History clearly proves that even the present day opposition, is not really an opposition to dogmas as such, but simply opposition to a certain kind of dogmas, or to certain specific dogmas, which do not find favor in the eyes of modern theologians. A Church without dogmas would be a silent Church, and this is a contradiction in terms. A silent witness would be no witness at all, and would never convince anyone.
              - d-the-elements-involved-in-dogmas: |-
                  D. The Elements Involved in Dogmas
  
                  Christian dogmas involve various elements, which are of great importance for the life of the Church. Of these the following three deserve special mention.
  
                  1. THE SOCIAL ELEMENT. Religious dogmas are not the product of individual Christians, but of the Church as a whole. Though the appropriation of the truth revealed in the Bible is first of all personal, it gradually assumes a communal and corporate aspect. It is only in communion with all the saints that believers can understand and confidently reproduce the truth. The personal reflection of the individual Christian thus gains the advantage of collective control, and the confidence which he may have in his own findings is naturally greatly strengthened by the fact that thousands of others reach the same conclusion. The communal or social character, which the dogmas thus acquire, may not be regarded as something accidental and of only relative importance, but should be thought of as something that is absolutely essential. Personal opinions, however true and valuable they may be, do not constitute Christian dogmas. Some extremists object to the social element of dogmas. They admit the necessity of reflecting on the truth, but are of the opinion that personal self-respect should prompt each one to decide for himself what is true. Each one should construct his own system of the truth, and should not concern himself about the ideas of others. It cannot be said, however, that they represent the prevailing tendency of our day in theological thought. Both Schleiermacher and Ritschl, in spite of the fact that their subjectivism makes for individualism in religion, strongly emphasize the communal element of dogmas. Harnack says, that there is "introduced into the idea of dogma a social element …; the confessors of one and the same dogma form a community." Sabatier, in speaking of the origin of dogmas, expresses himself as follows: "Dogma only arises when the religious society, distinguishing itself from the civil, becomes a moral society, recruiting itself by voluntary adherents. This society, like every other, gives to itself what it needs in order to live, to defend itself, and to propagate itself."2 And, finally, McGiffert says: "Schleiermacher's recognition of the social element has been reinforced in modern times by the study of the history and psychology of religion which has made it abundantly evident that our beliefs are largely social products, and that the notion that our individual reasons work in isolation to create our own independent faiths is a pure fiction."
  
                  2. THE TRADITIONAL ELEMENT. Dogmas also contain a traditional element. Christianity rests on historical facts which come to our knowledge through a revelation given and completed more than nineteen centuries ago. And the correct understanding and interpretation of these facts can only result from the continual prayers and meditation, from the study and struggles, of the Church of all ages. No one Christian can ever hope to succeed in assimilating and reproducing properly the whole content of the divine revelation. Neither is one generation ever able to accomplish the task. The formation of dogmas is the task of the Church of all ages, a task which requires great spiritual energy on the part of successive generations. And history teaches us that, in spite of differences of opinion and protracted struggles, and even in spite of temporary retrogressions, the Church's insight into the truth gradually gained in clarity and profundity. One truth after another became, the center of attention, and was brought to ever greater development. And the historical Creeds of the Churches now embody in concentrated form the best results of the reflection and study of past centuries. It is at once the duty and the privilege of the Church of our day to enter into that heritage of bygone years, and to continue to build on the foundation that was laid.
  
                  There is a manifest tendency, however, on the part of modern liberal theology to break with the past. Many of its representatives are often rather loud in their praises of the Creeds of the Church as historical documents, but refuse to acknowledge their doctrinal value for the present. And, sad to say, the so-called Fundamentalists of our day join hands with the liberals on this point with their well-known slogan, "No Creed but the Bible." They do not seem to realize that this really involves a break with the historical past of the Church, a refusal to profit by the lessons which the Churches of the Reformation passed on as a precious heritage to following generations in their great Creeds and Confessions, and a virtual denial of the guidance of the Holy Spirit in the past history of the Church. But modern liberal theology does not stop even there; it also breaks with the Bible itself as the authoritative source of all doctrinal truth. This is stated without any hesitation by Reville in the following words: "Not only has it (Liberalism) thrown off the yoke of the Protestant confessions of faith, because a thorough examination of these proved that they by no means faithfully reflected the teaching of Christ. But further, owing to the immense results reached by the historical and philological sciences during the nineteenth century, it has recognized that in the Bible itself there are many doctrines which come neither from the prophets, nor from Jesus, and which consequently are not to be considered as the faithful expression of the teaching of Christ." Such a position, of course, involves a rejection of the Bible as the Word of God, and further an utter disregard and denial of the guidance of the Holy Spirit in the past doctrinal history of the Church, a lack of respect for the prayers, the labors, and the struggles of the greatest and most pious teachers of the Church. It represents an unwarranted individualism in the development and formulation of the truth, an exaggerated notion of the ability of a single individual, or of the Church of a single generation to rear de novo a better structure of religious truth than the time-honored system of the past.
  
                  3. THE ELEMENT OF AUTHORITY. When the Churches of the Reformation officially define their doctrines and thereby turn them into dogmas, they also implicitly declare them to rest on divine authority and to be expressions of the truth. And because they regard their dogmas as embodiments of the truth revealed in the Word of God, they consider them as entitled to general recognition, and insist on such recognition in their own circles. The Roman Catholic Church claims absolute infallibility for its dogmas, partly because they are revealed truths, but especially because they are proposed for the faith of the faithful by an infallible Church. Her dogmas are absolutely unchangeable. The Vatican Council declared: "If any one shall assert it to be possible that sometimes, according to the progress of science, a sense is to be given to the doctrines propounded by the Church different from that which the Church has understood and understands: let him be anathema." This absolutism is not shared by the Protestant Churches. While they expect acceptance of their dogmas, because they regard them as correct formulations of Scripture truth, they admit the possibility that the Church may have been in error in defining the truth. And if dogmas are found to be contrary to the Word of God, they cease to be authoritative.
  
                  It is exactly this element of authority that meets with the greatest opposition in the present day. Both Roman Catholics and Protestants regard religion first of all as something given and determined by God, and therefore find the seat of authority in Him. According to the former it is especially the Church, while according to the latter it is the Bible, that is basic to this authority. Both recognize an objective standard of the truth, which finds expression in the dogmas of the Church and which demands submission, faith, and obedience. Eighteenth century Rationalism and Deism broke with the "medieval principle of religious authority," and substituted for it the standard of human reason, thus placing the seat of authority in man and making it purely individual. For Schleiermacher the content of dogmas is determined by religious experience, and for Ritschl, ostensibly by Jesus Christ as the Founder of the Kingdom of God, but in reality by the subjective faith of the Church. In the case of both the real seat of authority is in the religious consciousness; and the authority, of course, is not that of an objective norm, but that of an internal principle. Lobstein says: "From the point of view of the Protestant it is necessary to condemn every conception which makes of dogma an authoritative and obligatory decision of the church in the sense of a statutory and legal ordinance." According to the dictum of Sabatier, another Ritschlian, "The outward authority of the letter has given place to the inward and purely moral authority of the Spirit."2 This French scholar argues that the human spirit has finally been emancipated from the principle of authority, and has become autonomous, which means that "the consent of the mind to itself is the prime condition and foundation of all certitude." This is tantamount to the rejection of all real authority. Barth rejects both the Roman Catholic and the modern liberal conception of dogmas. He ascribes absolute authority to dogma (singular), since it agrees with revelation, and relative authority to dogmas, that is, to he doctrinal propositions formulated by the Church, in so far as they spring from the root of revelation.
  
                  QUESTIONS FOR FURTHER STUDY: Has the Church of Rome power to make new dogmas? Does it assume that the Pope has this power? If not, does it not follow that, according to this Church, dogmas as such are contained in the Word of God? How does Cardinal Newman's conception of the development of dogmas fit in with the Roman Catholic view of the unchangeableness of dogmas? What is the Protestant view as to the formulation of new dogmas? Do science and philosophy also furnish a part of the content of dogmas, or do they affect their form only? What is Harnack's conception of dogma? How does he conceive of its origin? What objections are there to his view? What factors in present-day life serve to strengthen the aversion to dogmas? Is there any Church in existence that has no dogmas?
  
                  REFERENCES: Bavinck, Geref. Dogm. I, pp. 1–10; Hepp, De Waarde Van Het Dogma; Is. Van Dijk, Begrip en Methode der Dogmatik, pp. 1–28; Hodge, The Idea of Dogmatic Theology, in The Princeton Theological Review, Jan., 1908, pp. 52–60; Lobstein, An Introduction to Protestant Dogmatics, pp. 1–57; Kaftan, The Truth of the Christian Religion, Vol. I, and Dogmatik, pp. 1–9; Ihmels, Centralfragen der Dogmatik, pp. 1–30; Sabatier, Outlines of a Philosophy of Religion, pp. 229–343; Otten, Manual of the History of Dogmas I, pp. 1–4; Meyrick, Is Dogma a Necessity?; Barth, The Doctrine of the Word of God, pp. 11–15, 284, 304 ff.; The Word of God and the Word of Man, 229.
              - a-the-relation-of-dogmas-to-dogmatics: |-
                  A. The Relation of Dogmas to Dogmatics
  
                  THE discussion of dogmas naturally leads on to an inquiry as to the relation in which they stand to Dogmatics. The very name 'Dogmatics' suggests a very close relation. It is derived from the singular 'dogma' rather than from the plural 'dogmata,' and as such points to the fact that it deals not merely with certain separate dogmas, but with the dogma of the Church as a whole. The exact relation between dogma and Dogmatics has not always been conceived of in the same way. The most common view is that dogma forms the subject-matter of Dogmatics, so that the latter might be called the science of Christian dogma. Thus it may be said that Dogmatics deals with the doctrinal truth of Scripture in a systematic way, and more particularly with that truth as it is confessed by the Church. It studies the doctrine of the Church as a whole, and considers each article of faith in its relation to the whole. As such it is not only Scriptural, though it must be this first of all, but also bears an ecclesiastical imprint. Schleiermacher's conception of dogma differs from that of the Protestant Church in general, since he does not acknowledge its derivation from Scripture, but agrees with it in its representation of dogma as the subject-matter of Dogmatics. According to him dogmatic theology is the science of the doctrine professed by a Christian Church at a given moment of its historical development. The Ritschlian view of the relation between dogma and Dogmatics does not differ from that just indicated. Kaftan says: "Die Dogmatik hat es demnach mit einem gegebenen object zu thun, mit der christlichen Wahrheit, die die Kirche auf grund der goettlichen Offenbarung glaubt und bekennt." Harnack claims, however, that the Church has not been altogether honest in its representation of the relation between dogmas and Dogmatics. According to him history teaches that dogmas are the product of theology. The Church, however, obscured their real origin, declared them to be revealed truths, and as such made them basic for theology.2 According to Forsyth dogma is "final revelation in germinal statement. It is God's act put as truth," and is therefore a part of God's revelation. "Doctrine is truth about dogma, dogma expanded … It is secondary theology, or the Church's grasp—as in the creeds. Theology is doctrine in the making. It is tertiary and tentative theology or the Church's reach—as in 1 Pet. 1:18, 19, 20." Dogma is for him the marrow of the gospel, the vital core of revelation, and is therefore found in Scripture. It is the root, out of which doctrine develops through the theological study of the Church. "Theology is tentative doctrine; doctrine is selected theology." This is rather strikingly similar to the view of Barth. Defining dogma (singular) as Church proclamation, so far as it is in real agreement with the Word of God, Barth regards Dogmatics as the science, not of dogmas, but of dogma, which inquires into the agreement of dogma with the revelation attested in Scripture. It therefore serves to test dogma. He does not believe that dogmas (plural) form the subject-matter of Dogmatics, though their understanding and formulation may be greatly promoted by Dogmatics. Forsyth looks upon dogma as a part, and in fact the vital core, of God's revelation, and Barth comes very close to the same evaluation; so close in fact that he too, like Forsyth, regards dogma as the object of faith. They further agree in denying that dogmas or doctrines should be regarded as objects of faith, and insist on it that these are mere expressions of the faith of the Church. Both are also of the opinion that the prevalent conception of dogma is that of Protestant Scholasticism, and not that of the Reformers. In the discussion of the historical conception of the Protestant Churches respecting the relation between dogmas and dogmatics attention must be called to several propositions.
  
                  1. DOGMAS ARISE OUT OF THE NECESSITIES OF THE BELIEVING COMMUNITY. Seeberg says in opposition to Harnack: "Although the form of dogma is the work of theology, its content is derived from the common faith of the Christian Church." This is a welcome correction of Harnack's view that dogmas are the product of theology, but can hardly be considered as a correct designation of the source from which dogmas are derived. It is more in harmony with the Ritschlian position. Rainy is more Reformed in his thinking, when he first points out that doctrines (dogmas) are derived from Scripture, and then says: "I do not think that it is the scientific interest which primarily calls out Christian doctrine; nor is it an obligation to comply with the formal conditions of science, which this activity properly obeys; nor do I think that the scientific impulse has been, historically, the creative force in this department.… Doctrine is maintained to arise not primarily in obedience to the scientific interest or impulse, but out of the necessities of the believing mind."3
  
                  Dogmas cannot be made to order. They cannot be produced by individual theologians, nor by scientific theology in general, and then imposed upon the community of believers from without. Chances are that dogmas so constructed and proposed would not really express the faith of the Church, would not strike a responsive chord in the communal life of believers, and consequently would not be recognized as authoritative. They are formed only in periods of intense spiritual life, of wide-spread and earnest reflection on the truth, and of deep religious experience. It is only when the Church thinks deeply on the truths of Scripture, when under the stress of religious controversies she has learned to see the truth sharply and clearly, and when definite convictions have gradually become the common property of the religious community, and thus a communis opinio is formed,—it is only then that she will be ready to confess, and will feel within herself an irresistible urge to give expression to her faith. Only the truth so confessed really constitutes a confession of faith, is rooted in the life and experience of the Church, and therefore also has a grip on the Church. Only the dogmas that spring from this living soil can be called in the words of Rainy "the human echo to the divine voice," or "the human response to the divine message."
  
                  2. THEOLOGY MAY AND HAS FREQUENTLY SERVED AS AN AUXILIARY IN THE FORMATION OF DOGMAS. While denying that dogmas are merely the product of theology, we need not close our eyes to the fact that, for their final formulation, the Church was often greatly indebted to theology. It need hardly be said that in the reflective activity of the Christian community some would be far more influential than others; and that, if all other things were equal, those who had special religious training would form the vanguard. As the spiritual leaders of the people, and as the interpreters, the historians, and the systematicians of the Church, they would naturally point the way in the careful formulation of dogmas. And it was but natural that, when the science of theology developed, this should also be pressed into service and become a powerful auxiliary in the process. This could not be otherwise, because it has, in its own field, the special task of reflecting on the truth as it is revealed in the Word of God, and of reproducing this truth in systematic form. Yet it should be borne in mind that the work of theology in this sphere is of a purely formal nature. It does not furnish the subject-matter of the dogmas, but merely helps the Church in forming and defining her dogmas. Naturally, in the measure in which theology took a hand in the formation of dogmas, these assumed a more systematic form than they would otherwise have had.
  
                  3. DOGMATIC THEOLOGY FINDS THE NUCLEUS OF ITS SUBJECT-MATTER IN THE DOGMAS OF THE CHURCH. Though theology may serve as an auxiliary in the formation of dogmas, this is not its main concern with the dogmas of the Church. These form the nucleus of the material with which it must build and which it must rear into a systematic structure, and will therefore naturally have a determining influence on the texture and the complexion of the system as a whole. They will occupy a very important place in it and lend it a distinctive character. The dogmatician takes his stand in the confessional teachings of the Church to which he belongs; these form his bias, if you will. It may be objected that this naturally endangers his intellectual liberty, but this is not necessarily the case. As long as he remains a member of that particular Church, it may be assumed that he does this from conviction. And if this is the case, he will naturally regard the dogmas of his Church more as friendly guides, acquainting him with the direction in which he should move, than as hateful fetters that impinge on his liberty. Moreover, it is well to remember that no one is ever entirely unbiased in his scientific work; and that the dogmatician who refuses to be biased by the dogmas of his Church should not pose as its dogmatician. To do so would be ethically reprehensible. We repeat that these dogmas constitute the most important part of the materials which he must use in the construction of his system, and will so enter into the structure of it as to form its nucleus and core, and also its unifying element.
  
                  But the theologian cannot limit himself to the dogmas that are contained in the Confession of the Church, for this is by no means an exhaustive expression of its faith. He must utilize all the doctrinal truths that are revealed in the Word of God, and doing that, of course, also draw upon the fruits of other studies, such as Exegesis, Biblical Theology, History of Doctrines, and others. He may find it profitable to levy contributions from individuals and groups. But whatever elements he incorporates in his system, he must present, not merely as historical data, but as component parts of the structure which he is rearing, and which he regards not merely as an expression of his own belief but as absolutely valid truth. Moreover, he cannot consider these doctrines as bare abstract intellectual formula, and as so many isolated truths, but will have to study and present them as living plants, which have come to development in the course of the centuries and strike their roots deep down into Scriptural soil, and must view them in their grand unity.
  
                  Naturally, modern theology, under the influence of Schleiermacher and Ritschl, has a somewhat different conception of the relation between dogmas and dogmatics. Litchtenberger states the position of Schleiermacher in a single sentence, when he says that, according to the father of modern theology, "Dogmatics describes not doctrines nor facts which have been revealed in a super-natural manner, but experiences of the human soul, or the feelings which the religious soul experiences in its relations with Jesus the Savior." Lobstein represents the Ritschlian position. Says he: "Like dogma, like dogmatics. There obtains between the notion of dogma and the role of dogmatics a necessary and direct relation.… It is clear that a return to the vital principle of the Reformation and the corresponding transformation of the idea of dogma in the evangelical Church involves a parallel modification of the task entrusted to the dogmatician. Dogmatics … is the scientific exposition of the Protestant faith.… Dogmatics creates nothing; it merely formulates the problems whose elements are given to it by the religious experience of the Christian in the presence of the living realities of the gospel. Dogmatics is an experimental and positive science, but it receives its material from faith; rather its material is faith itself with the divine content of faith."2
  
                  Is. Van Dijk, a representative of the Ethical Movement in the Netherlands, which reminds one somewhat of both Schleiermacher and Ritschl but seems to owe its greatest debt to Vinet, puts it as follows: "Het dogme is de vrucht der poging om een bepaald moment, een bepaalde relatie van het leven der gemeente in de taal des verstands om te zetten, terwijl de dogmatiek dan is de beschrijving, de omzetting in begrippen van dat leven in zijn geheel." The objection that this obliterates the distinction between dogmatics and ethics, is met by the remark that, though both describe life, they do not contemplate life in the same sense: … "de dogmatiek beschrijft den grond en den inhoud, deethiek de openbaring en het ideaal van het leven."
              - b-the-object-of-dogmatic-theology: |-
                  B. The Object of Dogmatic Theology. (Its Definition)
  
                  The question of the object of theology, and therefore also of dogmatic theology, can be considered very appropriately in connection with its definition. Theology has not always been defined in the same way. A brief consideration of the most important definitions that have been suggested in course of time may be helpful in determining what has been and should be considered as the object of theology.
  
                  1. THE CONCEPTION OF THE OBJECT OF DOGMATIC THEOLOGY IN EARLY PROTESTANT THEOLOGY. Previous to the Reformation there were various ideas respecting the object of Dogmatic Theology. According to Augustine it deals with God, the world, man, and the sacraments. Peter the Lombard shared this view. Others (Alexander of Hales, Bonaventura) regarded the mystical body of Christ, that is, the Church, and still others (Hugo of St. Victor), the redemptive work of God, as the object of Dogmatic Theology. Thomas Aquinas expressed himself as follows: "Theologia a Deo docetur, Deum docet, et ad Deum ducit" ("Theology is taught by God. teaches God, and leads unto God"). This is more in harmony wth the etymology of the word in so far as it represents God as the object of theology. A considerable number of both Lutheran and Reformed theologians of the post-Reformation period defined theology as the knowledge or science of (concerning) God. Some objected to this on the ground that it is not possible for us to have a perfect knowledge of God on earth. But the men who used this definition were generally quite careful to point out that they did not have in mind the knowledge which God has of Himself (archetypal knowledge), but the knowledge which man has of God in virtue of His Self-revelation, (ectypal knowledge.) They considered such knowledge of God possible, because He revealed Himself. The desire to stress the practical nature, of this science prompted some seventeenth century theologians to define it with reference to its end or purpose rather than with a view to its object. They conceived of it as teaching man the true religion unto salvation, the life for God in Christ, or the service of God that is well-pleasing to Him. These and other, somewhat similar, descriptions are found in the works of Hollaz, Quenstedt, Gerhard. Amesius, Mastricht, and à Marck. In general it may be said, however, that Reformed theologians conceived of theology as the science of (concerning) God. However, this simple definition frequently received certain complementary additions. It often assumed some such form as the following: Theology is the science of God and of divine things; or … of God and His relations to the universe; or … of God as He is in Himself and as He is related to all His creatures.
  
                  2. THE DEVELOPMENT OF A NEW CONCEPTION IN MODERN SUBJECTIVE THEOLOGY. The phenomenalism of Kant had a rather revolutionary effect on the common conception of theology. It limited all theoretical knowledge, scientific or otherwise, to the phenomenal world. This means that according to it man can have no theoretical knowledge of that which transcends human experience, and therefore theology as the science of God is an impossibility. The practical reason is the only reliable guide in religion, and its propositions are not susceptible of rational proof, but must be accepted by faith. God is highly exalted above our observation and experience. We can accept Him and the relations in which He stands to His creatures only by faith, and what is so accepted cannot be constructed into a scientific system. God is an object of faith, and not of science.
  
                  The epistemological principles of Kant paved the way for that subjectivism in religion, of which Schleiermacher became the great spokesman. He defined Dogmatics as "the science of the Christian faith," that is, of the contents of the Christian faith. This content does not consist in truths or facts supernaturally revealed, but in religious experiences, primarily under the inspiration of the personality of Jesus, by which man becomes conscious of the super-natural and eternal. The intellectual expressions of the devout feeling, or of Christian experience, which are current in the preaching and teaching of a particular Church, constitute the raw material of theology. And an inquiry into the cause of this experience will naturally lead the mind to God. Ritschlians also define Dogmatics as "the scientific exposition of the Protestant faith." Yet they do not agree with Schleiermacher's conception of the object of Dogmatics, for with respect to his work Lobstein says: "The classical work of the great theologian is not, to tell the truth, a systematic exposition of the Protestant faith; it is composed of reflections upon the soul of the Christian, upon the different modifications of the religious consciousness of the subject." Ritschlians generally claim greater objectivity, and it sounds somewhat more objective, when the author just quoted says: "Dogmatics … receives its material from faith; rather its material is faith itself with the divine content of faith, that is, the gospel." Yet in the end the Ritschlian view turns out to be just as subjective as that of Schleiermacher, as we shall show in one of the following chapters.
  
                  This subjective tendency in course of time gave rise to the definition, so popular in our day, according to which theology is defined as "the science of religion" or, more specifically, as "the science of the Christian religion." In this definition, as it is generally used in modern theology, the word 'religion' is used in the subjective sense, to denote religion as a phenomenon of human life. Moreover, this religion is often conceived of in a very one-sided and unsatisfactory way, and is sometimes represented in a purely naturalistic fashion. Thus that aspect of human life, which is indicative of man's relation to a divine Being, became the object of theology. This view resulted in an increased emphasis on the study of the history of religion, of the philosophy of religion, and of the psychology of religion.
  
                  There are, of course, serious objections to this conception of theology: (a) it divorces theology from its objective foundation in the Word of God, and bases it entirely on subjective experiences which have no normative value; (b) it robs theology of its positive character and reduces it to a purely descriptive science, describing historical and psychological phenomena instead of aiming at absolute truth; and (c) it involuntarily leads to a representation of the Christian religion as merely one of the many religions of the world, differing from them indeed in degree, but not in essence.
  
                  Attention should be called to the fact, however, that the definition of theology as the science of religion is sometimes found in the works of the older Reformed theologians, and is still found in the theological writings of such men of a previous generation as Thornwell, A. A. Hodge, and Girardeau. But when these men so define theology, they use the term 'religion' in an objective sense, that is, as denoting the divine revelation, which is the standard for the true service of God, the rule of man's religious life, devotion, and worship. So understood, the definition is not exposed to the criticism that was offered. At the same time it is ambiguous, and therefore does not deserve commendation.
  
                  3. RECOGNITION OF THE OBJECTIVE CHARACTER OF DOGMATIC THEOLOGY IN RECENT TIMES. Though some conservative scholars adapted themselves more or less to the use of the new definition, and spoke of theology as the science of religion or of the Christian faith (McPherson), they did not at all mean to indicate thereby that they too regarded man's subjective religion or faith as the object of theology. Some of them evidently chose this definition as an indication of the fact that theology was not limited to the study of just one object, namely, God, but included the study of all the doctrines of religion or of the Christian faith. This means that in their definitions the terms 'religion' and 'faith' did not have a subjective, but an objective connotation.
  
                  The greater number of conservative scholars, however, continued to conceive of theology as the science of God, though frequently with the distinct understanding that they did not regard God apart from His creation as the object of theology, but God as related to His creatures. Thus Shedd says: "Theology is a science that is concerned with both the Infinite and the Finite, with both God and the Universe." And A. H. Strong gives the following definition: "Theology is the science of God and of the relations between God and the universe."2 Other well-known theologians, who regard God as the object of theology, and therefore speak of theology, as the science of God, are Hill, Dick, Heppe, Schmid, Dabney, Boyce, Hastie, Orr, and Warfield.
  
                  The preceding paragraph makes no mention of Dutch theologians. This does not mean, however, that their stand differs materially from that of the men just mentioned. They are named separately merely because some of them varied their definition somewhat, just as Charles Hodge did in our own country. This change was, at least in part, prompted by the desire to obviate the difficulty suggested by the consideration that we cannot make God the direct object of our scientific study. Hodge finds the object of theology in the "truths" and "facts" of Scripture, which the theologian must "collect, authenticate, arrange, and exhibit in their natural relation to each other." In Kuyper's estimation this definition is "in the main not incorrect," but both he and Bavinck rightly object to the idea that the theologian must "authenticate" the truths and the facts of Scripture, because this virtually destroys the concept of the ectypal theology, and logically brings the theologian once more under the dominion of a naturalistic science.
  
                  Kuyper proceeds on the assumption that God cannot be the direct object of scientific study. In such a study the subject rises superior to the object, and has the power to examine and to comprehend it. But the thinking man is not so related to God, 1 Cor. 2:11. According to Kuyper it is quite essential to distinguish between two kinds of theology, namely: (a) theology as the knowledge of God, of which God is the object, and (b) theology as a science, which finds its object in the divine Self-revelation. The former is the ectypal knowledge of God, contained in Scripture, and adapted to the cognitive faculties of man; while the latter is defined as "that science which has the revealed knowledge of God as the object of its investigation and raises it to sunesis (insight)." By means of this distinction he seeks to establish an organic connection between theology and science in general. Now the question arises, whether this position is equivalent to a denial of the fact that God is the object of theology. On the one hand it certainly seems so, and as a matter of fact Kuyper clearly says that the revealed knowledge of God, and it only, is the object of theology as a science.4 This point even became the subject of a theological debate in the Netherlands. At the same time he also says that this science would not yet be entitled to the name theology, if it did not deepen our insight in the ectypal knowledge of God. The question arises, whether Kuyper's way of putting things is not merely another way of saying that God is the object of theology as a science only in so far as He has revealed Himself in His Word. Or, to put it in other words, that God is not the direct, though He is the ultimate object of theology; that He is not the immediate object, but the object as mediated through His divine Self-revelation. After all, on his view, theology as a science deals with the Knowledge of God, seeks to appropriate and assimilate its various data, to represent them in their grand unity, and to cast them into a form that satisfies the human consciousness, and can be called theology only in so far as it deepens insight into the knowledge of God. Moreover, it deserves attention (a) that Kuyper asserts that the science of theology admits of no other motive than "to know God or to learn to know Him"; (b) that his denial that God can be the object of human science simply means that we cannot of ourselves attain to a scientific knowledge of God, but are bound to His Self-revelation; (c) that he regards it as a very precarious phenomenon that in theology "no more the reality God, but the reality religion is the object of investigation.
  
                  This view of the matter finds corroboration in the fact that Bavinck considers God as the object of theology, and yet defines Dogmatics as "the scientific system of the knowledge of God"; that Hepp, one of Kuyper's disciples and successors says that Dogmatics "is that part of science that has God for its object, as He can be known through His revelation, or to express it more briefly, that has Scripture for its object";5 and that Honig, one of the earliest disciples of Kuyper, also maintains that both definitions, namely, that theology is the science of God, and that it is the science of the knowledge of God, are good, and that the dispute about this was largely a dispute about words. Evidently Dr. Warfield too feels that these two do not conflict. He defines theology as "the science which treats of God and of the relations between God and the universe," but also says: "Now the object of theology, as Dr. Kuyper has often justly insisted, is the ectypal knowledge of God." For him this is not equivalent to saying that the Scriptures constitute the object of theology, for he explicitly says that "The Scriptures, after all, are not the object of theology, but only its source."7
  
                  In Germany a reaction arose in recent years against the subjectivism that was introduced into theology by Schleiermacher and resulted in placing man rather than God in the center. There are those who emphasize anew the fact that God is the proper object of theological study. This new tendency finds expression in the two-volume work of Schaeder. This author begins his second volume with these significant words: "Mit Gott hat es die Theologie zu tun; immer und ueberal mit Gott. Jede Frage der Theologie, auch wenn sie sich auf die Welt in Natur und Geschichte oder auf den Menschen und sein Leben richtet, ist nur unter der Bedingung eine wirklich theologische, dass sie sich im letzten Grunde um Gott dreht." The theology of crisis differs considerably from Schaeder's theocentric theology, and that among other things in breaking more completely and radically with the method of Schleiermacher. While Schaeder makes the Word of God more prominent in his theology than Schleiermacher, he does not rise superior to the subjectivism of the latter. The theology of crisis on the other hand places the Word of God, that is, God's super-natural revelation, prominently in the foreground, and is therefore also called "the theology of the Word of God." Barth defines the task of Dogmatics as follows: "As a theological discipline, dogmatics is the scientific test to which the Church puts herself regarding the language about God which is peculiar to her." In Credo he expresses himself as follows: "Dogmatics endeavors to take what is first said to it in the revelation of God's reality, and to think it over again in human thoughts and to say it over again in human speech. To that end dogmatics unfolds and displays those truths in which the truth of God concretely meets us." It deals therefore with the doctrinal material which the Church has derived from God's revelation.
  
                  There is really no good reason why we should not continue to speak of theology as the science of (concerning) God. It is, of course, possible to consider the ectypal knowledge of God as the immediate object of theology, and under certain circumstances it may be desirable to represent it as such; but on the whole it would seem to be preferable to speak of Him, as He has revealed Himself in His Word, as the real object of theology. This does not imply that the thinking subject can place itself above God as the object, and can of itself elicit from Him knowledge of the divine Being; nor that the human subject can comprehend God and thus attain to a perfect knowledge of Him. In employing the old definition it is assumed: (a) that God has revealed Himself and thus conveyed true knowledge of Himself to man; (b) that man, created in the image of God, is capable of appropriating and apprehending this divine truth; and (c) that man has an urge within him to systematize this knowledge with a view to a better understanding of God and of His relations to His creatures. With Bavinck we may define Dogmatics as "the scientific system of the knowledge of God."
              - c-theology-as-a-science: |-
                  C. Theology as a Science
  
                  1. THE SCIENTIFIC CHARACTER OF THEOLOGY DENIED.
  
                  a. The ground for this denial. Theology was once generally recognized as the queen of the sciences, but does not enjoy that distinction today. Duns Scotus already held that theology was not a science in the strict sense of the word, but simply a practical discipline. This view was rather exceptional, however, and did not meet with a great deal of favor. The Scholastics in general stressed the scientific character of theology and treated it as such; and in the theological works of the Reformation and post-Reformation periods it is also fully recognized. It is especially since the end of the eighteenth century that the right of theology to be called a science was called in question, and was even positively denied. This was due in part to Kant's criticism of the faculty of knowledge, according to which it is impossible to obtain any theoretical knowledge of God and of the supersensible in general; and in part to the pretentious claim of the natural sciences to be the only sciences worthy of the name. This negative attitude was greatly strengthened by Positivism with its notion that each branch of knowledge passes, successively, through three different stages: the theological or fictitious stage, the metaphysical or abstract stage, and the scientific or positive stage. The man who has reached the final stage has left theology far behind. Herbert Spencer, the great agnostic, also invariably proceeded on the assumption that theology is outside of the domain of science.
  
                  The greatest objection to the scientific status of theology was especially twofold. In the first place theology is devoted to the study of an object that lies beyond the ken of human theoretical knowledge, since it cannot be observed nor subjected to experimental tests. And in the second place it finds its ground of certitude in an authoritative revelation rather than in human reason, the only authority recognized in science. In our day it is quite common to find scientists smiling significantly, when they hear people speak of the science of theology. Harry Elmer Barnes even declares the theologian utterly incompetent to deal with the subject-matter of his own chosen field of study. Says he: "The new view of matters makes it very evident that the clergyman can no longer pretend to be a competent expert in the way of discovering the nature, will and operations of the new cosmic God. If undertaken and solved at all, this is a problem for the coöperative endeavors of the natural scientist and the cosmic philosopher of the Dewey tradition. The theologian at best can be only a competent second—or third—hand interpreter of the facts and implications gathered about the cosmos and its laws by specialists in science and philosophy.… But now, when God must be sought, if at all, in terms of the findings of the test-tube, the compound microscope, the interferometer, the radium tube and Einstein's equations, the convential clergyman is rather hopelessly out of place in the premises." There is more than a mere grain of truth in the following words of Macintosh: "Among the empirical sciences theology can find none so poor as to recognize her, much less do her reverence. Moreover, even the world at large, including hosts of persons who still think of themselves as religious, is coming to share in the contempt of the scientists for theology."2
  
                  b. Reaction of theologians to this denial. This widespread denial of scientists and philosophers, re-echoed by large numbers of lesser lights, who popularize the prevailing opinion, did not fail to affect the attitude of theologians and of religious people in general. The reaction on the part of those theologians who accepted the dictum of the scientists, has been especially twofold. Some simply relinquish the claim of theology to the high honor of being scientific, and appear perfectly willing to assign to it a lesser position. Says Macintosh: "Of late, under the stress of much hostile criticism, there has been a strategic retreat, and the definitions generally favored are modest statements to the effect that theology is the intellectual expression of religion."
  
                  Others, however, set themselves the task of reconstructing theology in such a manner as to vindicate its time-honored claim to a scientific position. They substituted religious experience, religious faith, or religion in general for God as the object of theology, which means that they turned from the objective to the subjective, from the divine to the human, from the supersensible to certain psychological phenomena, which fall under human observation. They have been seeking ever-increasingly to study and interpret the religious life by the application of the true scientific method, which Macintosh describes as "the method of observation and experiment, of generalization and theoretical explanation." This author adds that, "if theology is to become really scientific, it must be by becoming fundamentally empirical." He does not believe that the methods of Schleiermacher, Ritschl, and Troeltsch have been successful, but does not on that account abandon all hope. Says he: "Systematic theology is not now and never has been an empirical science. And yet this does not mean that it cannot become a science, and that in the very near future."2 It is rather remarkable that this modern theologian, like Schaeder in Germany, again stresses the fact that not religion but God is the object of theology, but then God as revealed in religious experience (taking experience in its broadest sense), and in the history of religions.
  
                  2. THE POSSIBILITY OF MAINTAINING THE SCIENTIFIC CHARACTER OF THEOLOGY.
  
                  a. From one point of view it is impossible. In our day many base the right of theology to be called a science on the fact that it is devoted to the study of Christianity or of religion, and therefore deals with historical data or data of experience, which can be studied according to the strictly scientific method of observation and experiment. Since we do not share this conception of theology, we cannot avail ourselves of the ground it affords for maintaining the scientific character of theology. For us the question is, whether it is possible to maintain the scientific status of a theology which aims at the study of God rather than of religion. And the answer one gives to this question will depend on one's conception of science. This means that it will be necessary first of all to come to a clear understanding as to what constitutes a science. Many present day scholars, especially in our country, regard the term 'science' as a proper designation of what are usually called "the natural sciences," and of them only, since they are the only studies that deal with matters that can be observed and that can be tested in the laboratory. The deciding question seems to be, whether a study deals with facts of observation. But the question may be raised, whether this is not a rather arbitrary limitation. Dr. Harris says that it can be justified only "by reverting to the complete Positivism of Comte, and avowing and maintaining that knowledge is limited to the observation made by the senses." But this is an utterly untenable position, for, says he, "if they do this, they must renounce the important part of their own sciences know by inferences depending for their validity on rational intuitions." They who insist on taking this position will naturally exclude theology from the domain of science, for theology as the science of God does not deal with data given by observation or experience. It does not greatly improve matters to say, as Huxley does: "By science I understand all knowledge which rests upon evidence and reasoning of a like character to that which claims our ascent to ordinary scientific propositions (italics mine); and if any man is able to make good the assertion that his theology rests upon valid evidence and sound reasoning, then it appears to me that such a theology must take its place as a part of science." Macintosh refers to these words of Huxley on page 25 of his Theology as an Empirical Science, and is inclined to take up the challenge. But from our point of view this would seem to be quite hopeless. We may not lose sight of the fact that the methods of the natural sciences do not apply in the study of theology, nor even in the study of religion. Theology is entitled to its own method, a method determined by the nature of its subject-matter. Dr. Mullins correctly remarks: "It is a false issue when men deal with religion as if it were physics or chemistry or biology, or psychology, or sociology. There is no necessary conflict between any of these and religion. But when men crave religion and a solution of its problems, then religious criteria must be employed. When modern science offers any other it gives a stone instead of bread, a serpent instead of a fish."
  
                  b. From another point of view it is possible. The situation is quite different, if 'science' is taken in the sense of the German 'Wissenschaft' or the Dutch 'wetenschap.' Eisler in his Handwoerterbuch der Philosophie defines Wissenschaft as "systematisiertes Wissen, der Inbegriff zusammengehoeriger. auf ein bestimmtes Gegenstandsgebiet sich bezienhender oder durch den gleichen Gesichtspunkt der Betrachtung verbundener, zu systematischer Einheit methodisch verknupfter, zusammenhaengender Erkenntnisse." According to this definition there is no good reason why we should not regard dogmatic theology as a science. Science is simply systematized knowledge. It is reared on the basis of the common knowledge of mankind. This knowledge may be obtained in various ways, depending on the nature of its object. It may be acquired by observation, by reflection, or by revelation, but must be true knowledge. Experimental tests may and should be applied in the case of the natural sciences, rational tests in the case of the Geisteswissenschaften, and Scriptural tests in the case of theology. The subject-matter of theology can only be given by revelation, and it is the duty of the theologian to systematize the knowledge so acquired, and to test it rigidly by the analogy of Scripture. If he takes a comprehensive view of the subject-matter, and unifies it, he is dealing with it in a systematic way, and the result of his work is scientific.
  
                  Theology has its own distinctive method, but there is after all a great deal which it has in common with the other sciences. If the matter with which theology deals is given by revelation, so is, strictly speaking, also the matter which the other sciences build into a system. Reason cannot be regarded as the source of this matter, but only as the instrument by which it is grasped, analyzed, classified, and systematized. And if the sciences in general employ human reason in the construction of their system of knowledge, so does theology depend on sanctified human reason in its investigation and constructive work. It is true that the element of faith is fundamental in the work of the theologian, but there is not a single scientist who can exclude this from his work altogether. And if theology must leave a great many ultimate questions unsolved, this is true to a large degree also of every other science.
  
                  Theology, then, does not move in the sphere of the natural sciences, and therefore does not and cannot apply its methods. It would succeed only in destroying itself by the application of the experimental method. It has far more in common with the so-called Geisteswissenschaften, a term which Baillie renders "sciences of spirit." It should be borne in mind that theology is not merely a descriptive science, which yields only historical knowledge, but very decidedly a normative science which deals with absolute truth, given by revelation and binding on the conscience. Shedd speaks of it as an absolute science, which is true not only for the human intellect but for all rational intelligence. He also calls it a positive science, to indicate that faith yields real and true knowledge of its object, though it must leave many mysteries unexplained. If others occasionally deny that it is a positive science, they usually mean that it is not a positive science in the Comtian sense of the word.
              - d-the-encyclopaedic-place-of-dogmatics: |-
                  D. The Encyclopaedic Place of Dogmatics
  
                  Under this general caption we shall consider the question as to the group to which Dogmatics belongs, and more particularly the relation in which it stands to Apologetics and Ethics.
  
                  1. THE GROUP OF STUDIES TO WHICH IT BELONGS. There is very little difference of opinion as to the group of theological studies to which Dogmatics belongs. It is almost invariably classed with the Systematic or, as Kuyper calls it, the Dogmatological group, that is, the group which centers about the dogma of the Church. The most important of the other studies which he includes in this group are Symbolics, the History of Dogma, Ethics, Apologetics, and Polemics. Schleiermacher departed from the ordinary classification, however, and classified it under Historical Theology. This was due to the fact that he conceived of Dogmatics as the systematic exposition of the Christian faith at a certain stage of its development, and more specifically as the science of the doctrine confessed by a particular Christian Church at a certain stage of its historical development. According to him dogma is characterized by change rather than by stability. It is the product of the constantly changing religious experience of a Church, having real value and significance only in so far as it is in agreement with the immediate believing Christian consciousness. In accordance with this conception of dogma, dogmatic theology is represented as "the science of the connected presentation of the doctrine prevailing in a Christian Church association at a given period." As an expression of ever varying religious life, Dogmatics in his estimation is not an expression of absolute truth, and is therefore entirely wanting in permanent authority.
  
                  This view of Schleiermacher, however, did not find great favor in the theological world, not even among liberal theologians. Rothe and Dorner are the most notable scholars who followed Schleiermacher in this respect. Raebiger correctly says: "According to the place assigned to it by Schleiermacher, dogmatics must be a history of doctrine current at the present time." Even George Burman Foster raises objections to it in the following words: "But historical theology is concerned with facts, not with truth; with what was, not with what ought to be. And indeed this limitation of the dogmatic task to historical theology has not been adhered to, even by these evangelical theologians themselves, least of all by Schleiermacher, who is the great champion of the conception."2
  
                  2. THE RELATION OF DOGMATICS TO APOLOGETICS. There never has been and is not now general agreement as to the exact nature of Apologetics, and as a result opinions differ very much with respect to the place which it should occupy in the encyclopaedia of theology. Some have given it a place in the exegetical group of theological studies, and others have incorporated it with Practical Theology. It has been more customary, however, to regard it as a part of Systematic Theology, either as an introductory study or as something in the nature of an adjunct to Dogmatics.
  
                  In this matter also, as in many others, Schleiermacher struck out on an entirely new path, when he declared it to be an introductory discipline, basic to the whole system of theology, which as such should precede even the exegetical group of theological studies. He represents Apologetics as the science that is devoted to the vindication of Christianity as a whole by means of rational argumentation. It was rather inconsistent on the part of Schleiermacher to take this position, since he considered it imperative to exclude philosophy from theology, and yet in this way laid an elaborate philosophical basis for theology. Apologetics became a sort of Fundamentallehr, and has since his day sometimes been called Fundamental Theology.
  
                  This view of Schleiermacher was adopted by Ebrard, a Reformed theologian. Beattie also favors it in his work on Apologetics. Says he: "It may be best, therefore, to give Apologetics a place of its own, and to regard it as an introductory discipline to the whole system of theology.… This, no doubt, is the best view." Dr. Warfield shares this view of Apologetics. He conceives of it as "the department of theology which establishes the constitutive and regulative principles of theology as a science; and in establishing these it establishes all the details which are derived from them by the succeeding departments, in their sound explication and systematization." He says further that it is the business of Apologetics "to establish the truth of Christianity as the absolute religion directly only as a whole, and its details only indirectly." With a direct appeal to reason for its evidences, Apologetics is supposed to deal with the great topics of God, religion, revelation, Christianity, and the Bible. The remaining departments of theology can only build on the foundation laid by Apologetics. According to Bruce it thus becomes a sort of mediator between philosophy and theology and a mediator, in which he does not have the greatest confidence. He himself conceives of Apologetics as "a preparer of the way of faith, an aid to faith against doubts whencesoever arising, especially such as are engendered by philosophy and science."2 This speaking of it as "a preparer of the way of faith" would seem to bring his view of it more or less in line with the conception of Schleiermacher, however different it may be in other respects. The position of Henry B. Smith is expressed in these words: "It is best to regard it as historico-philosophical Dogmatics. It is the whole contents and substance of the Christian faith, arrayed for defense and for (defensive) assault."
  
                  Kuyper, Bavinck, and Hepp have serious objections to the Schleiermacherian conception of Apologetics, and their strictures would seem to be fully warranted. They register especially the following objections: (a) While, as the name indicates, Apologetics is properly a defensive science, it is on this view changed into a constructive science, which aims at the construction of an independent system from philosophical data and by means of purely rational arguments. (b) According to this view Apologetics precedes the four departments of theology as a sort of Prinzipienlehre, and theology must build on a foundation laid by human reason. (c) Theology is thus robbed of its independent character, and derives its principles from a system that is the product of pure reason; all of which conflicts with the nature of theology.
  
                  These theologians assign to it a place in connection with the study of Dogmatics, and ascribe to it the task of vindicating the Christian system of the truth over against the attacks of false philosophy and science. They try to avoid overrating Apologetics on the one hand, and underrating it on the other hand. They do not want to neglect it, nor to consider it as a study of purely practical significance, but assign to it the modest and yet important task of defending the dogma of the Church against all attacks, and of doing this in a constructive and principial manner, and not merely in an occasional way as determined by current controversies.
  
                  3. THE RELATION OF DOGMATICS TO ETHICS. No branch of theological study is so closely related to Dogmatics as Christian or Theological Ethics. Before and during the Reformation many theologians incorporated Christian Ethics in their Dogmatics, and several theologians of the seventeenth century treat it in a second part after Dogmatics. Yet even at that early time some began to discuss it as a separate discipline, in order to do more justice to it than could be done in a week on Dogmatics. According to Geesink, Daneau was the first to publish a Reformed Ethics in 1577. This separation of Dogmatics and Ethics did not at once become general, though theologians began to make a sharper distinction in their works between the dogmatical and the ethical material, the credenda and the facienda. Gradually, however, the practice of separating the two increased. While this was in itself quite harmless, it did have disastrous results, since Ethics gradually drifted from its religious moorings. Under the influence of the philosophy of the eighteenth century. Christian Ethics was gradually robbed of its theological character. In the philosophy of Kant religion was based on Ethics rather than Ethics on religion. And in the writings of such men as Schleiermacher, Ritschl, Rothe, Herrmann, and Troeltsch morality is divorced from religion and acquires an autonomous character.
  
                  Such writers as Dorner, Wuttke, and Luthardt, again linked Ethics up with the Christian religion, but in a rather unsatisfactory way. As a matter of fact there is no principial difference between Dogmatics and Ethics. The principia of the one are also those of the other. It is no wonder therefore that some have again sought a closer connection between the two. In the previous century Raymond included a separate system of Ethics in his Systematic Theology. George Burman Foster in his Christianity in its Modern Expression did the same thing. And such Reformed theologians as Charles Hodge and Robert L. Dabney incorporated a discussion of the ten commandments in their works on Systematic Theology. Kuyper considers it desirable to treat Theological Ethics separately, because (a) ethical truths have come to development in a different way than dogmatical truths; and (b) the study of each of these has its own requirements and methods. Dogmatics discusses the articula fidei. and Ethics the praecepta decalogi. And Geesink says that it is generally admitted that the separation of Dogmatics and Ethics is incorrect, even though their separate treatment is commendable. It is undoubtedly true that the two should always be regarded and studied as standing in the closest relation to each other. The truth revealed in the Word of God calls for a life that is in harmony with it. The two are essentially inseparable.
  
                  QUESTIONS FOR FURTHER STUDY: Is it correct to speak of dogmas as the fruit of theology? What does history teach as to the function of theology in the formation of dogmas? Is the subject-matter of Dogmatics limited to what is found in the Creeds? How does Barth conceive of dogma, dogmas, and the Creeds? How do Schleiermacher, Ritschl, Wobbermin, Troeltsch, Schaeder, and Barth differ in their conception of Dogmatics? What objection is there to making Dogmatics a purely descriptive science? Does it still remain theology, if it consistently makes religion or the Christian faith its object? On what grounds is it denied that theology is a science? How can its scientific character be maintained? Is it important that this should be done? Do Barth and Brunner regard Dogmatics as a science?
  
                  REFERENCES: Bavinck, Geref. Dogm. I, pp. 1–41; Kuyper, Enc. der Heil. Godgel, I, pp. 241–283; Hepp, De Waarde van het Dogma; id., Geref. Apologetiek; Honig, Dogmatiek en Ethiek; Van Dijk, Begrip en Methode der Dogm., pp. 7–51; Hodge Syst. Theol. I, pp. 1–22; Shedd, Dogm. Theol. I, pp. 3–58; Strong, Syst. Theol., pp. 1–24; McPherson, Christian Dogm., pp. 1–9, Schmid, Doct. Theol. of the Ev. Luth. Church, pp. 25–35; Girardeau, Discussions of Theol. Questions, pp. 1–44; Hastie, Theol. as a Science, pp. 1–58; Lobstein, An Introd. to Prot. Dogm., pp. 1–96; H. B. Smith, Introd. to Chr. Theol., pp. 49–59; Meyrick, Is Dogma a Necessity?; Kaftan, Dogm., pp. 1–9; id., The Truth of the Chr. Ref I; Haering, The Chr. Faith I, pp. 1–31; Hall, Dogm. Theol., Introduction, pp. 10–32; Warfield, Introd. to Beattie's Apologetics, pp. 19–32; id., The Idea of Syst. Theol. and Apologetics, both in Studies in Theology; C. W. Hodge, The Idea of Dogm. Theol., Princeton Review, Jan. 1908, pp. 52–82; Raebiger, Theol. Enc. II, pp. 330–338, 362–367; Beattie, Apologetics, pp. 48–48–67; Barth, The Doct. of the Word of God, pp. 1–10, 284–335; Geeseink, Geref. Ethiek I, pp. 149–184.
              - a-the-task-of-dogmatics: |-
                  A. The Task of Dogmatics
  
                  1. MODERN CONCEPTIONS OF THE TASK OF DOGMATICS. One's conception of dogma(s) and of Dogmatics will naturally determine one's view of the task of Dogmatics. Since the notion of dogma(s) and Dogmatics that became prevalent in the nineteenth century differs radically from the view prevailing in the theology of the Reformation, there is also a fundamental departure from the earlier view of the task of Dogmatics. We shall call attention only to some of the most important of the modern conceptions.
  
                  a. Schleiermacher's conception. According to Schleiermacher, it is the task of Dogmatics to describe the feelings which the Church experiences in union with Jesus Christ, the Saviour. For him religion is neither knowledge nor moral action, but feeling, more specifically, a feeling of dependence on an ultimate reality, which arises only within the Christian community; and dogma is merely the intellectual expression or interpretation of the inner significance of this religious feeling. Experience rather than the Word of God is therefore the source of dogmas, though Schleiermacher still regards the New Testament as the norm by which this experience must be tested. The materials furnished by the communal experience of the Church form the subject-matter of Dogmatics. Its task is to give a systematic exposition of the Dogma of a Christian Church at a given moment of its historical development, which can boast of historical exactness, but is not necessarily an expression of absolute truth. In this way it becomes something purely subjective, divorced from the external authority of the Word of God, a merely historical or descriptive science without any normative significance.
  
                  The Erlangen school, including such men as J. C. K. Hofmann, Thomasius, and Frank, represents a reaction against the subjectivism of Schleiermacher in favor of orthodox Lutheranism. It does indeed share the subjective starting point of Schleiermacher, and is in so far also a theology of experience, but from experience it works back to an objective basis, which is found not in certain isolated passages of Scripture, but in the doctrinal truth of Scripture as a whole. Speaking of Hofmann, Edghill really indicates its method clearly in the following words: "Starting with the personal experience of the Christian he worked backwards to the experience of the Christian Church, as expressed in its creeds and confessions; and thus further to the documentary proofs in Scripture upon which all is based."
  
                  A position somewhat similar to that of Schleiermacher, though reflecting even more clearly the influence of Vinet, is that of the Ethicals in the Netherlands. It takes its starting point in the life of believers in communion with Christ, that is, not merely in the life of the individual believer, but in that of believers collectively, of the community of believers, which is the Church. When the Church reflects on this life, which consists not merely in feelings, but also in thought and action, this gives rise to dogmas, which are merely the intellectual expression of that life. And the task of Dogmatics is to describe the life of the Church at a particular time in a systematic and scientific way. Van Dijk, one of their prominent representatives, defines Dogmatics as the description of the life of the Church He prefers the term 'life' to the Schleiermacherian term 'feelings,' because it points to something more permanent, and is also more comprehensive and Scriptural. Moreover, he maintains that this description of the life of the Church should be under the constant control of Scripture as a record of what the writers experienced of the life of the Lord, and refuses to consider Dogmatics as a purely historical discipline, devoid of normative authority.
  
                  b. The Ritschlian conception. In Ritschlian circles it is quite customary to speak of Dogmatics as "the scientific exposition of the Christian faith" (Lobstein), or as "the science of the Christian faith" (Haering). This faith, however, is not always conceived in the same way. Herrmann divorces it as much as possible from all knowledge, and regards it purely as fiducia (trust). The content of this faith consists merely in religious-ethical experiences, which are always individual and cannot be systematized, and which develop out of faith itself. On this view Dogmatics can hardly be anything else than a description of religious-ethical experiences. Yet there is in the Ritschlian school a manifest desire to break away from the subjectivism of Schleiermacher. This tendency finds expression perhaps most of all in Kaftan, the real dogmatician of the school. He defines Dogmatics as follows: "Die Dogmatik ist die Wissenschaft von der Christlichen Wahrheit, die auf Grund der goettlichen Offenbarung in der Kirche geglaubt und bekannt wird." This definition seems to acknowledge the objective character of Dogmatics. But his description of the task of Dogmatics on page 104 makes a different impression. Says he: "Die eigentliche Hauptaufgabe der evangelischen Dogmatik besteht darin, die Erkenntniss darzulegen, die sich dem Glauben aus der Aneignung der von der Schrift bezeugten Gottesoffenbarung ergiebt." This means that Dogmatics must set forth faith, that is, the knowledge-content involved in faith, which results from the appropriation of the divine revelation given in Scripture. In the study of Scripture faith fastens on certain truths and appropriates these. It does not accept them, however, because they are infallibly given by revelation and therefore authoritative, but because they commend themselves by their practical value for the religious subject. The knowledge-content of faith is therefore after all a content selected by man. Consequently, even Kaftan does not succeed in maintaining the objective character of Dogmatics.
  
                  The position of Lobstein agrees with that of Kaftan. He speaks of faith as being both the object and the source of Dogmatics, but also mentions the gospel as the source. The synthesis of these two is expressed in the following words: "Faith is the legitimate and pure source of Dogmatics only when it is in union with the divine factor which inspires it and which, without ceasing, conditions and establishes it. The source of Dogmatics is that faith which has assimilated to itself the eternal essence of the gospel, or the gospel in its apprehension by the mysterious power of faith." The knowledge-content of faith is inspired by the gospel, but its extent is determined by the selective activity of faith. It is only in the light of these facts that we can really understand his definition of Dogmatics as "the scientific exposition of the Protestant faith." Both of these men want to maintain the objective and normative character of Dogmatics, but in view of the fact that with them faith is really the immediate source of Dogmatics, it can hardly be said that they have succeeded.
  
                  c. The view of Troeltsch. Troeltsch was motivated by a desire to secure for Dogmatics a greater measure of objectivity, and therefore suggested a religious-historical norm of more universal validity than that of the Ritschlians, in order to establish the truth of the Christian religion. In his estimation this should not be sought merely in the study of what the history of the Christian religion has to offer, but in the study of religions in general. In his scheme Dogmatics really derives its subject-matter from history, the history of religions. According to him it has a threefold task. The first of these is to establish the supremacy of the Christian religion over other religions. The dogmatician must begin with the study of the history of the various religions. In the course of this study a standard or norm emerges in virtue of a religious a priori in the human consciousness, which cannot be demonstrated but is nevertheless real and determinative, and enables us to decide in favor of Christianity. The judgment so reached is not a mere value judgment, but one that has ontological significance. Having established the supreme character of the Christian religion, the dogmatician must, in the second place, determine the real meaning of Christianity or discover its essence. Troeltsch says that it is characteristic of Christianity that it ever leads to new interpretations, so that the conception of its essence will naturally change from time to time. He expresses his own view of it in these words: "Christian religious faith is faith in the regeneration of man who is alienated from God, a regeneration effected through the knowledge of God in Christ. The consequence of this regeneration is union with God and social fellowship so as to constitute the kingdom of God." Finally, the third task of Dogmatics is to expound the content of Christianity so conceived, and to formulate the doctrines of God, man, and redemption that are involved in this general conception of it. This view is more objective than that of the Ritschlians in its appeal to the history of religions in general, but does not entirely break with the empiricism of Schleiermacher and Ritschl. In distinction from the view of these men it does not want to exclude metaphysics. However, it does not represent a return to the objective basis found in the Word of God.
  
                  d. The position of Schaeder. Schaeder criticizes both the Ritschlian position and that of Troeltsch. The former simply postulates a God, in order to secure certain moral interests; and the latter leaves Jesus too much amid the relativism of history, instead of seeing in Him the unique revelation of God in history. History records man's search for God, and not God's finding man through His revelation. Theology must cease to be man-centered, and should become God-centered. In Schaeder's opinion the glory and the majesty of God were compromised too much in the anthropocentric theology that prevailed since the days of Schleiermacher. This sounds very promising, but Schaeder does not succeed in rising above the subjectivism of the theology which he condemns. He does not recognize the Word of God as the only source and norm of theology. His starting point is, after all, also purely subjective. It is the revelation wrought by the Spirit of God in man, a revelation which becomes ours only through the faith wrought in us. To this revelation Scripture, nature, history, and Christ also make their contribution. From this revelation, mediated to us through faith, Dogmatics must draw its material, all of which centers about God. Dogmatics must deal first of all with that which is most fundamental in God, namely, His majesty or absolute sovereignty; then it must treat of the holiness of God in its close and unqualified relationship to the majesty of God; and, finally, it must unfold the idea of the love of God, especially as it is revealed in Jesus Christ, in organic connection with both the majesty and the holiness of God. "Auf diese Weise ergeben sich drei einfache Teile des dogmatischen Entwurfes: Gott der Herr, Gott der heilige, Gott der liebende oder der Vater … So ist die ganze Theologie wirklich Gotteslehre. Sie ist aber aus dem Glauben und fuer den Glauben." The method of Schaeder does not differ fundamentally from that of Schleiermacher; but while Schleiermacher's theology can hardly be said to rise above the level of anthropology, that of Schaeder strongly emphasizes the fact that it must be God-centered. And in striving to make it this he does not rule out the theoretic element.
  
                  e. The Barthian view. The conception of Barth respecting the task of Dogmatics can best be indicated briefly by quoting some of his own words. Says he: "As a theological discipline, dogmatics is the scientific test to which the Christian Church puts herself regarding the language about God which is peculiar to her." The task of Dogmatics is therefore to test the language of the Church respecting God, in order to make sure that it is in agreement with the divine revelation. In God in Action, p. 53 Barth expresses himself as follows: "Dogmatics must test dogma (not dogmas) to see that dogma corresponds to the true object … Dogmatics has the task of interpreting the corresponding co-relation of the dogmas. But beyond that its task is to carry on a comprehensive investigation of the entire Church's language, concepts, phrases, and ways of thinking in the present." He rejects the Roman Catholic conception of Dogmatics, and the tendency towards a similar view in the old Protestant tradition, to the effect that the task of Dogmatics is merely "the combination, repetition, and transcription of a number of already present 'truths of revelation,' once for all expressed and authentically defined as to wording and meaning." In Credo he expresses himself in a slightly different way: "Dogmatics endeavors to take what is first said to it in the revelation of God's reality, and to think it over again in human thoughts and to say it over again in human speech. To that end dogmatics unfolds and displays those truths in which the truth of God concretely meets us. It articulates again the articles of faith; it attempts to see them and to make them plain in their interconnection and context; where necessary it enquires after new articles of faith, i.e. articles that have not up to now been known and acknowledged."
  
                  The fundamental idea from which to start, in order to understand the representation of Barth, is that of "Church proclamation." Just what does Barth mean by that? He tells us that not all language of the Church about God is Church proclamation. Words addressed to God in prayer, singing, and confession, do not form a part of it; neither do the social activities of the Church. Even the instruction of the youth cannot be so called, since it "has to teach, not to convert, not to 'bring to a decision,' and to that extent not to proclaim." Theology cannot claim to be such proclamation, though it is also language about God to men. "Proclamation is its presupposition, its raw material and its practical goal, not its content or its task. Naturally, proclamation also means to speak about God, but in it "is concealed, as the meaning of this action, the intention to speak the word of God Himself." It is speaking with the expectation that in it God Himself will be the speaker. "Proclamation is human language in and through which God Himself speaks, like a king through the mouth of his herald.… Where human language about God is proclamation, it raises this claim, it lives in this atmosphere of expectation." Now dogma is Church proclamation in so far as it really agrees with the original revelation attested in Scripture, in which God is, of course, the speaker. It is revealed truth, and therefore quite different from dogmas, which are mere doctrinal propositions formulated by the Church, and therefore words of men. And now "Dogmatics must test dogma (not dogmas) to see that dogma corresponds to the true object."4 "It is the inquiry about the Word of God in Church proclamation, must be the critical inquiry as to the agreement of Church proclamation, not with any norm of human truth or human value … but with the revelation attested in Holy Scripture." The goal of Dogmatics is dogma, that is, it aims at the agreement of Church proclamation with the original revelation. Barth reminds us, however of the fact that "the dogma after which Dogmatics inquires is not the truth of revelation, but it is on the way to the truth of revelation."
  
                  2. THE REFORMED CONCEPTION OF THE TASK OF DOGMATICS. In distinction from the views discussed in the preceding, Reformed theologians maintain that it is the task of Dogmatics "to set forth in scientific form absolutely valid truth, and to embrace the entirety of Christian doctrine." (Hodge) Bavinck expresses it in these words: De dogmatiek heeft juist tot taak, om dien inhoud der openbaring, welke op de kennisse Gods betrekking heeft, denkend te re-produceeren." It seeks to give a systematic presentation of all the doctrinal truths of the Christian religion. It may not rest satisfied with a description of what was at one time the content of the faith of the Church, but must aim at absolute or ideal truth. It is not a purely historical or descriptive science, but one that has normative significance. In the task to be performed by Dogmatics we can distinguish three different phases.
  
                  a. A constructive task. The dogmatician deals primarily with the dogmas embodied in the confession of his Church, and seeks to combine them into a systematic whole. He must do this in such a manner that the organic relations of the various elements of the divine truth stand out clearly. This is not quite as easy a task as Lobstein seems to think. It requires more than a mere logical arrangement of the truths that are clearly formulated in the confession of the Church. Many truths that are merely stated in general terms must be formulated; the connecting links between the separate dogmas must be discovered and supplied and formulated in such a way that the organic connection of the various dogmas becomes clear; and new lines of development must be suggested, which are in harmony with the theological structure of the past. For all its content it must draw directly on Scripture, and not on religious experience or faith (Schleiermacher, Ritschl, Kaftan, Schaeder), nor on history (Troeltsch), nor on Church proclamation (Barth), thus making God's revelation in Scripture merely a norm by which to test its content.
  
                  b. A demonstrative and defensive task. It is not sufficient to systematize the dogmas of the Church, since this would make Dogmatics merely descriptive. The dogmatician must demonstrate the truth of the system which he presents as his own. He must show that every part of it strikes its roots deep down into the subsoil of Scripture. Bible proof which takes account of the progressive character of the divine revelation should be given for the separate dogmas, for the connecting links, and for the new elements suggested. Dogmatics is in search of absolute truth. It may not be able to reach this in every particular, but should nevertheless seek to approach it as much as possible. Moreover, account must be taken of the historical departures from the truth, in order that this may stand out with greater clearness. All attacks on the dogmas embodied in the system, should be warded off, so that the real strength of the position assumed may clearly appear.
  
                  c. A critical task. The dogmatician may not, with Harnack, proceed on the assumption that the doctrinal development of the past was one gigantic error, and that he must therefore begin his work de novo. This would reveal a lack of respect for the guidance of the Holy Spirit in the past history of the Church, and give evidence of an undue amount of self-confidence. At the same time he must be severely critical of the system which he proposes, and allow for the possibility of a departure from the truth at some point or other. If he detects errors even in the dogmas of the Church, he must seek to remedy them in the proper way; and if he discovers lacunae, he should earnestly endeavor to supply what is lacking. He should bend every effort to the advancement of the science of Dogmatics.
              - b-the-method-of-dogmatics: |-
                  B. The Method of Dogmatics
  
                  The word 'method' does not always have the same connotation, and is not always used with the same latitude in works on dogmatic theology. In some of them the discussion of the method of Dogmatics includes, if it is not limited to, a consideration of the necessary qualifications for the study of Dogmatics, and the distribution of the contents of Dogmatics in the construction of the system. Strictly speaking, however, the method of Dogmatics concerns only the way in which the content of Dogmatics is obtained, that is, the source or sources from which it is derived, and the manner in which it is secured. It is to the consideration of these two points that the present discussion will be limited.
  
                  1. VARIOUS VIEWS AS TO THE SOURCE FROM WHICH THE CONTENT OF DOGMATICS IS DERIVED. The first question that comes into consideration is therefore that of the source and norm of Dogmatics. Historically, there are especially three views that come into consideration, namely: (a) that Scripture is the source of Dogmatics; (b) that the teaching of the Church constitutes the real source; and (c) that the Christian consciousness must be regarded as the source. These three will be considered in succession.
  
                  a. Holy Scripture. Holy Scripture was generally recognized from the earliest times, if not as the fons or principium unicum, at least as the fons primarius of theology, and therefore also of Dogmatics. God's general revelation in nature was frequently, and is also now sometimes, recognized as a secondary source. Warfield says that "the sole source of theology is revelation." Taking into consideration, however, that God revealed Himself in divers manners, he also recognizes as "true and valid" sources God's revelation in nature, providence and Christian experience. They all furnish some data for theology. "But," says he, "it remains nevertheless true that we should be confined to a meager and doubtful theology were these data not confirmed, reinforced, and supplemented by the surer and fuller revelations of Scripture; and that the Holy Scriptures are the source of theology in not only a degree but also in a sense in which nothing else is." He would certainly call Holy Scripture the fons primarius of theology.
  
                  Other Reformed theologians, such as Turretin, Kuyper, Bavinck, Thornwell, and Girardeau, do not hesitate to speak of it as the principium unicum ('unicum' in the sense of 'only,' and not merely in that of 'unique'), or as the sole source and norm of theology. They, of course do not mean to deny that the theologian can also obtain some knowledge of God from His general revelation; but they maintain that, since the entrance of sin into the world, man can gather true knowledge of God from His general revelation only if he studies it in the light of Scripture, in which the elements of God's original self-revelation, which were obscured and perverted by the blight of sin, are republished, corrected, and interpreted. Consequently, the theologian must always turn to Scripture for reliable knowledge of God and of His relations to His creatures. Moreover, he can obtain no knowledge whatsoever of God's redemptive work in Jesus Christ, except from special revelation, and this is knowledge of supreme significance. It is only on the basis of Scripture therefore that one can construct a system of dogmatic theology.
  
                  In his use of Scripture the dogmatician will naturally take into account the results of his previous studies concerning Revelation and Inspiration, General and Special Introduction, Sacred History, and especially of the Historia Revelationis or Biblical Theology. In the opinion of some this means that he should regard the Bible as a collection of old Israelitish and early Christian literature of very unequal verity and value, should accept as historically true only those parts that are attested by historical criticism, and should ascribe normative significance only to the elements that approve themselves to the Christian consciousness. Such principles naturally lead to all kinds of arbitrary limitations of the special revelation of God as a source of theology.
  
                  Modern empirical theologians, averse to the idea of an authoritative revelation of God, and eager to secure the scientific character of their theology by applying scientific methods in its study, discredit the Bible as a source of theology entirely, though in some cases still ascribing to it some sort of normative significance. They seek the source of their theology in the Christian consciousness. The theology of Schleiermacher is purely subjective and experimental. The Ritschlians, it is true, still ascribe revelational significance to Scripture, but restrict it to the New Testament, and more particularly to those elements on which the faith of the Church fastens, and which are apprehended and verified by faith.
  
                  Reformed theologians, however, refuse to be led into that labyrinth of subjectivism, and accept the whole of Scripture as the divinely inspired revelation of God and as the source of theology. Nevertheless, they realize that all parts do not have equal doctrinal significance, that the earlier revelations are not as full and explicit as the later ones, and that doctrines should not be based on isolated passages of Scripture, but on the sum-total of the doctrinal teachings of the Bible. They feel that it is absolutely wrong to follow what a certain writer calls "the cafeteria style" of using the Bible, selecting only what satisfies one's taste and ignoring all the rest. The dogmatician should always study Scripture according to the analogia Scriptura.
  
                  At the same time they do not follow the so-called Biblical method of Beck, who was strongly under the influence of Oetinger, though he avoided the mysticism of the latter. Beck opposed the subjectivism of Schleiermacher and his followers. He stressed the fact that the theologian must gather all his material from Scripture and from Scripture only, ignoring not only all philosophical theories, but also all Church doctrines. He regarded the divine revelation in Scripture as an organic whole, consisting of several interrelated parts, moving forward in a unitary development, and finally reaching its consummation under the guidance of the Holy Spirit. The theologian simply has the task to reproduce the truth as it is objectively given in Scripture, and in doing this should follow no other method than that which Scripture itself suggests. His exposition should follow the line of development indicated in Scripture, in which all parts of the truth are organically related.
  
                  This method does not sufficiently take into account the fact that Scripture does not contain a logical system of doctrine, which we can simply copy; that the order which it follows as the record of God's revelation is historical rather than logical; that dogmatic theology should be an exposition of the thoughts of God, appropriated and assimilated by the human consciousness, and expressed in a language and scientific form adapted to the dogmatician's own time; and that the dogmatician never comes to the study of Scripture without any prepossessions, but always represents a certain ecclesiastical standpoint and has certain positive personal convictions, which will naturally be reflected in his work.
  
                  One of the most recent names applied to the theology of Barth is "Theology of the Word of God." Barth denies general revelation, is violently opposed to the subjectivism of modern theology, and stresses the necessity of special revelation for the knowledge of (concerning) God. It would be a mistake, however, to infer from this that he agrees with the Protestantism of the Reformation in its conception of the Bible as the source of theology. In the first place the Bible should not be identified with the special revelation of God, but can only be regarded as a witness to that revelation. And in the second place special revelation is always simply God speaking; it can never be objectified and made static in a book, so that this becomes, in the words of Dr. Machen, "the supreme text-book on the subject of faith." God's special revelation is not a book, from which the theologian can simply gather his material. Consequently it is not the Bible, nor a part of the Bible, but simply God's speaking to man, to which the Bible bears witness, and by which the Church's speaking about God must be tested. And if the question be asked, Where does theology find its material, the answer can only be: in the Church's proclamation of the Word of God in so far as this is really the speaking of God. "In Dogmatics," says Barth, "it can never be a question of the mere combination, repetition, and summarizing of Biblical doctrine." Says Mackintosh in stating Barth's view: "Dogmatics, therefore, starts from the message preached and taught by the Church, and finds the materials of its discussion there. When the Church speaks of God, it claims to be declaring His Word. And for Dogmatic the central question is this: how is the Church's language, in its intention and content, fit to serve and express the Word of God."2 In view of all this it is no wonder that Barth says: "There is, to be sure, a history of the Reformed Churches, and there are documentary statements of their beliefs, together with classical expositions of their theory and practice, which command (and always will command) the attention, respect, and consideration of every one who calls himself a Reformed churchman; but in the truest sense there is no such thing as Reformed doctrine" (italics mine).
  
                  b. The teaching of the Church. The teaching of the Church or its confession is also regarded by some as the source of theology. The Roman Catholic Church in a certain sense indeed regards Holy Scripture as a source of theology, but denies that it is the complete supernatural revelation of God and supplements it with what is called "apostolic tradition." These two in a way constitute the source of theology, and yet it is hardly correct to say that, in the estimation of this Church, these two together constitute the source and norm of theology, though Roman Catholic writers often speak as if they do. In reality they constitute the source and norm of theology only as they are infallibly authenticated and interpreted by the Church. Roman Catholics do say that Scripture and tradition are the sources of theology, but deny the right of private interpretation. They maintain that we receive both Scripture and tradition at the hands of the Church, which determines what books belong to the canon, and what tradition is authentic. Moreover, they hold that both must be read through the spectacles of the Church.
  
                  Consequently, though both Scripture and tradition may be regarded as sources of theology, only the teachings of the Church, which are irrevocable, constitute the real source and the rule of faith. In considering the question, whence the Church draws its teaching, or where revelation is deposited and preserved, Wilmers says: We answer: from two sources—Scripture and tradition. As these two sources contain the subject-matter of our faith, they are called sources of faith; and as they determine our faith, they are likewise called rules of faith. They are, however, only the remote or mediate rules of faith, while the immediate rule is the teaching Church. And Gibbons asserts that "God never intended the Bible to be the Christian's rule of faith, independently of the living authority of the Church.'5 Dr. D. S. Schaff says: "The Tridentine position was reaffirmed by the Vatican Council when it stated that "all those things are to be believed with divine and Catholic faith which are contained in the Word of God, written or handed down and which the Church, either by solemn judgment or by virtue of her ordinary and universal teaching function offers for belief as having been divinely revealed." The situation is this, that nothing can be accepted as true or received as an article of faith, which has not been defined and proposed by the Church. "She still retains the apostolic commission," says Thornwell, "and is the only accredited organ of God's Spirit for the instruction of mankind in all that pertains to life and godliness."2 Strictly speaking, it is the voice of the Church that is heard in both Scripture and tradition. She only is the supreme oracle of God, and therefore it is no wonder that she does not regard the reading of the Bible as an absolute necessity, and even discourages this among the laity.
  
                  This Roman Catholic view is a misconception of the relation that obtains between the Church and the truth with which theology deals. It was the truth that gave birth to the Church, and not the Church that produced the truth. Consequently, she cannot be regarded as the principium theologiae. All her claims and all her teachings must be tested by Scripture, and are valid only in so far as they have Scriptural warrant. The Church of Rome cannot maintain her claim to a perpetual apostolic inspiration, and therefore even her so called tradition must be submitted to the test of Scripture. The tests which the Roman Catholic Church herself applies are not sufficient.
  
                  But if the Church of Rome has an exaggerated view of the significance of the Church and its teachings, others are clearly inclined to minimize their importance. There is a widespread aversion at the present time to ascribe any binding character, any authority whatsoever, to the Church's creedal formulations of the truth. While the historical value of the creeds is frankly admitted, their normative significance is questioned, if not explicitly denied. Curtis regards it as a very dubious practice to demand of the officers of the Church that they subscribe to its creed. Allen calls upon the members of the Anglican Church to stand fast in the liberty with which Christ has made them free, and to shake off the yoke of bondage placed upon them in the creed.4 And William Adams Brown, while in his recent work. A Creed for Free Men, still pleading for a Creed, does not want to be misunderstood, and therefore says: "By a unifying Creed, let me hasten to explain, I do not mean a set of beliefs prescribed by authority, whether it be of Church or State, which one must take as it is given to one as a test of orthodoxy. I mean a definite grouping of the convictions which give meaning to life and direction to activity, which may serve as a guide for personal conduct and a means of understanding with one's neighbors." Even Barth and Brunner. while regarding the Creeds as venerable and worthy of respect, refuse to ascribe to them authority and to regard them as rigid tests of orthodoxy. They stress the fact that the Creeds are expressions but not objects of faith.2 Quite generally the position is taken that the theologian, while appreciating the historical value of the Creeds and Confessions of the Protestant Churches and gratefully using them as historical guides, should not feel himself bound by their teachings, but should be entirely untrammeled in his scientific investigations.
  
                  It is only proper, however, to avoid both of the extremes just described. Creeds and confessions, it goes without saving, may never be placed on a level with Holy Scripture as sources of theology. The Bible is the only source, and the Creeds should be interpreted in the light of Scripture, and not Scripture in the light of the Creeds. At the same time the Creeds contain the testimony of the Church respecting the truth revealed in the Bible; and the fact that she was guided in the development of the truth by the Holy Spirit is, to express it in the words of Thornwell, "a venerable presumption in favor of the divine authority of all that she proposes." The Church in drawing up a Creed proposes it as her carefully considered and prayerfully accepted conception and expression of the absolute truth revealed in the Word of God; and they who join that Church thereby signify their adherence to the truth of God's Word as it is confessed in its Creed. Common honesty demands of them that, as long as they remain members of that Church, they shall abide by her expression of the truth and teach nothing that is contrary to her standards.
  
                  This demand, of course, holds very emphatically for the officers and teachers of the Church. The theologian is always the theologian of a particular Church. He receives the truth in her communion, shares her convictions, and promises to teach and propagate these as long as they do not prove to be contrary to the Word of God. While he does not consider the Creed to be infallible, he accepts its teachings as the expression of absolute truth until the contrary appears. It may be said that these teachings constitute a bias, and this is perfectly true; but no one ever takes up a study without any prepossessions. Every theologian in entering upon his task has certain convictions which he cannot set aside at will, because he cannot eliminate himself.
  
                  c. The Christian consciousness. Under the influence of Schleiermacher and Ritschl it has become quite customary in many circles to regard the Christian consciousness as the source of theology, the only source from which it derives its material. For Schleiermacher the dogmas of the Church are the scientific expression of the pious feelings which the believer, on close and conscientious self-examination, perceives in his heart. The Christian consciousness of the individual, but especially of the religious community, is the goldmine from which the dogmas of the Church must be drawn. At the same time he believes that the truths derived from this source, in order to become an integral part of the organism of evangelical doctrine, should find support in the confessions of the Church and in the New Testament. While he does not recognize the Bible as the source of theology he does ascribe a certain normative significance to the New Testament, since it contains the revelation of God in Jesus Christ, and describes the experiences of those who lived in immediate contact with Him. Because of their intimate association with Christ their experiences have normative significance for us.
  
                  Ritschlians criticize the subjectivism of Schleiermacher and his followers, which results in changing Dogmatics from a normative to a purely descriptive science, and make an attempt to safeguard the objective character of theology. They claim to derive their dogmas from a historical revelation, the revelation of God in Jesus Christ, as it is recorded in the Gospels, that is, the revelation embodied in the life and the teachings of Jesus, and especially in His work as the founder of the Kingdom of God. They often speak of that revelation as the source of theology. This does not mean, however, that they regard this as the direct source of theological doctrines. They even deny explicitly that it should be so considered, and this is but natural. Since they limit the Scriptural source to the historical revelation of God in Jesus Christ, the question naturally arises as to the ground for this limitation; and this is found only in the faith of the Church. Faith fastens on those elements of the historical revelation that are of real value for the Christian life, since they engender true piety. And the elements so appropriated constitute the material for the doctrinal system. Hence the faith of the Church is really the direct source of its theology, and so the contents of the theological system is after all subjectively determined. Faith comes in between the historical revelation in Christ and the theologian. The religious consciousness is still the source of theology. But even so the full subjectivity of the Ritschlian position does not yet appear. Dogmatics should not be regarded as "the science of the objects of faith," but as "the science of the Christian faith." The task of the dogmatician, says Lobstein, "consists in analyzing the faith of the Church, in developing its content, in connecting together its affirmations."2 He is concerned with faith's understanding of revelation, and considers the data of faith in the light of a particular theory of religious knowledge, and the test which he applies is primarily of a pragmatic kind. What works in religion is true in theology. Garvie says that according to Ritschl, "A doctrine is true, not because it is in the Bible, but because it verifies itself experimentally and practically."
  
                  The idea that the Christian consciousness is the source of theology is rather common in present day theological literature. Even the Erlangen school takes it starting point in experience, and Troeltsch, in spite of his appeal to the history of religions in general, did not succeed in rising above the subjectivism of Schleiermacher and Ritschl. Wobbermin in principle goes back to Schleiermacher, and even Schaeder with his theocentric emphasis does not escape his subjectivism. The same experimental view is found in Lemme's Christliche Glaubenslehre, and in Schultz's Grundriss der evangelischen Dogmatik. It also characterizes the theology of the Ethicals in the Netherlands. And in our own country the Christian consciousness is regarded as the source of theology by such men as Wm. Adams Brown (Christian Theology in Outline), Beckwith (Realities of Christian Theology), D. C. Macintosh (Theology as an Empirical Science), and G. B. Foster (Christianity in its Modern Expression). Many of those who adopt this position are still inclined to recognize Scripture in some sense as an objective authority, though not as an infallibly inspired revelation of God.
  
                  Now there are some obvious objections to the notion that the Christian consciousness is the source, or even one of the sources of theology. (1) History and experience teach us that it is the acceptance and assimilation of the truth, which is revealed in the Word of God, that determines the nature of our Christian experience, and not vice versa. (2) In the interpretation of his experience man is always in danger of confusing what is from man with what is from God, and of allowing the imperfect thought of the individual or of the community to condition and limit his theology. (3) Many truths which are of the greatest importance in theology cannot be experienced. In the strict sense of the word man cannot experience God, though he may experience His operations. How can he experience such objective historical facts as the creation of the world, the fall of man, the incarnation of the Logos, the atoning death of Christ, His resurrection from the dead, His physical return, and so on? Consistency in this matter will result in one of two things: either it will impose upon experience a burden which it cannot bear, or it will seriously impoverish theology. (4) The interpretation of the data of the Christian consciousness with its currents and cross-currents, and with all its fluctuations, is a process, which is so delicate and in which man is so liable to error, that in all probability very few satisfactory inferences can be drawn from it. Absolute truth cannot be reached in that way, and yet this is the very thing at which dogmatic theology aims. (5) While it may be true that saving faith, at least in a general way, implicates a system of doctrine, it does not follow that such a system can be deduced from the Christian consciousness, even when this is more or less controlled by Scripture. Frank attempted to derive a whole system from the principle of regeneration, but it can hardly be said that he was successful. (6) It is a striking fact that they who so confidently speak of the Christian consciousness as the source of theology, frequently insist on it that its deliverances be brought to the touchstone of Scripture, and can be regarded as valid data for the construction of a system of theology only when they are in agreement with the written Word of God.
  
                  The fact that Christian experience or the Christian consciousness is not the source of theology does not mean that it is not a factor, and even an important factor, in the construction of the dogmatic system. Some Reformed theologians, such as H. B. Smith, Van Oosterzee, McPherson, and Warfield, even speak of it as a real, though subsidiary, source of theology. The latter says, however, "that probably few satisfactory inferences could be drawn from it, had we not the norm of Christian experience and its dogmatic implications recorded for us in the perspicuous pages of the written Word." If we bear in mind, however, that religious knowledge differs from all other knowledge in that it does not rest on one's own insight into the truth, nor on the authority of any man, but only on the authority of God, then we feel that the religious consciousness can hardly be an independent source of theology. The attempt to make man autonomous in this respect exposes one on the one hand to the danger of Deism, which makes man independent of God, and on the other hand, to the danger of Pantheism, which identifies him with God. Scripture never refers to the Christian consciousness as a source and norm of the truth. Moreover, the religious consciousness is determined to a great extent by the environment in which man lives, reveals significant variations, and therefore cannot be regarded as a dependable source.
  
                  At the same time the religious consciousness will always be an important factor in the construction of a system of dogmatic theology. Only the Christian theologian has a proper insight into the truth as it is revealed in the Word of God, and is therefore qualified to give a systematic representation of it. While his faith cannot be regarded as a fountain from which the living waters spring, it is nevertheless the channel that carries them to him from the perennial well spring of Scripture. And his personal appropriation of the truths of revelation will naturally be reflected in his construction of the truth. The dogmatician, engaging in his work, will not be able to set aside his individual convictions, nor the convictions which he has in common with the Church to which he belongs. The product of his theological labors will necessarily bear a personal imprint. Moreover, Christian experience may serve to verify many of the truths of the Christian religion and to make them stand out as living realities in the Christian life. While it adds nothing to the truth of what is recorded in the Word of God, it may greatly strengthen the subjective apprehension of it, and therefore has great apologetical value.
  
                  2. THE MANNER IN WHICH THE MATERIAL IS SECURED AND TREATED. Several methods of obtaining and dealing with theological truth have been suggested and applied, of which the following may be regarded as the most important.
  
                  a. The Speculative Method. The term 'speculative' is not always used in the same sense in philosophy and theology. Speculative thought in one sense of the word is simply the antithesis of that Empiricism which maintains that all knowledge is based on experience. Consistent Empiricism reduces all knowledge to the comprehension of the things that fall directly under the observation of the senses, and is therefore called Sensualism. It yields knowledge of particular facts, but knows of no universal laws and principles, which unite them into an organic whole, and is therefore really equivalent to the negation of all scientific knowledge. It is the function of reason to go beyond the particular and contingent fact, and to seek the underlying general and necessary principle, which unites the particular facts and ideas into a unity and gives them the coherence of a system. This function of reason is sometimes designated as 'speculation'. Now speculation in this sense is absolutely essential in raising any kind of knowledge to the level of a science, and therefore cannot be dispensed with in theology. Dogmatic theology aims at a systematic exposition of the knowledge of God in the relations in which He stands to His creatures, and will never be able to accomplish its task without the organizing function of reason.
  
                  This is not the ordinary meaning, however, which, in the sphere of theology, attaches to 'speculation' and 'the speculative method'. It denotes rather the method of philosophers and theologians who refuse to take their starting point in given facts and seek to construct a system in an a priori fashion, that, is, without taking account of the data given by observation and experience. It proceeds from the absolute and universal to the relative and particular in a purely deductive way. Fleming says that it is characteristic of this method "not to set out from anything given as its subject, but from determinations which thought finds in itself as the necessary and primary ground of all being as of all thinking." In the application of this method the test of truth lies in its coherence or the consistency of its various propositions. Whatever a man must necessarily think according to the laws of logic must be regarded as true. This is the method which Bacon had in mind when he said: "The rationalists are like the spiders; they spin all out of their own bowels." The speculative method operates purely with abstract thought, and proceeds on the assumption that the world of thought is also the world of reality. Kaftan states the peculiarity of the speculative method, when he says: "It is based on the presupposition that there is a creative function inherent in human thought; that in the human mind there slumbers the power of extending our knowledge beyond all experience, and that it only requires to be awakened by the intercourse with things; that to the so-called Laws of Thought there accrues a supernatural significance."2 Caldecott expresses himself on this point as follows: "The kernel of the full doctrine is that Necessary thought is constructive of intelligent experience, and that the 'idea' or 'object' which it presents is entitled to our full belief as Real. That we have some intelligent experience, and that it is veridical, is taken for granted; it is the fact to be explained: whatever idea, or thought, or belief can be shown to be necessarily involved or implied therein as its prius is a true thought; as veridical as the datum itself, to say the least." According to this method human reason is not merely the instrument of thought, but is the very source of thought, and all necessary and coherent thought is also the Real. And not only philosophy but also theology (which Hegel regards as philosophy speaking in symbols) is spun out of the human mind. The philosophy of Hegel furnishes the classical example of this method, and this example is followed in the works of absolute Idealists.
  
                  There are several obvious objections to the application of the speculative method, as it has been defined. (1) It proceeds on the assumption that the consciousness of man, which is here represented as absolute thought, is the source of theology; but, as we have seen in the preceding, it is quite impossible that the human consciousness should serve in that capacity. (2) In this method we are moving entirely in the realm of thought, and do not touch the objective in the sense of something independent of and, so to speak outside of our own mental life, while in theology we are concerned with objective realities. It may be said that what man necessarily thinks is objectively real, but this is an unwarranted idea. (3) It ignores the historical facts of Christianity, which exist independently of human reason and cannot be deduced from it. Moreover, it is limited to very general ideas, since, as Schleiermacher pointed out, pure thought is always limited to that which is general and can never yield particulars. (4) It obliterates the essential distinction between philosophy and theology and makes theology something purely intellectual. According to Hegel philosophy interprets ultimate reality in terms of pure thought, while theology represents the same reality in pictorial form, that is, in terms of the imagination. Philosophy is higher theology, and theology is lower philosophy. (5) It robs faith of its real Biblical character by reducing it to pure cognition. It is the knowledge of the ordinary Christian, which can only be raised to the level of true knowledge by means of speculative reason. Faith thus becomes something like the pistis of the Gnostics, as distinguished from the gnosis on which they prided themselves.
  
                  b. The empirical method. The terms 'empirical method' and 'experimental method' are often used interchangeably. Empiricism is quite the opposite of a priorism. In the acquisition of knowledge it proceeds inductively rather than deductively. It "allows nothing to be true nor certain but what is given by experience, and rejects all a priori knowledge." Theologians of the empirical school generally take experimental religion to be the object of theology. In the study of this object they desire to employ the method of modern science, that is, the method of observation and induction. Religion is made the object of careful observation, and all its manifestations are subjected to close scrutiny, in the historical study of the religions of the human race and in that of the psychology of religion. After these manifestations are carefully described and classified, their explanation is sought in general principles; and when these principles are carefully formulated, they are, in turn, tested by further observation. From the materials so gathered a system is constructed, which constitutes a philosophy of religion rather than a system of theological truth.
  
                  The preceding description is of a very general nature, and gives no indication of the different variations of the experimental method, which are rather numerous. Macintosh classifies under the empirical method what he calls the mystical, the eclectic, and the scientific types. Wobbermin speaks of the religio-psychological method, which he also calls the Scheiermacherian-Jamesian method, and Lemme calls the method which he employs "die empirisch-descriptive Methode." The existing variations result from the various attempts that were made to overcome some of the weaknesses of the empirical method, and to meet such objections as the following: that it is altogether subjective; that it is purely individual and therefore has no general validity; and that it reduces theology to a rather highly specialized division of anthropology. Some modern theologians realize that they must deal with their subject-matter theologically, and that this requires a very special effort on their part. Macintosh wants it clearly understood that God is the object of his "Theology as an Empirical Science." And Schaeder very definitely wants his theology to be God-centered.
  
                  Schleiermacher may be regarded as the father of the empirical method in theology. Ritschl and the Ritschlians were opposed to his subjectivism and suggested a more objective method, but even their method is in the last analysis experimental. The Erlangen theologians continued this method, and even Troeltsch did not entirely break with it. Wobbermin's religio-psychological method is in fact a return to the position of Schleiermacher; and even Schaeder finds God primarily in the experiences of the soul. Thus it has been characteristic of modern theology to seek God in man, and to regard him as in some sense of the word continuous with man. Barth, it is true, stresses the infinite distance between God and man, and emphasizes the fact that man can only know God by means of a special divine revelation. But if the question is asked, Just where is God's revelation? Barth cannot tell, for it has no objective independent existence. It does not exist in a definite form, so as to enable one to say, Here it is. The Bible cannot be regarded as the infallibly inspired Word of God. It merely bears witness to the original divine revelation to the prophets and particularly in Christ. He can only say that God's revelation is there, where God speaks directly to the human soul, speaks a word which is recognized as the Word of God only by a special operation of the Holy Spirit in each particular case. The speaking of God is a revelation of God only for the one to whom God brings it home in faith. The reception of this revelation is a unique experience for those who receive it. Has Church proclamation, strictly speaking, any other source to draw on? And if not, how far does Barth then really get away from the experimental method? It may be said that, according to him, Church proclamation must be tested by the original revelation attested by Scripture, but that does not change matters. Most of the experimental theologians regard the Bible as, in some sense of the word, a norm for the study of theology. It is not surprising to find Rolston saying: "On Barthian premises, there is no way to prevent men from falling into a position which the Barthians themselves would abhor. The system would inevitably tend to a vast subjectivity in which each man decided for himself just what portion of Scripture had authority for him."
  
                  However much the empirical method may be in vogue in modern theology, it is nevertheless open to several serious objections. (1) The application of this method eo ipso rules out God as the object of theology, for it is not possible to investigate God experimentally. He cannot be brought to the tests of observation and experience. If some of those who apply this method feel that in the study of theology they should proceed beyond the knowledge of the phenomena of religion to the knowledge of God, and really make a serious attempt to move in that direction, they do it at the expense of their empirical method. (2) Because the empirical method deals with the phenomena of experimental religion rather than with God as its object, it does not really succeed in constructing a system of theology at all, but merely yields a study in religious psychology. James' The Varieties of Religious Experience is regarded as a classic production of this method. But however important this book may be, it is not theological. (3) The strict application of the empirical method does not enable one to get beyond the surface even in the study of religion. External tests can be applied to the phenomena of the religious life, but not to the inner life itself, not to the hidden depths of the soul from which the experiences of religion arise. The empirical method pure and simple ties one down to a bare phenomenalism without unity or conscience, which is not even entitled to the name of science. (4) Finally, the empirical method, even when it ceases to be purely empirical and allows the validity of reflection and inference, and admits of the application of general categories of thought, does not, as a rule, get beyond the description of subjective states of consciousness with their constant fluctuations. The result is a purely descriptive science, and not one that has normative significance. It abandons the field of objective religion, and seeks to achieve its triumphs in the realm of the subjective.
  
                  c. The genetico-synthetic method. This method is sometimes called the theological method, or the method of authority, because it proceeds on the assumption that the divine self-revelation in Scripture is the principium cognoscendi externum of theology. The presupposition is that God, and not religion, is the object of theology, and that the object can be known only because, and in so far as, it has revealed itself. Consequently the data with which theology deals are not given in the Christian consciousness, but in the objective special revelation of God. This self-revelation only can give us absolutely reliable knowledge of God. Whatever knowledge may be derived from other sources, such as nature and the Christian consciousness, must be tested by the Word of God.
  
                  According to this method the dogmatician, while taking his stand in the confession of his Church, yet in the construction of his system proceeds from the data given in Scripture. He enters into the rich harvest of the work that was done especially in exegesis and in the history of revelation or Biblical theology, and seeks to show how the dogmas of the Church are rooted, not in isolated passages of Scripture, but in Scripture as a whole, and are developed out of the divine revelation in an organic way. In so far as he gathers his materials from Scripture his method may be called inductive, but this should not be represented as a sort of experimental method, as is done in a measure by Hodge, and also by Edgar. For him Scripture not merely reveals certain facts which man may interpret as he sees fit and as he deems necessary in the age in which he lives, but also gives an infallible interpretation of the facts, an interpretation which he may not set aside at will, but must accept as authoritative.
  
                  In the application of the synthetic method the theologian will not merely receive isolated doctrines from Scripture, but rather the divine truth as a whole revealed in facts and words. The facts are the embodiments of the truths that are revealed, and the truths illumine the facts that stand out on the pages of Holy Writ. The teachings of Scripture are seen in their grand unity, since the Bible indicates in various ways how its separate doctrines are interrelated. Bearing all these data in mind, the dogmatician will seek to construct his system in a logical way, supplying whatever links may still be missing in the confession of the Church from the Bible as the fountain-head of religious truth, and calling attention to the various deviations from Scripture in the historical development of the truth. It will be his constant endeavor to set forth all the treasures of wisdom and knowledge that are hidden in Christ and revealed in Scripture.
