  en:
    title: On the Making of Man.
    sections:
      - note-on-the-treatise-on-the-making-of-man: Note on the Treatise “On the Making of Man.”
        # loci:
      - on-the-making-of-man: On the Making of Man.
        # loci:
        sections:
          - gregory-bishop-of-nyssa-to-his-brother-peter-the-servant-of-: "Gregory, Bishop of Nyssa, to his brother Peter, the servant of God."
            # loci:
          - wherein-is-a-partial-inquiry-into-the-nature-of-the-world-an: "Wherein is a partial inquiry into the nature of the world, and a more minute exposition of the things which preceded the genesis of man."
            # loci:
          - why-man-appeared-last-after-the-creation: "Why man appeared last, after the creation."
            # loci:
          - that-the-nature-of-man-is-more-precious-than-all-the-visible: That the nature of man is more precious than all the visible creation.
            # loci:
          - that-the-construction-of-man-throughout-signifies-his-ruling: That the construction of man throughout signifies his ruling power.
            # loci:
          - that-man-is-a-likeness-of-the-divine-sovereignty: That man is a likeness of the Divine sovereignty.
            loci: image-of-god
          - an-examination-of-the-kindred-of-mind-to-nature-wherein-by-w: "An examination of the kindred of mind to nature: wherein, by way of digression, is refuted the doctrine of the Anomœans."
            # loci:
          - why-man-is-destitute-of-natural-weapons-and-covering: Why man is destitute of natural weapons and covering.
            # loci:
          - why-mans-form-is-upright-and-that-hands-were-given-him-becau: "Why man's form is upright; and that hands were given him because of reason; wherein also is a speculation on the difference of souls."
            # loci:
          - that-the-form-of-man-was-framed-to-serve-as-an-instrument-fo: That the form of man was framed to serve as an instrument for the use of reason.
            # loci:
          - that-the-mind-works-by-means-of-the-senses: That the mind works by means of the senses.
            # loci:
          - that-the-nature-of-mind-is-invisible: That the nature of mind is invisible.
            # loci:
          - an-examination-of-the-question-where-the-ruling-principle-is: "An examination of the question where the ruling principle is to be considered to reside; wherein also is a discussion of tears and laughter, and a physiological speculation as to the inter-relation of matter, nature, and mind."
            # loci:
          - a-rationale-of-sleep-of-yawning-and-of-dreams: "A Rationale of sleep, of yawning, and of dreams."
            # loci:
          - that-the-mind-is-not-in-a-part-of-the-body-wherein-also-is-a: That the mind is not in a part of the body; wherein also is a distinction of the movements of the body and of the soul.
            # loci:
          - that-the-soul-proper-in-fact-and-name-is-the-rational-soul-w: "That the soul proper, in fact and name, is the rational soul, while the others are called so equivocally; wherein also is this statement, that the power of the mind extends throughout the whole body in fitting contact with every part."
            loci: soul
          - a-contemplation-of-the-divine-utterance-which-said-let-us-ma: “A contemplation of the Divine utterance which said--”Let us make man after our image and likeness”; wherein is examined what is the definition of the image, and how the passible and mortal is like to the Blessed and Impassible, and how in the image there are male and female, seeing these are not in the prototype.”
            loci: image-of-god
          - what-we-must-answer-to-those-who-raise-the-question-if-procr: “What we must answer to those who raise the question--”If procreation is after sin, how would souls have come into being if the first of mankind had remained sinless”.”
            loci: original-righteousness
          - that-our-irrational-passions-have-their-rise-from-kindred-wi: That our irrational passions have their rise from kindred with irrational nature.
            loci: passions
          - to-those-who-say-that-the-enjoyment-of-the-good-things-we-lo: "To those who say that the enjoyment of the good things we look for will again consist in meat and drink, because it is written that by these means man at first lived in Paradise."
            # loci:
          - what-was-the-life-in-paradise-and-what-was-the-forbidden-tre: "What was the life in Paradise, and what was the forbidden tree?"
            loci: original-righteousness
          - that-the-resurrection-is-looked-for-as-a-consequence-not-so-: "That the resurrection is looked for as a consequence, not so much from the declaration of Scripture as from the very necessity of things."
            loci: resurrection-of-the-dead
          - to-those-who-say-if-the-resurrection-is-a-thing-excellent-an: “To those who say, “If the resurrection is a thing excellent and good, how is it that it has not happened already, but is hoped for in some periods of time?””
            loci: resurrection-of-the-dead
          - that-he-who-confesses-the-beginning-of-the-worlds-existence-: "That he who confesses the beginning of the world's existence must necessarily also agree as to its end."
            loci: creation
          - an-argument-against-those-who-say-that-matter-is-co-eternal-: An argument against those who say that matter is co-eternal with God.
            loci: creation
          - how-one-even-of-those-who-are-without-may-be-brought-to-beli: How one even of those who are without may be brought to believe the Scripture when teaching of the resurrection.
            loci: resurrection-of-the-dead
          - that-the-resurrection-is-not-beyond-probability: That the resurrection is not beyond probability.
            loci: resurrection-of-the-dead
          - that-it-is-possible-when-the-human-body-is-dissolved-into-th: "That it is possible, when the human body is dissolved into the elements of the universe, that each should have his own body restored from the common source."
            loci: resurrection-of-the-dead
          - to-those-who-say-that-souls-existed-before-bodies-or-that-bo: "To those who say that souls existed before bodies, or that bodies were formed before souls; wherein there is also a refutation of the fables concerning transmigration of souls."
            loci: soul
          - an-establishment-of-the-doctrine-that-the-cause-of-the-exist: An establishment of the doctrine that the cause of the existence of soul and body is one and the same.
            # loci:
          - a-brief-examination-of-the-construction-of-our-bodies-from-a: A brief examination of the construction of our bodies from a medical point of view.
            # loci:
