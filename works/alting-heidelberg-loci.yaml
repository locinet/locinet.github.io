                      - s3_5_2_1_1: "a. Proof from Scripture (Old and New Testament)"
                      - s3_5_2_1_2: "b. Illustrations from Created Things"
                  - s3_5_2_2: "2. Twofold Order Among the Three Persons"
                    sections:
                      - s3_5_2_2_1: "a. Natural Order"
                      - s3_5_2_2_2: "b. Arbitrary Order"
              - s3_5_3: "C. The First Person: The Father"
                sections:
                  - s3_5_3_1: "1. Definition and Meaning"
                  - s3_5_3_2: "2. Common and Singular Predications"
                    sections:
                      - s3_5_3_2_1: "a. Common: Person of Deity"
                      - s3_5_3_2_2: "b. Singular: First Person from None, Begetting the Son"
                  - s3_5_3_3: "3. The Father as Begetter of the Son"
                    sections:
                      - s3_5_3_3_1: "a. Scriptural Testimony"
                      - s3_5_3_3_2: "b. Mode of Generation"
                        sections:
                          - s3_5_3_3_2_1: "i. Hyperphysical"
                          - s3_5_3_3_2_2: "ii. By Communication of Essence"
                          - s3_5_3_3_2_3: "iii. From the Father Alone"
                          - s3_5_3_3_2_4: "iv. By Property and Perfection of Nature"
                          - s3_5_3_3_2_5: "v. From Eternity"
              - s3_5_4: "D. The Second Person: The Son"
                sections:
                  - s3_5_4_1: "1. Definition and Meaning"
                  - s3_5_4_2: "2. Common and Singular Predications"
                    sections:
                      - s3_5_4_2_1: "a. Common: Person of Deity"
                      - s3_5_4_2_2: "b. Singular: Second Person Begotten from the Father"
                  - s3_5_4_3: "3. Proofs That the Son Is from the Father by Generation"
                  - s3_5_4_4: "4. Similitudes Adumbrating Generation"
                  - s3_5_4_5: "5. The Son Begotten from the Father Alone"
                  - s3_5_4_6: "6. Only-Begotten and Proper Son"
                  - s3_5_4_7: "7. Begotten from Eternity"
              - s3_5_5: "E. The Third Person: The Holy Spirit"
