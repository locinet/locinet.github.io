alting-heidelberg-loci:
  author: Q1971867
  date_added: 2026-02-09
  category: systematic
  la:
    title: Scriptorum theologicorum Heidelbergensium tomus primus
    orig_lang: true
    editions:
      - year: 1646
        place: Amsterdam
  en:
    title: Heidelberg Theological Writings, Didactic Common Places
    sections:
      - s1: "FIRST LOCUS Concerning THE NATURE OF THEOLOGY"
        sections:
          - s1_1: "I. The Definition of Theology"
          - s1_2: "II. Exegesis of the Definition"
            sections:
              - s1_2_1: "A. Etymology of the Word “Theology”"
              - s1_2_2: "B. Various Significations of the Word"
              - s1_2_3: "C. Scriptural Synonyms for Theology"
          - s1_3: "III. The Genus of Theology"
            sections:
              - s1_3_1: "A. Debates Concerning Whether Theoretical or Practical Habit"
                sections:
                  - s1_3_1_1: "1. Theology as Higher Order Discipline"
                  - s1_3_1_2: "2. Infinite and Supernatural Nature"
                  - s1_3_1_3: "3. Testimony of God’s Word for Both Knowledge and Action"
              - s1_3_2: "B. Assignment of “Doctrine” as the Common Genus"
                sections:
                  - s1_3_2_1: "1. Testimony of the Old Testament (Torah)"
                  - s1_3_2_2: "2. Testimony of the New Testament"
                  - s1_3_2_3: "3. Suitability to Theology’s Nature"
                  - s1_3_2_4: "4. Other Names Used Synecdochically"
          - s1_4: "IV. The Object of Theology"
            sections:
              - s1_4_1: "A. Divine Things as the Adequate and Proper Object"
                sections:
                  - s1_4_1_1: "1. Definition of Divine Things"
                  - s1_4_1_2: "2. Primary: God Himself"
                  - s1_4_1_3: "3. Secondary: Works of God"
              - s1_4_2: "B. Three Grades of Divine Things"
                sections:
                  - s1_4_2_1: "1. First and Highest Grade: God Himself"
                  - s1_4_2_2: "2. Second Grade: Works of Redemption"
                  - s1_4_2_3: "3. Third and Lowest Grade: Works of Creation and Conservation"
              - s1_4_3: "C. Consideration of Sin in Theology"
                sections:
                  - s1_4_3_1: "1. Analogous to Medicine’s Treatment of Poisons"
                  - s1_4_3_2: "2. Reduction to the Three Works"
                    sections:
                      - s1_4_3_2_1: "a. To Creation (Privation of Image)"
                      - s1_4_3_2_2: "b. To Conservation (Divine Permission)"
                      - s1_4_3_2_3: "c. To Redemption (Justification and Sanctification)"
              - s1_4_4: "D. Theology’s Proper and Unique Object"
                sections:
                  - s1_4_4_1: "1. Treatment in Metaphysics"
                  - s1_4_4_2: "2. Exclusive Treatment of Redemption"
                  - s1_4_4_3: "3. Unique Mode of Considering Creation"
          - s1_5: "V. The Efficient Cause of Theology"
            sections:
              - s1_5_1: "A. God as Revealer of Divine Things"
              - s1_5_2: "B. Necessity of Revelation"
              - s1_5_3: "C. Order of Trinitarian Revelation"
          - s1_6: "VI. The End of Theology"
            sections:
              - s1_6_1: "A. Primary End: The Glory of God"
              - s1_6_2: "B. Secondary End: The Salvation of Men"
                sections:
                  - s1_6_2_1: "1. Eternal Beatitude in Union with God"
                  - s1_6_2_2: "2. Testimony of Scripture"
                  - s1_6_2_3: "3. Subordination to Primary End"
                  - s1_6_2_4: "4. Salvation of Men, Not Angels"
                  - s1_6_2_5: "5. Salvation of the Elect Only"
          - s1_7: "VII. The Use and Application of This Doctrine"
            sections:
              - s1_7_1: "A. For Teaching [Διδασκαλίαν, Didaskalian]"
              - s1_7_2: "B. For Correction [Παιδείαν, Paideian]"
              - s1_7_3: "C. For Reproof [ἐπανόρθωσιν, epanorthōsin]"
