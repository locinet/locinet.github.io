        sections:
          - s4_1: "INTRODUCTION TO THE WORKS OF GOD"
            sections:
              - s4_1_1: "I. Transition from the Doctrine of God to His Works"
              - s4_1_2: "II. Definition and General Description of God’s Works"
          - s4_2: "EXEGESIS"
