                          - s2_2_1_1_2_1: "i. Manifestation of Divine Attributes"
                          - s2_2_1_1_2_2: "ii. Both Insufficient After the Fall"
                      - s2_2_1_1_3: "c. Third Grade: Revelation Through the Word"
