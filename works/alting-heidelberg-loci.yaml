                    sections:
                      - s2_2_1_2_1: "a. Metonymical Uses"
                      - s2_2_1_2_2: "b. Metaphorical Uses"
                      - s2_2_1_2_3: "c. Synecdochical Uses"
                      - s2_2_1_2_4: "d. Proper Sense Here Employed"
                  - s2_2_1_3: "3. The Causes of Revelation"
                  - s2_2_1_4: "4. The Mode and Circumstances of Revelation"
