                          - s2_2_3_2_1_1: "i. Impulsive Cause"
                          - s2_2_3_2_1_2: "ii. God as Triple Author of Scripture"
                          - s2_2_3_2_1_3: "iii. By Example (Writing the Law)"
                          - s2_2_3_2_1_4: "iv. By Command"
                          - s2_2_3_2_1_5: "v. By Inspiration"
                          - s2_2_3_2_1_6: "vi. Instrumental Writers (Prophets and Apostles)"
                          - s2_2_3_2_1_7: "vii. Why Christ Wrote Nothing"
                      - s2_2_3_2_2: "b. The Divine Authority of Scripture"
                        sections:
                          - s2_2_3_2_2_1: "i. Definition of Authority"
                          - s2_2_3_2_2_2: "ii. Threefold Testimony Confirming Authority"
                  - s2_2_3_3: "3. The Material or Object of the Written Word"
