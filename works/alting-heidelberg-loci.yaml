              - s3_5_1: "A. The Person Defined"
                sections:
                  - s3_5_1_1: "1. Synonyms for Person"
                  - s3_5_1_2: "2. Definition of Person"
                  - s3_5_1_3: "3. Mode of Subsisting"
                  - s3_5_1_4: "4. Corollaries Concerning Divine Persons"
              - s3_5_2: "B. The Number and Names of Divine Persons"
