                      - s3_3_3_1_1: "a. Properly (Common and Particular)"
                      - s3_3_3_1_2: "b. Improperly (By Ordination, Usurpation, or Human Error)"
                  - s3_3_3_2: "2. Other Names of God"
                    sections:
                      - s3_3_3_2_1: "a. Multiplicity of Names Does Not Derogate Simplicity"
                      - s3_3_3_2_2: "b. Names Not Synonymous"
                      - s3_3_3_2_3: "c. Analogical Denomination from Creatures"
