                  - s3_5_5_1: "1. Definition and Meaning"
                  - s3_5_5_2: "2. Common and Singular Predications"
                    sections:
                      - s3_5_5_2_1: "a. Common: Person of Deity"
                      - s3_5_5_2_2: "b. Singular: Third Person Proceeding from Father and Son"
                  - s3_5_5_3: "3. Proof of Origin from the Father"
                  - s3_5_5_4: "4. Proof of Origin from the Son"
                  - s3_5_5_5: "5. Mode Expressed by Procession"
                  - s3_5_5_6: "6. What Procession Is and How It Differs from Generation"
                  - s3_5_5_7: "7. Similitudes Adumbrating Procession"
                  - s3_5_5_8: "8. Procession Is Natural and Eternal"
              - s3_5_6: "F. The Common Essence of the Three Persons"
