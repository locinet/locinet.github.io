                      - s3_3_3_3_3: "c. אלהים [Elohim] – Power and Strength"
                      - s3_3_3_3_4: "d. אל [El] – Meaning"
                      - s3_3_3_3_5: "e. אדני [Adonai] – Lord or Master"
                  - s3_3_3_4: "4. Principal Names in the New Testament"
                    sections:
                      - s3_3_3_4_1: "a. Θεός [Theos] – Etymology"
                      - s3_3_3_4_2: "b. Κύριος [Kyrios] – Lord"
              - s3_3_4: "D. Description of God"
                sections:
                  - s3_3_4_1: "1. No True Genus or True Difference"
                  - s3_3_4_2: "2. Analogical Genus: Spirit"
                  - s3_3_4_3: "3. Differentia: Uncreated and of Three Persons"
                  - s3_3_4_4: "E. Twofold Theory Concerning God"
          - s3_4: "IV. Absolute Theory: The Essence of God"
