                          - s2_2_3_3_2_1: "i. Number (Twenty-Seven) and Language (Greek)"
                          - s2_2_3_3_2_2: "ii. Authority Equal to Old Testament"
                          - s2_2_3_3_2_3: "iii. Distribution (Histories, Epistles, Prophecy)"
                  - s2_2_3_4: "4. The Form of the Written Word"
                    sections:
                      - s2_2_3_4_1: "a. Form Opposed to Unwritten Word"
                      - s2_2_3_4_2: "b. Form in Itself: The Sense of Scripture"
                      - s2_2_3_4_3: "c. The Sense of Scripture is Unique"
                        sections:
                          - s2_2_3_4_3_1: "i. Literal, Grammatical, Historical Sense"
                          - s2_2_3_4_3_2: "ii. So-Called Multiple Senses are Applications"
                      - s2_2_3_4_4: "f. Interpretation of Scripture"
                        sections:
                          - s2_2_3_4_4_1: "i. Interpretation of Words (Versions)"
                          - s2_2_3_4_4_2: "ii. Interpretation of Things"
                  - s2_2_3_5: "5. The End of the Written Word"
                    sections:
                      - s2_2_3_5_1: "a. Rule of Faith and Life"
                      - s2_2_3_5_2: "b. Supreme Judge of Religious Controversies"
                  - s2_2_3_6: "6. The Effects of the Written Word"
                  - s2_2_3_7: "7. The Subject of the Written Word"
                  - s2_2_3_8: "8. The Adjuncts of the Written Word"
                    sections:
                      - s2_2_3_8_1: "a. First Adjunct: Eternity"
                        sections:
                          - s2_2_3_8_1_1: "i. Not Simply as to Writing"
                          - s2_2_3_8_1_2: "ii. By Reason of Object and Effect"
                      - s2_2_3_8_2: "b. Second Adjunct: Sufficiency"
                        sections:
                          - s2_2_3_8_2_1: "i. Definition of Sufficiency"
                          - s2_2_3_8_2_2: "ii. Essential and Integral Parts Demonstrate It"
                          - s2_2_3_8_2_3: "iii. Diverse Modes of Expression"
                      - s2_2_3_8_3: "c. Third Adjunct: Perspicuity"
                        sections:
                          - s2_2_3_8_3_1: "i. Definition"
                          - s2_2_3_8_3_2: "ii. Many Obscure Things in Scripture"
              - s2_2_4: "D. Scripture as the Sole and Unique Principle of Theology"
                sections:
                  - s2_2_4_1: "1. Distinction Between Theology and the Word of God"
                  - s2_2_4_2: "2. Human Reason Not Properly a Principle of Theology"
                    loci: faith-and-reason
                  - s2_2_4_3: "3. The Use of Reason in Theology"
                    loci: faith-and-reason
          - s2_3: "III. The Use and Application of This Doctrine"
            sections:
              - s2_3_1: "A. For Teaching [Διδασκαλίαν, Didaskalian]"
              - s2_3_2: "B. For Correction [Παιδείαν, Paideian]"
              - s2_3_3: "C. For Reproof [ἐπανόρθωσιν, epanorthōsin]"
              - s2_3_4: "D. For Consolation [Παράκλησιν, Paraklēsin]"
      - s3: "THIRD LOCUS CONCERNING GOD"
        sections:
          - s3_1: "I. The Two Parts of Theology"
          - s3_2: "II. The Definition of God"
          - s3_3: "III. Exegesis of the Definition"
            sections:
              - s3_3_1: "A. Various Divisions of Theology"
                sections:
                  - s3_3_1_1: "1. Several Common Divisions"
                  - s3_3_1_2: "2. The Division Into Doctrine Concerning God and His Works"
                    sections:
                      - s3_3_1_2_1: "a. Scriptural Foundation"
                      - s3_3_1_2_2: "b. Conformity to Rules of Legitimate Division"
                      - s3_3_1_2_3: "c. Works of God Defined"
              - s3_3_2: "B. The Doctrine Concerning God as the First and Most Noble Part of Theology"
                sections:
                  - s3_3_2_1: "1. Reasons for Its Primacy"
                  - s3_3_2_2: "2. No Need to Demonstrate God’s Existence"
