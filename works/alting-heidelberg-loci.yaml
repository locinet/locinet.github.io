                      - s2_2_3_3_1: "a. Books of the Old Testament"
                        sections:
                          - s2_2_3_3_1_1: "i. Number (Forty or Twenty-Two)"
                          - s2_2_3_3_1_2: "ii. Language (Hebrew and Chaldean)"
                          - s2_2_3_3_1_3: "iii. Collection"
                          - s2_2_3_3_1_4: "iv. Distribution (Law, Prophets, Writings)"
                      - s2_2_3_3_2: "b. Books of the New Testament"
