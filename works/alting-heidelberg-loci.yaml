                    sections:
                      - s3_4_1_3_1: "a. From Itself (Self-Existent)"
                      - s3_4_1_3_2: "b. Absolute (Equally Common to Three Persons)"
                      - s3_4_1_3_3: "c. One in Number and Individual"
              - s3_4_2: "B. Properties of the Divine Essence"
