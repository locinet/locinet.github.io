                        sections:
                          - s3_4_2_1_2_1: "i. First Rule: Distinguished Only by Our Conception"
                          - s3_4_2_1_2_2: "ii. Second Rule: All Properties Are Infinite, Eternal, etc."
                          - s3_4_2_1_2_3: "iii. Third Rule: No Properties Communicable to Creatures"
                          - s3_4_2_1_2_4: "iv. Properties Called Communicable or Incommunicable by Effects"
                  - s3_4_2_2: "2. Two Orders of Properties"
                    sections:
                      - s3_4_2_2_1: "a. First Order: Negative Properties (Four)"
                        sections:
                          - s3_4_2_2_1_1: "i. Simplicity"
                          - s3_4_2_2_1_2: "ii. Immutability"
                          - s3_4_2_2_1_3: "iii. Eternity"
                          - s3_4_2_2_1_4: "iv. Immensity"
                      - s3_4_2_2_2: "b. Second Order: Affirmative Properties"
                        sections:
                          - s3_4_2_2_2_1: "i. Life of God"
                          - s3_4_2_2_2_2: "ii. Intellect of God"
                          - s3_4_2_2_2_3: "iii. Will of God"
                          - s3_4_2_2_2_4: "v. Power of God (Omnipotence)"
          - s3_5: "V. Relative Theory: The Persons of God"
