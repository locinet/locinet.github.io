                      - s2_2_2_6_3: "c. Urim and Thummim"
                        sections:
                          - s2_2_2_6_3_1: "i. Scriptural References"
                          - s2_2_2_6_3_2: "ii. Material (Twelve Gemstones)"
                          - s2_2_2_6_3_3: "iii. Form"
                          - s2_2_2_6_3_4: "iv. Efficient Cause"
                          - s2_2_2_6_3_5: "v. End (Oracle Seeking)"
                          - s2_2_2_6_3_6: "vi. Typical Significance"
                          - s2_2_2_6_3_7: "vii. Subject (The Breastplate)"
                          - s2_2_2_6_3_8: "viii. Duration"
              - s2_2_3: "C. The Written Word [ἔγγραφον]"
