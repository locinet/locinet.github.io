                          - s3_5_6_1_1_1: "i. From the Names of God"
                          - s3_5_6_1_1_2: "ii. From the Properties of God"
                          - s3_5_6_1_1_3: "iii. From the Proper Effects of God"
                          - s3_5_6_1_1_4: "iv. From the Proper Worship of God"
                      - s3_5_6_1_2: "b. Proofs for the Son"
                        sections:
                          - s3_5_6_1_2_1: "i. From the Names of God"
                          - s3_5_6_1_2_2: "ii. From the Properties of God"
                          - s3_5_6_1_2_3: "iii. From the Proper Effects of God"
                          - s3_5_6_1_2_4: "iv. From the Proper Worship of God"
                      - s3_5_6_1_3: "c. Proofs for the Holy Spirit"
                        sections:
                          - s3_5_6_1_3_1: "i. From the Names of God"
                          - s3_5_6_1_3_2: "ii. From the Properties of God"
                          - s3_5_6_1_3_3: "iii. From the Proper Effects of God"
                          - s3_5_6_1_3_4: "iv. From the Proper Worship of God"
                  - s3_5_6_2: "2. How the Essence Is Common to the Persons"
                  - s3_5_6_3: "3. Consubstantiality and Equality of the Persons"
                  - s3_5_6_4: "4. Mutual Indwelling of the Persons [Περιχώρησις]"
                  - s3_5_6_5: "5. Distinction Between Divine and Created Persons"
              - s3_5_7: "G. The Distinction of the Persons"
                sections:
                  - s3_5_7_1: "1. Twofold Distinction"
                    sections:
                      - s3_5_7_1_1: "a. From the Essence (By Reason)"
                      - s3_5_7_1_2: "b. Among Themselves (Really)"
                  - s3_5_7_2: "2. Real Distinction Among Persons Explained"
                    sections:
                      - s3_5_7_2_1: "a. In the Persons Themselves"
                      - s3_5_7_2_2: "b. In Their Works"
                        sections:
                          - s3_5_7_2_2_1: "i. By Order of Operations"
                          - s3_5_7_2_2_2: "ii. By Terms of Operation"
      - s4: "THE FOURTH LOCUS CONCERNING THE DECREES OF GOD, AND ESPECIALLY THAT WHICH IS COMMONLY CALLED PREDESTINATION"
