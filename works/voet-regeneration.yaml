                sections:
                  - s2_2_4_1: "1. Problem I: Whether Natural Man Can Use Natural Light to Obtain Salvific Grace"
                  - s2_2_4_2: "2. Problem II: Whether Regeneration Occurs by Moral Persuasion Alone"
                  - s2_2_4_3: "3. Problem III: Whether the Will Lost Something Through the Fall"
                  - s2_2_4_4: "4. Problem IV: Whether the Will Is Determined Immediately or Mediately"
                  - s2_2_4_5: "5. Problem V: Whether the Affirmative Opinion Favors Pelagianism"
                  - s2_2_4_6: "6. Problem VI: Whether Truth Can Be More Easily Defended by This Reasoning"
                  - s2_2_4_7: "7. Problem VII: Whether God Is Considered as Author of Grace in the First Moment and Author of Nature in the Second"
                  - s2_2_4_8: "8. Problem VIII: Whether Merely External Calling Can Be Called Salvific"
                  - s2_2_4_9: "9. Problem IX: Whether Efficacious Internal Drawing Is Properly Part of Salvific Calling"
                  - s2_2_4_10: "10. Problem X: Whether Legal Sorrow and Servile Fear in the Elect Are from Regenerating Grace"
          - s2_3: "III. Positive Absolute Concomitant Adjuncts"
          - s2_4: "IV. Positive Absolute Consequent Adjuncts as Proper Affections"
            sections:
              - s2_4_1: "1. Problem I: Whether Regeneration Always Actually Grows in the Second Moment"
              - s2_4_2: "2. Problem II: Whether the New Form Is the Death of Sin"
          - s2_5: "V. Positive Absolute Consequent Adjuncts as Effects and Results"
