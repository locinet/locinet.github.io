                  - s2_6_10_2: "2. Problem II: Whether Corruption and Grace Differ in Degree Among Regenerate Infants"
              - s2_6_11: "K. Uniform Regeneration of Adults as to Essentials"
                sections:
                  - s2_6_11_1: "1. Problem I: Whether Equal Grace Is Impressed in the First Act"
                  - s2_6_11_2: "2. Problem II: Whether It Differs in Degrees in the Second Moment"
                  - s2_6_11_3: "3. Problem III: Whether Regeneration Can Occur Without External Calling"
              - s2_6_12: "L. Cognizable A Posteriori from Ourselves"
              - s2_6_13: "M. Primordial Effects Sometimes Greater or More Sensible"
          - s2_7: "VII. Privative and Negative Adjuncts"
            sections:
              - s2_7_1: "A. Imperfection as to Terminus in First and Second Act"
              - s2_7_2: "B. Spiritual Warfare Following Regeneration"
              - s2_7_3: "C. Two Principles of Acting: Flesh and Spirit"
              - s2_7_4: "D. Hypocrisy and Falsely Boasted Conversion"
              - s2_7_5: "E. Regeneration Not Unwilling, Coerced, or Violent"
              - s2_7_6: "F. Not a Miracle Strictly So Called"
              - s2_7_7: "G. Never Repeated; Terminus Never Totally Abolished"
                sections:
                  - s2_7_7_1: "1. Problem: Whether Regeneration Occurs Once for Justification but Often for Repentance"
