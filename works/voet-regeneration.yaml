              - s2_6_8: "H. Actual Corruption of Some Elect Greater Than Many Reprobate"
              - s2_6_9: "I. Preceding Corruption Sometimes Extending to End of Life"
              - s2_6_10: "J. Problems Concerning Comparative Adjuncts"
