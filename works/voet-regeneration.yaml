                  - s2_5_3_1: "1. Problem I: Whether Illumination Differs in Species from Common Illumination"
                  - s2_5_3_2: "2. Problem II: Whether Regeneration of Intellect Requires New Light Impressed Within"
                  - s2_5_3_3: "3. Problem III: Cause of Apparent Contradictions in Dogmatic and Practical Writers"
                  - s2_5_3_4: "4. Problem IV: Whether Acts 15:9 Refers to Habitual or Actual Faith"
                  - s2_5_3_5: "5. Problem V: Whether Faith Is Considered Relatively or Absolutely in Acts 15:9"
                  - s2_5_3_6: "6. Problem VI: Whether Faith in Habit Must Be Considered Materially and Formally"
                  - s2_5_3_7: "7. Problem VII: Whether Adoption Can Be Called Prior or Posterior to Regeneration"
