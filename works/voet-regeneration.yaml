                    sections:
                      - s2_11_1_5_1: "a. Problem I: Whether Habits Are Diminished or Acts Impeded in Lapse"
                      - s2_11_1_5_2: "b. Problem II: Whether Restoration Occurs at Once or Gradually"
                  - s2_11_1_6: "6. Consummation or Final Perfection"
                    sections:
                      - s2_11_1_6_1: "a. Problem 1: Interpretation of Romans 7:24"
                      - s2_11_1_6_2: "b. Problem 2: Whether Bodily Death Is the Proximate Cause of Sin’s Abolition"
                      - s2_11_1_6_3: "c. Problem 3: Whether Consummation Is a Work of the Regenerating Spirit Qua Talis"
                      - s2_11_1_6_4: "d. Problem 4: Whether the Soul Is Passive or Active in Consummation"
                      - s2_11_1_6_5: "e. Problem 5: Whether Augmentation Is Infused at Once"
                      - s2_11_1_6_6: "f. Problem 6: Whether Sanctification and Excitation to Second Act Are Simultaneous"
                      - s2_11_1_6_7: "g. Problem 7: Whether First Acts Belong to the Light of Grace or Glory"
                      - s2_11_1_6_8: "h. Problem 8: The Timing of Perfect Sanctification Relative to Death"
                      - s2_11_1_6_9: "i. Problem 9: Whether Perfection Increases Intensively at the Resurrection"
              - s2_11_2: "B. Conversion Considered According to New and Spiritual Acts (On Our Part)"
                sections:
                  - s2_11_2_1: "1. Acts First in Order (First Actual Conversion)"
                  - s2_11_2_2: "2. Distinction of First Acts"
                  - s2_11_2_3: "3. Subsequent, Second, or Iterated Acts"
                  - s2_11_2_4: "4. Practical Resources Commended"
