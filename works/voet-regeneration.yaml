voet-regeneration:
  author: Q983347
  date_added: 2026-02-09
  category: disputations
  la:
    title: De regeneratione
    orig_lang: true
    editions:
      - year: 1655
  en:
    title: On Regeneration
    sections:
      - s1: "ON REGENERATION"
        sections:
          - s1_1: "I. Introduction"
          - s1_2: "II. Redemption Through Christ: Its General Division"
            sections:
              - s1_2_1: "A. Impetration and Application Distinguished"
              - s1_2_2: "B. Application Defined as Translation from Darkness to Light"
              - s1_2_3: "C. The Threefold Acts of Application"
                sections:
                  - s1_2_3_1: "1. Intentional or Relative Actions of God"
                    sections:
                      - s1_2_3_1_1: "a. Definition and Nature"
                      - s1_2_3_1_2: "b. The Three Acts: Reconciliation, Justification, Adoption"
                        sections:
                          - s1_2_3_1_2_1: "(1) Reconciliation: Removing Evils and Enmity"
                          - s1_2_3_1_2_2: "(2) Justification: Adjudicating Acquired Goods"
                          - s1_2_3_1_2_3: "(3) Adoption: Declaring Sense of Mind"
                      - s1_2_3_1_3: "c. How Adoption and Reconciliation Relate to Justification"
                  - s1_2_3_2: "2. Moral Actions of God"
                  - s1_2_3_3: "3. Real Actions Operating Physically"
          - s1_3: "III. The Distinction of Regeneration According to Subjects"
          - s1_4: "IV. The Name and Synonyms of Regeneration"
            sections:
              - s1_4_1: "A. The Name “Regeneration” Explained"
              - s1_4_2: "B. Synonyms of Regeneration"
                sections:
                  - s1_4_2_1: "1. Metaphorical Synonyms"
                  - s1_4_2_2: "2. More Proper Synonyms"
                    sections:
                      - s1_4_2_2_1: "a. Sanctification"
                      - s1_4_2_2_2: "b. Conversion"
                        sections:
                          - s1_4_2_2_2_1: "(1) First Signification: Act of God Alone"
                          - s1_4_2_2_2_2: "(2) Second Signification: Complete Act of God and Man"
                          - s1_4_2_2_2_3: "(3) Third Signification: Formal Act of Man"
                      - s1_4_2_2_3: "c. Drawing"
                      - s1_4_2_2_4: "d. Translation into the Kingdom of God"
                      - s1_4_2_2_5: "e. Renovation"
                      - s1_4_2_2_6: "f. Transformation"
                      - s1_4_2_2_7: "g. Liberation from Sin"
              - s1_4_3: "C. Homonymy of Regeneration"
                sections:
                  - s1_4_3_1: "1. Metonymically: Glorification"
                  - s1_4_3_2: "2. Four Senses of Regeneration Proper"
                  - s1_4_3_3: "3. Active and Passive Regeneration Distinguished"
          - s1_5: "V. The Definition of Regeneration"
            sections:
              - s1_5_1: "A. The Definition Stated"
              - s1_5_2: "B. Explanation of the Definition"
                sections:
                  - s1_5_2_1: "1. The Genus: Action of God"
                  - s1_5_2_2: "2. The Subject of Regeneration"
                    sections:
                      - s1_5_2_2_1: "a. Total Subject"
                        sections:
                          - s1_5_2_2_1_1: "(1) Remote: Man"
                          - s1_5_2_2_1_2: "(2) Proximate: Elect Man"
                          - s1_5_2_2_1_3: "(3) Closer: Elect Sinner"
                          - s1_5_2_2_1_4: "(4) Proximate: Elect Sinner Given to Christ"
                      - s1_5_2_2_2: "b. Partial Subject"
                        sections:
                          - s1_5_2_2_2_1: "(1) Formally and Per Se: Intellect and Will"
                          - s1_5_2_2_2_2: "(2) Participatively and Consecutively: Sensuality and Lower Faculties"
                      - s1_5_2_2_3: "c. Corollaries"
                        sections:
                          - s1_5_2_2_3_1: "(1) Rejection of Pelagian Error on Sensuality Alone"
                          - s1_5_2_2_3_2: "(2) Rejection of Remonstrant Assertion on Pre-Fall Qualities"
                          - s1_5_2_2_3_3: "(3) Rejection of Remonstrant Exclusion of Infants"
                  - s1_5_2_3: "3. The Object of Regeneration"
                    sections:
                      - s1_5_2_3_1: "a. Immediate or First Object: Individual Elect"
                      - s1_5_2_3_2: "b. Mediate or Second Object: Church of the Elect"
                  - s1_5_2_4: "4. The Terminus A Quo: Sin or Corruption"
                  - s1_5_2_5: "5. The Terminus Ad Quem"
                    sections:
                      - s1_5_2_5_1: "a. Proximate or Formal Terminus: Supernatural Qualities"
                      - s1_5_2_5_2: "b. Ultimate or Completive Terminus: The Renewed Man"
                      - s1_5_2_5_3: "c. Consecutive Terminus"
                        sections:
                          - s1_5_2_5_3_1: "(1) First: First Actual Conversion"
                          - s1_5_2_5_3_2: "(2) Second: Conservation, Instauration, Augmentation"
                          - s1_5_2_5_3_3: "(3) Final: Consummation"
                      - s1_5_2_5_4: "d. Terminus Ad Quem Per Alterum: The Church"
          - s1_6: "VI. The Causes of Regeneration"
            sections:
              - s1_6_1: "A. The Efficient Cause"
                sections:
                  - s1_6_1_1: "1. The First and Supreme Efficient Cause: The Triune God"
                  - s1_6_1_2: "2. The Proëgumenal Immanent Cause: God’s Will and Good Pleasure"
                  - s1_6_1_3: "3. The Emanant Cause: Regenerating Grace"
                    sections:
                      - s1_6_1_3_1: "a. Special, Efficacious, Invincible, Prevailing, and Persevering"
                      - s1_6_1_3_2: "b. Distinction from Grace as Terminus of Regeneration"
                      - s1_6_1_3_3: "c. Rejection of Enthusiast Deifications"
                      - s1_6_1_3_4: "d. Rejection of Pelagianizing Fictions"
                  - s1_6_1_4: "4. The Subordinate Principal Cause: Christ the Mediator"
                  - s1_6_1_5: "5. The Procatarctic Cause: The Merit of Christ"
                    sections:
                      - s1_6_1_5_1: "a. Christ as Efficient Cause Directly and Physically (Theologically)"
                      - s1_6_1_5_2: "b. Christ as Efficient Cause from Inferior Right (Economically)"
                      - s1_6_1_5_3: "c. Christ as Subordinate Meritorious Cause"
                      - s1_6_1_5_4: "d. Christ as Exemplary Cause"
                      - s1_6_1_5_5: "e. The Proximate Procatarctic Cause: Christ’s Obedience"
                      - s1_6_1_5_6: "f. Passive Obedience as Proximate, Dispositive, Consecutive Cause"
                      - s1_6_1_5_7: "g. Active Obedience as Proximate, Immediate, Formal Cause"
                      - s1_6_1_5_8: "h. The Material and Formal of Passive Obedience"
                      - s1_6_1_5_9: "i. Application to Catechism Question 43"
                      - s1_6_1_5_10: "j. Resurrection and Intercession as Proximately Impetrating Causes"
                  - s1_6_1_6: "6. Procatarctic or Motive Cause with Respect to Us"
                    sections:
                      - s1_6_1_6_1: "a. None in First Regeneration"
                      - s1_6_1_6_2: "b. Not in Second Moment of Regeneration as Such"
                      - s1_6_1_6_3: "c. Only in the Effect: Actual Repentance and Piety"
              - s1_6_2: "B. The Exemplary Causes"
              - s1_6_3: "C. The Instrumental Causes"
          - s1_7: "VII. Problems Concerning the Efficient Causes"
            sections:
              - s1_7_1: "A. Problem I: Whether Faith Is a Cause or Internal Instrument of Regeneration"
              - s1_7_2: "B. Problem II: Whether Faith Precedes Regeneration or Repentance"
              - s1_7_3: "C. Problem III: Whether Man’s Intellect and Will Concur to Regeneration"
              - s1_7_4: "D. Problem IV: Whether There Are Preparatory Dispositions Concurring to Regeneration"
              - s1_7_5: "E. Problem V: Whether Restraining Grace Through Common Ecclesiastical Aids Is a Disposition"
              - s1_7_6: "F. Problem VI: Whether the Word of God Is Heard Savingly Before Conversion"
              - s1_7_7: "G. Problem VII: Whether Unregenerate or Regenerate Man Sanctifies Himself"
          - s1_8: "VIII. The Material and Formal Causes"
            sections:
              - s1_8_1: "A. Proper Material and Formal Causes Not Applicable to Accidents"
              - s1_8_2: "B. Analogical Concepts Applied to Regeneration"
              - s1_8_3: "C. Regeneration or Conversion in the Second Moment Analogically Conceived"
              - s1_8_4: "D. Comparison with Creation and Resuscitation"
              - s1_8_5: "E. Comparison with Physical Motion"
          - s1_9: "IX. The End of Regeneration"
          - s1_10: "X. Corollary: Rejection of Socinian Errors"
      - s2: "ON REGENERATION"
        sections:
          - s2_1: "I. Introduction"
          - s2_2: "II. Positive Antecedent Adjuncts of Regeneration"
            sections:
              - s2_2_1: "A. Adjuncts Anteceding Regeneration Itself"
              - s2_2_2: "B. Antecedent Adjuncts Without Infallible Connection to Salvation"
              - s2_2_3: "C. Antecedent Adjuncts Derived from Genus, Object, and Causes"
