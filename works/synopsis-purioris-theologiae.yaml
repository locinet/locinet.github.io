synopsis-purioris-theologiae:
  author:
    - Q1698178
    - Q2848543
    - Q606757
    - Q606748
  date_added: 2026-02-09
  corporate_author: "Professors of Leiden"
  la:
    title: Synopsis Purioris Theologiae
    orig_lang: true
    editions:
      - year: 1625
        place: Leiden
  en:
    title: Synopsis of Pure Theology
    sections:
      - s1: "DISPUTATION I: ON SACRED THEOLOGY"
        sections:
          - s1_1: "I. Prolegomena to the Disputation"
          - s1_2: "II. The Name and Nature of Theology"
            sections:
              - s1_2_1: "A. The Etymology of the Term “Theology”"
              - s1_2_2: "B. The Historical Usage of the Term"
          - s1_3: "III. The Distinction of Theology According to Subject"
            sections:
              - s1_3_1: "A. The Unity and Diversity of Theology"
              - s1_3_2: "B. Archetypal Theology"
              - s1_3_3: "C. Ectypal Theology"
                sections:
                  - s1_3_3_1: "1. Definition: Knowledge Communicated to Creatures"
                  - s1_3_3_2: "2. The Modes and Degrees of Communication"
                  - s1_3_3_3: "D. The Singular Communication to Christ the God-Man"
                  - s1_3_3_4: "E. The Restriction of This Disputation to the Theology of Pilgrims"
          - s1_4: "IV. The Revelation of Theology"
            sections:
              - s1_4_1: "A. The General Division of Revelation"
              - s1_4_2: "B. Natural Revelation"
              - s1_4_3: "C. Supernatural Revelation"
          - s1_5: "V. The Definition of Theology"
          - s1_6: "VI. The Genus of Theology Explained"
            sections:
              - s1_6_1: "A. Theology as Science"
              - s1_6_2: "B. Theology as Wisdom (Thesis XI)"
          - s1_7: "VII. The Object of Theology"
          - s1_8: "VIII. The Efficient Cause of Theology"
            sections:
              - s1_8_1: "A. The Principal Efficient Cause: God"
              - s1_8_2: "B. The Instrumental Cause: The Word of God (Thesis XIV)"
          - s1_9: "IX. The Mode of Theological Revelation"
            sections:
              - s1_9_1: "A. The Twofold Division"
              - s1_9_2: "B. The Diverse Modes of Communication"
              - s1_9_3: "C. The Accommodation to All Capacities"
          - s1_10: "X. The Fruits and Ends of Theology"
            sections:
              - s1_10_1: "A. The First Fruit: Knowledge of Truth According to Piety"
              - s1_10_2: "B. The Form of Theology"
              - s1_10_3: "C. The Second Fruit: Wisdom unto Salvation"
              - s1_10_4: "D. The Ultimate End: The Glory of God"
          - s1_11: "XI. The Nature of Theology: Theoretical or Practical?"
            sections:
              - s1_11_1: "A. The Question Stated"
              - s1_11_2: "B. The Opinions of Theologians"
              - s1_11_3: "C. The Author’s Position: Both Theoretical and Practical"
              - s1_11_4: "D. Theory and Practice Not Opposed but Conjoined"
              - s1_11_5: "E. Theology Not Consisting in Empty Speculation"
          - s1_12: "XII. True Theology Opposed to False Theology"
            sections:
              - s1_12_1: "A. The General Opposition"
              - s1_12_2: "B. The Two Modes of Error"
              - s1_12_3: "C. The Three Principal Species of False Theology"
          - s1_13: "XIII. The Unity of Old and New Testament Theology"
          - s1_14: "XIV. The Demonstrative Character of Theology"
      - s2: "DISPUTATION II: CONCERNING THE NECESSITY AND AUTHORITY OF HOLY SCRIPTURE"
        sections:
          - s2_1: "I. The Nature and Definition of Holy Scripture"
            sections:
              - s2_1_1: "A. The Transition from the Doctrine of Theology to the Doctrine of Scripture"
              - s2_1_2: "B. The Proper Understanding of the Term “Scripture”"
              - s2_1_3: "C. The Formal Definition of Holy Scripture"
          - s2_2: "II. The Necessity of Holy Scripture"
            sections:
              - s2_2_1: "A. The Historical Occasion for the Inscripturation of Divine Revelation"
                sections:
                  - s2_2_1_1: "1. The Primitive Mode of Divine Instruction before Moses"
                  - s2_2_1_2: "2. The Divine Example and Command for Writing"
              - s2_2_2: "B. The Refutation of Errors Concerning Scripture’s Necessity"
                sections:
                  - s2_2_2_1: "1. Against the Pontifical Doctors Who Deny Scripture’s Necessity"
                    sections:
                      - s2_2_2_1_1: "a. The False Assertion of the Pontificals Stated"
                      - s2_2_2_1_2: "b. The Necessity of Scripture Established from Scripture’s Own Testimony"
                  - s2_2_2_2: "2. Against the Libertines Who Depreciate Scripture’s Use"
                    sections:
                      - s2_2_2_2_1: "a. The Impious Opinion of the Libertines Stated"
                      - s2_2_2_2_2: "b. The First Refutation: Scripture Alone Provides Certainty in Religion"
                      - s2_2_2_2_3: "c. The Second Refutation: Scripture Commends Its Use to All Believers, Not Only to Beginners"
          - s2_3: "III. The Authority of Holy Scripture"
            sections:
              - s2_3_1: "A. The Twofold Question Concerning Scripture’s Authority Proposed"
              - s2_3_2: "B. Arguments for Scripture’s Divinity Against Profane Men Who Doubt It Entirely"
                sections:
                  - s2_3_2_1: "1. The Preliminary Consideration Concerning the Incapacity of Unbelievers to Receive the Spirit’s Testimony"
                  - s2_3_2_2: "2. The First Genus of Arguments: From the Criteria of Historical Truth"
                    sections:
                      - s2_3_2_2_1: "a. The Principle Stated: If Sacred History Be True, It Must Also Be Divine"
                      - s2_3_2_2_2: "b. The Standard Criteria for Historical Credibility According to Arrian and Josephus"
                      - s2_3_2_2_3: "c. The Application to Sacred History: The Character and Credibility of the Sacred Writers"
                      - s2_3_2_2_4: "d. The Application to Sacred History: Their Eyewitness Testimony, Absence of Worldly Motive, and Unanimous Consent"
                  - s2_3_2_3: "3. The Second Genus of Arguments: From the Perfection and Divinity of the Christian Religion"
                    sections:
                      - s2_3_2_3_1: "a. The Transition: What Follows Can Engender Faith"
                      - s2_3_2_3_2: "b. The First Mark of True Religion: The Worship of the True God Alone as Creator and Governor"
                      - s2_3_2_3_3: "c. The Second Mark of True Religion: The True Method of Reconciliation with God"
                      - s2_3_2_3_4: "d. The Third Mark of True Religion: True and Perfect Duties Prescribed toward God and Neighbor"
                  - s2_3_2_4: "4. The Third and Principal Genus of Arguments: From the Internal Marks of Divinity in Scripture Itself"
                    sections:
                      - s2_3_2_4_1: "a. The Principle Stated: Certain Rays of Divinity Shine Forth More Conspicuously"
                      - s2_3_2_4_2: "b. The First Mark of Divinity: Miracles Exceeding All Created Power"
                      - s2_3_2_4_3: "c. The Second Mark of Divinity: The Divine Subject Matter of Scripture"
                      - s2_3_2_4_4: "d. The Third Mark of Divinity: The Divine Form and End of Scripture"
                      - s2_3_2_4_5: "e. The Fourth Mark of Divinity: The Divine Effects of Scripture"
                      - s2_3_2_4_6: "f. The Fifth Mark of Divinity: The Divine Adjuncts of Scripture"
                  - s2_3_2_5: "5. The Summary and Application of These Marks to Sincere Readers"
              - s2_3_3: "C. Against Socinus and Others Who Deny Scripture’s Divinity in Lesser Matters"
              - s2_3_4: "D. Against the Pontificals Who Subject Scripture’s Authority to the Testimony of the Church"
                sections:
                  - s2_3_4_1: "1. The False Assertion of the Pontificals Stated"
                  - s2_3_4_2: "2. The Ministerial Office of the Church Distinguished from Authoritative Power over Scripture"
                  - s2_3_4_3: "3. Scripture’s Authority Demonstrated to Be Far Greater than the Church’s"
                  - s2_3_4_4: "4. The Greater Weight of the Ancient Church’s Testimony Compared to the Modern Church’s"
                  - s2_3_4_5: "5. Scripture’s Authority Depends upon God Alone, Not upon the Church’s Testimony"
                  - s2_3_4_6: "6. The Prophets and Apostles Never Subjected the Authority of the Word to Human or Angelic Authority"
      - s3: "DISPUTATION III: CONCERNING THE CANONICAL AND APOCRYPHAL BOOKS"
        sections:
          - s3_1: "I. The Nature and Definition of the Canonical Books"
            sections:
              - s3_1_1: "A. The Transition from the General Authority of Scripture to the Particular Question of Canonical Books"
              - s3_1_2: "B. The Formal Definition of Holy Scripture or Canonical Books"
              - s3_1_3: "C. The Appellations of Holy Scripture"
                sections:
                  - s3_1_3_1: "1. The Sacred Names Whereby Scripture Is Called"
                  - s3_1_3_2: "2. The Name “Syntagma” or “Collection” Explained"
          - s3_2: "II. The Writing of the Sacred Books"
            sections:
              - s3_2_1: "A. The Twofold Consideration: Writing and Collection"
              - s3_2_2: "B. The Efficient Cause of the Writing of Sacred Books"
                sections:
                  - s3_2_2_1: "1. The Principal Cause: God the Father, in the Son, through the Holy Spirit"
                  - s3_2_2_2: "2. The Instrumental Cause: The Holy Servants of God Divinely Called and Inspired"
                  - s3_2_2_3: "3. The Mode of Writing: Dictation and Assistance"
                  - s3_2_2_4: "4. The Use of Scribes and the Approbation of Others’ Writings"
              - s3_2_3: "C. The Material, Formal, and Final Causes of the Writing"
              - s3_2_4: "D. The Authentic Edition of Scripture"
                sections:
                  - s3_2_4_1: "1. The Original Autographs and Their Copies in Hebrew and Greek"
                  - s3_2_4_2: "2. Translations as Holy Scripture and the Rejection of the Vulgate’s Exclusive Authority"
          - s3_3: "III. The Collection and Arrangement of the Sacred Books"
            sections:
              - s3_3_1: "A. The Divine Origin of the Collection"
                sections:
                  - s3_3_1_1: "1. The Immediate Collection: Books Written for the Whole Church"
                  - s3_3_1_2: "2. The Mediate Collection: Books First Written to Particular Churches"
              - s3_3_2: "B. The Criteria for the Communication and Acceptance of Canonical Books"
          - s3_4: "IV. The Doubts Concerning Certain Books and the Closure of the Canon"
          - s3_5: "V. The End and Purpose of the Collection: Scripture as the Perfect Canon"
            sections:
              - s3_5_1: "A. The End of the Collection: A Perfect and Perpetual Canon"
              - s3_5_2: "B. The Appellation “Canonical” Explained"
              - s3_5_3: "C. Scripture as the Sole Principle, Matter, Canon, Witness, and Judge"
              - s3_5_4: "D. The Criterion of Judgment Stated in Three Axioms"
          - s3_6: "VI. The Historical Development of the Canon"
          - s3_7: "VII. The Division of the Canonical Books"
            sections:
              - s3_7_1: "A. The Division into Old and New Testament Explained"
              - s3_7_2: "B. The Distinction into Prophetic and Apostolic Explained"
              - s3_7_3: "C. The Enumeration of All Canonical Books"
              - s3_7_4: "D. The Catalogues of the Old Testament Books"
                sections:
                  - s3_7_4_1: "1. The Ancient Jewish Enumeration of Twenty-Two Books"
                  - s3_7_4_2: "2. The Various Distinctions and Classifications Proposed"
                  - s3_7_4_3: "3. The Most Ancient Partition Approved by Christ and the Apostles"
                  - s3_7_4_4: "4. The Difference in Number According to Josephus and Jerome"
                  - s3_7_4_5: "5. The Modern Hebrew Division into Four Orders"
                  - s3_7_4_6: "6. The Greek and Latin Nomenclature and Order"
                  - s3_7_4_7: "7. The Various Class Distinctions Among the Greeks"
                  - s3_7_4_8: "8. The Scholastic Distinction into Legal, Historical, Sapiential, and Prophetical"
              - s3_7_5: "E. The Catalogue of the New Testament Books"
                sections:
                  - s3_7_5_1: "1. The Number and Arrangement of the New Testament Books"
                  - s3_7_5_2: "2. The First Class: The Four Gospels"
                  - s3_7_5_3: "3. The Second Class: The Acts of the Apostles"
                  - s3_7_5_4: "4. The Third Class: The Apostolic Epistles"
                  - s3_7_5_5: "5. The Fourth Class: The Apocalypse"
                  - s3_7_5_6: "6. The Books Formerly Doubted and Their Vindication"
          - s3_8: "VIII. The Apocryphal Books"
            sections:
              - s3_8_1: "A. The Distinction Between Canonical and Non-Canonical Books"
              - s3_8_2: "B. The Enumeration of the Apocryphal Books of the Old Testament"
              - s3_8_3: "C. The Roman Position Compared with the Reformed Position"
              - s3_8_4: "D. The Reasons Why These Writings Are Not Held as Sacred"
              - s3_8_5: "E. The Pseudonymous Books of the New Testament"
          - s3_9: "IX. The Apostles’ Creed and Ecclesiastical Writings"
            sections:
              - s3_9_1: "A. The Appellations, Origin, and Authority of the Apostles’ Creed"
              - s3_9_2: "B. The Authority of Ecclesiastical Councils, Creeds, and Fathers"
      - s24: "DISPUTATION XXIV: On Divine Predestination"
        sections:
          - s24_1: "I. PROLEGOMENA CONCERNING THE DOCTRINE OF DIVINE PREDESTINATION"
            sections:
              - s24_1_1: "A. The Necessity of Teaching the Doctrine of Predestination in the Church"
              - s24_1_2: "B. The Required Moderation and Spiritual Prudence in Handling This Doctrine"
          - s24_2: "II. THE DEFINITION AND GENERAL NATURE OF PREDESTINATION"
            sections:
              - s24_2_1: "A. The Etymology and Signification of the Term “Predestination”"
                sections:
                  - s24_2_1_1: "1. The Dual Meaning of Predestinating"
                  - s24_2_1_2: "2. Patristic Definitions of Predestination"
              - s24_2_2: "B. The Various Acceptations of the Term “Predestination” in Scripture"
              - s24_2_3: "C. The Proper Use of “Predestination” in the New Testament"
              - s24_2_4: "D. The Analogical Extension of “Predestination” to Reprobation"
              - s24_2_5: "E. The Angelic and Human Objects of Divine Predestination"
          - s24_3: "III. THE DOCTRINE OF ELECTION"
            sections:
              - s24_3_1: "A. The Definition and Nature of Election"
                sections:
                  - s24_3_1_1: "1. The Etymology and Biblical Usage of “Election”"
                  - s24_3_1_2: "2. The Twofold Consideration of Election"
                  - s24_3_1_3: "3. The Scope of This Disputation: Eternal Election"
              - s24_3_2: "B. The Synonymous Terms for Election in Scripture"
                sections:
                  - s24_3_2_1: "1. Foreknowledge (gnosis)"
                  - s24_3_2_2: "2. Predestination (horismos)"
                  - s24_3_2_3: "3. Purpose (prothesis)"
              - s24_3_3: "C. The Formal Definition of Election Expounded"
              - s24_3_4: "D. The Attributes of the Decree of Election"
                sections:
                  - s24_3_4_1: "1. The Eternity of the Decree"
                  - s24_3_4_2: "2. The Immutability of the Decree"
                    sections:
                      - s24_3_4_2_1: "a. Refutation of the Division into Complete and Incomplete Election"
                      - s24_3_4_2_2: "b. Refutation of the Division into Revocable and Irrevocable Election"
                  - s24_3_4_3: "3. The Simplicity of the Divine Act Despite Multiple Objects"
                  - s24_3_4_4: "4. The Simultaneous Ordination of End and Means"
              - s24_3_5: "E. The Material Cause of Election: The Fallen Human Race"
                sections:
                  - s24_3_5_1: "1. The State of Humanity as the Matter of Election"
                  - s24_3_5_2: "2. Scriptural Demonstration That Election Presupposes the Fall"
                  - s24_3_5_3: "3. The Relation of the Fall to God’s Providence"
              - s24_3_6: "F. Christ’s Place in the Decree of Election"
                sections:
                  - s24_3_6_1: "1. Christ as the Primary Elect: Head and Redeemer"
                  - s24_3_6_2: "2. The Harmony Between Christ’s Election and the Election of His Members"
                  - s24_3_6_3: "3. The Mutual Relation Between Christ and the Elect"
                  - s24_3_6_4: "4. The Priority of Christ’s Election as Means to the Church’s Redemption"
                  - s24_3_6_5: "5. The Unity of Christ’s Election with the Election of His Members"
              - s24_3_7: "G. The Number of the Elect"
              - s24_3_8: "H. The Efficient and Moving Cause of Election"
                sections:
                  - s24_3_8_1: "1. Statement of the Question Regarding the Cause"
                  - s24_3_8_2: "2. Refutation of the Pelagian Opinion: Good Works as the Cause"
                  - s24_3_8_3: "3. Refutation of the Semi-Pelagian Opinion: Foreseen Faith as the Condition"
                    sections:
                      - s24_3_8_3_1: "a. The Incompatibility with Pure Grace"
                      - s24_3_8_3_2: "b. The Reversion to Works-Based Election"
                      - s24_3_8_3_3: "c. The Superfluity of Such an Election"
                      - s24_3_8_3_4: "d. The Contradiction with Explicit Scripture"
                  - s24_3_8_4: "4. The Orthodox Position: God’s Good Pleasure and Undeserved Grace Alone"
                  - s24_3_8_5: "5. The Compatibility of God’s Free Will with Wisdom and Right Reason"
              - s24_3_9: "I. The Uses and Fruits of the Doctrine of Election"
                sections:
                  - s24_3_9_1: "1. The Manifold Benefits in the Church"
                  - s24_3_9_2: "2. The Certainty of Election from Its Effects and Marks"
                  - s24_3_9_3: "3. The Supreme End: The Demonstration of God’s Grace and Glory"
          - s24_4: "IV. THE DOCTRINE OF REPROBATION"
            sections:
              - s24_4_1: "A. The Necessity of Treating Reprobation"
              - s24_4_2: "B. The Definition and Nature of Reprobation"
                sections:
                  - s24_4_2_1: "1. The Etymology of “Reprobate”"
                  - s24_4_2_2: "2. The Twofold Mode of Expression in Scripture"
                    sections:
                      - s24_4_2_2_1: "a. The Negative Mode"
                      - s24_4_2_2_2: "b. The Affirmative Mode"
                  - s24_4_2_3: "3. The Theological Distinction: Negative and Affirmative Reprobation"
              - s24_4_3: "C. The Object of Reprobation: Sinful and Guilty Man"
              - s24_4_4: "D. The Unity of the Divine Act Despite Twofold Consideration"
                sections:
                  - s24_4_4_1: "1. The Terminus a Quo: Desertion in Common Corruption"
                  - s24_4_4_2: "2. The Terminus ad Quem: Specific Degrees of Damnation"
              - s24_4_5: "E. The Justice of Reprobation"
                sections:
                  - s24_4_5_1: "1. The Justice of Preterition"
                  - s24_4_5_2: "2. The Justice of Predamnation"
              - s24_4_6: "F. The Relation of Reprobation to Common Grace"
                sections:
                  - s24_4_6_1: "1. The Distinction Between Peculiar and Common Grace"
                  - s24_4_6_2: "2. The Sufficiency of Common Grace for Rendering Men Inexcusable"
                  - s24_4_6_3: "3. The Rejection of the Idea That God Predestinates to Evil"
              - s24_4_7: "G. The Cause of Reprobation"
                sections:
                  - s24_4_7_1: "1. Sin as the Presupposed Condition"
                  - s24_4_7_2: "2. God’s Free Power and Just Will as the Supreme Cause"
                  - s24_4_7_3: "3. The Non-Absolute Nature of God’s Will in Reprobation"
              - s24_4_8: "H. The Refutation of Calumnies and the Proper Use of This Doctrine"
      - s29: "DISPUTATION XXIX:ON THE SATISFACTION OF JESUS CHRIST"
        sections:
          - s29_1: "I. Prolegomena to the Doctrine of Satisfaction"
            sections:
              - s29_1_1: "A. The Connection of Satisfaction to Previous Doctrines"
              - s29_1_2: "B. The Definition of Satisfaction"
                sections:
                  - s29_1_2_1: "1. The Etymology and General Meaning of the Term"
                  - s29_1_2_2: "2. The Scriptural Equivalents of the Term"
                  - s29_1_2_3: "3. The Formal Definition of Christ’s Satisfaction"
          - s29_2: "II. The Efficient Cause of Christ’s Satisfaction"
            sections:
              - s29_2_1: "A. The Primary Efficient Cause: God the Father"
              - s29_2_2: "B. The Proximate Efficient Cause: Christ the God-Man"
                sections:
                  - s29_2_2_1: "1. The Theanthropic Person as the Sole Agent of Satisfaction"
                  - s29_2_2_2: "2. The Voluntary Nature of Christ’s Satisfaction"
              - s29_2_3: "C. The Internal Causes"
                sections:
                  - s29_2_3_1: "1. The Internal Cause Moving God: His Mercy and Justice"
                  - s29_2_3_2: "2. The Internal Cause Moving Christ: His Love"
              - s29_2_4: "B. The External Cause: Human Misery and Sin"
                sections:
                  - s29_2_4_1: "1. Sin as the Impulsive Cause"
                  - s29_2_4_2: "2. The Prepositions “For” and “On Account Of” Denoting Impulsive Cause"
                  - s29_2_4_3: "3. The Meritorious Nature of the Impulsive Cause Against Socinus"
          - s29_3: "III. The Matter of Christ’s Satisfaction"
            sections:
              - s29_3_1: "A. The Sufferings of Christ in General"
              - s29_3_2: "B. The Qualities of Christ’s Death"
                sections:
                  - s29_3_2_1: "1. The Violent, Bloody, Ignominious, and Accursed Death"
                  - s29_3_2_2: "2. The Sufferings of Christ’s Soul"
                    sections:
                      - s29_3_2_2_1: "a. The Bodily and Spiritual Agonies"
                      - s29_3_2_2_2: "b. The Dolors of Death and Hell; The Descent into Hell"
                      - s29_3_2_2_3: "c. The Evangelical Descriptions of Christ’s Spiritual Anguish"
              - s29_3_3: "C. The Limits of Christ’s Suffering"
                sections:
                  - s29_3_3_1: "1. Christ Did Not Despair"
                  - s29_3_3_2: "2. Christ Was Not Detained in Eternal Punishments"
                  - s29_3_3_3: "3. The Reason: Christ’s Divine Power to Exhaust Infinite Wrath at Once"
              - s29_3_4: "D. The Price of Satisfaction: Christ Himself"
          - s29_4: "IV. The Form of Christ’s Satisfaction"
            sections:
              - s29_4_1: "A. The Formal Definition: Perfect Payment for All Our Sins"
              - s29_4_2: "B. The Three Acts of Satisfaction: Oblation, Presentation, Application"
              - s29_4_3: "C. The Typical Confirmation from Levitical Sacrifices"
              - s29_4_4: "D. The Prophetic Confirmation from Isaiah 53"
                sections:
                  - s29_4_4_1: "1. Christ Bearing Our Griefs and Sorrows"
                  - s29_4_4_2: "2. The Chastisement and Imputation of Iniquity"
              - s29_4_5: "E. The New Testament Interpretation of the Type and Prophecy"
                sections:
                  - s29_4_5_1: "1. John the Baptist and the Apocalypse"
                  - s29_4_5_2: "2. The Phrase “For Us” Denoting Vicarious Substitution"
          - s29_5: "V. The End of Christ’s Satisfaction"
            sections:
              - s29_5_1: "A. The Object: The Elect Alone"
              - s29_5_2: "B. The Supreme End: The Demonstration of God’s Justice and Mercy"
              - s29_5_3: "C. The Intermediate End: The Manifestation of Christ’s Love"
              - s29_5_4: "D. The Proximate End: Our Pacification, Justification, and Sanctification"
                sections:
                  - s29_5_4_1: "1. Pacification, Healing, and Justification"
                  - s29_5_4_2: "2. Inherent Righteousness and Sanctification"
          - s29_6: "VI. The Necessity of Christ’s Satisfaction"
          - s29_7: "VII. The Twofold Satisfaction: Penal and Preceptive Obedience"
          - s29_8: "VIII. The Application of Satisfaction Through Faith"
          - s29_9: "IX. Antitheses: Errors Rejected"
          - s29_10: "X. Patristic Testimonies"
            sections:
