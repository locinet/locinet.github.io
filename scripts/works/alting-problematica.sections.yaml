sections:
  - s13: "PROBLEMATA Of the Thirteenth Locus: Concerning THE CHURCH"
    sections:
      - s13_1: "PROBLEM I: Whether the People of the Old Testament are Always and Everywhere Called Synagogue, but of the New Testament Church?"
