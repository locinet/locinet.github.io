        sections:
          - s13_6_1: "A. The Libertine and Socinian Negation"
          - s13_6_2: "B. The Orthodox Affirmation: Twofold Demonstration"
            sections:
              - s13_6_2_1: "1. First Demonstration: Church Militant Always Existed in Old Testament"
              - s13_6_2_2: "2. Second Demonstration: Same in Species with New Testament Church"
