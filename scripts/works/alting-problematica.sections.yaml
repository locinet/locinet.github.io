            sections:
              - s13_3_2_1: "1. First: The Name “Church” Not Attributed to Angels in Scripture"
              - s13_3_2_2: "2. Second: Angels Not Parts of the Church Militant"
              - s13_3_2_3: "3. Third: Angels Truly Pertain to the Church Triumphant"
          - s13_3_3: "C. The Question Whether Angels Are Called or Vocati"
