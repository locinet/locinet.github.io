              - s13_12_1_2: "2. Second Controversy: Among Orthodox Doctors"
          - s13_12_2: "B. Arguments for the Affirmative Sentence"
          - s13_12_3: "C. Arguments for the Negative Sentence"
          - s13_12_4: "D. Twofold Ratio of Conciliation"
            sections:
              - s13_12_4_1: "1. First Ratio: From Subject – Distinction of Church Itself"
                sections:
                  - s13_12_4_1_1: "a. Collectively: In Assemblies Under Antichrist’s Tyranny"
                  - s13_12_4_1_2: "b. Representatively: In Pope, Clergy, Antichristian Ministry"
              - s13_12_4_2: "2. Second Ratio: From Attribute – Distinction of Truth"
          - s13_12_5: "E. Censure of Both Distinctions"
            sections:
              - s13_12_5_1: "1. Censure of First Distinction"
              - s13_12_5_2: "2. Censure of Second Distinction"
          - s13_12_6: "F. The Simpler and Sounder Sentence"
            sections:
              - s13_12_6_1: "1. Statement: Roman Church Not True but False Church"
              - s13_12_6_2: "2. Responses to Contrary Arguments"
