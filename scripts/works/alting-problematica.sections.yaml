            sections:
              - s13_4_3_1: "1. General Response: Triumph Inchoate, Not Consummated"
              - s13_4_3_2: "2. Specific Solutions to Individual Arguments"
              - s13_4_3_3: "3. The Origin of the Error: False Hypothesis of Soul-Sleep"
