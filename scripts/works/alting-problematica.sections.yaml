          - s13_11_3: "C. Errors in Doctrine Distinguished by Three Genera"
            sections:
              - s13_11_3_1: "1. Errors in the Foundation: Directly Destroying It"
              - s13_11_3_2: "2. Errors Concerning the Foundation: Indirectly Undermining It"
              - s13_11_3_3: "3. Errors Besides the Foundation: Curious Questions and Vain Strifes"
