          - s13_14_2: "B. Objections Against Clandestine Assemblies"
          - s13_14_3: "C. The Orthodox Affirmation with Seven Reasons"
          - s13_14_4: "D. Refutation of Objections"
      - s13_15: "PROBLEM XV: Why Do Some Orthodox Doctors Enumerate More, Others Fewer Marks of the Church?"
        sections:
