sections:
  - s1: "I. THE DOCTRINE OF THE ROMAN SCHOOL"
    sections:
      - s1_1: "A. The Various Acceptations of the Term “Predestination” in the Roman School"
      - s1_2: "B. The Various Acceptations of the term “Election” in the Roman School"
      - s1_3: "C. The Effects of Predestination According to the Roman School"
        sections:
          - s1_3_1: "1. The First Opinion: Glory Alone Is the Effect"
          - s1_3_2: "2. The Second Opinion: The Means to Glory Alone Are the Effects"
          - s1_3_3: "3. The Third Opinion (Common Today): Both the Means and Glory Are Effects"
          - s1_3_4: "4. The Fourth Opinion: Creation and Permission of Sin Are Also Effects"
            sections:
              - s1_3_4_1: "a. The testimony of Alphonsus Mendoza"
                sections:
                  - s1_3_4_1_1: "i. His first conclusion: First of all divine acts was predestination"
                  - s1_3_4_1_2: "ii. His second conclusion: All things follow from predestination"
                  - s1_3_4_1_3: "ii. His third conclusion: There is no providence antecedent to predestination"
      - s1_4: "D. The Object of Predestination According to the Roman School"
        sections:
          - s1_4_1: "1. The First Opinion: Man as Creatable (Supralapsarian)"
          - s1_4_2: "2. The Second Opinion (Common): Man as Fallen in Adam"
  - s2: "II. THE DOCTRINE OF THE REFORMED SCHOOL"
    sections:
      - s2_1: "A. The Various Acceptations of “Predestination” Among the Reformed"
        sections:
          - s2_1_1: "1. The Broader Sense: Including Both Election and Reprobation"
          - s2_1_2: "2. The Narrower Sense: Predestination to Life Only"
      - s2_2: "B. The Various Acceptations of “Election” Among the Reformed"
        sections:
          - s2_2_1: "1. Election as Synonymous with Predestination"
          - s2_2_2: "2. Election Restricted to the Decree of Giving Faith"
      - s2_3: "C. The Object of Predestination According to the Reformed School"
        sections:
          - s2_3_1: "1. The First Opinion: Man as Creatable (Supralapsarian)"
            sections:
              - s2_3_1_1: "a. Doctors holding this opinion"
          - s2_3_2: "2. The Second Opinion (Most Common): Man as Fallen"
            sections:
              - s2_3_2_1: "a. Conformity with the Canons of Dort"
          - s2_3_3: "3. The Third Opinion: Man as Fallen and Called by the Gospel"
            sections:
              - s2_3_3_1: "a. The view of George Sohnius"
              - s2_3_3_2: "b. Those following Cameron’s method"
      - s2_4: "D. The Effects of Predestination According to the Reformed School"
        sections:
          - s2_4_1: "1. According to the Supralapsarians: Creation and Permission of the Fall"
          - s2_4_2: "2. According to the Infralapsarians: The Means of Salvation Beginning with Christ"
          - s2_4_3: "3. According to Those Who Make the Called Man the Object: Faith as the First Effect"
  - s3: "III. COMPARISON OF THE TWO SCHOOLS"
    sections:
      - s3_1: "A. The Diversity of Usage of the Terms"
        sections:
          - s3_1_1: "1. Differences in the acceptation of “predestination” and “election”"
      - s3_2: "B. The Diversity Concerning the Effects of Predestination"
        sections:
          - s3_2_1: "1. Similar diversity exists in both schools"
      - s3_3: "C. The Diversity Concerning the Object of Predestination"
        sections:
          - s3_3_1: "1. Similar opinions exist in both schools"
          - s3_3_2: "2. The common opinion in both schools: man as fallen"
  - s4: "IV. THE WEIGHT OF THESE QUESTIONS"
    sections:
      - s4_1: "A. Much Is Logomachy"
        sections:
          - s4_1_1: "1. The dispute concerns the definition of predestination"
      - s4_2: "B. The Rule to Be Observed"
        sections:
          - s4_2_1: "1. Follow Scripture’s usage and common scholastic usage"
      - s4_3: "C. The Reason for the Diversity"
        sections:
          - s4_3_1: "1. Different views on what acts relate to God’s intended end"
          - s4_3_2: "2. The end of creation versus the end of predestination"
