sections:
  - s1: "I. THE PROTESTANT DOCTRINE OF SCRIPTURE’S PERSPICUITY EXPLAINED"
    sections:
      - s1_1: "A. A Misrepresentation of the Protestant Position Corrected"
      - s1_2: "B. The Distinction Between Things Necessary and Not Necessary to Salvation"
      - s1_3: "C. A Further Distinction Concerning Things Necessary to Salvation"
      - s1_4: "D. The Perspicuity Affirmed of the Whole Body of Scripture, Not Every Particular Place"
      - s1_5: "E. The Perspicuity Sufficient for a Pious Mind, Though Not for Curious Wits"
  - s2: "II. THE THREE DEGREES OF PERSPICUITY AND OBSCURITY IN SCRIPTURE"
    sections:
      - s2_1: "A. The First Degree: Things Plainly and Evidently Set Forth"
      - s2_2: "B. The Second Degree: Things Requiring Labor and Exercise to Understand"
      - s2_3: "C. The Third Degree: Things Sublime and Hidden, Exceeding Human Capacity"
  - s3: "III. THE DIVINE WISDOM IN TEMPERING SCRIPTURE’S CLARITY AND OBSCURITY"
    sections:
      - s3_1: "A. The First Reason: To Repress Human Pride"
      - s3_2: "B. The Second Reason: To Stir Up Desire for the Blessed State to Come"
      - s3_3: "C. The Third Reason: To Excite Diligent Study of the Scriptures"
  - s4: "IV. THE ROLE OF PASTORS AND TEACHERS IN UNDERSTANDING SCRIPTURE"
    sections:
      - s4_1: "A. Labor and Diligence Required to Understand Scripture"
      - s4_2: "B. The Office of Pastors in Expounding Scripture"
      - s4_3: "C. The Faithful Receive the Sense of Scripture by the Light of Truth, Not Blind Obedience"
      - s4_4: "D. The Distinction Between Finding the Sense and Recognizing the Sense Once Demonstrated"
  - s5: "V. THE NECESSITY OF THE HOLY SPIRIT’S ILLUMINATION"
    sections:
      - s5_1: "A. The True Sense Cannot Be Perceived Without Divine Aid"
      - s5_2: "B. Natural Understanding Distinguished from Saving Understanding"
      - s5_3: "C. Even the Faithful Do Not Understand All Things Perfectly"
  - s6: "VI. A SUMMARY OF THE PROTESTANT DOCTRINE"
    sections:
      - s6_1: "A. A Recapitulation of What the Protestants Teach"
      - s6_2: "B. What the Protestants Do Not Teach"
      - s6_3: "C. What the Protestants Positively Teach Concerning the Means of Understanding"
  - s7: "VII. THE ROMAN DOCTRINE STATED AND THE TRUE POINT OF CONTROVERSY IDENTIFIED"
    sections:
      - s7_1: "A. What the Doctors of the Roman Church Concede"
      - s7_2: "B. The Precise Point of Contention Between Protestants and Romanists"
      - s7_3: "C. The Occasion and Origin of This Controversy"
      - s7_4: "D. The Controversy Is Not About Whether Scripture Is Clear or Obscure, But About the Degree"
      - s7_5: "E. The State of the Question Briefly Conceived"
  - s8: "VIII. ARGUMENTS CONFIRMING THE PROTESTANT DOCTRINE"
    sections:
      - s8_1: "A. The First Argument: From God’s Purpose in Giving Scripture"
      - s8_2: "B. The Second Argument: From God’s Purpose That All Should Learn from Scripture"
      - s8_3: "C. The Third Argument: From Scripture Being a Rule of Faith"
      - s8_4: "D. The Fourth Argument: From the Perpetual Practice of the Church in Convincing Heretics"
      - s8_5: "E. The Fifth Argument: From the Testimony of Scripture Itself"
        sections:
          - s8_5_1: "1. The testimony of Moses in Deuteronomy 30"
          - s8_5_2: "2. The first objection of the Romanists answered"
          - s8_5_3: "3. The second objection of the Romanists answered"
          - s8_5_4: "4. The testimony of Peter concerning the prophetic word as a light"
