    sections:
      - s3_1: "A. Introduction to the Threefold Demonstration"
      - s3_2: "B. From the Nature of God"
        sections:
          - s3_2_1: "1. God as Infinite, Self-Sufficient, and Supreme Good"
          - s3_2_2: "2. The Absurdity of Any Other End Than God Himself"
      - s3_3: "C. From the Common Nature of All Created Things"
        sections:
