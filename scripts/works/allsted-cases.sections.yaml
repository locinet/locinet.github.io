sections:
  - s1: "CHAPTER I. Concerning the End of the Theology of Cases, Which Is the Tranquillity of the Tempted Conscience"
    sections:
      - s1_1: "PRECEPTS."
      - s1_2: "RULES."
        sections:
          - s1_2_1: "I. The Theology of Cases is a part of practical theology, concerning the pacifying of the conscience of a tempted man."
          - s1_2_2: "II. The Theology of Cases is to be sought from the one Word of God alone."
          - s1_2_3: "III. In the preliminary cognition of the end, the Casuist ought to consider in what thing the tranquillity of conscience is situated, and how manifold temptation is."
            sections:
              - s1_2_3_1: "Rule 1. Temptation is either unto good, or unto evil. The former is called the temptation of probation, the latter of seduction."
              - s1_2_3_2: "Rule 2. The Devil, the world, and the flesh often intermingle with divine temptations the temptation of security and desperation."
              - s1_2_3_3: "Rule 3. God tempts the elect as a father tempts his sons, and that unto the glory of His name and their eternal salvation."
              - s1_2_3_4: "Rule 4. Those who are tempted are either elect or reprobate. It is therefore false—this prejudice of the world—that every tempted man is reprobate: such as was the judgment of Job’s friends."
  - s2: "CHAPTER II. Concerning the Subject of the Theology of Cases, Which Is the Conscience of Man"
    sections:
      - s2_1: "PRECEPTS."
      - s2_2: "RULES."
        sections:
          - s2_2_1: "I. Conscience is a power of the practical intellect in a rational creature, determining concerning things done."
          - s2_2_2: "II. The natural state of conscience in every man is such that it is placed in a middle position between God and man, in such a way that it is below God and above man."
          - s2_2_3: "III. A good conscience is such either by creation, or by regeneration, that is, by re-creation."
          - s2_2_4: "IV. The evil conscience of man is either dead or awakened."
          - s2_2_5: "DISSERTATION Concerning the Most Base of All Baseness, Which Is Sin."
            sections:
              - s2_2_5_1: "First, the baseness of sin consists in this: that its form is an aversion from God, who is the supreme Good, and a conversion to evil, which corrupt man regards under the appearance and guise of good."
              - s2_2_5_2: "Second, the effects of sin are of all things most base and most harmful."
              - s2_2_5_3: "Third, the mother of sin is most base."
              - s2_2_5_4: "Fourth, let us see how base is the nurse of sin."
              - s2_2_5_5: "Fifth, let us institute a comparison of the sinful man and the Christian, so that it may better appear how base sin is."
              - s2_2_5_6: "Finally, let us consider in particular how base are these and those sins."
          - s2_2_6: "V. For acquiring a good conscience, three means are required: namely, diligent preparation, application of the remedy, and reformation of the conscience."
          - s2_2_7: "VI. He who wishes to preserve a good conscience must remove the impediments and apply the nourishments."
          - s2_2_8: "A LIVING DESCRIPTION OF THE UNCLEAN WORLD"
            sections:
              - s2_2_8_1: "The Deity of the World"
              - s2_2_8_2: "The Properties of the World"
              - s2_2_8_3: "The Profanity of the World"
              - s2_2_8_4: "The Parts of the World"
              - s2_2_8_5: "The Rewards of the World"
              - s2_2_8_6: "Exhortation of the Pious Man to His Soul"
